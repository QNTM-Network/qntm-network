# DECLARED SINKS (this is declaration, NOT code) — where work LANDS. depth-to-sink is measured
# TO these points, so this file decides what "depth" means for this project.
#
# LIVE AGAIN 2026-07-23 (second pass), for the same reason as flows.yaml: the sink is checkable
# now that flow-trace observes TypeScript. It previously declared `rendered-page-written`
# (qntm_network.render.build:write_page), the Python build's file write, which retired with that
# app; the file then sat empty while TS was unobservable.
#
# THE EDITORIAL CALL, restated because changing this line changes what every depth number means:
# a browser app's terminal effect is the DOM mount, not a disk write. So depth reads as "how many
# hops from entry to the document being on screen" — the browser equivalent of what
# "hops to the page landing on disk" meant before.

sinks:
  - id: view-painted
    sink: app/present/paint:paint
    description: >
      the graph view on screen — a view's markdown resolved through the presentation cascade and
      painted into app.html's #viewBody. ADDED 2026-07-30 with migration stage 1.

      IT IS A SECOND SINK, NOT A REPLACEMENT, and the two are genuinely different terminal
      effects on two different pages: `document-mounted` is the demo page's editor coming alive,
      this is the hosted graph becoming legible behind the passkey. Depth to THIS sink reads
      "how many hops from entry to a view being on screen".

      It could not be declared before today for the reason that governs this whole stage: the
      painting happened inside app.html, at the repo root, and `.flow-trace.yaml`'s capture
      filter is a path prefix (`include: [app]`). A sink outside the filter is a sink nothing can
      measure depth to. Moving the painter under app/ is what made this declarable, and the
      declaration is here to make that gain visible rather than implied.

      NOT MEASURED YET, and saying so is the point of the sentence: depth-to-sink runs under
      `flow-trace verify`, which exits 2 in this environment for a reason outside this repo. The
      sink is declared so the measurement exists the moment the tool does.

  - id: selection-moved
    sink: app/present/caret:placeCaret
    description: >
      A CARET EXISTING AT A POSITION ON SCREEN. Declared 2026-08-10 against
      `app/present/focus:FocusSurface.focus`; MOVED DOWN HERE 2026-08-12, and the move is the
      whole point of this entry.

      WHY IT MOVED, MEASURED RATHER THAN REASONED. `FocusSurface.focus` is a STATE SETTER, not a
      terminal effect: `app/present/focus.ts` contains ZERO DOM operations, and `focus()` assigns
      three private fields — `#lineIndex`, `#anchor`, `#column` — and returns. The app DECIDING a
      cursor should be somewhere and a caret BLINKING there are two events, and only the second is
      an effect on the world. Declaring the first as the sink put it at the wrong altitude, and the
      cost was concrete: `cursor-position` could not govern it, because a class cannot stand
      between callers and a method it owns, so every legitimate route read as a bypass. The full
      record of that measurement is in `classes.yaml` under `cursor-position`.

      WHAT THE MOVE BOUGHT, ALL THREE NUMBERS MEASURED ON 2026-08-12:
        `flow-trace sinks .`               2 governed / 1 ungoverned  ->  3 governed / 0 ungoverned
        `canonical-routing --class presentation-painting`   routed: 0  ->  routed: 1
        the routed chain, this repo's first:
          app/present/paint:<anonymous> -> paint:repaint -> paint:paint -> paint:paintDraft
            -> placeCaret                                                              (PASS)

      AND IT BOUGHT OBSERVABILITY, WHICH WAS NOT THE INTENTION AND IS THE LARGER GAIN. The caret
      placement used to be a bare `setSelectionRange?.(...)` expression inside `paint.ts`. The only
      scenario that reaches `paint` supplies a document stub with no `setSelectionRange`, so the
      optional call short-circuited and the observer recorded NOTHING. As a named function the call
      is recorded even when its DOM effect is a no-op under the stub. An effect written as an
      expression is invisible to the tracer; the same effect written as a function is not.

      THE ROUTES — THREE CALL SITES, TWO CONCERNS, and they do not collapse into one:
        app/present/paint.ts  the row builder    THE READING CURSOR. Guarded by
                                                 `focus.isFocused(lineIndex)`; position from
                                                 `mode.takeCaretHint()` (`i`/`a`/Enter, decided in
                                                 motions.ts) clamped into the line's length at the
                                                 call site.
        app/present/paint.ts  paintDraft x2      THE DRAFT'S OWN CURSOR, on a row that is in NO
                                                 file. Two branches: back to the end of what he
                                                 typed (`open.typed.length`) when the row survived
                                                 a repaint, or to the seed's declared offset
                                                 (`open.cursorOffset`) when it is fresh.

      The reading cursor is a position in a line of the FILE and is answerable to `FocusSurface`.
      The draft cursor is a position in a string that is in no file, is answerable to
      `DraftSurface`, and has no line index to be anchored against. They share this one terminal
      effect and nothing above it. The tracer distinguishes them itself — `paintDraft` is its own
      frame on the observed chain above.

      THE GOVERNING CLASS IS `presentation-painting`, NOT `cursor-position`, AND THAT WAS ALSO
      MEASURED. `cursor-position` was wired to govern this sink and run: it reports BYPASS, because
      `FocusSurface` is nowhere on the chain. `focus.focus()` returns before any painting happens —
      the repaint is a SIBLING statement at the call site (paint.ts:1377-1378), not a call from
      inside it — so the painter's relation to the focus surface is a DATA dependency (it READS
      `isFocused`/`column`) and `canonical-routing` only sees CALL stacks. For the observed chain it
      is wrong twice over: that chain is the DRAFT cursor, which must not route through
      `FocusSurface` at all.

      THE TWO PAGE ROUTES ARE STILL DARK, and the extraction did not reach them.
      `app/index.html:2231` (view-entry seeding, `paintView`) and `:2316` (repaint re-seeding,
      `repaintCurrentView`) call `focus.focus()` — the state setter — and the painting they cause
      happens inside that file's own inline module script, which node cannot import. They are the
      repaint path, which is where "the cursor loses its place after a redraw" would live, so this
      is the gap that matters most. Listed rather than omitted: a sink whose caller census is
      quietly two-thirds of the truth is worse than one that says which third is missing.

      THE PAIR THAT MAKES THIS SINK REAL. `canonical-routing` is only the POSITIVE half — it checks
      that everything REACHING the sink came through the painter, and is blind to code that never
      goes near the sink and calls the browser API directly. The NEGATIVE half is
      `state-caret-placement-has-one-home` (state.yaml): `setSelectionRange` may appear in
      `app/present/caret.ts` and nowhere else under `app/`. It is static, so unlike the routing half
      it covers the caret paths no scenario drives — but its glob is `{.ts,.tsx,.js,.mjs}` and it
      never opens `app/index.html`, so it is blind in the same page the two dark routes live in.

  - id: rule-effect-shown
    sink: app/present/landing:landPrediction
    description: >
      A RULE'S DECISION REACHING THE SCREEN — the terminal effect of a rule application. Declared
      2026-08-12, and it is the first sink in this repo that is not purely presentational: the other
      three answer "did the view draw", this one answers "did the operator's own published rule
      become something he can see".

      IT IS NOT `renderRuleEffects`, AND THAT WAS THE FIRST THING TESTED RATHER THAN ASSUMED.
      `renderRuleEffects` (rules.ts) computes characters and RETURNS them; nothing visible has
      happened when it returns, and a caller is free to discard the result — `promotion.ts` does
      exactly that on an abstention (`arm` returns `ARMS_NOTHING`). Anchoring there would repeat
      `selection-moved`'s original error: a function that DECIDES, declared at the altitude of one
      where work LANDS.

      THE ROUTES, ALL TWO, COUNTED RATHER THAN ASSUMED (grep `surface: "predict"` across app/):
        app/present/resolvers/rules.ts:209      the RULES axis, for the line just committed.
                                                Arms `text` only, NO `fullText` — so this route can
                                                only ever reach the APPEND branch, never the swap.
        app/present/resolvers/promotion.ts:493  the PARENT-PROMOTION axis, for the row above. The
                                                only caller that supplies `fullText`, and therefore
                                                the only one that can reach the in-place swap.
      There is no third armer and no non-rule prediction in this app, so every chain that reaches
      this sink is a rule application. Both routes are observable — neither lives in app/index.html.

      WHAT IT MAKES MEASURABLE, WHICH IS WHY IT EXISTS. An append can happen three ways and only one
      of them is visible from the call site: no `fullText`; the row absent from
      `predictableByLineIndex`; or `replacePredictedSwap` refusing because it could not find the
      delta's own chip in the rebuilt HTML (`chipIndex === -1`). The operator has reported an
      appended `#outcome` where he expected a swap, and that question has been answered by reading
      several times and by measurement never. Until this declaration the branch was an inline
      if/else inside `paint`, reachable by no observer.

  - id: document-mounted
    sink: app/main:mount
    description: >
      the mount sink — the document rendered into the page and the toggle wired, the terminal
      effect the app exists to produce. mount() is where the pure renderer's output and the
      session's state become something a reader can see and type into; everything upstream is
      preparation and everything inside it is presentation.

# ── 2026-08-07, THE SINKS SURVEY — CORRECTION AND A DELIBERATE NON-ADDITION ──
#
# CORRECTION FIRST. `view-painted`'s own description above still says "NOT MEASURED YET ...
# depth-to-sink runs under `flow-trace verify`, which exits 2 in this environment." That was true
# 2026-07-30 and is stale now: `.flow-trace.yaml`'s header was corrected 2026-07-30 (stage 2) —
# `flow-trace verify .` exits 0 given the two documented preconditions (`npm ci` in the tool's own
# `js/`, `npm ci` here). Confirmed again today: `flow-trace sinks .` and `flow-trace canonical-
# routing . --class presentation-painting` both run clean. Left un-rewritten above (this file
# corrects by addendum, the way `.flow-trace.yaml` and `classes.yaml` both already do) so the
# history of why the sentence was once true is not erased.
#
# WHO READS THIS FILE, PROVEN BY MUTATION RATHER THAN ASSUMED (the question that mattered most
# before adding anything to it). Two real consumers, not one, and they are not the same strength:
#
#   1. `flow-trace sinks` (src/flow_trace/sinks.py, also folded into `verify`'s own fan) — a PURE
#      cross-reference against classes.yaml's `governs_sinks`. Removing `governs_sinks: [view-
#      painted]` from `presentation-painting` (tested, reverted) flips the finding PASS -> INFO
#      "UNGOVERNED ANCHOR" — a real, live reaction. But it is EXPLICITLY never a FAIL (`sinks.py`'s
#      own comment: "surfacing the residue IS the job") — advisory, not gating, by design.
#   2. `flow-trace canonical-routing` (also folded into `verify`) — a REAL, GATING behavioural
#      check. Pointing `view-painted`'s `sink:` at a module that does not exist
#      (`app/present/nonexistent_module_xyz:paint`, tested, reverted) produced a genuine
#      `UNPROBEABLE ANCHOR` FAIL and a process exit code of 1 — not 0, not 2. This is a live
#      instrument, not theatre: a sink declared here and then unreachable in code is caught, hard.
#
# BOTH READERS ONLY FIRE FOR A SINK SOME CLASS ACTUALLY `governs_sinks`. That is the real gap in
# this repo (see classes.yaml's `capture-rule-application` note, added the same day): the two
# sinks above have governing classes and are therefore live-checked; the four resolvers
# (app/present/resolvers/{membership,ordering,promotion,rules}.ts) govern nothing, so neither
# reader has ever looked at them — not a weak pass, an absence. `class_routing_verdicts`
# (canonical_routing.py) states this precisely: a class with no `governs_sinks` produces no
# finding and is "ABSENT from the map ... never a vacuous held."
#
# THE DELIBERATE NON-ADDITION. The brief this row answers asked whether the browser stack has
# more terminal effects than these two — the armed prediction (`predict.ts`), the settled repaint
# (`settle.ts`), the painted chip, the diagnostics channel (`reportAbstentions`, app/index.html).
# Checked, not assumed:
#
#   - `predict.ts` and `settle.ts` are each imported ONLY by `resolve.ts`, `paint.ts` and
#     `index.ts` (grep, not inference) — both are CONTRIBUTORS whose output becomes an argument
#     `paint()` reads, never a second place work terminates. Intermediate, not sinks.
#   - the painted chip is a rendition DECISION inside `paint()` (see `presentation-painting`'s own
#     concern text) — detail within `view-painted`, not a second terminal.
#   - `reportAbstentions` (app/index.html:2679) genuinely IS a distinct terminal effect — a
#     `console.debug` write, not a repaint — and is NOT declared here, on purpose. `view-painted`
#     itself could not be declared until its code moved under `app/`, inside flow-trace's capture
#     filter (this file's own history, above); `reportAbstentions` has not made that move and
#     still lives in the one file flow-trace structurally cannot import (a node module-load hook;
#     node cannot import HTML — `.flow-trace.yaml`'s own note). Declaring it now would be a sink
#     nothing can ever reach until that relocation happens — worse than leaving it absent. The
#     relocation is real, scoped work (the same one `classes.yaml`'s `markdown-rendering` and
#     `capture-rule-application` notes both name for their own gaps) and is not attempted here.
#
# So: two sinks were correct before this row and are correct after it. What changed is that the
# claim is now load-bearing rather than assumed.

# ── 2026-08-07, `view-painted` GAINED A SECOND GOVERNING CLASS — `commit-line-routing` ──
#
# `commitLine` relocated to app/present/commit.ts (`createCommitLine` — see that module's own
# header), closing the gap `capture-rule-application`'s own note named: the connecting act
# building a context, walking the resolver registry, and reaching `paint` with what came back was
# hand-authored HTML until this move, invisible to flow-trace by construction. `classes.yaml`'s
# new `commit-line-routing` class names `commitLine` itself as `view-painted`'s second canonical
# home, alongside `presentation-painting` (`paint` calling itself through `repaint`, unchanged).
#
# `reportAbstentions`, NAMED ABOVE AS NOT-YET-RELOCATED, IS STILL NOT RELOCATED. `commitLine`
# moved; `resolverContextFor` and `reportAbstentions` deliberately did not (commit.ts's own header
# states why — both are small and genuinely page-shaped, and neither is what made the
# resolver-to-paint path unobservable). So the non-addition above still holds, unchanged: no third
# sink is declared here today.
#
# WHAT `commit-line-routing` DOES NOT CLAIM, STATED SO IT IS NOT ASSUMED FROM THE NAME ALONE: it
# does not mean any of the four resolvers (membership/ordering/rules/promotion) themselves govern
# `view-painted`. They cannot, by a mechanism rather than by omission — see
# `capture-rule-application`'s own 2026-08-07 addendum in classes.yaml for the argument (a
# resolver's own frame has always already returned, unwound, by the time any later repaint reaches
# `paint`; flow-trace's AsyncLocalStorage-based caller tracking records whichever instrumented
# frame is ACTIVE at that moment, and only `commitLine` — the frame spanning the whole gap, from
# the resolver walk through the write's own answer — ever qualifies). `commit-line-routing` is the
# closest true statement flow-trace can check: not "a resolver reaches the screen" but "the ONE
# function through which every resolver's answer must pass before it can" does.

# ══════════════════════════════════════════════════════════════════════════════════════════════
# ADDED 2026-08-17 — the graph read for a CROSS-LINE decision (`promotion` is the one resolver
# of the four that needs one; see classes.yaml's `graph-aware-resolution-reads-one-modelled-graph`
# for why this is a class named before it is built, and the live defect that named it).
# ══════════════════════════════════════════════════════════════════════════════════════════════
  - id: structural-node-candidate-is-the-graph-read-for-cross-line-resolution
    sink: app/present/resolvers/promotion:structuralNodeCandidateFor
    description: >-
      The one place a graph-aware resolver looks up ANOTHER line's (a structural parent's or
      child's) current id and fields — the front end's only read of graph state for a
      cross-line decision, as opposed to the line the operator just committed. `parentCandidateFor`
      and `childCandidateFor` both delegate here rather than reading `snapshot.nodes` themselves
      (2026-08-07, unifying what used to be two lookups into one); a second graph-aware resolver,
      or a third candidate kind added to this one, that queries the snapshot some other way is the
      identical duplication this unification already closed once.
    canonical_home: graph-aware-resolution-reads-one-modelled-graph
    chokepoint: app/present/resolvers/promotion:structuralNodeCandidateFor
    carries_only:
      - a structural node's graph id + resolved fields, read from `ctx.graph` — the browser's
        current model of the graph, whatever that model currently knows
