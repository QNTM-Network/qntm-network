# qntm.network — classes.yaml. The canonical-concern grouping (type #6).
#
# A class here is not the `class` keyword — it is a CONCERN with one canonical home, the
# chokepoint every flow for that concern must route through. Declaring one is opt-in strictness:
# once declared, `flow-trace canonical-routing` reports any path that does the concern's work
# WITHOUT going through its home (compliant-but-bypassing), which is the failure this file exists
# to make visible.
#
# NEW 2026-07-23 (second pass). This file did not exist while the app was unobservable — a class
# whose routing nothing can check is a label, not governance. flow-trace's
# `typescript-capture-backend` landing made routing adjudicable on TypeScript (leg 3), so the
# three app capabilities converted from `rooting: isolated` to real class-rooting against these
# homes, exactly as their opt-out text promised they would.
#
# Identity convention (JS/TS): `path/without/extension:Symbol`.

classes:

  - id: markdown-rendering
    concern: >
      Turning markdown source into HTML. This class is the structural form of
      architecture.yaml#one-implementation-per-concern: a second renderer should show up as a
      path doing rendering work without routing through this home.

      CORRECTED 2026-07-30 — the previous text asserted "there is exactly one markdown
      implementation in this project" as a fact. IT IS FALSE AND HAS BEEN SINCE 2026-07-23.
      There are THREE: this home, a CDN markdown-it imported at app.html:156, and a hand-rolled
      line-by-line renderer at app.html:234-268. The claim is what this class exists to MAKE
      true; stating it as already true is how it went a week unnoticed.

      AND THIS CLASS CANNOT CATCH IT, for two independent reasons worth knowing before trusting
      any canonical-routing green here. (1) `flow-trace canonical-routing` cannot run at all in
      this environment — verify and capability-rollup both exit 2 (see architecture.yaml's
      verification note). (2) Even when it runs it would not see app.html: `.flow-trace.yaml`
      declares `modules.include: [app]`, and for a JS/TS target that entry is a PATH PREFIX, not
      a package root — app.html sits at the repo root and is outside the capture filter by
      construction. Proven by mutation in the survey (M2: a second TypeScript renderer under
      app/ left 13/13 PASS). Carried as the asserted backlog row
      `flag-one-markdown-implementation-is-now-three`.

      The home is still the right home and the class is still the right class. What is wrong is
      the file it can reach, and the fix is to bundle app.html's script through the existing
      build rather than to weaken the claim.

      UPDATED 2026-07-30 (migration stage 1) — THE COUNT IS NOW TWO, and one of the three left
      by being reclassified rather than deleted, which is worth stating precisely because it
      would be easy to read as a bigger win than it is. The hand-rolled line-by-line renderer at
      app.html:234-268 moved to app/present/paint, inside the capture filter. In moving it
      stopped being a markdown implementation: it classifies lines and builds DOM, and delegates
      every markdown-to-HTML call to a renderer its caller injects. That work now has its own
      class (presentation-painting) and its own home, which is the correct place for it — it was
      never really this concern.

      WHAT REMAINS IS THE HONEST TWO. app/render/renderer (npm markdown-it, the demo page) and
      app.html:156 (a CDN markdown-it, the app page, injected into the painter). Stage 1
      deliberately did NOT collapse them, and the reason is methodological rather than lazy: the
      painter takes its renderer as a dependency so that "the painted output is byte-identical"
      could be proven with ONE markdown-it on both sides of the comparison. Bundling the CDN copy
      away in the same change would have made the headline claim of that change unprovable.
      Carried, still, as the asserted backlog row. Still unreachable by canonical routing for the
      same two reasons as above — verify exits 2, and app.html is outside the filter.
    canonical_class: app/render/renderer:MarkdownRenderer
    status: working

  - id: editing-session-state
    concern: >
      What the reader is looking at and what they have typed — the mode (view/edit) and the
      in-memory document. Deliberately holds NO presentation: the session never touches the DOM
      (flows.yaml#session-never-touches-the-dom), which is what keeps the mode machine reasonable
      about, and testable, without a browser.
    canonical_class: app/editor/session:EditorSession
    status: working

  # ── THE PRESENTATION CASCADE (added 2026-07-30, migration stage 1) ────────────────────────
  #
  # These three land WITH their homes, in the same change, and not one commit earlier. The
  # design that specifies them (docs/implementation-artifacts/design-presentation-cascade.md
  # section 7) deliberately did NOT declare them on its own branch, citing this file's header
  # back at itself: a class whose routing nothing can check is a label, not governance. The
  # modules now exist under app/present/, inside the capture filter, so the labels become
  # governance here.
  #
  # WHAT CAN AND CANNOT BE CHECKED TODAY, stated per class below rather than assumed. Canonical
  # routing needs `flow-trace verify`, which exits 2 in this environment — the TOOL's JS observer
  # has no node_modules, and the fix is a command in the tool's own checkout. The same three
  # properties ARE checked today by tests/present-cascade.test.mjs under `node --test`, which
  # this repo's CI runs. That is a weaker instrument in one specific way and it is worth being
  # precise about which: a node test proves the paths it drives route correctly; canonical
  # routing proves that NO path bypasses. Until verify runs, "compliant-but-bypassing" is
  # unmeasured here.

  - id: presentation-resolution
    concern: >
      Deciding which RENDITION a token family gets — `raw` (the characters, verbatim) or `wired`
      (the app's rendition of them). Seven levels, most specific wins, ordered by when each fact
      becomes known, with the precedence order owned in exactly ONE tuple (app/present/levels
      SPECIFICITY) that no caller may re-express.

      ANY PATH THAT DECIDES A RENDITION WITHOUT ROUTING HERE IS THE FAILURE. That is not
      hypothetical drift — it is the state this repo was in until 2026-07-30, when 36 lines
      inside app.html decided everything and nothing consulted a declaration because there was
      nothing to consult. The class exists so that returning to that state is a reportable event
      rather than a diff nobody reads.

      Exercised today by tests/present-cascade.test.mjs, which spies on
      PresentationCascade.resolve and asserts the painter both ASKS and OBEYS. Mutation-proven in
      both directions on 2026-07-30 — inlining the decision fails the first, ignoring the answer
      fails the second.

      TWO CONTRIBUTORS JOINED THIS CONCERN 2026-07-30 AND NEITHER GOT A CLASS OF ITS OWN, which is
      a decision rather than an omission. app/present/declaration reads the served GLOBAL document
      (stage 2) and app/present/focus derives the FOCUS level from where the cursor is (stage 3).
      Both produce a CONTRIBUTION; neither decides a rendition. The failure worth catching is
      unchanged and this class already catches it: a path that decides how a line is shown without
      routing through the cascade. Giving a contributor its own canonical home would split one
      concern across three homes and make "who decides?" a three-file question again — which is
      the condition app/present/ exists to end. Their flows are declared and carry THIS class.

      THE CONCERN GREW A FINER GRAIN 2026-07-30 (stage 8) AND DID NOT GROW A HOME FOR IT. `tags`
      is the first key whose subject is a TOKEN rather than a LINE, so "which rendition" is now
      asked about a substring as well as about a whole line. The grammar that finds those
      substrings — app/present/resolution.tagSpans — is a MIRROR of the engine's canonical one
      (parse_tag.py:23), not a thing this repo gets to choose, and it lives beside classifyLine
      because it is the same act one grain finer: reading what a line CONTAINS, which is a
      different act from deciding how it is SHOWN. A tag grammar re-expressed at a call site is
      the same failure as a precedence order re-expressed at one, so it is one function with one
      declared flow (paint-finds-the-tags-in-the-line) and no second class.
    status: working

  - id: presentation-painting
    concern: >
      Turning a resolved line into DOM. THE ONLY CONCERN IN app/present/ PERMITTED TO TOUCH THE
      DOCUMENT, which is what lets levels, resolution, cascade, context and source stay pure and
      therefore testable under node without a browser. The same split app/main already uses and
      the same one flows.yaml already enforces for the renderer and the session; adopting it
      rather than inventing a fourth arrangement is deliberate.

      It may build DOM and it may not decide. A rendition branch appearing in the painter is the
      violation, and it is the violation `presentation-resolution` above is written to catch.

      IT GREW A SURFACE 2026-07-30 (stage 3) AND STILL MAY NOT DECIDE. The painter now wires the
      cursor affordance — a click listener that moves the cursor, and the `<input>` a raw line
      becomes when there is somewhere for a cursor to go — but the rendition is still the
      cascade's answer, resolved per line against a context the focus surface derived. What the
      painter chose is the EMBODIMENT (inert text with no focus surface, an editable line with
      one), which is this concern's job. An `if (focused)` deciding raw-versus-wired would be the
      violation, and there is none.

      IT GREW A TOKEN RENDITION 2026-07-30 (stage 8) AND THE SPLIT HELD AGAIN. A tag resolved
      `wired` becomes a chip, and everything about the chip that is a JUDGEMENT belongs here: that
      it is placed into the markdown before the single render call rather than swapped into the
      built DOM afterwards (the painter must not read the page it is building), that it carries one
      class and no attribute that could hold a gesture, and that if the renderer will not carry the
      markup through — an indented line is a code block, and the engine indents by four spaces —
      the line falls back to the characters rather than putting escaped markup on screen. WHETHER
      there is a chip is still not decided here: that is `tags` in the served declaration, and
      flipping it changes the DOM with nothing rebuilt.

      AND THE CHIP OFFERS NOTHING, WHICH IS THIS CLASS DECLARING ITS OWN CEILING. A removable chip
      would be an affordance, an affordance needs a source edit, and `applyEdit` gained no case at
      this stage — see app/present/paint.ts for the three questions a removable chip has to answer
      first. It is the first rendition under which the DOM and the source genuinely disagree
      (`#work` is not text on the page any more), which is what finally makes source-write-back's
      corrupted-DOM detector able to catch an inversion on its own rather than only after the page
      is wrecked.
    canonical_class: app/present/paint:paint
    governs_sinks:
      - view-painted
    status: working

  - id: source-write-back
    concern: >
      Every edit, as an operation on the SOURCE STRING. The structural form of the governing
      constraint of the presentation cascade — a resolution is admissible only when every
      affordance it offers can be expressed as an edit to the source, and the app never
      reconstructs markdown from the DOM.

      THE PROPERTY WAS ALREADY TRUE AND NOTHING CHECKED IT. app.html patched one character at one
      line index of the source string it was handed and posted the whole file; the DOM was never
      inverted. What this class adds is findability and an enforcer: "does this affordance have a
      source edit?" is answerable by reading one file, and an affordance that cannot be written
      down as an operation there is not admissible yet. The app posts the WHOLE FILE, so a bad
      inversion does not corrupt one title — it rewrites a view.

      Exercised today by tests/present-cascade.test.mjs, which corrupts the rendered DOM and then
      uses the affordance, asserting the posted markdown is unaffected. Mutation-proven
      2026-07-30 — a painter that built the posted markdown from the rendered elements passed the
      byte-identical golden and every other assertion, and failed only that one. Which is the
      point of it: a naive DOM inversion looks correct exactly until the DOM stops matching the
      source.

      STAGE 8 ADDED NO CASE HERE, AND THAT IS THE STAGE'S MAIN STRUCTURAL CLAIM. The first token
      rendition — a tag as a chip — is READ-ONLY, so the first change that alters what a token
      looks like adds no second write path and could not corrupt a file even if every other claim
      in it were wrong. What it DID add is the first situation in which this class's detector can
      catch an inversion unaided: before the chip, the page still held every source character, so
      a file rebuilt from the DOM came out right by accident and only a deliberately corrupted DOM
      exposed it. With chips painted, `#work` is not text on the page at all.

      AND ONE REAL DEFECT WAS FOUND AND CLOSED WHILE PROVING THAT. `applyEdit` used to fall through
      to the checkbox branch for any edit that was not `set-line`, so an unknown edit kind silently
      UNTICKED a box and returned a whole file to POST. No typed caller could reach it —
      `SourceEdit` is a closed union — but the next person to add `delete-span` and forget a branch
      would have, and the failure shape is the one the engine already paid for one repo away. It
      now discriminates explicitly and refuses. Mutation-proven 2026-07-30: removing the guard
      turns `the edit that would remove a tag does not exist` red and nothing else.
    canonical_class: app/present/source:applyEdit
    status: working

  - id: page-presentation
    concern: >
      Everything page-shaped — reading the session, painting the rendered HTML, reflecting mode
      into the DOM, and wiring the toggle. The ONLY concern permitted to touch the document, so
      the other two can stay pure. It governs the mount sink because mounting IS this concern's
      terminal act: the point where the renderer's output and the session's state become
      something a reader can see and type into.
    canonical_class: app/main:mount
    governs_sinks:
      - document-mounted
    status: working

  - id: section-membership
    concern: >
      Deciding whether a LINE belongs in the SECTION it was typed in — a different question from
      how that line is SHOWN, which is `presentation-resolution`'s, and from what a GESTURE on it
      means, which is the structural language's.

      IT GETS ITS OWN CLASS RATHER THAN JOINING presentation-resolution, and the reason is the same
      one that file gives for the contributors that DID join: the failure worth catching. The
      failure `presentation-resolution` exists to catch is a path that decides how a line is shown
      without routing through the cascade. The failure THIS class exists to catch is different in
      kind — a path that decides where a line BELONGS by re-expressing a pattern rather than
      reading the published predicate. Membership produces no `Contribution`, consults no
      `PresentationLevel`, and would not be caught by a spy on `PresentationCascade.resolve`; a
      concern whose characteristic defect a class cannot see is not that class's concern.

      THE WHOLE CONCERN IS A READ. `scripts/generate-qualification-declaration.mjs` interprets the
      engine's pattern language ONCE, against the monorepo's config, and publishes a closed
      predicate grammar of two operators over three node fields. `app/present/qualification.ts`
      validates that document; `app/present/membership.ts` resolves a line's fields and tests them
      against a predicate. Neither reads YAML and neither knows what `children:` or `$cycle_today`
      mean — 116 of the operator's 159 qualifications are refused at publish time, with a recorded
      reason, precisely so that no code here has to.

      THE INVARIANT THAT MAKES IT SAFE: the answer is only ever DISPLAYED. Nothing in this concern
      produces a `SourceEdit`, and `tests/flow_scenarios/section_membership.ts` asserts that
      `membership.ts` imports neither `source.ts` nor `context.ts` and reaches the cascade zero
      times under a spy on the callee.

      Exercised by tests/present-membership.test.mjs (the operator's own two inbox cases, and every
      refusal), tests/present-qualification.test.mjs (the reader, and a config-mutation falsifier
      proving the answers INVERT when the declaration changes), and
      tests/qualification-agreement.test.mjs (agreement with the engine's own `matches_pattern`
      over 61 real field triples covering 1501 nodes, and 2184 reachable ones).
    status: working

  # ── ADDED 2026-08-07, DURING THE SINKS SURVEY — A DECLARATION THAT ALREADY EXISTED AND DID NOT
  # LAND. `docs/architecture/flows.yaml`'s "THE RULES AXIS, THROUGH THE RESOLVER REGISTRY" block
  # (PR #144) tags six edges `class: capture-rule-application`. No class of that id existed here,
  # so `capability_rollup.py`'s `declared_class_ids` check (schema.py:185) silently dropped every
  # one of them from `class_ids` — the rules resolver could never be counted as class-rooted, not
  # because it lacked a home, but because the home was named and never built. Found by reading the
  # capability_rollup consumer, not assumed. Fixing that drift is this row's whole job.
  - id: capture-rule-application
    concern: >
      Applying the operator's published capture rules to a freshly committed line — the RULES axis
      of the four the resolver registry (app/present/resolvers/registry.ts) walks on every commit.
      `read` addresses the line (`address.ts`), resolves its fields the same way `section-
      membership` does (`select/membership.ts`, so there is one field-resolution reader, not two),
      reads the day boundary (`today.ts`), then runs the published grammar (`rules.ts`'s
      `applyRules`, re-using `membership.ts`'s own matcher — one interpreter, not a second copy)
      and spells the fired effect onto the line or refuses (`renderRuleEffects`).

      THIS IS THE AXIS THE 2026-08-07 PRODUCTION DEFECT LIVES ON. `renderRuleEffects` can abstain
      `conflicting-token-present` when the line already carries a token its own fired effect would
      collide with — a decided rule whose effect the app cannot spell without overwriting or
      inventing characters. That refusal is real and correct; what made it a silent defect is a
      question about the caller (`resolvers/promotion.ts`'s `arm`) and the diagnostics venue, not
      about this concern, and is not this row's to re-litigate — see capability
      `resolvers-child-candidate-reads-the-graph` and the flow-trace scenario
      `tests/flow_scenarios/capture_rules.ts` (PR #144) for what is already proven about this path.

      NO `governs_sinks` HERE, AND THAT IS A FINDING, NOT AN OVERSIGHT. `read`'s answer reaches the
      screen only through `app/index.html`'s `commitLine` — it builds a `CommitContext`, walks
      `RESOLVERS`, and separately calls `paint(...)` with a `predict`/`settle` state the resolvers'
      output primed. There is no TypeScript-to-TypeScript call edge from any resolver into
      `paint.ts` at all: checked directly (`rg -n "paint(" app/present app/main.ts`, and neither
      `paint.ts` nor any resolver imports the other), not assumed. Declaring `governs_sinks:
      [view-painted]` here today would be FALSE, not merely unobserved — the edge it would assert
      does not exist in code for any scenario to ever discover, however many are written. It
      becomes true, and then declarable, only once the connecting act — building a context, walking
      the registry, handing the result to `paint` — moves out of `app/index.html` (which flow-trace
      cannot import; see `.flow-trace.yaml`'s own note) into a module under `app/`, mirroring the
      move `presentation-painting` itself made in migration stage 1. That relocation, and the
      flow-trace scenario that would then drive it end to end, are both real, separately-scoped
      work this row does not attempt.

      The other three axes the same registry walks — `membership`, `ordering`, `promotion`
      (app/present/resolvers/{membership,ordering,promotion}.ts) — have no canonical class home at
      all, not even a broken one; this row does not add one, for the identical reason stated above
      applies to each of them symmetrically and none is closer to true than the others.

      ── 2026-08-07, ADDENDUM: THE RELOCATION HAPPENED, AND `governs_sinks: [view-painted]` IS
      STILL NOT ADDED HERE, FOR A DIFFERENT AND STRONGER REASON THAN "NOT YET MOVED" ──

      `commitLine` DID move, to `app/present/commit.ts` (`createCommitLine`) — see that module's
      own header. The FALSE claim named above ("no TypeScript-to-TypeScript call edge from any
      resolver into `paint.ts`") is now checkable rather than assumed, and checking it changes the
      conclusion, not just its status: `runResolvers` (and every resolver's own `read`/`arm`) is a
      SYNCHRONOUS call that returns, fully unwound, long before `paint` is ever reached — the
      earliest a resolver-armed placement can affect the screen is a LATER repaint, reached via
      `deps.arrive`/`deps.repaintArrived`, after `commitLine`'s own `await`. flow-trace's JS
      observer threads the logical caller through `AsyncLocalStorage`
      (`tools/flow-trace/js/src/runtime.mjs`), which records, for any given call to `paint`,
      whichever INSTRUMENTED frame was still active at that exact moment — and by the time `paint`
      runs, `resolvers/rules:read`'s own frame has already returned and left no trace. This is not
      a gap that closes when a resolver moves somewhere else; it is a structural property of WHEN
      a resolver's answer and WHEN the paint it eventually influences happen. `commitLine` itself
      — the frame active across the whole gap, sync prefix through the async continuation — is the
      only thing that can EVER appear in `paint`'s own caller-chain here, which is why the new
      `commit-line-routing` class below governs `view-painted` and no resolver-anchored class ever
      will, by this mechanism. `tests/flow_scenarios/commit_line_routes_to_paint.ts` is the scenario
      that establishes this — driving the real `commitLine`, the real registry walk (ordering arms
      a real placement), and the real `paint` — and its own header states the same argument as a
      falsifiable claim rather than a proof.
    canonical_class: app/present/resolvers/rules:read
    status: working

  # ── ADDED 2026-08-07 — THE CONNECTING ACT ITSELF, THE ONLY THING THAT CAN GOVERN view-painted ──
  #
  # See `capture-rule-application`'s own addendum immediately above for why this is a SEPARATE
  # class rather than a `governs_sinks` line added to that one: the concern here is not "applying
  # the rules axis" (capture-rule-application's own subject, unaffected) but "reaching paint at
  # all, with whatever any resolver decided" — a concern no individual resolver's home could ever
  # canonically route through, by construction (AsyncLocalStorage records whichever instrumented
  # frame was active WHEN paint fires; a resolver's own frame has always already returned by then).
  - id: commit-line-routing
    concern: >
      THE ONE PLACE A COMMITTED LINE'S RESOLVED FATE REACHES THE SCREEN. `createCommitLine`
      (app/present/commit.ts) builds the context every resolver reads, walks the registry
      (`runResolvers`), arms the two surfaces `paint` itself later reads (`armSettle`,
      `armPredict`), sends the write, and — on the write's own answer, whether that is an
      accepted ack or a refusal with nothing safe to retry — is the frame still active when a
      repaint next reaches `paint`. Not because it calls `paint` directly (it does not, and never
      did — see commit.ts's own header for the two acts that remained page-shaped on purpose,
      `resolverContextFor`/`reportAbstentions`, and `app/index.html`'s own
      `paintView`/`repaintCurrentView`, which stayed behind too) but because nothing between
      `commitLine`'s own continuation and `paint` is itself instrumented, so the logical caller
      flow-trace records for that call is `commitLine`, unbroken across the gap.

      THIS IS THE SAME MOVE `presentation-painting` MADE IN MIGRATION STAGE 1, ONE LAYER UP THE
      CHAIN. Stage 1 made `paint` itself observable by moving it out of `app.html`, where node's
      module-load hook could not reach it. This class makes the CALLER of the resolver walk
      observable the identical way — `commitLine` was the one function on this page that called
      both `runResolvers` and reached `paint`, and until this move that fact was true and
      unverifiable for the same reason: it lived inside a `<script type="module">` in an HTML
      document, which flow-trace cannot import, `.flow-trace.yaml`'s own note explains why, and no
      entry in `modules.include` can fix.

      GOVERNS view-painted, NOT BECAUSE IT PAINTS, BUT BECAUSE IT IS THE CHOKEPOINT. Every one of
      the four resolvers' own answers — membership, ordering, rules, parent promotion — reaches
      the screen through this one function's write path or not at all; there is no second route a
      resolved placement or prediction could take to `paint` that does not pass through
      `commitLine` first. `tests/flow_scenarios/commit_line_routes_to_paint.ts` drives it real:
      the ordering resolver arms a genuine placement, `commitLine` sends the (stubbed) write,
      and — gated behind the write's own accepted answer — reaches `paint`. Proven at the SCENARIO
      level (flow-trace's own capture); `tests/app-predict-wiring.test.mjs` and
      `tests/app-settle-wiring.test.mjs` prove the identical wiring again at the APPLICATION level,
      through the real page, against `#viewBody`'s real children.
    canonical_class: app/present/commit:commitLine
    governs_sinks:
      - view-painted
    status: working

  # ── ADDED 2026-08-07, DURING THE ORDER-CONSUMER STRAIGHTENING — A CONCERN NAMED FOR THE FIRST
  # TIME, WITH NO GOVERNS_SINKS, FOR A MECHANICAL REASON STATED IN FULL BELOW ──
  #
  # The operator's own report: a row's paint position now resolves correctly (`commit-line-routing`,
  # above, closed that), but "hovering over it still shows the old random order" and "selecting up
  # and down sort of has the old placed order, not the resolved post-ordering-rules order." The
  # census: `app/present/arrange/ordering.ts`'s `orderingPlacementFor`/`defaultOrderingPlacementFor`
  # decide the RULE (where a committed row now belongs); `app/present/settle.ts` + `paint.ts`'s
  # `settleRow` MATERIALISE that rule into `#viewBody`'s own child order, one `insertBefore` at a
  # time, on every repaint a live placement survives for. That move is COSMETIC ONLY — it repositions
  # the DOM and never edits `source`, which the real reorder only catches up to once the engine's own
  # next cycle answers. So `source.split("\n")`'s own line numbering and "the row painted Nth" are
  # two different facts the instant any settle has fired for a view, and `app/present/paint.ts`'s
  # `visualLineOrder` (added the same day) is the ONE place the second fact — the DOM's own current,
  # materialised order — is published for a reader outside `paint.ts` to consult, rather than a
  # second copy of "what order are the rows in" computed from `source` again. `app/index.html`'s vim
  # keydown handler now reads it for `j`/`k`/`gg`/`G` — `tests/app-vim-visual-order.test.mjs` proves
  # this at the APPLICATION level, the real page, real DOM, red against unmodified `origin/main`
  # before the fix landed.
  #
  # NO `governs_sinks` HERE, AND IT IS A MECHANICAL FINDING, NOT AN OVERSIGHT — the identical shape
  # `capture-rule-application`'s own note states for the other three resolver axes, for a
  # DIFFERENT-but-related reason this time:
  #
  #   1. THE REAL CALLER IS `app/index.html`, WHICH FLOW-TRACE CANNOT IMPORT. `visualLineOrder`'s
  #      one production call site is the page's own global `keydown` listener — hand-authored HTML,
  #      outside `.flow-trace.yaml`'s `include: [app]` by construction (a node module-load hook
  #      cannot import an HTML document; see that file's own note, restated at `markdown-rendering`
  #      and `capture-rule-application` for the identical reason). A call flow-trace cannot see is a
  #      call canonical-routing has no evidence about, in either direction.
  #   2. A SCENARIO CANNOT STAND IN FOR IT WITHOUT BEING DISCARDED. `canonical_routing.py`'s own
  #      rule — cited in `commit-line-routing`'s own header and in `sinks.yaml`'s survey — throws out
  #      any chain reached by a scenario calling the target directly as its own top-level driver
  #      ("harness-only"). `visualLineOrder` takes one DOM element and returns an array; a scenario
  #      that called it to manufacture evidence would be exactly that harness-only shape, proving
  #      nothing about the real page.
  #   3. THE SHAPE THAT WOULD CLOSE IT IS KNOWN, BECAUSE IT ALREADY HAPPENED ONCE. `commit-line-
  #      routing` (above) closed the identical gap for the resolver-to-paint path by relocating the
  #      CONNECTING ACT — `commitLine` — out of `app/index.html` into `app/present/commit.ts`, so ONE
  #      instrumented frame spans the whole operation and is still active, via `AsyncLocalStorage`,
  #      when the sink fires. The same move here would be extracting the keydown handler's OWN
  #      "translate a `ModeSurface` move effect into a real focus target" glue — today three
  #      statements split across `app/index.html` around `visualLineOrder`, `mode.handleKey`, and
  #      `focus.focus` — into ONE `app/present/` function spanning all three. THAT ALONE IS STILL NOT
  #      ENOUGH FOR `view-painted` SPECIFICALLY: `repaintCurrentView` (the call that actually reaches
  #      `paint`) is itself page-shaped glue, reading a dozen more module-scoped variables
  #      (`graphData`, `mode`, `md`, `draftLine`, `rows`, `declaration`, …) that a present/ module
  #      cannot hold without becoming a second `CommitContext` — a real, separately-scoped relocation,
  #      not attempted here. A NARROWER sink — the resolved cursor target itself, before any repaint —
  #      is the more tractable next step, and is not declared here either, because no such sink exists
  #      in `sinks.yaml` yet and inventing one to immediately govern is exactly the kind of
  #      "declaration with no reader" this file's own header warns against.
  #
  # This class exists so the concern has a NAMED, CORRECT HOME the day either extraction happens —
  # not to claim evidence that was never gathered.
  - id: row-order-materialisation
    concern: >
      Publishing the DOM's OWN current row order — the materialised consequence of every placement
      `app/present/arrange/ordering.ts` has decided and `paint.ts`/`settle.ts` have applied so far —
      so a consumer that needs "what row is next, on screen" reads it rather than re-deriving an
      order of its own from `source`'s line numbering, which is an ADDRESS, not a screen position,
      and drifts from the DOM the instant an optimistic settle has fired even once for a view.

      THE FAILURE THIS CLASS EXISTS TO CATCH: a consumer computing or caching its OWN idea of row
      order instead of reading the one this class publishes. Three consumers were found to disagree
      before this class existed — `paint`/`settle` (correct, DOM-driven), `app/index.html`'s vim
      motions (arithmetic on `source.split("\n")`, wrong the instant a settle has moved a row), and
      the file-line-index addressing every resolver, `applyEdit` and the write path correctly still
      use for CONTENT (a different, legitimate concern this class does not touch). Any FOURTH
      consumer that re-derives adjacency from `source` rather than calling `visualLineOrder` would be
      the identical failure recurring.
    canonical_class: app/present/paint:visualLineOrder
    status: working
