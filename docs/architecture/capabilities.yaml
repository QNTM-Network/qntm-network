    NAME does not say whether `- [ ] ` or `- ` is safe for it — `person` and `task` are both names,
    and only the type's declared `render.shape` (schema.yaml) tells them apart. `resolution.
    chromeShapes` (this step's one addition to the config-only resolution table, `resolutiontable.
    ts`/`generate-resolution-declaration.mjs`) publishes it, restricted to the node types that
    actually appear as a `default_node_type` candidate anywhere in this config (11, measured
    2026-08-01: 9 checkbox, 2 plain_line — `person` and `group`, the operator's own trap case) and
    restricted to the two shapes `newline.ts` knows how to seed (`checkbox`, `plain_line` — never
    `stat_line`/`heading`, left unpublished on purpose, the same "declared but not readable" refusal
    posture as an unaddressable line or an unpublished section).
    THE RUNG REPORT SURVIVES, AND THE DECLARATION IS A FOURTH RUNG IN THE SAME WALK, NOT A
    SHORTCUT. `seedFor` still walks LINE, then STRUCTURAL_NODE (up then down), then VIEW, then —
    ONLY once every PRINTED line has answered nothing — the declaration. Most-specific-PRINTED-
    evidence still wins outright over a config default, unchanged from before this step; proven
    directly by a test that hands `seedFor` a `declared` table that DISAGREES with a real printed
    checkbox line and asserts the printed evidence still answers.
    THE REFUSAL FIRES FOR FOUR NAMED REASONS NOW, NOT ZERO: no `GlobalRegistration` was supplied at
    all (a caller with no declaration, or every test written before this step, unmodified); `sectionAt`
    cannot name a `(view, section)` for the line (above the first heading, an unaddressable view);
    the named section is absent from `qualification.sections[view]` — REAL AND MEASURED, not
    hypothetical: `daily-work` still refuses on 4 of its 5 sections and `daily-personal` on 5 of its
    8, the operator's own two daily surfaces, because the published predicate table is a proper
    subset (`section-addressing-reads-the-full-declared-order`'s own trap, one layer up); or the
    resolved type is absent from `chromeShapes` (a `stat_line`/`heading` type, or a name outside the
    published candidates). Every one of the four is a NAMED refusal a test drives, not an unhandled
    case that happens to return `null`.
    PROVEN AGAINST THE FALSIFIER THE DESIGN DOCUMENT ITSELF STATES: "the seed's chrome matches the
    render.shape the engine would print for that view's resolved default_node_type." `scripts/
    resolution-agreement.py` (extended this step) compares every published `chromeShapes` candidate
    against the engine's OWN `qntm_md.grammar.node_type_form.node_type_forms` — the function the
    RENDERER itself composes its dispatch table from — over a plain YAML parse of `schema.yaml`,
    never re-deriving the engine's own default (an undeclared `render:` block reads as `checkbox`,
    asserted rather than assumed). `tests/resolution-agreement.test.mjs` asserts 0 disagreements
    across all 11 candidates, with a positive control (at least one candidate's engine-read shape is
    `plain_line`) run before the "0 disagreements" is trusted. Since every one of the config's 72
    views resolves to one of these 11 candidates by construction (the GLOBAL value or a view's own
