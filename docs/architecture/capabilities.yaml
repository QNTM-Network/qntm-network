    type comes from `qualification.sections[view][section].nodeType` — the MINTING default, already
    cascaded GLOBAL -> VIEW by the generator, already `membership.ts`'s own field
    (`section-membership-is-read-not-guessed`). `resolution.registration.baseNodeType` (the REVERT
    target, `config-resolution-table-is-published`) is NEVER read by this rung — using it here would
    be exactly the trap §5.5 names: a bare new line is being MINTED, not reverted, and the two
    values only agree today because they share one config key.
