    `parse_qntm_id.parse`, to decide what a hand-typed line's bracket chrome is. `wikiLinkSpans`
    mirrors THAT grammar (`\[\[([^\]]+)\]\]`) and strictly contains every span `qntmIdSpans` would
    find, so `titleSpans` uses it — a widening of what the design document asked to be skipped, not a
    narrowing. `qntmIdSpans` still exists and is still tested against `parse_qntm_id.py`'s own regex,
    per the design document's own instruction, and IS used by orchestrator.py/render_context_parse.py
    elsewhere in the engine — it was not dead code, just not the grammar this app needed.
    (2) MARKERS ARE TWELVE, NOT THREE, AND ARE VOCABULARY — NOT A LIST TO MIRROR AT ALL. The design
    document names three emoji seen on one line (`📅 🛫 🆕`). The shipped
    `config/vocabulary/markers.yaml` declares twelve (`📅 🛫 ✅ 🆕 🔽 ⏫ ☑️ 🎯 ⛔ 📌 🏳️ 💤 🔢`), confirmed
    against real content — `~/qntm/metrics.md` carries `🎯` on a HEADING, `~/qntm/this_week.md` and
    `habits.md` carry `☑️` — neither of which the three-item list would have caught. But
    `parse_marker.py` itself builds its matcher from `token_resolver.marker_token_forms()` — there is
    no frozenset of emoji anywhere in the engine — so WHICH GLYPHS ARE MARKERS is vocabulary
    (`config/vocabulary/markers.yaml`), exactly the distinction `resolution.ts`'s own `TAG` header
    draws between a tag's closed-code SHAPE and its vocabulary-owned MEANING, one repo layer down.
    Hardcoding the shipped twelve would repeat the mistake that header warns against: an operator who
    adds a 13th marker to his own instance would silently lose protection from a grammar meant to
