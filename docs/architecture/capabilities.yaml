- id: the-load-path-has-no-third-party-cdn
  intent: >-
    THE FIRST BYTE OF APPLICATION CODE DOES NOT WAIT ON A THIRD-PARTY ORIGIN. `app/index.html`
    used to statically import `markdown-it` and `@simplewebauthn/browser` from `esm.sh` — MEASURED
    (research-state-and-speed.md §2.2): 17 sub-requests, a dependency chain four levels deep, ~440ms
    of serial latency on desktop broadband cold, and STILL 1,175.6ms with every byte served from a
    warm HTTP cache, because the cost was the round trips, not the bytes. Because the imports were
    static, nothing in the module ran until all four levels resolved — the reader saw a fixed bar
    over a black rectangle for the whole of that wait.
    NOW BOTH LIBRARIES ARE BUNDLED LOCALLY. `app/vendor.ts` re-exports both from npm; a third
    esbuild entry point in `scripts/build.mjs` builds it, minified, to `dist/vendor.js`; the page
    imports `MarkdownIt`, `startRegistration` and `startAuthentication` from that ONE site-root-
    absolute, same-origin path. MEASURED, this change's own artifact: `dist/vendor.js` is 157,000
    bytes raw, 46,359 bytes brotli (`zlib.brotliCompressSync`, quality 11) — 17 requests and a
    4-deep chain collapse to one request on the connection to `qntm.network` that is already open.
    THE CONSTRAINT THE RESEARCH DOCUMENT CITED COULD NOT BE FOUND WRITTEN DOWN ANYWHERE IN THIS
    REPOSITORY. §2.2 of that document says "'No CDN dependencies at runtime' and 'the site has a
    strict content policy' are incompatible with two https://esm.sh/… imports" and calls that a
    STATED constraint — but unlike every other claim in that document, it carries no file:line
    citation. A search of docs/, brand/, qntm_network_checks.py, state.yaml and every other
    architecture/backlog file for "no CDN", "content policy" and "third-party" found the phrase
    nowhere except that document's own sentence. THIS CAPABILITY DOES NOT CLAIM TO SATISFY A WRITTEN
    RULE, because none was found; it claims what is independently true and measured regardless of
    whether a rule was ever written down — no `esm.sh` (or any other CDN) reference survives in any
    file GitHub Pages serves, proven by building fresh and reading the output (tests/no-cdn.test.mjs),
    not by grepping source.
    TWO THINGS ESTABLISHED, NOT ASSUMED, BEFORE SHIPPING THIS. (1) `markdown-it`'s version is
    unchanged by bundling — both the page and `tests/present-golden.test.mjs` resolve the same npm
    package, `14.3.0`, and the golden byte-identical comparison against the historical painter it
    replaced still passes unmoved. (2) `@simplewebauthn/browser` tolerates bundling: its source was
    read, not assumed — `WebAuthnAbortService` is the only module-level side effect (an
    `AbortController`, a standard API in both Node and every target browser) and `startRegistration`
    / `startAuthentication` touch `navigator.credentials` only inside their own function bodies, at
    ceremony time, never at import time. Bundling changes WHERE the bytes come from and not what the
    ceremony does. Its version is now pinned in `package-lock.json` (`^13.3.0`) rather than floating
    on whatever `esm.sh` resolved `@13` to at fetch time, which is a durability improvement `esm.sh`
    never offered.
    NOT VERIFIED IN A BROWSER. No real cold load was measured against the bundled version — every
    "before" number above is the research document's own `[OBS]` measurement, reused rather than
    reproduced, and every "after" number is this change's build output measured with Node's `zlib`,
    not a browser's network panel.
  tier: functional
  rooting: >-
    isolated, same shape as `app-is-a-typed-browser-application` — this is a property of the BUILD
    (`scripts/build.mjs`, `package.json`) and the DELIVERY PATH (one more committed, CI-staleness-
