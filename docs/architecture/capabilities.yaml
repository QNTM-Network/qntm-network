    change. If it did not, the app would be holding a copy of the config rather than reading a
    declaration generated from it.
    NOT VERIFIED. No browser, no passkey session, no live server, no cycle. Nothing in this table
    has been shown to anybody — see `rooting` below for what "published, not yet narrated" means
    for this specific axis, which is different from the other three.
