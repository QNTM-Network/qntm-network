- id: section-addressing-reads-the-full-declared-order
  intent: >-
    THE APP NAMES WHICH SECTION A PRINTED ROW IS IN, BY THE CONFIG'S OWN ID — AND THE MAPPING IS
    BUILT SO THE OBVIOUS SHORTCUT CANNOT BE TAKEN, NOT MERELY AVOIDED.
    docs/implementation-artifacts/design-the-resolution-architecture.md names L3 ADDRESSING as the
    layer the brief's own candidate list omitted, and step 2 as "the blocker": the app already knew
    a section by its POSITIONAL ORDINAL (`instance.ts`'s own `section` field, the Nth heading
    walked from the markdown), and `section-membership-is-read-not-guessed`'s declaration is keyed
    on the config's section `id:` string (`inbox-tagged`, `domain-empty`). Nothing mapped one to
    the other, so `membershipFor` could not be called for a real cursor line at all.
    THE TRAP, MEASURED RATHER THAN ASSUMED (2026-08-01, against the operator's live config): heading
    count equals declared section count in 71 of 71 checked views (186 declared, 184 headings
    matched positionally — see `rooting` below for the one file the sweep could not check and why).
    So the naive join — `Object.keys(sections[view])[ordinal]`, indexing the PUBLISHED predicate
    table by ordinal — looks safe, and IS safe, on 25 of 27 published views. It is silently WRONG on
    the operator's two daily surfaces: `daily-work` publishes a qualification for 1 of its 5
    declared sections, `daily-personal` for 3 of its 8, because the published table
    (`QualificationLanguage.sections`) is a proper SUBSET, filtered to what the app can decide
    (`section-membership-is-read-not-guessed`'s own record: 43 of 159 qualifications). Indexing
    that subset by ordinal returns the WRONG section id, or nothing, for every unpublished ordinal —
    silently, because both views print exactly as many headings as sections either way.
    THE FIX MAKES THE MISTAKE UNREPRESENTABLE, NOT MERELY DOCUMENTED AGAINST. Step 1 of the design
    document adds `sectionOrder` — per view, the FULL declared order of section ids, unfiltered,
    captured in `scripts/generate-qualification-declaration.mjs`'s `readViews` BEFORE the existing
    `sections` filter runs, published as a sibling key to `sections` rather than derived from it.
    `app/present/address.ts`'s `sectionAt` (step 2) takes `sectionOrder` as its one config-shaped
    parameter — its type is `Record<string, readonly string[]>`, a different shape from `sections`'
    `Record<string, Record<string, SectionQualification>>` — so a caller cannot pass the published
    subset where the full order is expected; TypeScript refuses the call. There is no code path
    through which the trap can be re-introduced by accident, which is the whole difference between
    "avoided" and "impossible" this capability's own name insists on.
    THE ORDINAL ITSELF IS COUNTED THE SAME WAY `instance.ts` ALREADY COUNTS IT — a heading OPENS the
    section it is the first line of (the same renderer.py:399/:430 attribution `instance.ts`'s own
    header cites), so `sectionOrdinalAt` walks every line at-or-above the target counting headings,
    0-based, `null` above the file's first heading. Deliberately NOT reused from `instancesOf`,
    which returns no id for a BLANK line — a blank line still sits inside a section positionally,
    and `sectionAt` must still answer for the cursor resting on one before anything is typed.
    PROVEN AGAINST THE TRAP DIRECTLY, NOT ONLY AGAINST THE EASY CASE. `tests/present-address.test.mjs`
    section 2 addresses all 5 of `daily-work`'s ordinals and all 8 of `daily-personal`'s — including
    every unpublished one — against real vault headings, and section 3 mutates a scratch copy of the
    real config (rename a section id; reorder two sections) and asserts `sectionAt`'s answer follows,
    the same falsifier `section-membership-is-read-not-guessed` already proved for the predicate
    axis. `tests/flow_scenarios/section_addressing.ts` proves the same trap closed under the node
    observer, and additionally proves the JOIN composes honestly: `sectionAt` names `daily-work`'s
    unpublished "urgent" ordinal correctly, and `membershipFor`, given that correct name, still
    abstains with `no-section-declaration` — L3 answering "where" and L5 declining "whether" are
    both right, and neither module can be used to fake the other's job.
    NOT VERIFIED. No browser, no passkey session, no live server, no cycle, and no comparison
    against the engine's own `RenderedLineRecord.section_id` — that needs a running cycle, which
    this worktree is forbidden from running. What section 4 of the test file proves instead is the
    positional agreement `design-presentation-instance-identity.md` §2.3(c) already measured and
    `instance.ts`'s own shipped ordinal already trusts, extended from 5 views to 71 of 72.
  tier: functional
  rooting: >-
    isolated, same family `presentation-instance-identity`'s own `instance.ts` still is:
    `app/present/address.ts` has no importer inside `app/` yet — `app/index.html` does not call
    `sectionAt`, and neither does `membership.ts` (the two are composed only by
    `tests/flow_scenarios/section_addressing.ts`, standing in for the caller step 4 would add). The
