- id: config-resolution-table-is-published
  intent: >-
    THE BROWSER CAN READ REGISTRATION'S TWO NAMES, ORDERING, LINE GRAMMARS AND THE DAY BOUNDARY
    FROM CONFIG ALONE, WITH NO GRAPH READ AND NO CLOCK — design-the-resolution-architecture.md
    step 5, "publish the config-only resolution table."
    TWO OF THE EIGHT CONFIG-ONLY KINDS THAT STEP NAMES WERE ALREADY PUBLISHED AND ALREADY
    CONSUMED BEFORE THIS CAPABILITY, AND THIS RECORD SAYS SO RATHER THAN RE-CLAIMING THEM.
    `defaults` (153 of 186 sections, 67 distinct maps over 8 fields) and the per-view MINTING
    default (18 sheets + 1 global) are `qualification.sections[view][section].{defaults,nodeType}`,
    generated by `scripts/generate-qualification-declaration.mjs` and read on every line
    `app/present/membership.ts` types — `section-membership-is-read-not-guessed` already carries
    that record. The measured reason those two matter most: 103 of 186 sections declare a
    `defaults:` that sets a field their OWN qualification predicate tests, so a browser that
    evaluated a placement filter before applying the section's default would say a line is about
    to leave at the instant the section's own default is about to make it stay — RESOLVE, THEN
    EVALUATE, and `membership.ts:166-181` already gets the order right.
    WHAT THIS CAPABILITY ADDS. `resolution.registration.baseNodeType` — the REVERT target
    (`qntm_md.resolution.registration.RegistrationKey.BASE_NODE_TYPE`), GLOBAL only, forever,
    published under a name SEPARATE from `defaultNodeType` even though both read one config key
    today (`default_registration.default_node_type`). The design document's own §5.5 names the
    trap this closes: a local mirror that used the per-view MINTING default as a revert target
    would reproduce, in the browser, the 2026-07-27 `routine -> task -> routine` race the engine
    restructured its own signatures to make impossible. `scripts/generate-resolution-declaration.
    mjs` refuses to generate at all if any sheet or section ever starts declaring `input_grammar`
    or `default_tags` — the two other GLOBAL-only registration keys this table also carries —
    because publishing a single GLOBAL value for a key that has started varying per view would be
    a silently stale answer, not a conservative one.
    `resolution.lineGrammars` — `line_grammars.yaml`'s 2 grammars (`tolerant` admits 3 shapes,
    `checkbox_only` admits none), verbatim. `resolution.ordering` — the 9 sections (of 186, 7
    `ordering:` + 2 `ordering_mode:`) that say anything about row order, published exactly as
    declared — NOT the engine's still-open fold of `ordering_mode` + `pin_after_qualification_
    drops` into one `persist_placing` knob (design §5.8), which is a separate, unfinished decision
    this table does not reproduce. `resolution.dayBoundary` — `day_boundary.yaml`'s 3 keys.
    `pull_context` (77 sections) IS DELIBERATELY LEFT OUT, AND THIS IS THE JUDGEMENT CALL THE
    BRIEF ASKED FOR BY NAME. It is "predicate exact, answer runtime"
    (research-the-resolution-universe.md §6.2) — the config says which edge and which direction,
    but the useful answer needs a transitive graph walk (measured depth up to 6), and no step
    5 through 13 of this document's own sequence names it as a dependency. Publishing it now would
    be a kind with zero future reader anywhere in this arc's own plan, which is the exact condition
    the design document's own rule refuses: "a smaller table that is exact and consumed beats a
    complete one nobody reads."
    THE SIZE IS MEASURED, NOT ESTIMATED, AND PINNED SO A FUTURE WIDENING IS VISIBLE.
    `tests/present-resolution.test.mjs` section 5 asserts the whole `resolution` key stays under
    3,000 bytes (measured 994 B on 2026-08-01) — inside the neighbourhood
    research-the-resolution-universe.md §6.1 measured for the full eight-kind table (per-view
    454-1,930 B, median 685 B), given this key is a deliberate SUBSET of that table (defaults and
    the minting default already live elsewhere, per above).
    AGREEMENT WITH THE ENGINE'S OWN RESOLVER IS MEASURED, NOT ASSERTED — the design document's own
    falsifier for this step, run exactly as it states it, not a stronger or weaker version.
    `scripts/resolution-agreement.py` loads the operator's real config bundle (read-only, config
    only — no graph, no state.db, no cycle) and calls the engine's OWN
    `qntm_md.resolution.cascade.ResolutionCascade` and `qntm_md.resolution.registration.
    resolve_registration_keys` / `resolve_base_node_type`. `tests/resolution-agreement.test.mjs`
    asserts all 49 published (view, section) pairs' `nodeType`/`defaults` agree, and that the 4
    GLOBAL registration facts agree — the FIRST time `qualification.sections`'s already-shipped
    defaults/registration values have been checked against the engine's own resolver rather than
    only against a second read of the same YAML the generator itself parsed. Three positive
    controls are asserted before any comparison is trusted (global defaults empty, no section
    declares `default_fields`, `default_tags` empty everywhere) — the same house rule the earlier
    103-of-186 measurement was paid to learn: a measurement of full agreement is worthless if the
    comparison could have passed vacuously, so the script refuses to write a fixture if any of the
    three ever stops holding, and one test asserts at least one compared section's defaults are
    non-empty so "all agree" cannot mean "all empty".
    THE FALSIFIER — proof standard #3: a config change moves the published answer.
    `tests/present-resolution.test.mjs` section 4 mutates a SCRATCH COPY of the real config three
    ways — reverses `this-week:overdue`'s sort direction, changes `day_start_hour`, and adds an
