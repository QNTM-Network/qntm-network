- id: day-boundary-resolver-agrees-with-the-engine
  intent: >-
    THE BROWSER HAS ONE FUNCTION FOR "WHAT DAY IS IT", AND IT AGREES WITH THE ENGINE'S OWN —
    design-the-resolution-architecture.md step 8, L2 + L5. `app/present/today.ts`'s `todayFor`
    mirrors `qntm_md.substrate_wiring.day_boundary.resolve_logical_day`/`resolve_week_end` field
    for field: convert the instant to wall-clock components in the DECLARED zone
    (`resolution.dayBoundary.timezone`, published by step 5, never the device's own default zone),
    then the logical date is that wall-clock date UNLESS the wall-clock hour is before
    `day_start_hour`, in which case it is the PREVIOUS calendar date; the week end derives from
    that date label under `week_starts_on`'s convention.
    THE CRUX, ANSWERED RATHER THAN ASSUMED: WHICH CLOCK, AND WHAT WHEN THE TWO DISAGREE. The
    engine's cycle stamps `cycle_today` from `datetime.now(timezone.utc)`
    (`orchestrator.py:5424,5432-5436`) — an absolute UTC instant, reinterpreted through ONE
    declared IANA zone. `Date.now()` in the browser is the SAME kind of measurement — a UTC epoch
    count, not "whatever zone the device displays" — so the two agree exactly when this module
    converts through the DECLARED zone rather than the device's own default one, proven by
    §4's own test: the same instant read against `Europe/London` and against
    `America/Los_Angeles` (an arbitrary device zone) resolves to two calendar days apart, which is
    exactly the divergence a `new Date().getHours()`-based implementation would have silently
    produced. THE ONE RESIDUAL RISK THIS MODULE CANNOT CLOSE, NAMED RATHER THAN HIDDEN: if the
    DEVICE'S OWN SYSTEM CLOCK is wrong (unsynced, drifted, hand-set), `Date.now()` is not the real
    "now", and no local computation can detect that without a network round-trip this repo's
    read-only posture does not make. The residual is narrow — the drifted duration, near the
    boundary only — and this module makes no attempt to guess around it; it has no guess to make,
    only the instant it is handed, and no caller in this PR treats its answer as authoritative
    over graph state.
    THE THREE KEYS, READ RATHER THAN ASSUMED FROM THEIR NAMES.
    `day_boundary.yaml`'s own header (`day-boundary-is-config-local-consistent`, 2026-06-24) and
    `resolve_logical_day`'s docstring were read before use, not inferred: `timezone` is an IANA
    name (capabilities-not-policies — the engine never hardcodes it); `day_start_hour` (0..23) is
    when the LOGICAL day rolls over, so a completion before it is stamped for the PREVIOUS
    calendar day (the late-night grace the operator asked for); `week_starts_on` decides where
    `$cycle_week_end` (the `this-week` view's date-range upper bound) falls, derived from the
    LOGICAL date label so the day-start-hour boundary is already folded in before week arithmetic
    runs. With no config the boundary is UTC midnight — legacy, unconfigured-bundle behaviour —
    but the operator's real config always declares one, so this module never exercises that path
    against his own data.
    WHAT CONSUMES THIS, MEASURED RATHER THAN INVENTED. `resolution.dayBoundary` was already
    PUBLISHED by step 5 (`config-resolution-table-is-published`); this capability is the READ half
    step 8 itself asks for. TWO CANDIDATE CONSUMERS WERE MEASURED IN THIS STEP AND BOTH REFUTED AS
    REAL DEPENDENCIES TODAY. ORDERING (`ordering-position-is-said-in-the-freshness-line`, step 7)
    does not need it — already measured and shipped: none of the 9 declared orderings compares a
    field to the clock. MEMBERSHIP's 8 clock-bound qualifications
    (`$cycle_today`/`$cycle_week_end` compared against a date field, `scripts/generate-
    qualification-declaration.mjs`'s own header) do NOT become answerable by this capability
    alone — measured directly against that generator's `normalisePredicate`: it refuses BOTH a
    `$`-prefixed value AND any multi-key predicate (a `{gte:…, lte:…}` range is two keys)
    UNCONDITIONALLY, for every qualification, clock-bound or not. The refusal is that the
    predicate grammar has no orderable-comparison or `$variable`-substitution vocabulary at all
    (`qualification.ts`'s `FieldPredicate` is `{eq}`/`{not}` only), not which value to substitute
    for "today" — so answering those 8 needs the generator AND `membership.ts`'s evaluator to
    both learn a wider grammar, a separate and larger unit of work than "read the boundary",
    filed as `widen-qualification-language-for-clock-bound-predicates` (backlog.yaml) rather than
    invented here to manufacture a consumer this step does not have.
    STATUS UPDATED 2026-08-03 (`feat/wire-the-clock`) — A RUNTIME CALL SITE IS NOW WIRED.
    `app/index.html`'s `sayAsOf` (the freshness-line writer `ordering-position-is-said-in-the-
    freshness-line`/`section-membership-is-said-in-the-freshness-line` already established the
