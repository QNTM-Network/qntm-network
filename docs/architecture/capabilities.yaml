- id: the-app-has-an-address-and-a-way-in
  intent: >-
    The app is a PLACE — https://qntm.network/app/ — and a visitor gets there in one click from
    the top right of the landing page. Until 2026-07-30 it was `app.html` at the root of a
    marketing site with no link to it from anywhere; the whole link set on the front page was
    `#access`, `#top` and two font URLs (research-site-survey.md section 5d). Both halves are the
    capability: an address without a way in is what the site already had, and a link to a page
    that moved is a 404.
    THE PREVIOUS ADDRESS KEEPS WORKING, and that is part of the commitment rather than a
    transitional kindness. GitHub Pages serves this repo verbatim with no rewrite rules, so
    `/app.html` answers only while a file sits there; it is now a redirect stub, and the enforcer
    below refuses its removal.
    WHY A PATH AND NOT `app.qntm.network`. The subdomain is what was asked for and it was
    rejected on evidence, not on taste. This zone's nameservers are Google Cloud DNS
    (`ns-cloud-d*.googledomains.com`), not Cloudflare, so there is no Cloudflare zone to attach a
    Worker route to; and GitHub Pages serves exactly ONE custom domain per site — a request with
    `Host: app.qntm.network` against the Pages edge returns 404 today, measured. Reaching the
    subdomain means either migrating the whole zone's nameservers to Cloudflare or standing up a
    second Pages site, both of which are changes to the live site's DNS made for a nicer URL.
    THE PASSKEY IS NOT THE OBSTACLE, and that is worth recording because it was assumed to be.
    The credential is bound to the RP ID `qntm.network` (worker/src/util.js `rpConfig`), and
    WebAuthn L2 section 5.1.3 admits any origin whose effective domain the RP ID is a registrable
    domain suffix of — so the existing passkey would work unchanged from `app.qntm.network`. Two
    Worker lines would need widening (the `ALLOWED_ORIGINS` set and the hardcoded expected
    origin) and nothing would need re-enrolling. The subdomain stays available at the cost of a
    DNS decision, not at the cost of the operator's only credential.
    NOTE ON PATHS ELSEWHERE IN THIS FILE. Capabilities below still cite `app.html:NNN`. Those
    mean `app/index.html` now. They were not rewritten here: their line numbers are already stale
    from the presentation migration, they belong to an arc in flight, and a mass path edit across
    another capability's prose is a merge conflict for no gain in truth.
  tier: functional
  rooting: >-
    isolated — this is a property of the DEPLOY LAYOUT (which file answers at which URL, and
    which page links to it), the same shape as push-to-deploy-loop. There is no class it could
    route through: the anchor is one line of HTML and the address is a file path.
  status: working
  enforced_by:
  - declared_state: state-app-is-reachable-from-the-front-door
    verify: PASS
  enforcement_depth: 1
  enforcement_surface: 0
  confidence: thin
- id: a-human-authors-in-the-browser
  intent: >-
    A human logs into qntm.network and DOES THEIR CONTENT THERE — not in Obsidian, not
    through a CLI. This is the apex the presentation stratum below it serves, and the thing
    every other capability in that stratum is measured against. Single user for now; signups,
    accounts and isolation are explicitly OUT of scope and their absence is a decision, not a
    gap. WHAT EXISTS TODAY, stated so the distance is legible rather than implied: passkey
    auth through a Cloudflare Worker, a hosted graph, and a working web write path — you can
    click a checkbox in the browser and it cycles through the hosted model. You can TOGGLE.
    You cannot AUTHOR. WHAT IS MISSING is a line-level authoring surface — `app.html` builds
    labels, checkboxes, spans, headings and divs and carries no textarea, no contenteditable
    and no keyboard path to a line's characters (`app.html:244-267`).
    EVIDENCE TIER — NONE. THIS IS A PLAN, NOT A PROOF. There is no enforcer and nothing here
    can be falsified until an authoring surface exists. It is declared so the distance is in
    the queue instead of in a conversation. See
    docs/implementation-artifacts/design-presentation-cascade.md.
  tier: foundational
  rooting: >-
    isolated — this capability is an APEX statement about the product, not a call path. It
    has no home class of its own; the classes belong to the four capabilities below it, which
    is where rooting will be earned. Declared rather than left silent because a silent absence
    is the debt this roster already carries on eight pre-existing rows.
  status: undeclared
- id: presentation-is-resolved-not-chosen
  intent: >-
    How a line is SHOWN is RESOLVED through a declared cascade, not decided at the call site.
    The engine emits `-`, `#` and the markers; which rendition of them a person sees is
    decided by the same kind of cascade that decides what they MEAN, with WHO IS USING IT and
    WHAT THEY ARE DOING as levels. Seven levels, most specific wins, ordered by when each
    fact becomes known — GLOBAL, USER, VIEW, STRUCTURAL_NODE, LINE, MODE, FOCUS — with the
    precedence order owned in exactly ONE tuple and no caller permitted to re-express it.
    RAW AND APP-LIKE ARE NOT TWO PRODUCTS. They are two values of one type, and every mixture
    between them is legal and reachable by declaration. This is the OUTPUT half of the cascade
    whose INPUT half shipped in the engine (`qntm_md.resolution`); it is the other half of
    that one, not a new idea beside it.
    TODAY there is no cascade, no declaration and no reader — `paintView` (`app.html:234-269`)
    is 36 lines of hardcoded decisions, and the app resolves exactly ONE thing (the checkbox
    glyph) while showing every tag, wiki-link and marker as literal characters.
    EVIDENCE TIER — NONE. THIS IS A PLAN, NOT A PROOF. It becomes falsifiable at migration
    stage 1, when a painter that decides without routing through the cascade is a detectable
    violation. Not before. See design-presentation-cascade.md sections 2, 3 and 7.
    ── UPDATE 2026-07-30, MIGRATION STAGE 1 SHIPPED. The paragraph above describes what this
    repo was, and the sentence it ends on has come true. `paintView` is gone; app/present/ holds
    six modules; the painter asks `PresentationCascade.resolve` and obeys the answer; the
    precedence order is owned in one tuple that nothing re-expresses. THE ROSTER IS STILL ONE
    THING — the checkbox, plus the heading demotion that section 0.1 undercounted — because the
    stage was an extraction and adding resolutions while moving them would have made
    "byte-identical" unprovable. Two keys ship, not five: `tags`, `links` and `markers` have no
    wired rendition until stage 8 and declaring them would be three keys read by nothing.
    WHAT IS PROVEN, and by what: the painted DOM is byte-identical to the painter it replaced
    (tests/present-golden.test.mjs runs both, out of the git history, against one markdown-it
    instance, over a whole-view fixture and a 1,125-case sweep); the painter routes through the
    cascade and obeys it (tests/present-cascade.test.mjs, mutation-proven both ways). WHAT IS NOT
    proven: that NO path bypasses. That is canonical routing, and it needs `flow-trace verify`,
    which exits 2 here for a reason outside this repo.
    ── UPDATE 2026-07-30, MIGRATION STAGE 2 SHIPPED. THE CASCADE NOW HAS A LEVEL THAT SPEAKS. The
    GLOBAL level is `presentation.json`, served with the app from the site root; app.html fetches
    it and `presentationFromDeclaration` (app/present/context) reads it through
    `readDeclaration` (app/present/declaration) into a GLOBAL contribution. Its committed value
    is today's behaviour — both keys `wired` — so nothing moved when it landed, and that is
    asserted as a comparison rather than promised. THE FALSIFIER IS THE POINT OF THE STAGE and it
    is asserted at two distances: flipping one key to `raw` changes the painted DOM through the
    modules, AND through app.html's own lifted script answering a flipped fetch. The second is the
    one that catches this stage's real failure mode — a perfect reader the page never calls.
    Mutation-proven three ways on 2026-07-30 (the reader applies nothing; the page reads and never
    installs; an unknown key is silently ignored), each red with its own message, each restored.
    AND THE SENTENCE ABOVE ABOUT `verify` IS NOW FALSE — with the tool's JS observer installed it
    exits 0 with 23 PASS / 0 FAIL and the five stage-1 flows are OBSERVED with counts. Canonical
    routing is still not answered here, for a narrower reason recorded in .flow-trace.yaml: the
    verbs that would answer it install probe anchors that blind the JS observer.
    ── UPDATE 2026-07-30, MIGRATION STAGE 8 (FIRST RENDITION) SHIPPED. `tags` IS A RESOLUTION KEY
    WITH A READER, and it is the first key whose subject is a TOKEN rather than a LINE. Four keys
    now: checkbox, heading, prose, tags. `links` and `markers` still have none and are still not
    declared, for the reason this roster has given twice already.
    IT IS THE FIRST KEY WHOSE DEFAULT AND WHOSE DECLARED VALUE DISAGREE, AND THAT ASYMMETRY IS THE
    ARCHITECTURE. `DEFAULT.tags` is `raw` — the floor of the cascade is what the app did before the
    key existed, which is what keeps tests/present-golden.test.mjs a real byte-for-byte comparison
    against the painter this replaced. `presentation.json` declares `wired`. So the chip is not
    built in; it is a decision this INSTANCE makes, at GLOBAL, in a served file. Flip that one key
    to `raw`, reload, and the chips are characters WITH NOTHING REBUILT — measured in a real
    browser against an unchanged bundle (identical md5 before and after), not asserted.
    WHAT A TAG IS, AND WHERE THE ANSWER CAME FROM. Not "a word after a hash". The engine's
    canonical grammar is `(?<!\S)#([a-zA-Z_][a-zA-Z0-9_-]*)` (the engine,
    src/qntm_md/io/parser/parse_tag.py:23), it lives in CODE and not in vocabulary config (the
    engine's own audit lists it under "Closed (code)", research-input-interpretation.md:290), and
    app/present/resolution.tagSpans mirrors it. So `#1`, `foo#bar`, `C#`, `# Heading`, `##` and a
    URL fragment are NOT tags, `#work/admin` is `#work` only, and the app agrees with the engine on
    every one. The shipped form writes the boundary as `(^|\s)` instead of a lookbehind because
    Safari only got lookbehind in 16.4 and an unparseable literal takes the whole bundle down; the
    two forms are PROVEN equal over the engine's own cases plus a 972-case sweep, with the engine's
    verbatim regex carried in the test as the reference.
    WHAT IS PROVEN, and by what. tests/present-tags.test.mjs (66) — the grammar against the
    engine's, the painter asking and obeying, a chip never swallowing a non-tag, the grammar's
    inability to emit an HTML-special character (fuzzed), the renderer-refuses fallback, and the
    corrupted-DOM detector under chips. Plus 5 through the app page's own lifted script and 2 more
    through the page's served declaration. Mutation-proven NINE ways, each red with its own
    message, each restored: a digit-leading tag body, the boundary dropped, the painter always
    chipping, the painter never chipping, the fallback removed, applyEdit's discrimination removed,
    `hidden` admitted as a rendition, the chip given an attribute, and the posted file rebuilt from
    the DOM. `flow-trace verify .` exits 0 at 30 PASS / 0 FAIL with the new edge OBSERVED
    (app/present/paint → app/present/resolution.tagSpans, count 5).
    WHAT WAS REFUTED. `hidden` is NOT a third rendition. The design calls hiding the safest
    resolution because hidden text is not edited; here it is not safe and it is not even true.
    `Rendition` is ONE union shared by every key and readDeclaration validates against it with no
    per-key table, so admitting `hidden` would admit `{"checkbox": "hidden"}` — well-formed, loads
    clean, read by nothing, painted as a checkbox anyway. And hidden text IS edited in this app:
    FOCUS takes a line to `raw` on every key, so the cursor landing makes hidden tags reappear.
    What it would take is renditions that vary per key rather than one union across all of them.
  tier: foundational
  status: undeclared
- id: the-focused-line-shows-its-source
  intent: >-
    Cursor on the line and you see `- [ ]`. Cursor off it and you see a rendered, clickable
    checkbox. ONE RULE AT ONE LEVEL, demonstrating the whole cascade — the FOCUS level is the
    most specific of the seven and beats every declaration below it, which is what stops a
    line that declares itself a chip from becoming uneditable. The focused line renders its
    EXACT source text; the source string stays the truth and the whole-file write path is
    unchanged.
    THE SURFACE THIS REACTS TO DOES NOT EXIST. `app.html` has no text-editing surface at all,
    so there is nowhere for a cursor to land (`app.html:244-267`). The only textarea in the
    repo holds a whole document on a different page (`app/main.ts:41`) which the site does not
    link to. The rule is minutes of work; the surface is the half-day, and saying so is more
    use than sizing the rule alone.
    EVIDENCE TIER — NONE. THIS IS A PLAN, NOT A PROOF. Falsifiable from migration stage 3 by
    the test that stage names — focus a line and assert the DOM carries the verbatim source
    substring; blur and assert the rendition returns; assert the posted markdown differs from
    the original by exactly that line.
    ── UPDATE 2026-07-30, MIGRATION STAGE 3 SHIPPED. THE SURFACE EXISTS AND THE RULE RUNS ON IT.
    Clicking a line's text puts the cursor on it; the line renders as an `<input>` holding its
    verbatim source; blur or Enter returns the resolved rendition and Escape drops what was typed.
    The rule is a LEVEL, not a branch: `FocusSurface` (app/present/focus) contributes `raw` at
    FOCUS for the line under the cursor and the painter obeys what the cascade then resolves — so
    "the cursor always wins" is a property of the ORDER, owned in one tuple, and a GLOBAL
    declaration of `wired` cannot make a line uneditable.
    WHAT IS PROVEN, and by what. tests/present-focus.test.mjs asserts the three the design names
    plus the one it does not: the posted file is IMMUNE TO A CORRUPTED DOM — every other rendered
    element is wrecked before the affordance is used, and the other lines still come out of the
    source string byte for byte. That is the test that catches the trap stage 1 found, where a
    naive inversion passes a byte-identical golden and every ordinary assertion. Asserted again
    through app.html's own lifted script. Mutation-proven five ways (raw is inert text; blur never
    repaints; the file is rebuilt from the DOM; a multi-line text is split in instead of refused;
    FOCUS is demoted out of first place), each red with its own message, each restored. AND IN A
    REAL BROWSER, not only under node: clicked, typed, blurred, and the committed file differed by
    exactly the edited line.
    THE AFFORDANCE HAS A SOURCE EDIT AND USES THE ONE THAT EXISTED. `set-line` joins
    `set-checkbox` inside app/present/source — an `<input>` holding verbatim source text has a
    substring operation ("line N becomes this string"); a contenteditable region holding a
    rendition would not, which is exactly why one is admissible and the other is forbidden. An
    `<input>` cannot hold a newline, so "exactly one line replaced" is a property of the element as
    well as of the code, and applyEdit refuses a multi-line text anyway.
    STILL MISSING, said plainly: there is no keyboard path INTO the surface — a line is reached by
    clicking it, and arrow-key navigation between lines is not built. A blank line is still not a
    cursor target, because it has no rendition at either end.
  tier: functional
  status: undeclared
- id: every-affordance-writes-back-through-the-source
  intent: >-
    The app may only offer a resolution it can take back EXACTLY. If it shows a chip instead
    of `#work` it must put `#work` back, character for character. This is the governing
    constraint of the presentation cascade and the sequencing rule for it — resolution levels
    advance exactly as fast as the source edits do, which is a schedule and not an objection.
    Stated structurally rather than as a vocabulary rule, because the client version is
    stronger than the engine version and needs to be — THE APP NEVER RECONSTRUCTS MARKDOWN
    FROM THE DOM. The markdown is the truth, the DOM is a projection, and edits travel
    projection to source to engine to new projection. That forbids exactly one shape: a
    contenteditable region serialised back to markdown.
    THIS ONE IS ALREADY TRUE AND NOTHING CHECKS IT. `toggleTask` (`app.html:273-296`) patches
    one character at one line index of the source string it was handed and posts the WHOLE
    file; the DOM is write-only. That is why the round trip is exact today, and it is one
    careless commit from ending.
    EVIDENCE TIER — STRUCTURAL, UNENFORCED. This is the ONE declaration here describing
    something real rather than planned, and it is the one most worth an enforcer. Its
    falsifier lands with migration stage 1. The engine's own `accept ⊇ emit` gates cover the
    checkbox glyph pair, the symmetric-by-construction tags and markers, and the three render
    shapes — but those are the ENGINE's enforcers in the engine's repo. qntm.network has none.
    ── UPDATE 2026-07-30, MIGRATION STAGE 1 SHIPPED. It is still true and it is no longer
    unchecked. `applyEdit` (app/present/source) is now the single place an edit is computed, the
    painter reaches it, and app.html posts what it is handed rather than building a string of its
    own. The enforcer is `is immune to a corrupted DOM` in tests/present-cascade.test.mjs, which
    wrecks every rendered element and then uses the affordance, asserting the posted markdown is
    unaffected. MUTATION-PROVEN, and the mutation is worth recording because of what it revealed:
    a painter that built the posted markdown out of the rendered DOM passed the byte-identical
    golden and every other assertion in the suite, and failed only that one. A naive DOM
    inversion looks correct exactly until the DOM stops matching the source — which is why the
    test corrupts it deliberately rather than trusting a happy path.
    Still unenforced in the ONE sense that matters and is not yet closed: nothing proves no OTHER
    path writes back. That is canonical routing against `source-write-back`, and it needs
    `flow-trace verify`, which exits 2 here.
    ── UPDATE 2026-07-30, MIGRATION STAGE 8 (FIRST RENDITION) SHIPPED, AND THIS CAPABILITY IS WHY
    IT SHIPPED SMALL. The first resolution that changes a TOKEN rather than a LINE — `#work` as a
    chip — ADDS NO SOURCE EDIT AND NO SECOND WRITE PATH. `applyEdit` still knows exactly two
    operations. The chip is READ-ONLY, and that is this constraint doing its job rather than a
    corner cut: the deletion is writable ("delete [start,end) of line N", and `TagSpan` already
    carries the offsets), but the AFFORDANCE is not answerable yet — what the leftover whitespace
    becomes, what deleting a tag MEANS to an engine for which `#task` selects a node type and
    `#work` sets a field, and where a destructive click would sit when the chip lives inside the
    span that is the cursor target. Named in app/present/paint.ts so the residue is legible.
    IT IS ALSO THE FIRST RENDITION UNDER WHICH THIS PROPERTY COULD REALLY BE TESTED. Until now the
    page held every source character, so a file rebuilt from the DOM came out right by accident and
    only a deliberately corrupted DOM exposed the inversion. With chips painted, `#work` is not
    text on the page at all — the mutation that rebuilds the posted file from the rendered elements
    now loses the tags outright, and the round trip is asserted through the app page's own script with
    every chip on the page replaced by something that is not a tag before the affordance is used.
    AND A REAL DEFECT IN THE WRITE PATH WAS FOUND WHILE PROVING IT, by a test rather than by
    reading. `applyEdit` fell through to the checkbox branch for anything that was not `set-line`,
    so an unknown edit kind silently UNTICKED a box and returned a whole file to POST — undefined
    is falsy. Unreachable from a typed caller today; reachable by the next person to add
    `delete-span` and forget a branch, which is exactly the affordance this stage deferred. It
    discriminates explicitly and refuses now, and the guard is mutation-proven.
    ── UPDATE 2026-07-31, THE THIRD SOURCE EDIT SHIPPED, AND IT IS THE FIRST CONSTRUCTIVE ONE.
    `insert-line` joins `set-checkbox` and `set-line`, and the union is still CLOSED — the explicit
    refusal added at stage 8 is what made the third kind cost nothing, and it is re-proven by
    handing `applyEdit` a kind that does not exist. There is still ONE write path: a line created
    and a line replaced arrive at the page through the same `onLineCommit` callback carrying the
    same whole-file markdown, and app/index.html cannot tell them apart because it does not need to.
    THE CONSTRAINT DID REAL WORK HERE RATHER THAN BEING SATISFIED IN PASSING. Creating a line is
    expressible — "the file gains this string at index N" — but an EMPTY one is not merely
    unhelpful, and that was measured rather than reasoned. Against a hermetic copy of the engine's
    own starter bundle, `- [ ] ` with no title MINTS A NODE: the cycle created qntm:3 titled
    "(untitled)" and reprinted it into three sections across two views, permanently. So the source
    string is NEVER speculatively mutated: a line being made is held in `app/present/draft`, out of
    the file, and reaches `applyEdit` exactly once, at settlement, carrying what was typed. An
    abandoned line therefore needs no DELETE affordance to undo — which is the second thing the
    constraint bought, because a constructive edit that required a destructive one to clean up
    after it would have doubled the union to add one feature.
    ── UPDATE 2026-07-31, THE SENTENCE ABOVE CARRIES A CORRECTION FROM THE OPERATOR. This intent
    says "The markdown is the truth, the DOM is a projection", and he answered THAT IS A DANGEROUS
    SENTENCE. It is true in the direction it was written for and dangerous read as a general claim,
    so it is annotated rather than rewritten. THE GRAPH IS THE TRUTH; THE MARKDOWN IS A VIEW OF IT.
    The markdown is authoritative for the DELTA — the change — because a file carries no events, so
    the only thing it can honestly assert is the difference between what it said and what it now
    says. It is DERIVED for the state. Against the DOM this capability's version is exactly right
    and nothing here weakens it; what it must not be read as is a licence for a write to assert the
    whole file. That reading is live in the shipped app and is measured in
    docs/implementation-artifacts/design-the-edit-is-a-safe-haven.md section 3.
  tier: foundational
  status: undeclared

- id: a-new-line-is-resolved-not-guessed
  intent: >-
    A NEW LINE HAS NO CONTENT, SO NOTHING ABOUT IT CAN BE READ FROM THE LINE — everything about it
    must be RESOLVED. Pressing Enter at the end of a line makes one below it with the cursor in it;
    clicking the space below the last line makes one there; and what it IS comes from the cascade
    rather than from a constant in the painter.
    WHICH CASCADE, PRECISELY. The engine decides what a bare line MEANS with `default_node_type`,
    which cascades GLOBAL -> VIEW -> STRUCTURAL_NODE (engine `resolution/registration.py:89-113`;
    shipped GLOBAL `task` at `config/views/default_registration.yaml:4`; `config/views/people.yaml`
    declares `person`). That decision is consumed at BOTH ends of one declaration: `io/applier.py`
    `_declared_form_is_chrome_free` (110-150) admits a chrome-free line by asking whether its
    resolved type's `render.shape` is not `checkbox`, and `render/renderer.py:909-936` dispatches on
    the SAME shape to decide what the line is PRINTED with. So the app does not re-derive the
    cascade and could not — the snapshot envelope carries `path`, `title`, `markdown`, `graph` and
    `locations`, and nothing about registration. It reads the answer the cascade ALREADY GAVE, off
    the source string, from the nearest line the engine printed as a node. `app/present/newline`
    walks four rungs and reports which one answered: LINE, STRUCTURAL_NODE, VIEW, GLOBAL.
    THE GLOBAL RUNG REFUSES RATHER THAN GUESSING, AND THAT IS THE MEASURED HALF. On a view that has
    printed no node line at all there is no answer to read, and both available guesses cost the
    operator. Against a hermetic copy of the shipped starter bundle, a checkbox line authored into
    the starter's `people` view (`person`, fields `[title, qntm_id]`) does not degrade — it raises
    `CycleAbortedError: ... Node type 'person' does not have field 'status'`, and the WHOLE cycle
    dies, taking every other edit in it. The other guess, a plain `- `, is refused at the applier's
    form gate under a checkbox-shaped default and the line vanishes when the view is rewritten. So
    nothing is written and the app says why.
    WHAT WOULD CLOSE IT is one field: the snapshot envelope carrying the view's resolved
    `default_node_type`. That is design-presentation-cascade.md §4.3's own blocker and the
    precondition of its stage 7. With it the GLOBAL rung becomes a read instead of a refusal and
    nothing else about `app/present/newline` changes.
    EVIDENCE TIER — OBSERVED, BOTH HALVES. tests/present-newline.test.mjs (31 assertions) drives
    the real painter through both gestures and proves the pair with opposite outcomes, the
    provenance of each rung, the empty-view refusal, and that the posted file is the source with
    exactly one line inserted and every other line byte-identical — including with every rendered
    element deliberately wrecked first, which is the DOM-inversion detector for this affordance.
    Mutation-proven six ways (the content guard removed; the seed hardcoded to a checkbox; the empty
    view guessing instead of declining; Enter no longer opening a line; the trailing target no
    longer last; an unknown edit kind falling through to the checkbox branch) — every one goes red.
    AND THE CYCLE ACCEPTS IT, over four cycles plus a no-op fifth, against a hermetic instance built
    by `qntm-md init` and driven through the SHIPPED dist/present.js rather than by hand-written
    markdown: `- [ ] Book the venue` came back `- [ ] Book the venue [[qntm:3]] #work #task` and
    `- Bob Newcomer` came back `- Bob Newcomer [[qntm:4]] #person`, with every pre-existing line in
    five control views intact and neither half of the pair leaking into the other.
  tier: foundational
  status: undeclared
- id: presentation-resolution-is-user-and-mode-aware
  intent: >-
    Who is using it and what they are doing are LEVELS of the presentation cascade, not
    branches in a painter. USER sits second, immediately below GLOBAL — a durable fact known
    at login. MODE sits sixth, between LINE and FOCUS — a transient fact known at the gesture.
    They are deliberately NOT adjacent, because collapsing "who you are" and "what you are
    doing" onto one rung forces one of them to lie. The operator sits near the raw end and
    most people would sit near the wired end and never see a bracket; both are values of one
    type, which is what makes them a dial rather than two products.
    THE USER LEVEL IS THE ONE MOST AT RISK OF BEING DECLARED AND NEVER READ, because with one
    user a wrong default is indistinguishable from a working one. It therefore ships only with
    a way to change it and a test that reads it back through the session. Its home is the
    server-side user record behind the passkey session — NOT localStorage, which would trip
    `state-edits-are-ephemeral` correctly, since that would be persistence arriving without a
    declaration.
    EVIDENCE TIER — NONE. THIS IS A PLAN, NOT A PROOF. Falsifiable from migration stages 4 and
    5, each by resolving one fixture twice and asserting the painted DOM differs.
  tier: functional
  rooting: >-
    isolated STILL. `presentation-resolution` exists as of 2026-07-30 (stage 1) and USER and
    MODE are real members of the level enum it walks — a test can already resolve twice with
    different contributions and get different answers. What does not exist is anything that
    CONTRIBUTES at either level: no user record field, no session mode. Rooting a capability
    whose levels nothing populates would describe a path no code takes. It roots at stages 4
    and 5, each of which ships a contributor and a test that reads it back.
  status: undeclared
- id: the-app-has-a-shell-and-views-are-chosen-by-folder
  intent: >-
    The app is a PLACE you are IN, not a view rendered on a blank page. A fixed menu bar carries
    the mark, WHERE YOU ARE (the current view's folder and title), who you are, the way out, and
    the way to somewhere else; a drawer off the right edge holds every view as the folder tree
    the operator already reads in Obsidian.
    THE FOLDER IS THE VAULT'S, TAKEN FROM `path`. This is the whole of the capability's content
    and the reason it is not "a nicer picker". Every view in the snapshot carries `path` — the
    rendered file's place in the vault, which is also the address /app/edit-file writes back to,
    so it cannot drift from where the file is. Its directory IS the folder, with no convention
    invented on top and nothing hardcoded. The vault's loose root files sit at the tree's root,
    the way a loose file does in Obsidian.
    IT IS NOT `domain`, WHICH IS WHAT THE RETIRED <select> USED. `domain` is a label written by
    hand in each view's config, and across the operator's 76 configs it is coarser than the tree
    (fourteen `dev` views in four project folders, one bucket), it renames
    (`character-development/` -> `character`, `spirit/program/` -> `program`), and it is
    sometimes wrong (`dev/test-scratchpad.md` declares `domain: personal`). Nothing here
    re-derives it or corrects it: `domain` is the ENGINE's label, read by the engine, and a
    second answer to it computed in the browser would be exactly the kind of drift this project
    exists to refuse.
    THE PHONE IS NOT A SECOND DESIGN. One shell, two adaptations, both about a hand rather than
    about width: the bar sheds WORDS and never controls (the wordmark reduces to the brand
    device's dot, which is the responsive-logo pair brand/BRAND.md already names), and the
    drawer's head — title and close together, one element — moves to the BOTTOM of the panel, so
    the one control that dismisses it is in the thumb's arc rather than in the top-right corner
    a one-handed grip cannot reach. Every target is at least 44px, stated once as `--touch`.
    WHAT IT DELIBERATELY DOES NOT DO IS WRITE. Every affordance the app offers has to be
    expressible as an edit to the SOURCE STRING (see every-affordance-writes-back-through-the-source
    above — this read `source-is-the-only-truth`, an id no capability in this file has ever
    carried; corrected 2026-07-31), and
    navigation is not an edit. The drawer chooses; it does not rename, move, create or delete a
    view, and it never reads the DOM to produce anything. `applyEdit` still knows exactly two
    operations after this capability landed, which is the check that it stayed navigation.
  tier: functional
  rooting: >-
    isolated — the shell is chrome around the reading column and shares no class with it. The one
    thing it consumes is the snapshot's `path` field, which already existed and already had a
    reader (the write path posts to it); the folder derivation is four lines in the page and has
    no other caller. Rooting it through a class would be inventing a module so that a declaration
    had somewhere to point.
  status: working
  enforced_by:
  - declared_state: state-the-view-chooser-is-one-folder-drawer
    verify: PASS
  enforcement_depth: 1
  enforcement_surface: 0
  confidence: thin

# ══════════════════════════════════════════════════════════════════════════════════════════════
# PINNED TOP-LEVEL BY THE OPERATOR, 2026-07-31. Two capabilities, IN TENSION, and the tension is
# the design — one says hold still, the other says keep moving. Both are declared here so the
# distance is in the derived queue instead of in a conversation. The spec is
# docs/implementation-artifacts/design-the-edit-is-a-safe-haven.md.
#
# THE PRINCIPLE UNDER BOTH, in the operator's own correction: THE GRAPH IS THE TRUTH, THE MARKDOWN
# IS A VIEW OF IT. The markdown is authoritative for the DELTA and derived for the STATE, and the
# cycle COMPUTES BEHAVIOUR — so a projection is a consequence, not a copy.
# ══════════════════════════════════════════════════════════════════════════════════════════════
- id: the-edit-is-a-safe-haven
  intent: >-
    THE LINE UNDER THE CURSOR IS HIS. The world may move around it — but not under it. What the
    operator is typing is never overwritten, reordered or reflowed by something arriving from
    elsewhere, and it is never silently discarded. His words for it: "delta focus — like a safe
    haven."
    THE SUBJECT IS THE DELTA, NOT THE FILE AND NOT THE VIEW, and getting that right is the whole
    of the capability. A file nothing may rewrite is a file the engine cannot serve; a view
    nothing may replace is the second capability refuted. The haven is the characters between the
    cursor arriving on a line and leaving it — bounded, short-lived, ONE LINE WIDE, and the only
    region in this app whose content is AUTHORED rather than DERIVED.
    IT HAS FOUR LEVELS AND THEY FAIL DIFFERENTLY. FOCUS (that a line is open) is held outside the
    file already. ANCHOR (which line is open) is held as a POSITIONAL INDEX, and an index is
    meaningful only against the string it indexes. DELTA (what has been typed) lives in a DOM
    element a repaint destroys. BASE (what the edit is computed against) is a closure captured at
    paint time and posted whole, guarded by nothing.
    TWO OF THE FOUR ALREADY EXIST AND WERE BUILT FOR ENTIRELY OTHER REASONS, which is why the
    remaining work is one type change and one region of the painter rather than an arc.
    `FocusSurface` holds the cursor as one number outside the source string
    (app/present/focus.ts:50) because "a fact about the moment written into a file is a fact that
    outlives the moment" — nothing to do with concurrency. `DraftSurface` holds an uncommitted new
    line out of the file entirely (app/present/draft.ts:55-83) so that an abandoned line would need
    no DELETE edit to undo it. That second one is already a working implementation of a region of
    the screen the source string does not own; this capability asks for exactly one more, with the
    same lifecycle.
    NOTHING HERE ADDS AN EDIT KIND. `SourceEdit` stays the closed union of three
    (app/present/source.ts:114) and keeping it closed is load-bearing. Every behaviour specified is
    `set-line` or `insert-line` against a CORRECTLY CHOSEN BASE. The one case that would need a
    fourth kind is the one the design refuses to specify (a vanished line re-inserting itself into
    a view the cycle removed it from), and the refusal is the point.
    EVIDENCE TIER — SPLIT PER LEVEL, AND NO PART OF IT IS FALSIFIABLE END TO END TODAY. FOCUS is
    STRUCTURAL AND UNENFORCED: real, shipped, proven by tests/present-focus.test.mjs, and nothing
    checks that it stays outside the file. ANCHOR is MEASURED WRONG, not assumed wrong — a
    hermetic run against the shipped dist/present.js repaints a body from a projection with one
    line inserted above the cursor, and the cursor lands on a heading with the typing gone. DELTA
    and BASE are MEASURED ABSENT by the same run — the edited line missing from the new projection
    paints zero editable rows, `FocusSurface` still reports the old index, and no refusal is
    reported anywhere. So one level is real and unguarded, one is defective, two do not exist. It
    becomes falsifiable when the first backlog row lands, and not before.
  tier: foundational
  rooting: >-
    isolated FOR NOW, and deliberately rather than by omission. Three of the four levels would root
    against classes that already exist — presentation-painting owns the repaint and the two
    surfaces are inside the capture filter — but the fourth, BASE, is a property of the WRITE PATH,
    which spans app/index.html (outside the capture filter, at the repo root), worker/src/app.js
    and a graph server that is not in this repository. Rooting the capability through the painter
    alone would describe the half that is already right and stay silent about the half that is
    wrong. It roots when the write-safety row lands and the base becomes a value some module
    computes rather than a closure some function captured.
  status: undeclared
- id: the-world-moves-around-you
  intent: >-
    THE SYSTEM COMPUTES BEHAVIOUR, SO THE PROJECTION SHOULD LIVE RATHER THAN WAIT TO BE FETCHED. A
    cycle fires rules, so an edit can unlock a task, change a node three views away, or make
    something appear that nobody typed — and those changes should ARRIVE. The operator's words:
    "the world moving around you, like real life."
    THIS IS NOT AUTO-REFRESH, and the distinction is the whole capability. Auto-refresh is a client
    asking again on a timer. What this commits to is that a change the operator DID NOT TYPE
    reaches his screen without him asking for it — which is the only way a computed consequence is
    distinguishable from a coincidence. If he has to press refresh to see a rule fire, the rule did
    not fire FOR HIM; it fired for the database.
    TODAY EVERY INSTALL OF A PROJECTION IS THE CLIENT ASKING. `loadGraph` at boot and sign-in, the
    refresh button, and the return of a write are the complete set (app/index.html:1284-1335,
    :1156-1202). There is no transport by which the server can say anything to this app.
    THE PAINTER HALF IS ALREADY BUILT, and it is the only part of this above zero. `paint(body,
    source, context, deps)` empties the body and rebuilds the whole view from ONE STRING
    (app/present/paint.ts:452, :537), which was done so the cascade would stay the only decider —
    "a patch-one-element implementation would have to know which lines a focus change could
    possibly affect, which is a second copy of the precedence order". The consequence nobody was
    aiming for is that installing a new projection is already a one-argument operation: no diff to
    compute, no DOM reconciler to write, no partial-update path that could be wrong. The world
    moving is `repaint(newSource)`.
    IT IS IN TENSION WITH `the-edit-is-a-safe-haven` AND THEY RESOLVE COMPLETELY RATHER THAN BY
    COMPROMISE, because their subjects are disjoint. This one owns THE STATE — every line of the
    view, derived, replaceable at any moment, never authoritative in the browser. That one owns THE
    DELTA — the characters under the cursor, authored, authoritative, never derived. They looked
    like a trade-off only because the app today conflates them by posting the whole state in order
    to express one change.
    IT MUST NOT SHIP BEFORE THE WRITE IS SAFE, and that ordering is a commitment rather than a
    preference. A projection arriving unbidden into an app whose every save posts a whole file
    computed against a stale base is a faster machine for discarding the cycle's own output. The
    sequence is in design-the-edit-is-a-safe-haven.md section 10 and the reason is in section 3.4.
    EVIDENCE TIER — NONE. THIS IS A PLAN, NOT A PROOF, and it is not even partly true. There is no
    push, no subscription, no server-sent anything, and the graph server's declared surface is
    `GET /health`, `GET /graph` and `POST /cycle`. Nothing here can be falsified until a transport
    exists, and no enforcer is claimed. It is declared so the distance sits in the derived queue
    instead of in a conversation.
  tier: foundational
  rooting: >-
    isolated — this capability is about a TRANSPORT that does not exist, on a server that is not in
    this repository. The one thing it would route through in the browser is the painter, which
    already has a class (presentation-painting) earned by a different capability; claiming it here
    would root the half that is already built and say nothing about the half that is missing. It
    roots when something outside this app can address it.
  status: undeclared
