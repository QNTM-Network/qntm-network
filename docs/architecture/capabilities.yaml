- id: section-order-prefers-the-served-envelope
  intent: >-
    design-the-resolution-architecture.md STEP 11, "carry section identity in the envelope" —
    NARROWED, ON EVIDENCE, TO WHAT A SERVER THAT NEVER RUNS THE RENDERER CAN ACTUALLY PUBLISH.
    THE THREE QUESTIONS THE STEP'S OWN BRIEF ASKED, ANSWERED IN ORDER.
    (1) WHERE CAN THE SERVER GET SECTION IDENTITY? `server/app.py` (monorepo, read-only) reads
    view CONFIG and RAW MARKDOWN; `GET /graph` never calls `run_cycle`, and `POST /cycle`'s own
    `RenderedLineRecord` — `(sheet_id, section_id, node_id)`, the fact that WOULD answer "which
    section is line N in" directly — is computed every cycle and discarded before `_envelope()`
    builds its response (`server/app.py:188-197`; design doc §5.9). So the server can emit the
    DECLARED SECTION ORDER per view — the same list step 1's generator already reads off the
    identical config, cheaply: no renderer, no database read, no migration, an extension of
    `_read_views`'s existing regex-style parse (`_parse_view_meta`) to also capture the ordered
    `sections:` id list. It CANNOT emit a PER-LINE section without capturing `RenderedLineRecord`
    before it is discarded, which is an engine/server change together, an arc not an afternoon —
    filed, not attempted (`carry-declared-section-order-in-the-server-envelope`, backlog.yaml).
    (2) IS THIS THE R2 THAT WAS REJECTED? NO RECORD OF SUCH A REJECTION WAS FOUND, MEASURED
    RATHER THAN TAKEN ON TRUST. `design-presentation-instance-identity.md` §2.3(c) and §7 assess
