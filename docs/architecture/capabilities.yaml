- id: the-write-carries-a-precondition-the-server-can-refuse
  intent: >-
    design-the-resolution-architecture.md STEP 13, the last of the sequence — L7 RECONCILIATION.
    THE ANSWER TO THE ROW'S OWN FIRST QUESTION IS NO: the Worker CANNOT refuse a stale write safely
    on its own, and this record is what was built instead of a refusal that only appears to work.
    THE STRONG VERSION IS NOT AVAILABLE, MEASURED RATHER THAN ASSUMED. `server/app.py` (the sibling
    monorepo, read read-only on 2026-08-01 at c0d77b7) offers `POST /vault/file` — an unconditional
    `target.write_text(...)` with no comparison anywhere in it — and `GET /graph`, the whole 77-view
    envelope. There is NO per-file read and NO precondition of any kind. So the only refusal this
    repository could build alone is READ-THEN-WRITE, which the row itself already judges WEAKER
    because check-then-act races: between the Worker's read and its write, a cycle can rewrite the
    file and the write clobbers it anyway.
    AND A SECOND REASON, WHICH IS THE DECIDING ONE AND IS NOT ON THE ROW. A refusal is only safe
    once the BROWSER can hold a refused edit's characters, and today it cannot. A stale base is an
    ORDINARY event on this path, not a rare one — `a-write-refuses-a-stale-base`'s own ARM 2
    measures a second edit inside one ~14 s cycle producing one — so a live refusal would fire
    during normal use. Switching one on before the holding half exists would trade a SILENT loss of
    the engine's output for a VISIBLE loss of the operator's typing, which is the worse trade and
    the one the row's risk note forbids. That is why nothing here refuses today.
    WHAT SHIPPED IS THE WORKER HALF, COMPLETE AND INERT. `POST /app/edit-file` forwards `base` to
    `POST /vault/file` when the browser sent one and NOT AT ALL when it did not — absent, never ""
    and never null, so a receiver never has to tell "no base" from "the wrong base" and a caller
    that predates this change sends a byte-identical request. A 409 from the graph server becomes a
    409 to the browser carrying `{refused, path, current}`, and NO CYCLE RUNS BEHIND IT — a cycle
    after a refused write would hand the browser a fresh projection and let it believe its edit had
    been ingested. The day `POST /vault/file` learns to compare, every part of this wakes up with no
    further change in this repository.
    EXACTLY ONE EXPRESSION CAN REFUSE A WRITE, AND IT IS NOT A COMPARISON: `w.status === 409`, the
    graph server's own answer. The Worker computes no digest and compares no string, so it cannot
    invent a mismatch; a `base` it cannot read is still just a string it hands on. Everything else
    fails OPEN — an unreadable base, a graph server that never learns to refuse, any upstream status
    other than 409 — and behaves exactly as it did before.
    WHAT A 409 DOES TO HIS CHARACTERS, STATED PLAINLY BECAUSE IT IS THE RISK. A refused LINE COMMIT
    does NOT repaint: the painter is already holding his edited source, so the page keeps showing
    what he typed, and the freshness line says so in the same vocabulary `BASE_REFUSALS.stale`
    already uses with only the consequence changed. THE COST IS REAL AND IS NAMED: the screen then
    shows a line the vault does not have. It is the cheaper cost by a distance — a refusal answered
    by deleting work he DID type would be strictly worse than the defect. A refused TICK reverts the
    box, which has no characters at stake and is the truth. THIS IS NOT THE EDIT BEING HELD: his
    characters live in the DOM and in the painter's source, which the next arriving projection
    replaces. The piece that survives a repaint and offers the edit back is
    `a-refused-edit-is-held-unanchored`, filed rather than half-built.
    EVIDENCE TIER — NODE-TEST ONLY, FIXTURES THROUGHOUT, AND NO SCENARIO IS POSSIBLE. 20 tests in
    tests/app-stale-write-refusal.test.mjs. The row's own falsifier (a POST carrying a stale base is
    answered 409 with the current content, and `POST /cycle` is never called); a matching base
    writes; an absent base writes with `base` absent from the forwarded body and the body's keys
    asserted exactly; four unreadable base shapes ("", null, a number, an object) all write; three
    bases the Worker has no way to check all write, which is the proof it cannot reject one it
    should not; four non-409 upstream answers all still produce the 502 they always did; a 409 with
    no `current` still refuses with `current: null` and reconstructs nothing. Plus the page's half
    driven through app/index.html's own lifted script: a refused commit keeps the characters on
    screen, does not adopt the server's copy as a new base, and says one sentence rather than two
    that contradict each other — with an ordinary FAILURE still repainting from the last server
    state, and an ordinary SUCCESS still landing, as the two controls.
    MUTATION-PROVEN SIX WAYS, each turning the suite red: the refusal branch never firing
    (409 -> 410, 3 red); an absent base substituted with "" (5 red); a cycle run behind a refused
    write (2 red); the page's 409 branch deleted so a refusal destroys his typing (3 red); the
    client's contradicting guess no longer dropped (1 red); the tick's refusal branch deleted
    (1 red).
    NOT VERIFIED — AND ON THIS ROW THE LIST IS THE POINT. No browser, no passkey session, no live
    server, no cycle, and NOT ONE REAL POST. Every request in the evidence is a fixture. The 409
    branch is UNREACHABLE IN PRODUCTION until the monorepo change lands, so what is proven is that
    it is correct when it is reached, never that it has been reached. The monorepo change itself is
    specified in backlog row `vault-file-accepts-a-precondition` and is NOT built here.
  tier: functional
  rooting: >-
    TWO FILES, BOTH OUTSIDE flow-trace's reach, and the two reasons differ. `worker/src/app.js` is
    outside `.flow-trace.yaml`'s `modules.include: [app]` altogether — it is a Cloudflare runtime
    module, not the application stratum. `app/index.html` is inside the prefix and invisible anyway,
    because capture is a node module-load hook and node cannot import an HTML document. SO NO
    SCENARIO COVERS THIS AND NONE CAN; flows.yaml's closing note says so rather than leaving it
    implied. What stands in its place is a STRUCTURAL assertion under `node --test`: the suite reads
    worker/src/app.js as text, strips its comments, and asserts `409` occurs exactly twice in the
    executable code and that no digest is computed anywhere in it. That is the claim a flow edge
    could not have made in any case — this row's whole safety argument is about what the Worker DOES
    NOT DO, and flow-trace measures edges that exist. NOTHING NEW IS IMPORTED ANYWHERE:
    `app/present/base.ts` is untouched, `motions.ts` still imports nothing, `SourceEdit` is still
    the closed union of three, and the four pinned write-adjacent counts are unmoved, COUNTED ON
    BOTH SIDES OF THE BRANCH BASE (bc47598) rather than asserted: `await writeFile(` 2 and 2,
    `graphData = ` 5 and 5, `.markdown = ` 0 and 0, and `applyEdit(` 5 external callers and 5
    (2 in app/index.html, 3 in app/present/paint.ts).
  status: working

- id: a-vanished-or-refused-edit-is-held-unanchored
  intent: >-
    THE OPERATOR'S CHARACTERS SURVIVE THE TWO EVENTS THAT USED TO DESTROY THEM, and it is the
    behaviour he chose by name when asked directly: "hold the edit, unanchored — your typing
    survives as a row the source doesn't own, like the draft line already works. The app says the
    line it belonged to is gone and asks where it goes." He chose it over REFUSING the arrival
    (cheap, never wrong, but the typing is lost) and over MOVING TO THE NEAREST SURVIVOR (never
    stuck, but he types into a line he did not choose).
    TWO BACKLOG ROWS, ONE MECHANISM, AND SAYING SO IS PART OF THE RECORD.
    `the-vanished-line-is-parked-not-dropped` is about a line the CYCLE removed;
    `a-refused-edit-is-held-unanchored` is about a write the SERVER declined. They were filed
    separately and they are the same thing to the person typing — characters the source string does
    not own — so they are built and recorded as one piece: one surface, one strip on the page, one
    release rule, one sentence pattern.
    THIS IS THE FOURTH LEVEL OF THE HAVEN. design-the-edit-is-a-safe-haven.md names four (FOCUS,
    ANCHOR, DELTA, BASE) and measured DELTA as the one that did not exist at all — "what has been
    typed lives in a DOM element a repaint destroys". It exists now. FOCUS is `FocusSurface`, ANCHOR
    is that surface's `InstanceAnchor`, BASE is `BaseSurface`, and DELTA is `HeldSurface`.
    WHAT HE SEES. A strip under the reading column, headed "Held — characters no file owns. Nothing
    here is saved." Each row holds the characters in a readonly input he can select and copy, names
    its own FILE, says what happened to it, and carries a Discard button. The freshness line gains
    one clause in each of its two existing sentences and no new register: "the line you were on is
    not in this view any more — what was on it is held below", and "… the server refused it and
    nothing was written · what you typed is still on this line, and held below". Not a dialog. A
    modal in the middle of a sentence violates the safe haven more than the thing it protects
    against.
    NOTHING HELD IS EVER WRITTEN, AND THE MODULE IS BUILT SO IT CANNOT BE — a construction, not a
    promise. `app/present/held.ts` imports nothing, so it cannot reach `applyEdit`. A held record
    carries NO LINE INDEX, which is the single most important field it does not have: an index is
    what `applyEdit` takes, so a record with one is a record a later change could post. It carries
    an INSTANCE instead — an identity, `instance.ts` — which can be recognised and reported and
    nothing else. `SourceEdit` is still the closed union of three.
    THE FOUR PINNED WRITE-ADJACENT COUNTS ARE UNMOVED, re-measured on this branch rather than
    asserted: `graphData` assigned 5, `writeFile(` 3 occurrences (its declaration plus two callers),
    `applyEdit(` 5 outside its own module (2 in app/index.html, 3 in app/present/paint.ts), and
    `.markdown` never assigned anywhere under app/. A fifth count is added and pinned by this
    change: the held surface is reached from exactly five expressions in the page, `held.hold` from
    exactly one of them, and `held.rows` from exactly one.
    THE STRIP IS OUTSIDE THE READING COLUMN, WHICH IS THE STRUCTURAL HALF OF THE SAME ARGUMENT.
    `#heldStrip` is a SIBLING of `#viewBody`; `paint()` is handed `#viewBody` and a source string
    and cannot walk into a sibling. So no held row can ever be part of the element tree the painter
    walks or the source string it computes an edit from. app/present/paint.ts is untouched by this
    change.
    OPEN DECISION 1 IS NOT ANSWERED AND THE REFUSAL TO ANSWER IT IS KEPT. Re-placing a vanished line
    means re-inserting into a view the cycle deliberately removed it from — which the next cycle
    removes again, or, if the node is gone, mints a fresh one, the exact failure
    `app/present/source.ts` already measured for an empty insert. design-the-edit-is-a-safe-haven.md
    §6.4 refuses that behaviour and §11 says the question belongs to the ENGINE. So there is no "put
    it back" button. What replaces it is that RETYPING is the recovery path and needs none: the
    retyped line commits through the ordinary write path, and the release rule clears the held row
    when the projection carries the characters back.
    WHEN IT CLEARS, EXACTLY. (1) The file takes the characters back — `settle` releases every row
    for the arriving file whose text that file now owns, either as a whole line or as a PREFIX with
    a token appended after a space, which is the one real shape a cycle produces. (2) He presses
    Discard. (3) He signs out. Nothing else: not a repaint, not time passing, not another hold, and
    NOT A VIEW CHANGE. The comparison in (1) is deliberately the strict one, because releasing
    wrongly loses his characters while releasing late costs him one dismissal.
    IT SURVIVES A VIEW CHANGE AND A DRAFT DOES NOT, AND BOTH ARE RIGHT. `paintView` drops a draft on
    every view change with an argued reason — "a row leaking across a view change is the one way
    this affordance could write into a file nobody was looking at". That reason is about the WRITE
    and does not transfer: a draft carries a line index and settles into an `insert-line` against
    whatever source is on screen; a held row carries neither and has no settle path at all. The
    hazard the drop protects against does not exist here, while the COST of dropping would be the
    thing this capability forbids — his characters destroyed by a click in the drawer. Every held
    row is painted whatever view is on screen, each naming its own file, because held work he cannot
    see is held work he does not know he has.
    A SECOND HELD ROW STACKS RATHER THAN EVICTING THE FIRST, with one lossless supersession rule: a
    new row replaces an existing one for the same key only when the new text CONTAINS the old, so
    the replacement cannot lose a character. That is what stops a retried save accumulating
    duplicates without ever choosing between two pieces of his writing.
    AMBIGUOUS HOLDS NOTHING, and it is a decision rather than an omission. `ambiguous` means the
    view prints that line in MORE THAN ONE place — the characters are demonstrably still in the
    file, so a held copy would be a third thing claiming to be them. `absent` is the whole trigger.
    EVIDENCE TIER — OBSERVED, NODE-TEST ONLY, FIXTURES THROUGHOUT. tests/app-held-edit.test.mjs, 38
    arms. The module's own shape (imports nothing; pure, proved by making the DOM, `fetch` and the
    clock all throw for the whole of a drive; no line index; no edit constructor named). The surface
    (stacking, supersession, and six release cases including four that must NOT release). All four
    ways a line goes absent, driven through the real app/index.html — a genuine deletion, the first
    stamp of authoring, a move out of the view, and a 409 — plus the ambiguous and ordinary-arrival
    controls. The clearing rules including the view change. The pinned counts. A falsifier on the
    wire: with a row held, a tick and a line commit are driven and neither POST body contains any of
    the held characters.
    THE TWO `absent` CAUSES ARE DRIVEN SEPARATELY, using the distinction step 12 built and handed
    over. `tests/present-replay.test.mjs` §1 measures a first-stamp-of-authoring absence
    (`anchor.node === null`, the node tier never ran) and §2d a genuine deletion (`anchor.node` is a
    real id, the node tier ran and found nothing). The replay harness now reports a sixth reading —
    `held` — computed by the shipped `heldFrom`, and both sections assert the hold with the right
    characters and the right node. The app holds in both cases and does not need to tell them apart,
    which is why `snapshot.graph` staying unread (`resolve-from-the-model-not-the-text`) does not
    block this.
    MUTATION-PROVEN TWICE, BY REWRITING THE PAGE RATHER THAN BY NARRATING IT.
    `tests/fixtures/app-html-page.mjs` gained an optional `mutate` applied last, plus `assertMutated`
    which refuses when the pattern is not found exactly once — so a drifted pattern fails instead of
    producing a green mutation proof against an unmodified page. Neuter the one holding expression
    and the survival assertion goes red while the freshness sentence still fires, which is what makes
    it a mutation of the HOLDING rather than of the detection. Neuter the release and the clearance
    assertion goes red.
    WHAT IS NOT VERIFIED, SAID PLAINLY. No browser was opened. No passkey session, no live graph
    server, no engine cycle, no real POST, no `graph-sync`. Every projection is a fixture and every
    409 is a stubbed `fetch`. The end-to-end path — a real server refusing a real write and the
    browser holding the characters — has never run, and cannot until
    `vault-file-accepts-a-precondition` lands in the other repository.
    AND IT DOES NOT SWITCH THE REFUSAL ON. That is the operator's decision and it is a separate one.
    What this changes is that it is now SAFE to make: the trade
    `the-write-carries-a-precondition-the-server-can-refuse` refused to accept — a silent loss of
    the engine's output for a visible loss of the operator's typing — is no longer the trade on
    offer, because a refused edit's characters now survive the repaint that used to erase them.
  tier: foundational
  rooting: >-
    isolated, for the same measured reason `app/present/base.ts` is and NOT as an omission.
    `app/present/held.ts` imports nothing, nothing under `app/present/` imports it, and its only
    caller is `app/index.html` — which `.flow-trace.yaml`'s filter names and which node cannot
    import, because capture is a module-load hook and an HTML document is not a module. So the one
    edge that would root this capability is unobservable by construction. It roots when the page's
    script is bundled through scripts/build.mjs, which is the remaining half of
    `flag-one-markdown-implementation-is-now-three` and a change of its own. See docs/architecture/
    flows.yaml for the matching `forbidden_flows` entry and for why no scenario is written.
  status: working

- id: a-line-being-authored-keeps-its-cursor-through-the-first-stamp
  intent: >-
    THE APEX CAPABILITY'S OWN BLOCKER, CLOSED. `author-in-the-browser-not-in-obsidian` means the
    operator types a line into the browser and the cycle takes it into the graph. Until this row,
    the second half destroyed the first: the moment the cycle stamped the line he was writing, the
    cursor stopped being able to find it. `design-presentation-instance-identity.md` §3.2 measured
    it on a real line as he typed it — `- [ ] Lesley pay tenner`, resolved against the projection
    that came back, outcome `absent` — and `tests/present-replay.test.mjs` §1 reproduced it as a
    measurement and generalised it past any one view.
    WHY IT FOLLOWED FROM THE DESIGN RATHER THAN FROM A DEFECT. `membershipFor` (membership.ts)
    answers only when a line carries no `[[qntm:N]]` — it predicts ONLY for a line being typed. So
    at the instant a prediction matters, `instanceAnchorFor` gives that line's anchor `node: null`,
    because there is no node yet. The cycle then stamps the line. The NODE tier of the two-tier walk
    has nothing to search with; the INSTANCE tier fails because an unstamped line's identity IS its
    own exact characters and the stamp changed them. Both tiers are structurally unavailable at
    once, which is why the reading was `absent` — unconfirmable, not wrong.
    WHAT WAS BUILT — A SECOND CONSTRUCT, NOT A WIDER INSTANCE FORMAT. `app/present/relative.ts`, the
    row the design named and refused to fold in: "a relative anchor is an id expressed as a position
    between two instances … but it is a second thing to build, not a consequence of the first." An
    instance id is a claim about ONE row; this is a claim about a NEIGHBOURHOOD, and widening the
    instance format would have made every stamped line's id depend on lines it has nothing to do
    with. So: a separate module, a separate type, a separate proof — and ONE walk, because the rung
    ORDER is a fact that must live in one place.
    THE ANCHOR IS A BRACKET, A GAP COUNT, AN OFFSET AND THE CHARACTERS. `above` is the nearest
    stamped node above within the section (or null, in which case the bracket's top is the section's
    own first line); `below` the same downward; `gap` is how many non-blank lines stood between them;
    `offset` is which of those the line was; `text` is what he typed. The bracket names a CANDIDATE
    and the characters CONFIRM it — the arrived line must EXTEND the remembered text, which is the
    one real shape every stamped line in `~/qntm/inbox.md` shows (the title first, the cycle's tokens
    appended after, never a rewritten prefix). "After node 122" alone was the other candidate and was
    rejected on evidence rather than taste: it cannot tell two lines opened one after another apart,
    and it says nothing about a line opened at the TOP of a section, which is where a new capture
    actually lands in the operator's own inbox.
    WHAT IT CANNOT SURVIVE, NAMED RATHER THAN DISCOVERED LATER. The cycle moving the line OUT of its
    bracket (inbox prints newest first, so a capture typed at the bottom is re-sorted to the top);
    the cycle inserting another line INTO the bracket; a bracketing node leaving the view; a
    bracketing node printing twice. Each is a named refusal with its own reason, and each is a test.
    A SECOND, WEAKER RUNG CATCHES THE FIRST OF THOSE, AND SAYS THAT IT IS WEAKER. `text` — exactly
    one line in the whole view still extends the remembered characters. It is the retired
    `anchor.ts`'s own floor, revived with two changes that make it safer than it was: an EXTENSION
    relation rather than exact equality (so it survives the stamp, which is the point), and more than
    one match is `ambiguous` rather than a pick. It exists because the re-sort case is not a corner
    case — it is what the operator's real inbox does to every capture typed below the first item.
    `held.settle` already stakes his characters on this same predicate, view-wide, to RELEASE a held
    row, which is the strictly more dangerous of the two decisions.
    THE ORDER IS OWNED IN ONE TUPLE. `ANCHOR_TRUST = [instance, node, relative, text]`
    (`app/present/instance.ts`), revived under the name the retired `anchor.ts` used. `relative` sits
    AFTER `node` because a node id is a fact the engine mints and preserves while a neighbourhood is
    an inference from two other lines holding still, which nothing promises — and the question is
    moot by construction as well as by argument, because a relative anchor is only ever taken for a
    line with NO node. The engine's own `levels.py` records what an order re-expressed per site cost
    this project once already, and `tests/present-relative.test.mjs` §4 asserts the walk against the
    tuple rather than against prose.
    NO EXISTING RUNG IS WEAKENED, AND THIS IS PROVED STRUCTURALLY RATHER THAN ASSERTED. A relative
    anchor is `null` for every line carrying a stamp, so for every stamped line in the operator's
    vault the walk is byte-identical to what it was. For an UNSTAMPED line the walk could previously
    return only `found`/`via:"instance"` or `absent` (`ambiguous` requires a node to search with), so
    the new rungs run ONLY on the path that already returned `absent`. Nothing that answered before
    answers differently now.
    A HEADING IS EXCLUDED, AND THE EXCLUSION WAS FOUND BY A TEST RATHER THAN FORESEEN. A heading
    carries no stamp, so it reached the same path an authored line does, and the first version of the
    module gave it a bracket — and with it the TEXT rung, which compares characters. `~/qntm/
    metrics.md` prints its five headings as `## <name> <emoji> <ratio>` and the ratio changes every
    cycle. A heading identified by its characters is precisely the defect `instance.ts` exists to
    remove, and its answer (a heading's token is a CONSTANT) is already strictly better than anything
    a neighbourhood could say.
    THE PAGE SAYS THE WEAKER CLAIM, AND SAYS ONLY THAT ONE. `reportCursorReading` narrates a `text`
    restore ("the cycle moved the line you were writing — the cursor followed it by what you typed")
    and stays silent on `relative`. The split is a decision: on `relative` the position AND the
    characters agree, which is as much as an `instance` match asserts, and it is the ORDINARY outcome
    of typing a line — narrating it would put a sentence in the freshness line on every capture, in
    the one line the page keeps for events that actually happened.
    EVIDENCE TIER — OBSERVED, NODE-TEST ONLY, FIXTURES THROUGHOUT. `tests/present-relative.test.mjs`,
    34 arms across five sections: what the anchor is and all five cases where it refuses to be taken;
    the stamp survived over real `~/qntm/inbox.md` content; one test per named refusal plus the
    ambiguous case; the rung order against `ANCHOR_TRUST`, including a case where all four rungs are
    exercised in order; and four MUTATION PROOFS which each delete one guard from a copy of the
    shipped `dist/present.js`, load it from a `data:` URL, and show the cursor land on a line the
    operator never wrote. `tests/present-replay.test.mjs` §1b replays the measured blocker itself —
    the exact `- [ ] Lesley pay tenner` line — with the AFTER being the real inbox file and the
    BEFORE being that file with the one line he typed removed. `tests/app-held-edit.test.mjs`
    §2f/§2g drive both new rungs through the real `app/index.html`, asserting that the cursor moves,
    that nothing is held, and that the freshness line speaks for one rung and not the other.
    ONE EXISTING ASSERTION CHANGED, AND IT IS NAMED IN THE TEST ITSELF. `tests/present-replay.test.mjs`
    §1's brand-new-capture case asserted `cursor.outcome === "absent"` and `preserved === "unknown"`.
    Those were the MEASUREMENT OF THE DEFECT, recorded so it could not be forgotten, not a statement
    of intent — and a test whose expected values were the defect is the one kind that must change
    when the defect is fixed. The fixture did not move: same before, same gesture, same after, only
    the answer. Its sibling — the case where the line LEAVES THE VIEW ENTIRELY — is unchanged and
    still asserts `absent`, which is what stops this from being a test rewritten to fit an
    implementation.
    THE HARNESS'S OWN MEMBERSHIP GROUND TRUTH WAS CORRECTED, and the correction is a generalisation
    rather than a rewrite. `actualMembership` read `via === "instance"` as "the row stayed in its
    section", which was sound for a two-rung walk (an instance string ENCODES the section, and the
    only other way to be found was the node tier, which fires only when the instance changed). It is
    not sound for a four-rung one: a stamp changes an unstamped line's instance for a reason that has
    nothing to do with its section, so every closed first-stamp report would have read as a spurious
    `leaves`. It now compares the section ORDINAL directly — the same fact, read where it lives — and
    for a `via:"instance"` match the two ordinals are equal by construction, so every reading it gave
    before is unchanged. `tests/present-replay.test.mjs` §1b's third test is what this unlocks: a
    membership prediction on an authored line now reports `converged: true` where it reported `null`.
    AND THE ONE HOLE IT LEFT IS NOW CLOSED — `the-relative-anchor-has-no-landmark-in-an-empty-
    section`, 2026-08-01. As merged this module refused any section carrying no stamped line,
    because "a bracket of two nulls is the whole file wearing a bracket's clothes". THAT SENTENCE
    WAS WRONG ABOUT ONE LANDMARK AND THE LANDMARK WAS ALREADY IN THE ANCHOR — `section`, the 0-based
    ordinal of the heading that opens it, which this same bundle already trusts a heading's own
    identity token to and which `address.ts`'s `sectionOrdinalAt` already counts. So "the Kth
    non-blank line of the Nth section" is a claim about the SAME fact, not a weaker one. The two
    bracket edges already fell back to the section's own first and last line when one side was null;
    with BOTH null the region is simply the whole section, and the section's first line IS its
    heading by construction, because `instancesOf` opens a new ordinal ON the heading line.
    IT IS THE MAJORITY OF HIS SECTIONS, NOT A CORNER. Counted read-only against `~/qntm` on
    2026-08-01, across 77 rendered files — 191 sections, 109 with no stamped line, 94 heading-only.
    `inbox.md :: ## Inbox`, `work/daily.md :: ## Work Capture`, `personal/daily.md :: ## Personal
    Capture`, `this_week.md :: ## Overdue` and every `dev/<project>/operator.md :: ## Tasks` are in
    that set. Every capture into one of them lost its cursor unconditionally — and because NO anchor
    was taken at all, it was also denied the TEXT rung, which is what actually rescues the inbox
    case, where the cycle re-sorts a new capture out of `## Inbox` and into `## Domain Empty`.
    TWO NEW NAMED REFUSALS. `section-absent` — the ordinal is not in the arriving projection at all,
    which is distinct from `gap-changed` because `gap-changed` says the region IS there and has a
    different shape. `no-landmark` — no bracket AND no ordinal, the region above the file's first
    heading; `relativeAnchorFor` never mints one, so this guards the EXPORTED resolver against a
    hand-built anchor rather than a shape the take side can produce, and it is said that way rather
    than implied.
    WHAT THE ORDINAL CANNOT SURVIVE, NAMED RATHER THAN DISCOVERED LATER. If the heading does not
    render — the measured collision case, dormant, zero firings across the live views — every
    ordinal below it shifts, `anchor.section` names a DIFFERENT section, and its gap count and its
    characters disagree. `gap-changed` or `text-changed` follows, then the TEXT rung, then
    `held.ts`. That exposure is neither new nor local: an ordinal that shifts already breaks a
    heading's own INSTANCE rung everywhere in this bundle, so this rung inherits it and does not add
    it. An anchor taken while the section was EMPTY also does not survive the section FILLING UP by
    the bracket — the gap is a count — and is carried by the characters instead, reported as
    `via: "text"` rather than hidden.
    THE NON-REGRESSION IS PROVED BY COMPARISON, NOT BY ARGUMENT. `tests/present-relative.test.mjs`
    §6 loads a copy of the shipped `dist/present.js` with this row's one behavioural change REVERTED
    and compares every anchor and every reading, line for line, over six fixtures — the real inbox,
    a capture at the top of a stamped section, a capture between two stamped lines, a stamped node
    that moved section, metrics.md's changing ratio, and the region above the first heading. They
    are identical everywhere, and one control test shows the revert is live rather than inert.
    §5's fifth mutation breaks the new landmark itself (the region falls back to `null`, the
    file's pre-heading region) and shows the cursor land on a stranger's line.
    WHAT IS NOT VERIFIED, SAID PLAINLY. No browser was opened. No passkey session, no live graph
    server, no engine cycle, no real POST, no `graph-sync`. Every projection is a fixture and every
    stamp is hand-written the way the operator's own real lines show one. `flow-trace verify .` was
    NOT RUN — the tool is not installed in this worktree — so the four `expected_flows` entries this
    row adds are declared from the scenario's own drive rather than from an observed capture, and
    `tests/flow_scenarios/instance_anchor.ts` was run standalone under node instead (it passes).
  tier: functional
  rooting: >-
    ROOTED, AND THE ROOTING IS THE POINT. `app/present/relative.ts` imports NOTHING — the same
    structural property `held.ts` has, arrived at from the opposite end: `held.ts` carries no line
    index because an index is what `applyEdit` takes, and this module's whole OUTPUT is an index, so
    the separation has to be that it can never reach the thing an index would be handed to. The
    dependency runs one way only: `instance.ts` imports `relative.ts` and never the reverse, which is
    what lets the rung ORDER live in `instance.ts` alone instead of being split across two modules.
    `docs/architecture/flows.yaml` declares the two edges plus the two `instance.ts` -> `resolution.ts`
    edges that were previously undeclared, and two `forbidden_flows` entries (never `source.ts`,
    never `paint.ts`). `tests/flow_scenarios/instance_anchor.ts` observes all four and additionally
    closes the gap `tests/flow_scenarios/vim_gestures.ts` recorded in as many words — "`instance.ts`
    is sibling-owned and still in flight, so it is deliberately left unscenario'd here … a real gap
    today, not an oversight".
  status: working
- id: a-line-being-made-survives-a-projection-too
  intent: >-
    A LINE HE HAS OPEN AND HAS NOT COMMITTED SURVIVES A PROJECTION ARRIVING. A VIEW CHANGE STILL
    DESTROYS IT, and both are right. `app/index.html`'s `paintView` called `draftLine.drop()`
    unconditionally with an argued reason — "an index that meant under the third task in one view
    means something else in the next" — and that reason is about a VIEW CHANGE, where a row that
    leaked could settle into an `insert-line` against a file nobody was looking at. `paintView` is
    called for two reasons. A projection arriving is the same view, the same cursor and the same
    sentence half-typed; destroying his row for that is the safe haven violated by the mechanism the
    apex capability needs.
    WHY THE FUNCTION WAS CALLED IS NOW A PARAMETER, NOT AN INFERENCE. `paintView(id, why)` takes
    `"chosen"` or `"arrived"` from the caller that knows. The page already held a proxy for the
    difference (`sameView`, `id === paintedViewId`) and that proxy is right about POSITION and wrong
    about CAUSE in exactly the two cases that cost characters: clicking the view you are already in
    is a choice that reads as an arrival, and a re-read landing elsewhere because the file was
    renamed is an arrival that reads as a choice. `sameView` is left doing the job it was written
    for — whether an anchor taken in one view may be resolved in another — and is not reinterpreted.
    Both conditions are required, never either.
    THE ROW IS ANCHORED ON ITS NEIGHBOUR, AND THAT IS FORCED RATHER THAN CHOSEN. The backlog row
    said "its anchor is RELATIVE, read off the line above it when it was opened". The second half is
    right and the first is not: a draft CANNOT carry a relative anchor of its own. `relativeAnchorFor`
    reads a bracket, a gap, an offset and the characters off a line that IS IN THE SOURCE, and a
    draft is in NEITHER source by construction — not the one it was opened against (nothing is
    written until it settles, `draft.ts`) and not the one that arrives (the cycle never saw it).
    `places[lineIndex]` is the line the row would PUSH DOWN. So `DraftPlace` is an ordinary
    `InstanceAnchor` for the ADJACENT line plus which side of it the row sits on, resolved by
    `resolveInstanceAnchor` — which means the row inherits ALL FOUR rungs of `ANCHOR_TRUST`,
    including `relative`, and no specificity order is re-expressed. The neighbour is the ADJACENT
    line and the search does not step over a blank: "two below qntm:122 with one blank in between"
    is an offset read against a gap nothing promises, so it refuses, exactly as `relative.ts` does.
    THREE ANSWERS, EACH WITH AN OWNER. PLACED — the row goes back beside its neighbour, and the
    place is re-taken against the arriving markdown for the reason `focus.reanchor` re-takes its own
    on a `found`. ARRIVED — the cycle ingested his line while he was typing it, so the row is
    RELEASED rather than re-placed, because a second copy of a line the file owns would mint a
    second node when it settled. UNPLACED — nothing could be said about where the row goes, so the
    characters are HELD.
    THE RELEASE RULE IS `held.ts`'S OWN, REACHED RATHER THAN REWRITTEN. `held.ts` imports nothing by
    construction, so its copy of the predicate cannot be shared; `relative.ts` carries the second
    copy WITH a note that a third caller must reach for it rather than write it again. `draft.ts` is
    that third caller and obeys the note — `extendsLine`, imported. It is GATED ON THE PROJECTION
    HAVING GAINED THE LINE rather than merely containing one, because releasing a draft is the one
    outcome here that destroys characters (a released held row is a copy of something the file has;
    a released draft is the only copy there was), and a view that already prints a matching line
    must not take his retyping away from him.
    HOLDING IS A THIRD CAUSE, NOT A THIRD MECHANISM. `HeldReason` gains `"unplaced"` and nothing
    else changes: one surface, one release rule, one strip, and still no line index anywhere in it.
    A row holding nothing but its own seed is dropped silently rather than held — `applyEdit` refuses
    a contentless insert, so there was never a line there to lose, and putting `- [ ] ` on the strip
    would report an event that cost him nothing.
    TWO THINGS THE BACKLOG ROW DID NOT NAME AND THE WORK FOUND. FIRST, THE CHARACTERS WERE NOT ON
    THE SURFACE AT ALL. `Draft` held `{lineIndex, seed}`; what he typed lived only in the `<input>`,
    which every repaint destroys — `design-the-edit-is-a-safe-haven.md`'s own DELTA finding reaching
    the last surface that had not answered it. `Draft.typed` is the answer, recorded by the same
    read `settle` already makes at the end, made earlier; it builds no edit and nothing posts it.
    SECOND, THE DROP NEVER PROTECTED THE ELEMENT. `paint.ts` builds one `<input>` per row whose
    `blur` listener SETTLES against the source the row was opened against, and removing a focused
    element is a blur in every browser that fires one — so a view change could ALREADY post into the
    view being left, drop or no drop. `DraftSurface.generation` closes that hole as well as the new
    one it was needed for.
    THE ROW WAS REACHABLE BEFORE `the-projection-arrives-without-being-asked-for`, WHICH THE BACKLOG
    ROW DOUBTED IN AS MANY WORDS ("genuinely worthless before 7 … a change with no observable
    effect"). `commitLine` is async and the cycle takes seconds: he captures a thing, presses Enter,
    presses `o`, starts the next one, and the FIRST capture's own answer lands on the SECOND
    capture's open row. Two captures in a row is the operator's ordinary gesture in his own inbox.
    `tests/app-open-line-survives.test.mjs` section 1 drives exactly that through the page.
    EVIDENCE TIER — OBSERVED, NODE-TEST ONLY, FIXTURES THROUGHOUT. `tests/app-open-line-survives.test.mjs`,
    20 arms in six sections driven through `app/index.html`'s REAL keydown wiring: the row surviving
    with lines changed above it, below it and both; the caret restored; exactly one editable row;
    the two-captures gesture; five arms proving a view change still drops it (a different view, the
    SAME view chosen again, a caller that says nothing, an arrival that lands elsewhere, and that
    nothing is held for any of them); the release; the hold, including the silent drop of a
    seed-only row and the sentence in the freshness line; the element left behind by a survival,
    blurred on purpose, posting nothing; and TWO MUTATION PROOFS which restore the unconditional
    drop and break the hold and show each section go red. `tests/present-replay.test.mjs` section 8
    adds 12 arms over real `~/qntm/inbox.md` content through the replay harness's seventh reading.
    TWO OF THIS WORK'S OWN EXPECTATIONS WERE WRONG AND THE CODE WAS RIGHT, which is worth recording
    because both are facts about `instance.ts` a reader could get wrong the same way. A line the
    cycle inserts ABOVE the neighbour is re-found by `instance`, not `node` — an instance string
    carries no position. And two printings of one node in DIFFERENT sections are separated for free
    by the section ordinal, so producing `ambiguous` needs both printings in ONE section.
    WHAT IS NOT VERIFIED, SAID PLAINLY. No browser was opened. No passkey session, no live graph
    server, no engine cycle, no real POST, no `graph-sync`. Every projection is a fixture. The DOM
    is the suite's stub, so nothing here proves a real browser's own blur-on-removal behaviour —
    section 5 drives that event explicitly rather than waiting for it. `flow-trace verify .` was NOT
    RUN: the tool is not installed in this worktree, so the six flow entries this row adds are
    declared from the scenario's own drive rather than from an observed capture, and
    `tests/flow_scenarios/draft_placement.ts` was run standalone under node instead (it passes,
    alongside `instance_anchor.ts` and `vim_gestures.ts`, which are unchanged).
  tier: functional
  rooting: >-
    ROOTED. `app/present/draft.ts` gains its first outward edges and they are exactly two modules:
    `instance.ts`, to ask where the row's neighbour went, and `relative.ts`, for the one predicate
    that decides whether the arriving file has taken the characters back. It reaches no DOM, no
    network, no clock, and — the load-bearing one — no `source.ts`. That is declared rather than
    promised: `docs/architecture/flows.yaml` adds two `forbidden_flows` entries
    (`draft-never-reaches-the-edit-path`, `draft-never-touches-the-dom`) beside the pair
    `relative.ts` already carries, for the same reason one module further on — this module's whole
    output is a LINE INDEX, which is what `applyEdit`'s `insert-line` takes.
    FOUR DECLARED EDGES, ALL DRIVEN. `draft -> instance` twice (`instanceAnchorFor`,
    `resolveInstanceAnchor`), `draft -> relative` (`extendsLine`), and `newline -> draft`
    (`placeFor`, so the place is taken in ONE place, at the moment the row opens, because an index
    and the string it indexes only mean anything together). `tests/flow_scenarios/draft_placement.ts`
    observes all four and additionally reads `draft.ts`'s own source to assert it reaches nothing
    else — the same structural claim `instance_anchor.ts` makes for `relative.ts`.
    THE HALF THAT CANNOT BE ROOTED HERE IS UNCHANGED AND ALREADY RECORDED: `app/index.html` is a
    hand-authored HTML document, node cannot import one, so the placement's CALLER is invisible to
    flow-trace by construction. It is proved under `node --test` through the lifted page instead.
  status: working
- id: a-config-declaration-the-app-drops-says-so
  intent: >-
    THE OPERATOR'S OWN ACCEPTANCE TEST, MADE MEASURABLE. He set the standard:
    "it shouldn't be specifically wired to any resolution, but should work for any new config the
    user puts in" — and named the three outcomes for a config entry the browser cannot express.
    Picks it up: generalised. Refuses it visibly: honest and incomplete, and it must SAY SO.
    Silently ignores it: the failure this capability exists to remove.
    ALL THREE GENERATORS SHIPPED THE THIRD OUTCOME, and it was measured rather than suspected.
    `design-the-rule-mirror.md` §9.3 named one line — a vocabulary token setting any field outside
    `node_type`/`domain`/`status` was skipped with no `refused` entry, no warning and no exit code.
    Against the operator's live config that one line dropped 73 of his own tokens. An audit of all
    three generators (not only the one the finding named) found sixteen call sites of the same
    shape, including two the finding did not: a section declaring `structural_edge_types` with no
    `structural_edge_direction` was dropped whole, so the app used the GLOBAL indent binding under
    a heading he had explicitly told to do otherwise; and a view sheet dropped by
    `generate-resolution-declaration.mjs` is a view its registration guard never sweeps, which is
    the one check stopping that generator from publishing a stale GLOBAL `input_grammar` for a
    sheet that overrides it.
    WHAT A REFUSAL DOES NOW, AND THE TENSION IT IS DESIGNED AGAINST. Three channels, deliberately
    not one: the drop is RECORDED in the generated declaration's own `dropped` map (`what -> why`),
    PRINTED to stderr on every generate, and GATED — because `presentation.json` is committed and
    `--check` compares the whole generated object, a NEW drop is red until the operator regenerates
    and commits it. A generate NEVER exits non-zero. A generator that refuses to run because the
