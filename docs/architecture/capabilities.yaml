    (`queue-never-reaches-the-edit-path`, `queue-never-paints`).
    IT GAINS NO OUTWARD EDGE AND NEITHER DOES ANYTHING ELSE. Only `app/present/index.ts` (the
    barrel, which holds no logic by construction) and `app/index.html` name it, and the page is
    invisible to the capture filter for the reason every page-level caller in this document is:
