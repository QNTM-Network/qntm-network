- id: structural-language-is-published-not-guessed
  intent: >-
    THE BROWSER READS WHAT A GESTURE MEANS; IT DOES NOT HOLD A COPY OR GUESS. Item 1 of
    `docs/implementation-artifacts/design-the-structural-language.md`, which refuted the brief that
    commissioned it: an indent's meaning (which edge type it creates, which direction) is not
    hardcoded in the engine — it is DECLARED, in `structural_tokens.yaml`, validated at bundle load,
    proved by mutation (change the declaration, the resolver's answer changes; remove the key, the
    applier creates no edge at all). Detection (which line is whose parent) is hardcoded and
    UNIT-FREE; meaning (what a parent relation IS) is declared, and only the second half belongs to
    this instance. THIS CAPABILITY IS THE WIRE, NOT A SECOND INTERPRETER: `StructuralTokenResolver`
    already resolves the language server-side; a pre-flight service computing what an edit would
    mean in the browser would be a second interpreter of one language, which the design document
    names as the exact MVC violation this project keeps finding and removing. So the browser is
    given a LOOKUP TABLE, generated from the monorepo's own config
    (`scripts/generate-structural-declaration.mjs`, never hand-written — the `INDENT_UNIT` mistake,
    §3 of the design document, is what a hand-copied number costs), and it is the browser's to READ,
    not to decide with.
    PUBLISHED, OVER THE EXISTING CHANNEL, NOT A NEW ONE. `presentation.json` already carries the
    GLOBAL rendition level and already reports an unrecognised key as a problem rather than
    ignoring it (`presentation-is-resolved-not-chosen`'s own record). This capability widens that
    same document's grammar with two more known keys: `structural` (the ingest axis — indent
    binding, edge cardinality, per-section overrides for every view that declares one) and
    `indentUnit` (the output axis — see below). Both are read by `presentationFromDeclaration`
    (`app/present/context.ts`), the same one wire function that already read the rendition axis, so
    every axis of the one document is validated the same way: an unrecognised key anywhere is
    REPORTED, never guessed at, and a malformed sub-fact falls back to "unknown" without blinding
    the reader to the rest of a good document.
    ── UPDATE 2026-07-31, THE CHANNEL STOPPED BEING A FETCH. THE SENTENCE ABOVE SAID "the page
    fetches once"; it no longer does. `app/present/embedded-declaration.ts` imports
    `presentation.json` at BUILD time (`import presentationJson from "../../presentation.json"`,
    esbuild's own JSON loader) and `dist/present.js` carries the parsed document as
    `EMBEDDED_DECLARATION` — removing the ~110ms serial round trip §2.5 of
