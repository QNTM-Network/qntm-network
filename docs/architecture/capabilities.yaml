    declaring `white-space: pre`, which is the one thing an `<input>` gave for free and a `<div>` does
    not — without it the engine's four-space indent collapses and "its exact source text" becomes
    approximately its source text.
    NOT VERIFIED IN A BROWSER, AND THE CARET QUESTION IS EXACTLY THE KIND THAT CANNOT BE. No real key
    event was observed, no passkey session was opened, and no engine was run. The readonly-caret
