    `docs/architecture/flows.yaml` gains no row - see the stated absence in that file rather than an
    edge nothing could observe.
    ENFORCEMENT IS `tests/app-enter-opens-a-line.test.mjs` - 10 tests in 3 documented sections,
    driving `app/index.html`'s own lifted script on the three browser facts
    `tests/app-escape-discards.test.mjs` introduced. Section 1 asserts the intended END STATE, named
