- id: the-app-has-a-shell-and-views-are-chosen-by-folder
  intent: >-
    The app is a PLACE you are IN, not a view rendered on a blank page. A fixed menu bar carries
    the mark, WHERE YOU ARE (the current view's folder and title), who you are, the way out, and
    the way to somewhere else; a drawer off the right edge holds every view as the folder tree
    the operator already reads in Obsidian.
    THE FOLDER IS THE VAULT'S, TAKEN FROM `path`. This is the whole of the capability's content
    and the reason it is not "a nicer picker". Every view in the snapshot carries `path` — the
    rendered file's place in the vault, which is also the address /app/edit-file writes back to,
    so it cannot drift from where the file is. Its directory IS the folder, with no convention
    invented on top and nothing hardcoded. The vault's loose root files sit at the tree's root,
    the way a loose file does in Obsidian.
    IT IS NOT `domain`, WHICH IS WHAT THE RETIRED <select> USED. `domain` is a label written by
    hand in each view's config, and across the operator's 76 configs it is coarser than the tree
    (fourteen `dev` views in four project folders, one bucket), it renames
    (`character-development/` -> `character`, `spirit/program/` -> `program`), and it is
    sometimes wrong (`dev/test-scratchpad.md` declares `domain: personal`). Nothing here
    re-derives it or corrects it: `domain` is the ENGINE's label, read by the engine, and a
    second answer to it computed in the browser would be exactly the kind of drift this project
    exists to refuse.
    THE PHONE IS NOT A SECOND DESIGN. One shell, two adaptations, both about a hand rather than
    about width: the bar sheds WORDS and never controls (the wordmark reduces to the brand
    device's dot, which is the responsive-logo pair brand/BRAND.md already names), and the
    drawer's head — title and close together, one element — moves to the BOTTOM of the panel, so
    the one control that dismisses it is in the thumb's arc rather than in the top-right corner
    a one-handed grip cannot reach. Every target is at least 44px, stated once as `--touch`.
    WHAT IT DELIBERATELY DOES NOT DO IS WRITE. Every affordance the app offers has to be
    expressible as an edit to the SOURCE STRING (see every-affordance-writes-back-through-the-source
    above — this read `source-is-the-only-truth`, an id no capability in this file has ever
    carried; corrected 2026-07-31), and
    navigation is not an edit. The drawer chooses; it does not rename, move, create or delete a
    view, and it never reads the DOM to produce anything. `applyEdit` still knows exactly two
    operations after this capability landed, which is the check that it stayed navigation.
  tier: functional
  rooting: >-
    isolated — the shell is chrome around the reading column and shares no class with it. The one
    thing it consumes is the snapshot's `path` field, which already existed and already had a
    reader (the write path posts to it); the folder derivation is four lines in the page and has
    no other caller. Rooting it through a class would be inventing a module so that a declaration
    had somewhere to point.
  status: working
  enforced_by:
  - declared_state: state-the-view-chooser-is-one-folder-drawer
    verify: PASS
  enforcement_depth: 1
  enforcement_surface: 0
  confidence: thin

# ══════════════════════════════════════════════════════════════════════════════════════════════
# PINNED TOP-LEVEL BY THE OPERATOR, 2026-07-31. Two capabilities, IN TENSION, and the tension is
# the design — one says hold still, the other says keep moving. Both are declared here so the
# distance is in the derived queue instead of in a conversation. The spec is
# docs/implementation-artifacts/design-the-edit-is-a-safe-haven.md.
#
# THE PRINCIPLE UNDER BOTH, in the operator's own correction: THE GRAPH IS THE TRUTH, THE MARKDOWN
# IS A VIEW OF IT. The markdown is authoritative for the DELTA and derived for the STATE, and the
# cycle COMPUTES BEHAVIOUR — so a projection is a consequence, not a copy.
# ══════════════════════════════════════════════════════════════════════════════════════════════
- id: the-edit-is-a-safe-haven
  intent: >-
    THE LINE UNDER THE CURSOR IS HIS. The world may move around it — but not under it. What the
    operator is typing is never overwritten, reordered or reflowed by something arriving from
    elsewhere, and it is never silently discarded. His words for it: "delta focus — like a safe
    haven."
    THE SUBJECT IS THE DELTA, NOT THE FILE AND NOT THE VIEW, and getting that right is the whole
    of the capability. A file nothing may rewrite is a file the engine cannot serve; a view
    nothing may replace is the second capability refuted. The haven is the characters between the
    cursor arriving on a line and leaving it — bounded, short-lived, ONE LINE WIDE, and the only
    region in this app whose content is AUTHORED rather than DERIVED.
    IT HAS FOUR LEVELS AND THEY FAIL DIFFERENTLY. FOCUS (that a line is open) is held outside the
    file already. ANCHOR (which line is open) is held as a POSITIONAL INDEX, and an index is
    meaningful only against the string it indexes. DELTA (what has been typed) lives in a DOM
    element a repaint destroys. BASE (what the edit is computed against) is a closure captured at
    paint time and posted whole, guarded by nothing.
    TWO OF THE FOUR ALREADY EXIST AND WERE BUILT FOR ENTIRELY OTHER REASONS, which is why the
    remaining work is one type change and one region of the painter rather than an arc.
    `FocusSurface` holds the cursor as one number outside the source string
    (app/present/focus.ts:50) because "a fact about the moment written into a file is a fact that
    outlives the moment" — nothing to do with concurrency. `DraftSurface` holds an uncommitted new
    line out of the file entirely (app/present/draft.ts:55-83) so that an abandoned line would need
    no DELETE edit to undo it. That second one is already a working implementation of a region of
    the screen the source string does not own; this capability asks for exactly one more, with the
    same lifecycle.
    NOTHING HERE ADDS AN EDIT KIND. `SourceEdit` stays the closed union of three
    (app/present/source.ts:114) and keeping it closed is load-bearing. Every behaviour specified is
    `set-line` or `insert-line` against a CORRECTLY CHOSEN BASE. The one case that would need a
    fourth kind is the one the design refuses to specify (a vanished line re-inserting itself into
    a view the cycle removed it from), and the refusal is the point.
    EVIDENCE TIER — SPLIT PER LEVEL, AND NO PART OF IT IS FALSIFIABLE END TO END TODAY. FOCUS is
    STRUCTURAL AND UNENFORCED: real, shipped, proven by tests/present-focus.test.mjs, and nothing
    checks that it stays outside the file. ANCHOR is MEASURED WRONG, not assumed wrong — a
    hermetic run against the shipped dist/present.js repaints a body from a projection with one
    line inserted above the cursor, and the cursor lands on a heading with the typing gone. DELTA
    and BASE are MEASURED ABSENT by the same run — the edited line missing from the new projection
    paints zero editable rows, `FocusSurface` still reports the old index, and no refusal is
    reported anywhere. So one level is real and unguarded, one is defective, two do not exist. It
    becomes falsifiable when the first backlog row lands, and not before.
    AMENDED 2026-07-31 — THE ANCHOR LEVEL IS BUILT. Both measurements above were REPRODUCED first
    against unmodified origin/main (f349b94) and are now fixed and covered by
    tests/present-anchor.test.mjs; see the-cursor-anchors-to-a-node-not-a-line-number below for
    what shipped. The count is now one level real and unguarded (FOCUS), one level real and
    node-test-proven (ANCHOR), two absent (DELTA, BASE). The capability is still not falsifiable
    end to end, because the two that are absent are the two that hold the operator's characters.
    AMENDED AGAIN 2026-07-31 — THE BASE LEVEL IS HALF BUILT, AND THE HALF MATTERS. `BASE (what the
    edit is computed against) is a closure captured at paint time and posted whole, guarded by
    nothing` is now false in its second clause and still true in its first. The base is COMPUTED,
    NAMED, CARRIED AND REPORTED — `app/present/base.ts`, `sha256-<hex>` of the served markdown, on
    the wire with every write, with a divergence said in the freshness line — and it is still NOT
    REFUSED, because the server accepts whatever it is sent and making it refuse is
    `the-write-is-refused-server-side`. See `a-write-refuses-a-stale-base` below for what shipped
    and for the arm the row's own diagnosis did not name (the checkbox path loses the OPERATOR'S
    OWN previous tick, not only the cycle's output). The count is now one level real and unguarded
    (FOCUS), one real and node-test-proven (ANCHOR), one detected-but-not-prevented (BASE), one
    absent (DELTA). Still not falsifiable end to end: DELTA is the one that holds his characters.
  tier: foundational
  rooting: >-
    isolated FOR NOW, and deliberately rather than by omission. Three of the four levels would root
    against classes that already exist — presentation-painting owns the repaint and the two
    surfaces are inside the capture filter — but the fourth, BASE, is a property of the WRITE PATH,
    which spans app/index.html (outside the capture filter, at the repo root), worker/src/app.js
    and a graph server that is not in this repository.
    AMENDED 2026-07-31, AND THE HALF THAT CHANGED IS NOT THE HALF THAT WOULD ROOT IT. The base IS
    now a value a module computes (`app/present/base.ts`, inside the capture filter) rather than a
    closure a function captured — the condition this note named. It still does not root, for a
    reason the note did not anticipate: that module's ONLY caller is `app/index.html`, which the
    capture filter names and cannot see, so the edge that would root it is unobservable by
    construction rather than merely undeclared. It roots when the page's script is bundled through
    scripts/build.mjs, which is the remaining half of `flag-one-markdown-implementation-is-now-three`
    and a change of its own.
  status: undeclared
- id: the-cursor-anchors-to-a-node-not-a-line-number
  intent: >-
    THE CURSOR IS HELD AS AN IDENTITY, NOT AS A POSITION, SO A PROJECTION ARRIVING CANNOT MOVE IT
    ONTO SOMEBODY ELSE'S LINE. `FocusSurface` held one number, and an index is meaningful only
    against the string it indexes; the painter restored the cursor by asking `isFocused(lineIndex)`
    while walking whatever source it had just been handed.
    BOTH FAILURES WERE REPRODUCED FIRST, against the shipped dist/present.js on unmodified
    origin/main (f349b94), through tests/fixtures/dom-stub.mjs, from fixtures built out of
    `~/qntm/this_week.md` (read-only). Cursor in `- [ ] Pay back per Darinz' plan said on 16th May
    [[qntm:1232]] …`, index 5, characters typed into it. (a) A cycle inserts ONE line above him —
    the one editable row painted afterwards holds `"## Overdue to Start"`, a HEADING, and the typing
    is gone. (b) His node leaves the view — ZERO editable rows are painted, `FocusSurface` still
    reports 5, the cursor is nowhere. Both silent, exit 0, nothing thrown, nothing reported to any
    callback.
    IDENTITY BEAT REBASING ON EVIDENCE, NOT ON TASTE. Rebasing (diff the old source against the new,
    map index 5 forward) needs a diff, a tie-break policy for an insertion landing at the anchor,
    and — the part that decided it — THE OLD SOURCE STRING STILL IN HAND when the new one arrives.
    In this app it is not: app/index.html's `paintView` reads its markdown out of `graphData`, which
    a fresh snapshot replaces wholesale before anything repaints, so a rebase would first have to
    make the browser retain a projection purely to diff it. Identity needs none of that, and it
    survives the case a diff cannot express at all — a rule moving a node BETWEEN SECTIONS, which is
    a delete plus an insert to a differ and the same node to a stamp.
    IT WALKS RUNGS AND REPORTS WHICH ONE ANSWERED, the same shape app/present/newline.ts already
    uses. `app/present/anchor.ts` (new, pure, imports `classifyLine` and `qntmIdSpans` and nothing
    else): STAMP (a unique `[[qntm:N]]`), STAMP_IN_SECTION, TEXT (the exact source text, for a
    heading or a line the cycle has not stamped), TEXT_IN_SECTION, and `absent`. `ANCHOR_TRUST`
    exports the order, because a cursor restored by TEXT and one restored by STAMP are not equally
    trustworthy and the next row has to be able to tell.
    THE SECTION RUNGS ARE NOT DECORATION — THEY ARE MEASURED NECESSITY. `~/qntm/this_week.md`
    (read-only, 2026-07-31) prints THREE nodes twice each, as byte-identical lines under two
    different headings — 6 of the file's 15 node lines. So a `[[qntm:N]]` is NOT unique within a
    view, which the design document assumed it was. A resolver taking the first match would put the
    cursor in the wrong printing of the right node across nearly half the operator's current week; a
    resolver refusing every duplicate would refuse there too. The heading that opens the line's
    section tells the two printings apart, and it is a structure this bundle already reads.
    AMBIGUITY IS A THIRD OUTCOME AND IT REFUSES RATHER THAN GUESSING. One rule governs every rung —
    A RUNG THAT FINDS NOTHING PASSES, A RUNG THAT FINDS TOO MANY STOPS. An ambiguous STAMP does not
    fall through to TEXT: if a node is printed twice inside ONE section both rows really are that
    node, and choosing between them by their characters chooses a PRINTING rather than a node. The
    candidates go back to the caller so a refusal can name them.
    THE ANCHOR IS EXPRESSED AGAINST THE SOURCE LINE INDEX, NEVER A PAINTED-ROW ORDINAL, and this is
    decided once here for every later row. design-the-vim-cursor.md §3.4 observes that a blank line
    is dropped from the paint and gets no row — real, and NOT a second coordinate system: paint.ts's
    own `lastPaintedIndex` holds the SOURCE index of the last line that got a row, so it is a
    filtered sample of the source indices rather than an ordinal in another space. Everything that
    writes already speaks source indices (`applyEdit`, `seedFor`, `clampLine`, `boundaryLine`), so
    any other choice buys a conversion at every one of those boundaries and avoids one at none.
    A BLANK LINE HAS NO IDENTITY AND SAYS SO: `anchorFor` returns `null` rather than anchoring on a
    text every other blank line shares, and `reanchor` reports `unanchored`.
    NO NEW EDIT KIND, NO NEW CASCADE CONTRIBUTION, NO NEW LEVEL. `SourceEdit` is still the closed
    union of three. `FocusSurface.contextFor` and its `FOCUSED` contribution are byte-unchanged — the
    anchor decides WHERE the cursor is and never how anything renders — and `motions.ts` still
    imports nothing.
    EVIDENCE TIER — NODE-TEST ONLY, NOT FLOW-TRACE-VERIFIED, the same undischarged gap every vim
    slice's note names. 28 new tests in tests/present-anchor.test.mjs: the rungs and their
    provenance; a MUTATION PROOF that corrupts the anchor's recorded index and asserts the answer
    does not move (which is what makes "this is identity, not a rebase" falsifiable rather than
    claimed); both reproduced arms re-run against the anchored surface; and four tests driving
    app/index.html's OWN lifted script so the refusal is proven to reach the freshness line rather
    than a callback. `npm run check`: 573 tests / 100 suites / 0 fail on origin/main before this row
    (verified, not assumed), 601 / 105 / 0 fail after (+28/+5, 0 regressions).
    NOT VERIFIED IN A BROWSER, AND NO PROJECTION WAS EVER OBSERVED ARRIVING. No real cycle ran, no
    passkey session was opened, no server was contacted, and the live vault and database were read
    only. Every "projection" in the evidence is a second string in a test file. The claim is about
    what these modules do when handed one — not that one has been seen to arrive.
  tier: functional
  rooting: >-
    isolated. `app/present/anchor.ts` is a new pure module in the same family as
    `boundary.ts`/`indent.ts`/`word.ts` — the surface holds the fact, a separate module owns the
    grammar — and its only importer inside app/present/ is `focus.ts`. No existing class's declared
    surface changed shape: `FocusSurface.focus` gained one OPTIONAL parameter (the same
    optional-dependency posture `PaintDeps` already draws for `focus`/`mode`/`draft`), so every
    caller that predates anchoring goes on painting what it always painted.
  status: undeclared
- id: a-write-refuses-a-stale-base
  intent: >-
    A SAVE NAMES THE COPY OF THE FILE IT WAS COMPUTED FROM, AND SAYS SO WHEN THAT COPY IS NOT THE
    ONE THE SERVER HAS. Every save posts the WHOLE FILE and the server overwrites what it is sent,
    so a save computed against an out-of-date copy discards everything that changed in between —
    and what changes in between is the CYCLE'S OWN OUTPUT. The operator's typing is never what is
    lost by this mechanism; a rule's tag and a task the engine created are, silently, exit 0.
    BOTH ARMS WERE REPRODUCED FIRST on unmodified origin/main (532a8cf), through app/index.html's
    own lifted script and the shipped dist/present.js, with no live server and no cycle.
    ARM 1 — a projection arrives while a line is open. The `<input>` closes over the source string
    the painter gave it, so the repaint that removes it fires blur, the edit is computed against the
    OLD projection, and the POST is the whole of it: `#blocked` (a rule's output) and `qntm:124` (a
    task the cycle created) both gone from the file, the operator's typing intact, freshness line
    reading `as of … · 0 queued`.
    ARM 2 — TWO TICKS INSIDE ONE CYCLE, AND THIS ONE IS WORSE THAN THE ROW'S OWN DIAGNOSIS SAYS.
    `toggleTask` does not repaint from its edited string — it toggles a class and a `checked`
    property — so the painter's source still holds the file as it was BEFORE the first tick. The
    second POST therefore carries the FIRST TICK UNDONE. On this path the loser is the OPERATOR'S
    OWN GESTURE, not only the cycle's output, which is a correction to "his typing is never lost".
    WHAT SHIPPED IS A DETECTOR AND A REPORT, NOT A PREVENTION, and the distinction is deliberate
    rather than partial. `app/present/base.ts` (new, pure, imports nothing) holds the markdown the
    server last sent for the file on screen and answers `current` / `stale` / `writing` / `unknown`
    for any write. `baseOf` is `sha256-<hex>` of the file's UTF-8 bytes, UNNORMALISED. The page
    carries it on every write and says one sentence in the freshness line when it diverges.
    THE CLIENT'S OWN CHECK IS A STRING COMPARISON AND THE WIRE CARRIES A HASH — two jobs, one of
    which needs a digest. The browser already HAS the served markdown, so its check cannot collide;
    the server cannot be sent the whole previous file, so it gets sha256 of the same bytes. The
    detector therefore never depends on the hash, which is what makes the two halves shippable a
    row apart.
    WHAT IT CANNOT SEE, STATED PLAINLY: a change the browser was never told about. A cycle that
    rewrote the file on the server while nothing arrived here leaves the base looking current. Only
    the server can answer "what does this file say NOW" — that is `the-write-is-refused-server-side`
    and it is exactly why the base goes on the wire rather than only into a comparison.
    THE PRECONDITION IS THE STRING THE EDIT WAS APPLIED TO, NOT WHAT IS ON SCREEN. `LineCommit` and
    `CheckboxToggle` gained `source`, because after an optimistic repaint the painter is holding a
    string this app computed and the page's own `graphData` is not — a base taken from whatever the
    page had would match every time and refuse nothing. Mutation-proven: pointing the write at the
    served copy instead turns arm 1 green-to-red in three tests.
    NO NEW EDIT KIND, NO NEW WRITE UNIT, NO NEW ENDPOINT. `SourceEdit` is still the closed union of
    three, `markdown` is still the whole view, `motions.ts` still imports nothing, and the two write
    sites now share one `writeFile` — one place a file is posted, which is what the design already
    claimed and this makes structural.
    EVIDENCE TIER — NODE-TEST ONLY, NOT FLOW-TRACE-VERIFIED, and here the gap is structural rather
    than undischarged: `base.ts`'s only caller is `app/index.html`, which the capture filter names
    and cannot see, so there is no observable edge to declare and no scenario is written. See
    flows.yaml's closing note for the measurement behind that decision. 18 new tests in
    tests/present-base.test.mjs: the digest checked against node's own `createHash` across the
    padding boundaries and multi-byte input; that nothing is normalised; the surface's four
    outcomes; both arms driven through the page; a CONTROL arm proving an ordinary save says
    nothing; and that the sentence follows the save it describes when two are in the air.
    MUTATION-PROVEN FIVE WAYS, each turning the suite red: the detector deleted (7 red); the base
    read off the served copy rather than off the edit (3 red); `paintView` never taking a base
    (4 red); one sha256 round constant flipped (1 red); the note not re-armed for its own write
    (1 red — the two-saves-in-the-air arm, which is the defect that mutation originally caused).
    THE ROW'S OWN MUTATION INSTRUCTION WAS "remove the base and watch the assertion go green
    wrongly", AND IT DOES NOT — it goes red. That is a property built on purpose: a write with no
    base reads `unknown` and is REPORTED, never treated as current, because a check that quietly
    passes when it cannot run is decoration.
    NOT VERIFIED IN A BROWSER. No real cycle ran, no passkey session was opened, no server was
    contacted, nothing was POSTed anywhere, and the live vault and database were not touched at all.
    Every "projection" in the evidence is a second string in a test file.
  tier: functional
  rooting: >-
    isolated, and for a reason worth separating from the usual one. `app/present/base.ts` is a new
    pure module in the same family as `boundary.ts`/`indent.ts`/`word.ts` — but unlike those it has
    NO importer inside app/present/ at all, by design: the base is a fact about a FILE and the
    painter's job stops at reporting which string it applied an edit to. Its one caller is the
    page's own `writeFile`, which is outside the capture filter because node cannot import an HTML
    document. `LineCommit` and `CheckboxToggle` each gained one field, so every caller that predates
    it goes on posting exactly what it always posted.
  status: undeclared
- id: presentation-instance-identity
  intent: >-
    A PRINTED LINE IS A THING, ADDRESSABLE BY AN ID, NOT ONLY FINDABLE BY WALKING RUNGS. The
    operator's own proposal: "surely if it's an app and we render we can tie presentation instances
    (not unique node ness but rendering structure) to ids and navigate a grid like that."
    `docs/implementation-artifacts/design-presentation-instance-identity.md` measured that the
    engine ALREADY computes this fact every cycle — `RenderedLineRecord` carries `(sheet_id,
    section_id, node_id)`, 1:1-assumed by `markdown_writer.py:188` — and throws it away before
    `line_cache` persists (six columns, none of them section or node). It is RE-DERIVABLE in the
    browser without the engine, because a view's declared `sections:` are an ORDERED list and the
    renderer walks them in that order: the Nth heading in a rendered file is the Nth declared
    section (measured across all five live views, 24-for-24, exact positional match).
    R1 (below) DERIVES THE ID CLIENT-SIDE from the markdown alone — `${view}/${section}/${token}`,
    `section` a 0-based heading ORDINAL rather than a config-read string. R2 (not built) would carry
    the same fact server-side, from the view config; for the two to produce the IDENTICAL string,
    R2 must key its own `section` field on that same ordinal, not the config's own `id:` string —
    a decision for R2, not settled here (see `derive-the-instance-id-in-the-browser`'s record).
    THIS FIXES A REAL BUG, NOT JUST A CONVENIENCE. `~/qntm/metrics.md` renders every heading as
    `## <name> <emoji> <ratio>`, and the ratio moves every cycle while the ORDER of the sections
    does not. The shipped anchor (`the-cursor-anchors-to-a-node-not-a-line-number`) keys an
    unstamped line's identity on its exact TEXT, so a heading whose ratio moved answered `absent` —
    THE ROW WAS STILL ON SCREEN AND THE APP SAID IT WAS GONE. An id keyed on a heading's ORDINAL,
    never its characters, cannot make that mistake, because it never read the ratio in the first
    place.
    IT REPLACES THE ANCHOR'S RUNGS IN PRODUCTION — AMENDED 2026-07-31, THE SAME DAY, AFTER THE
    FIRST CUT OF THIS RECORD SAID IT DID NOT. `FocusSurface.reanchor` now calls
    `instance.ts`'s `resolveInstanceAnchor` directly; `anchor.ts` and its four rungs (STAMP,
    STAMP_IN_SECTION, TEXT, TEXT_IN_SECTION) are DELETED, not kept beside their replacement — proved
    dead by removing the file and rebuilding (`npm run typecheck` and `npm run build` both stayed
    clean with nothing importing it; the only test that broke was the one importing its symbols
    directly, `tests/present-anchor.test.mjs`, since rewritten). THE TENSION THE FIRST CUT NAMED WAS
    REAL AND WAS IN THE BRIEF, NOT IN THE DESIGN: "every existing anchor test still passes" was
    written to mean "do not regress the behaviour", read as "do not touch that test file", and a
    module that exists and does not reach production is this project's own named highest-frequency
    bug. The correction: rung labels were never a behaviour the operator has — they were this
    surface's internal bookkeeping about which lookup answered — so `tests/present-anchor.test.mjs`
    is rewritten to assert what the cursor DOES (holds, follows, refuses, is not silently guessed)
    rather than which internal tier produced the answer, and the ONE property worth keeping
    unmissable is proven twice: a stamped node that MOVES SECTION still keeps the cursor, once
    driving `FocusSurface` directly and once through `app/index.html`'s own lifted script end to
    end (refutation 1, design doc §3.3 — see `derive-the-instance-id-in-the-browser`'s record for
    the tier-by-tier account of what survived).
  tier: functional
  rooting: >-
    isolated FOR NOW IN ONE SENSE, ROOTED IN ANOTHER. `app/present/instance.ts` is a new pure module
    in the same family `boundary.ts`/`indent.ts`/`word.ts` still are (`anchor.ts`, the fourth member
    of that family, is retired) — but unlike those three it is no longer import-adjacent only:
    `focus.ts` imports it directly and `FocusSurface.reanchor` is its production caller, which is
    what makes this capability's cursor-holding claims claims about the SHIPPED cursor rather than
    about a tested-but-unwired module. `paint.ts` imports it too, for `data-instance`. `PaintDeps`
    and `FocusSurface.focus`/`.reanchor` each gained OPTIONAL/threaded parameters (`view`), the same
    posture `focus`/`mode`/`draft` already have on `PaintDeps`, so every caller that predates it
    paints and resolves exactly what it always did when it omits one.
  status: working
- id: structural-language-is-published-not-guessed
  intent: >-
    THE BROWSER READS WHAT A GESTURE MEANS; IT DOES NOT HOLD A COPY OR GUESS. Item 1 of
    `docs/implementation-artifacts/design-the-structural-language.md`, which refuted the brief that
    commissioned it: an indent's meaning (which edge type it creates, which direction) is not
    hardcoded in the engine — it is DECLARED, in `structural_tokens.yaml`, validated at bundle load,
    proved by mutation (change the declaration, the resolver's answer changes; remove the key, the
    applier creates no edge at all). Detection (which line is whose parent) is hardcoded and
    UNIT-FREE; meaning (what a parent relation IS) is declared, and only the second half belongs to
    this instance. THIS CAPABILITY IS THE WIRE, NOT A SECOND INTERPRETER: `StructuralTokenResolver`
    already resolves the language server-side; a pre-flight service computing what an edit would
    mean in the browser would be a second interpreter of one language, which the design document
    names as the exact MVC violation this project keeps finding and removing. So the browser is
    given a LOOKUP TABLE, generated from the monorepo's own config
    (`scripts/generate-structural-declaration.mjs`, never hand-written — the `INDENT_UNIT` mistake,
    §3 of the design document, is what a hand-copied number costs), and it is the browser's to READ,
    not to decide with.
    PUBLISHED, OVER THE EXISTING CHANNEL, NOT A NEW ONE. `presentation.json` already carries the
    GLOBAL rendition level and already reports an unrecognised key as a problem rather than
    ignoring it (`presentation-is-resolved-not-chosen`'s own record). This capability widens that
    same document's grammar with two more known keys: `structural` (the ingest axis — indent
    binding, edge cardinality, per-section overrides for every view that declares one) and
    `indentUnit` (the output axis — see below). Both are read by `presentationFromDeclaration`
    (`app/present/context.ts`), the same one wire function that already read the rendition axis, so
    every axis of the one document is validated the same way: an unrecognised key anywhere is
    REPORTED, never guessed at, and a malformed sub-fact falls back to "unknown" without blinding
    the reader to the rest of a good document.
    ── UPDATE 2026-07-31, THE CHANNEL STOPPED BEING A FETCH. THE SENTENCE ABOVE SAID "the page
    fetches once"; it no longer does. `app/present/embedded-declaration.ts` imports
    `presentation.json` at BUILD time (`import presentationJson from "../../presentation.json"`,
    esbuild's own JSON loader) and `dist/present.js` carries the parsed document as
    `EMBEDDED_DECLARATION` — removing the ~110ms serial round trip §2.5 of
    research-state-and-speed.md measured in front of the `/app/graph` request that actually
    matters. THE GENERATED HALF IS STILL GENERATED, AND STILL ONE DOCUMENT: this file imports
    `presentation.json`, the exact file `scripts/generate-structural-declaration.mjs` writes and
    the exact file `tests/present-structural.test.mjs`'s `SERVED` reads off disk — there is no
    hand-copy step and no second place the structural language could go stale in. THE DRIFT GUARD
    IS THE ONE THIS REPO ALREADY TRUSTS: `dist/present.js` is a committed artifact CI already
    refuses to ship stale (`.github/workflows/build.yml`'s "fail if a committed bundle is stale"),
    and because the JSON import makes `presentation.json` part of that bundle's own input graph,
    the existing gate now also catches "presentation.json changed and nobody rebuilt" — no new
    machinery, the same protection `demo/app.js` already had, extended to one more input file.
    `tests/present-global.test.mjs` section 0 additionally asserts `EMBEDDED_DECLARATION` deep-
    equals a fresh read of `presentation.json`, so the guard is provable in `npm test` too. THE
    FAILURE MODE STAGE 2 TOLERATED — "a slow, missing or broken presentation.json costs nothing but
    a warning" — NO LONGER APPLIES TO A FETCH, because there is not one; a malformed
    `presentation.json` now fails `npm run build` instead (esbuild's JSON loader throws on invalid
    JSON), which CI catches before anything ships. What survives unchanged is a document that
    PARSES but says something the reader does not recognise — still reported, never guessed,
    exactly as before. `presentation.json` is still served at the site root as its own resource;
    this change only stops the RUNNING APP being the thing that has to fetch it.
    THE MINIMUM, STATED AS A DECISION: the whole of `structural_tokens.yaml`'s vocabulary is NOT
    published (wiki-link bindings, field bindings, chain buckets) — only the indent binding, the
    cardinality of every edge type that binding or a section override actually names, and the
    per-section overrides themselves, because that is exactly what item 3 (narration, NOT built
    here) needs to answer "what will `>` do on this line" and nothing else has a reader yet.
    `edgeCardinality` matters because it is the fact that decides MOVE VERSUS ADD
    (`applier.py:2953-2961`, `schema.yaml`'s `cardinality:`) — the same keystroke relocates a node
    under `PART_OF` (`many_to_one`) and accumulates a waiter under `WAITING_FOR` (`many_to_many`) in
    the operator's own six live views, and an app that named the edge without the cardinality could
    still get the verb wrong.
    THE INDENT UNIT IS THE OUTPUT AXIS, NOT THE STRUCTURAL ONE — the design document's own
    refutation of a filing IT made first, in the design brief that commissioned it. Detection
    (`content_diff.py:721-722`) is unit-free: any column increase nests, so the number of spaces per
    level changes no edge, only whether a re-rendered line visibly jumps. `presentation.json`'s
    `indentUnit` therefore rides beside the rendition axis (`declaration.ts`, not `structural.ts`)
    and `app/present/indent.ts`'s `indentedLine` now takes it as a parameter, defaulting to the same
    `INDENT_UNIT` constant it always used — `declaration.ts`'s own fallback IS that constant,
    imported rather than re-declared, so the built-in floor is one number, not two. THIS DOES NOT
    (YET) CLOSE THE GAP `vim-normal-mode-slice-3` RECORDED: `paint.ts`'s checkbox-margin arithmetic
    still divides by two, disagreeing with the four this axis now declares, because fixing it was
    tried — dividing by the declared unit instead of the constant 2 — and reverted when
    `tests/present-golden.test.mjs`'s byte-identical comparison against the historical
    `app.html:234-269` reference failed for indents of 1, 2 and 4 raw spaces. That golden is a
    separate, already-validated claim and was not weakened to make room. The disagreement is now a
    tested, cited fact (`tests/present-structural.test.mjs`, section 4) rather than only a prose
    finding, so a future fix cannot silently regress it back to "fixed" without the test and the
    golden both being looked at together.
    THE COUPLING TO THE MONOREPO IS KEPT HONEST, NOT ASSUMED. `tests/present-structural.test.mjs`
    section 3 does not compare against a fixture — it imports
    `scripts/generate-structural-declaration.mjs` and regenerates the structural declaration FROM
    the monorepo's `structural_tokens.yaml`, `schema.yaml` and `config/views/*.yaml` directly,
    asserting the regenerated value equals what is checked into `presentation.json`. It is SKIPPED,
    with a stated reason, when the sibling monorepo checkout is not present — this repo's CI does
    not clone it — so it runs locally, where the checkout this worktree's own flow-trace invocation
    already assumes is present, and lights up there; the same posture `tests/flow_scenarios/
    vim_gestures.ts` already documents for its own CI gate.
  tier: functional
  rooting: >-
    isolated for now, same family as `presentation-is-resolved-not-chosen` was at migration stage 2:
    `app/present/structural.ts` is read by `app/present/context.ts`'s `presentationFromDeclaration`
    (the observable edge `context-reads-the-structural-declaration`, flows.yaml) and by nothing
    else in production yet — `app/index.html` holds the result in a page-level variable
    (`structural`) that nothing downstream consumes, which is the honest state of "published, not
    yet narrated". Item 3 of the design document (narration — "tell the operator what `>` will do
    before they press it") is the consumer that would root this further; it is explicitly not built
    here. `app/present/indent.ts` IS wired into production (`indentedLine`'s new `unit` parameter,
    threaded from `app/index.html`'s `loadPresentation`), so the indent-unit half of this
    capability's claims are claims about the shipped `>`/`<` gesture, not about an unwired module.
  status: working
- id: the-world-moves-around-you
  intent: >-
    THE SYSTEM COMPUTES BEHAVIOUR, SO THE PROJECTION SHOULD LIVE RATHER THAN WAIT TO BE FETCHED. A
    cycle fires rules, so an edit can unlock a task, change a node three views away, or make
    something appear that nobody typed — and those changes should ARRIVE. The operator's words:
    "the world moving around you, like real life."
    THIS IS NOT AUTO-REFRESH, and the distinction is the whole capability. Auto-refresh is a client
    asking again on a timer. What this commits to is that a change the operator DID NOT TYPE
    reaches his screen without him asking for it — which is the only way a computed consequence is
    distinguishable from a coincidence. If he has to press refresh to see a rule fire, the rule did
    not fire FOR HIM; it fired for the database.
    TODAY EVERY INSTALL OF A PROJECTION IS THE CLIENT ASKING. `loadGraph` at boot and sign-in, the
    refresh button, and the return of a write are the complete set (app/index.html:1284-1335,
    :1156-1202). There is no transport by which the server can say anything to this app.
    THE PAINTER HALF IS ALREADY BUILT, and it is the only part of this above zero. `paint(body,
    source, context, deps)` empties the body and rebuilds the whole view from ONE STRING
    (app/present/paint.ts:452, :537), which was done so the cascade would stay the only decider —
    "a patch-one-element implementation would have to know which lines a focus change could
    possibly affect, which is a second copy of the precedence order". The consequence nobody was
    aiming for is that installing a new projection is already a one-argument operation: no diff to
    compute, no DOM reconciler to write, no partial-update path that could be wrong. The world
    moving is `repaint(newSource)`.
    IT IS IN TENSION WITH `the-edit-is-a-safe-haven` AND THEY RESOLVE COMPLETELY RATHER THAN BY
    COMPROMISE, because their subjects are disjoint. This one owns THE STATE — every line of the
    view, derived, replaceable at any moment, never authoritative in the browser. That one owns THE
    DELTA — the characters under the cursor, authored, authoritative, never derived. They looked
    like a trade-off only because the app today conflates them by posting the whole state in order
    to express one change.
    IT MUST NOT SHIP BEFORE THE WRITE IS SAFE, and that ordering is a commitment rather than a
    preference. A projection arriving unbidden into an app whose every save posts a whole file
    computed against a stale base is a faster machine for discarding the cycle's own output. The
    sequence is in design-the-edit-is-a-safe-haven.md section 10 and the reason is in section 3.4.
    EVIDENCE TIER — NONE. THIS IS A PLAN, NOT A PROOF, and it is not even partly true. There is no
    push, no subscription, no server-sent anything, and the graph server's declared surface is
    `GET /health`, `GET /graph` and `POST /cycle`. Nothing here can be falsified until a transport
    exists, and no enforcer is claimed. It is declared so the distance sits in the derived queue
    instead of in a conversation.
  tier: foundational
  rooting: >-
    isolated — this capability is about a TRANSPORT that does not exist, on a server that is not in
    this repository. The one thing it would route through in the browser is the painter, which
    already has a class (presentation-painting) earned by a different capability; claiming it here
    would root the half that is already built and say nothing about the half that is missing. It
    roots when something outside this app can address it.
  status: undeclared

