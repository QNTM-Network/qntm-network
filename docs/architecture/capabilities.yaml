  status: 'working'

- id: the-browser-recognises-its-own-write
  intent: >-
    THE BROWSER CAN TELL THAT ITS OWN WRITE LANDED, AND THE RECOVERY STRIP STOPS LYING TO HIM.
    THE MEASURED DEFECT. A real browser session on 2026-08-01 found the held strip carrying FIVE
    rows, THREE of which were lines that had saved perfectly. The cause is in the data rather than in
    the strip: the cycle REWRITES the line it ingests - it appends the identity stamp, the defaults
    and the marker - and the only signal the page had for "is this line back" was its TEXT
    (`HeldSurface.settle`, which matches a whole line or a prefix with a token appended after a
    space). A line the cycle re-sorted, re-worded or moved into another view reads as "the file does
    not own these characters", so the row stays up claiming work was lost when none was. A strip full
    of rows that are not losses is a strip nobody reads, which makes the rows that ARE losses
    invisible - the exact failure `a-vanished-or-refused-edit-is-held-unanchored` is least able to
    afford.
    TEXT IS NOT IDENTITY. A TOKEN IS. The browser mints one opaque token per write and sends it
    beside `{path, markdown, base}`; the server records it and names it back as
    `writes: {path: [token, ...]}`; the browser matches the echo and knows ITS write landed rather
    than that some write did.
    THE NARROW CLAIM, WHICH IS THE ONLY ONE ANYTHING IS BUILT ON. The echo says "this server accepted
    a write carrying this token FOR THIS PATH" and no more. It does not say the projection in hand is
    derived from that write - the ledger holds up to 8 tokens per path for 24 hours, so a token
    recorded before a LATER write to the same path is still echoed. So the match is per path, and
    where the difference could matter the answer is to keep the row.
    WHAT HE SEES. A row whose write the server acknowledged is not held at all, and the freshness
    line says "the cycle rewrote the line you saved - the server recorded it, so nothing is held".
    RECORDED, never WRITTEN: a 200 says the server ACCEPTED the save, an echo says it RECORDED it,
    and neither says the line survived the cycle, because the cycle is entitled to rewrite, move or
    delete what it ingests. Two sentences carry the distinction and neither claims the stronger fact.
    ONLY POSITIVE EVIDENCE REMOVES A ROW, AND GIVING UP IS NOT EVIDENCE. A write whose echo never
    arrives is dropped from the register after three arrivals that NAME its file without naming it -
    and what is dropped is the register's record and nothing else. The row keeps its token, the strip
    keeps the row, the characters stay on screen. A vanished echo is never proof a write failed: the
    server's ledger is capped and aged, so an acknowledgement can legitimately disappear.
    A SERVER THAT ECHOES NOTHING BEHAVES EXACTLY AS TODAY, AND THAT IS THE CONDITION OF SHIPPING. The
    server half is merged and NOT DEPLOYED. Three independent statements make it true: `token` is
    absent from the POST body when none could be minted (`mintWriteToken` returns `null` rather than
    a weak token when there is no CSPRNG); `readWriteEcho` reports `silent` for an envelope with no
    `writes` key and `correlate` returns before touching the register; and `HeldSurface.landed([])`
    is a no-op.
  rooting: >-
    ONE NEW MODULE, `app/present/correlation.ts`, and it imports nothing. It holds the mint
    (`mintWriteToken`, 128 bits from `crypto.getRandomValues`, hex, behind a `w1-` scheme prefix),
    the reader (`readWriteEcho`, the ONE expression in the repository that knows where the echo lives
    and what shape it has) and the register (`WriteRegister`, the outstanding writes keyed BY TOKEN).
    PURE except for the mint, which is the one function that reaches a platform global - the same
    separation `base.ts` makes between `baseOf` and `BaseSurface`, and for the same reason: the
    surface stays drivable with the DOM, the network and the clock all made to throw.
    THE READER IS SMALL AND REPLACEABLE ON PURPOSE. It was written against a placeholder shape while
    the server half was being built in another repository, and when the real shape landed it was the
    only thing that changed. It is strict in the posture `declaration.ts`, `structural.ts`,
    `qualification.ts` and `resolutiontable.ts` all share: silence falls through to the behaviour
    that existed before it, and a shape it does not recognise is REPORTED to the console and treated
    as no evidence at all, never guessed.
    `HeldEdit` GAINS ONE FIELD, `token`, AND `HeldSurface` ONE METHOD, `landed`. The field is `null`
    for a REFUSED row (a 409 means nothing was written, so no echo can exist for it) and for an
    UNPLACED one (the row was being made; no write ever carried it). So the release is structurally
    unable to reach the two causes it must not.
    THE FOUR PINNED WRITE-ADJACENT COUNTS ARE UNMOVED and are asserted at the VALUE level rather than
    by number: `graphData` is assigned in four places and every one of them from an envelope off the
    wire (`data`, `pending.data`, `null`); `writeFile(` occurs 3 times (its declaration plus two
    callers); `applyEdit(` reaches 5 sites outside its own module (2 in app/index.html, 3 in
    app/present/paint.ts); `.markdown` is never assigned anywhere under app/. Two more are pinned by
    this change: the held surface is now reached from exactly six named expressions (the sixth,
    `held.landed`, is a release and not a way into a write), and the register from exactly five.
    `worker/src/app.js` FORWARDS `token` TO `POST /vault/file` ON EXACTLY THE TERMS IT ALREADY
    FORWARDS `base` - absent, never empty and never null - and carries `writes` back through the two
    places it rebuilds the envelope field by field. CONDITIONALLY, not as `|| {}`: absent and empty
    are different statements, and only absent is true of the graph server that is actually deployed.
    An unconditional empty echo would start a grace running and put a sentence on the freshness line
    for every projection from a server that has never heard of a token.
    ENFORCEMENT IS `tests/app-write-correlation.test.mjs` - 44 tests in 8 documented sections over
    the real `app/index.html` module script. Section 2 reproduces the false positive and asserts it
    is gone; section 3 is the shipping condition, driving identical gestures against an envelope with
    no `writes` key; section 5 is the mutation proof, breaking the one expression that decides
    whether the row is held and asserting section 2's own assertion goes red. Independently measured:
    breaking `HeldSurface.landed` turns 3 of the 44 red.
    NOT VERIFIED IN A BROWSER. No browser is available in this environment - no passkey session, no
    live graph server, no engine cycle, no real POST, and no run against the deployed Worker.
  status: 'working'
- id: a-write-does-not-wait-for-the-cycle
  intent: >-
    THE WRITE IS ANSWERED WHEN THE VAULT HAS IT, AND THE ENGINE'S ANSWER IS COLLECTED SEPARATELY.
    WHAT IT COST BEFORE. `POST /app/edit-file` wrote the file and then awaited the engine cycle, so
    every checkbox and every line commit cost the ~10 s the cycle takes, on a screen that said
    `syncing...`. That is item #1 of research-state-and-speed.md's ranked list, worth ~10 s -> ~250
    ms, and it was blocked for two years' worth of reasons that all reduce to one: the projection
    came back ON the write, so a write that stopped waiting had no answer at all.
    THE ANSWER ARRIVES ON ITS OWN, WHICH IS THE OTHER HALF OF THIS ROW AND WAS ITS BLOCKER. Until
    now the complete set of things that install a projection was boot, the re-read button, and THE
    RETURN OF A WRITE. All three are the browser asking, and only the third fires on an ordinary
    gesture. A PICKUP is that third one rebuilt as a SEPARATE read: the write says accepted, and a
    moment later the page collects what the cycle made of it, through the same door every other
    arrival goes through - correlated, coalesced by `generated_at`, and HELD if a line is open.
    IT IS NOT A POLL, AND THE DISTINCTION IS THE OPERATOR'S MONEY RATHER THAN A PREFERENCE. The
    graph server is a Fly machine with `auto_stop_machines = stop` and `min_machines_running = 0`
    - it sleeps when idle and a cold wake is 4,278 ms of a dedicated core he pays for. A browser
    timer that re-read every N seconds would wake it every N seconds for as long as a tab is open,
    which at 30 s is 2,880 wakes a day of a machine nobody is using. Three properties keep this
    from being that. CAUSED - nothing is ever read except after a write HE made, so an idle page
    reaches the graph server exactly zero times. BOUNDED - a write buys at most three reads over
    ~40 s and the series then ENDS and says so; it never re-arms itself. INSIDE THE WAKE THE WRITE
    ALREADY PAID FOR - the machine is awake and running the cycle for the whole of that window, so
    the marginal cost of every pickup is zero cold wakes.
    ACCEPTED IS NOT WRITTEN AND THE FRESHNESS LINE NOW HAS BOTH WORDS. A 200 on the vault write
    says the server took the bytes. `as of <when>` is a claim about a PROJECTION and belongs to the
    projection when it lands, so an ack says `the server took your save - the cycle's answer
    follows` and nothing stronger. When the series ends without an answer it says so, and points at
    the one control that can ask again.
    TWO EDITS INSIDE ONE CYCLE STILL CARRY BOTH, WHICH IS THE CASE ASYNC WAS REFUSED OVER. A
    synchronous write got that for free: its projection came back and the painter re-walked the
    file, so the second edit was computed on top of the first. An ack has no projection, so the
    string the painter walks comes from the ack itself - `POST /vault/file` writes the bytes it is
    sent and answers 200 when it did, so after an ack THE FILE SAYS WHAT WAS POSTED. That same one
    string refreshes the base, which is what stops the stale-write detector going blind.
    THE DETECTOR IS NOT WEAKENED AND TWO NAMED REFUSALS ARE WHY. An ack whose path already has a
    projection QUEUED takes nothing - what the page holds in its own hand is a newer word about the
    file, and overwriting the base with the ack's string would undo the one statement that keeps
    the detector honest while the screen waits. An ack that arrives while a LINE IS OPEN takes
    nothing either, because the repaint rebuilds every row from one string. Both leave the next
    write reading `stale`, which is the safe direction.
  rooting: >-
    TWO NEW MODULES, BOTH PURE AND BOTH IMPORTING NOTHING. `app/present/pickup.ts` holds the POLICY
    - how long to wait, how many times, one outstanding read per path, and the bound is a private
    copy so a caller cannot lengthen it. It holds no timer: `setTimeout` is the page's, because the
    first wait is ten seconds and a suite that could only wait ten seconds could prove neither that
    a read fires nor that the series stops. It does not decide whether the answer ARRIVED either -
    it is told, because that is a fact about `correlation.ts`'s register and a second weaker copy of
    a judgement that already exists is how two answers drift apart.
    `app/present/accepted.ts` holds ONE FILE'S markdown, as the server said it stands after taking
    a write. It has no views, no graph, no locations and no `generated_at`, so there is nothing in
    it that could reach `graphData`, and it is never offered to `ProjectionQueue`. A projection for
    the path drops it unconditionally - the engine is entitled to rewrite what it ingested, so
    where the two disagree the arriving one is right.
    `worker/src/app.js` TAKES `ack: true` AND ANSWERS ON THE VAULT WRITE, running the cycle in
    `ctx.waitUntil`. `handleApp` and the router now take the ExecutionContext the runtime has always
    handed them. FOUR INDEPENDENT FALLS BACK TO TODAY'S BEHAVIOUR, which is the whole shipping
    condition - a browser that does not send the field, `ack: false`, a truthy value that is not
    `true`, and a runtime that hands over no `ctx`. A 409 and a 502 are both answered BEFORE the
    branch, so accepted-but-not-written is not a state that exists. The field is the Worker's own
    and is never forwarded to the graph server.
    THE PINNED WRITE-ADJACENT COUNTS, RE-ASSERTED AT THE VALUE LEVEL. `graphData` is assigned in
    four places and every one from an envelope off the wire; `writeFile(` occurs 3 times;
    `applyEdit(` reaches 5 sites outside its own module; `.markdown` is never assigned anywhere
    under `app/`; the held surface is reached from exactly six named expressions. TWO MOVED AND
    BOTH ARE JUSTIFIED IN THE SUITES THAT PIN THEM. The POST body gains `ack` - unconditional
    rather than absent-when-empty, because `do not make me wait` is true of every write this app
    makes, and it is still a field a server may ignore. The write register gains a sixth reach,
    `writes.waiting` - a token in, a boolean out, no path, no markdown and no way to a POST.
    ENFORCEMENT IS `tests/app-async-ack.test.mjs` (31 arms in 5 documented sections, 2 of them
    mutation proofs) plus the rewritten section 7 of `tests/app-projection-queue.test.mjs`, whose
    two arms WERE this row's blocker and are now its acceptance, inverted in place against the same
    fixture and the same gestures. Measured: breaking `accepted.take` turns 5 arms red across the
    two suites.
    NOT VERIFIED IN A BROWSER. No browser is available in this environment - no passkey session, no
    live graph server, no engine cycle, no real POST, and no run against the deployed Worker.
    `ctx.waitUntil` is a recorder and the graph server is a fixture. NOTHING MEASURES LATENCY: the
    ~10 s -> ~250 ms is a claim about a network no arm touches. What is measured is the SHAPE -
    which requests are made, in which order, carrying what, and what the page does with the answers.
  status: 'working'

