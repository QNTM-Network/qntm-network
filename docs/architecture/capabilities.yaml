    `edgeCardinality` matters because it is the fact that decides MOVE VERSUS ADD
    (`applier.py:2953-2961`, `schema.yaml`'s `cardinality:`) — the same keystroke relocates a node
    under `PART_OF` (`many_to_one`) and accumulates a waiter under `WAITING_FOR` (`many_to_many`) in
    the operator's own six live views, and an app that named the edge without the cardinality could
