    the exact file `tests/present-structural.test.mjs`'s `SERVED` reads off disk — there is no
    hand-copy step and no second place the structural language could go stale in. THE DRIFT GUARD
    IS THE ONE THIS REPO ALREADY TRUSTS: `dist/present.js` is a committed artifact CI already
    refuses to ship stale (`.github/workflows/build.yml`'s "fail if a committed bundle is stale"),
