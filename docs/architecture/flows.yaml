# qntm.network — flows.yaml. DECLARATION, not code — the call-flow SHAPE we commit the app to.
# flow-trace measures the captured flow against this:
#   observed AND declared      -> ok (the code does what we said)
#   observed but NOT declared  -> drift (the code does something we never committed to)
#   declared but NOT observed  -> a commitment the code stopped honouring
#
# LIVE AGAIN 2026-07-23 (second pass). This file was emptied that morning when the Python render
# app retired into TypeScript and flow-trace could not observe TS at all — declaring a shape
# nothing could check would have manufactured permanent drift. flow-trace's
# `typescript-capture-backend` landed the same day (working, depth 3), so the commitment is
# checkable now and the declarations come back.
#
# NOTE THE IDENTITY CONVENTION: for a JS/TS target a module is its repo-relative path without
# extension (`app/render/renderer`), not a dotted package path, and a callee is the function or
# `Class.method` name. Observed by tests/flow_scenarios/render_and_edit.ts under the node observer.

expected_flows:

  # ── THE TRANSFORM ────────────────────────────────────────────────────────────────────────
  # paint() calls the pure renderer. Fires on the initial mount AND on every keystroke; one
  # declared edge covers both because it is the same commitment either way.
  - id: main-renders-markdown
    from: app/main
    to:   app/render/renderer
    callee: MarkdownRenderer.toHtml
    event: app.markdown-to-html
    class: markdown-rendering
    gates_capabilities: [demo-renders-markdown-in-the-browser]

  # ── THE SESSION ──────────────────────────────────────────────────────────────────────────
  # main.ts owns the DOM and the session owns the state, so every read of mode or text is a
  # cross-module call. Declaring the getters as well as the mutators is deliberate: they are
  # real observed edges, and leaving them undeclared would report as drift while being exactly
  # what we intend. An accurate map includes the quiet edges.

  - id: main-reads-session-source
    from: app/main
    to:   app/editor/session
    callee: EditorSession.source
    event: app.reads-document-text
    class: page-presentation
    gates_capabilities: [demo-renders-markdown-in-the-browser]

  - id: main-reads-session-mode
    from: app/main
    to:   app/editor/session
    callee: EditorSession.mode
    event: app.reads-current-mode
    class: page-presentation
    gates_capabilities: [reader-can-toggle-edit-and-view-modes]

  - id: main-toggles-mode
    from: app/main
    to:   app/editor/session
    callee: EditorSession.toggle
    event: app.switches-view-and-edit
    class: editing-session-state
    gates_capabilities: [reader-can-toggle-edit-and-view-modes]

  - id: main-updates-source
    from: app/main
    to:   app/editor/session
    callee: EditorSession.setSource
    event: app.records-typed-text
    class: editing-session-state
    gates_capabilities: [reader-can-toggle-edit-and-view-modes]

  # ── THE PRESENTATION CASCADE ─────────────────────────────────────────────────────────────
  # Added 2026-07-30 with migration stage 1, in the same change as the modules and the classes.
  # Observed by tests/flow_scenarios/present_cascade.ts under the node observer.
  #
  # ── THEY ARE OBSERVED NOW. CORRECTED 2026-07-30, MIGRATION STAGE 2 ────────────────────────
  # This block used to open "they are DECLARED and they are NOT OBSERVED YET, because
  # `flow-trace verify .` exits 2". That was true when it was written and it is FALSE NOW, and
  # leaving it would be exactly the fossil this project keeps finding. With the tool's own JS
  # observer installed (`npm ci` in flow-trace's js/ — the fix is in the tool, not here),
  # `flow-trace verify .` exits 0 with 23 PASS / 0 FAIL and every expected flow below is
  # OBSERVED, with counts:
  #     paint -> cascade.PresentationCascade.resolve   count 8
  #     cascade -> context.PresentationContext.at      count 56
  #     cascade -> levels.isSilent                     count 56
  #     paint -> resolution.classifyLine               count 12
  #     paint -> source.applyEdit                      count 1
  # ONE CAVEAT, AND IT IS THE TOOL'S RATHER THAN THIS REPO'S: `capability-rollup` and
  # `map --full` install canonical-routing probe anchors during the same capture, and with those
  # anchors installed the JS observer records NO cross-module calls, so every flow here reads
  # UNVERIFIABLE and the capabilities derive `partial`. Measured both ways on 2026-07-30 (the
  # identical verify run, probe_anchors=() vs the two routing anchors), so it is a property of
  # the anchors and not of these declarations. The derived block in capabilities.yaml is
  # therefore NOT refreshed from a rollup that under-reports — a derived verdict is not
  # hand-written in either direction, and it is not machine-written from a capture known to be
  # blind either.

  # THE RESOLUTION. The painter asks; it does not decide. This is the edge that makes
  # `presentation-is-resolved-not-chosen` falsifiable at all — a painter with the decision back
  # at the call site stops producing it.
  - id: paint-resolves-through-the-cascade
    from: app/present/paint
    to:   app/present/express/cascade
    callee: PresentationCascade.resolve
    event: app.resolves-a-rendition
    class: presentation-resolution
    gates_capabilities: [presentation-is-resolved-not-chosen]

  # THE DECLARATION REACHES (added 2026-07-30, migration stage 2). The GLOBAL level is a document
  # served with the app, and this edge is what makes "the reader is wired" an OBSERVED fact rather
  # than a claim. It is declared as its own flow, and the stage was done as its own hour, because
  # "a declaration that exists and does not reach" is this system's highest-frequency bug: the
  # edge that would disappear if the page went back to reading the document itself is exactly the
  # edge worth watching. app.html fetches; app/present/context reads.
  - id: context-reads-the-global-declaration
    from: app/present/context
    to:   app/present/express/declaration
    callee: readDeclaration
    event: app.reads-the-global-declaration
    class: presentation-resolution
    gates_capabilities: [presentation-is-resolved-not-chosen]

  # THE STRUCTURAL LANGUAGE REACHES (added 2026-07-31, design-the-structural-language.md item 1).
  # Same shape as the edge above, same reason it is declared on its own: the INGEST axis (what a
  # gesture like indent MEANS) is a second grammar over the SAME served document, read by a second
  # strict reader from the SAME wire function — never a second fetch, never a second channel. This
  # edge is what makes "the structural reader is wired" observed rather than claimed, exactly as
  # `context-reads-the-global-declaration` does for the rendition axis above it.
  - id: context-reads-the-structural-declaration
    from: app/present/context
    to:   app/present/arrange/structural
    callee: readStructuralDeclaration
    event: app.reads-the-structural-declaration
    class: presentation-resolution
    gates_capabilities: [structural-language-is-published-not-guessed]

  # THE MEMBERSHIP AXIS REACHES (added 2026-08-01, design-the-resolution-architecture.md step 3).
  # Same shape as the two edges above, same reason it is its own declaration: `qualification.ts`
  # had NO production caller before this — only tests called `readQualificationDeclaration`
  # directly, and 20+ KB of predicate table shipped in every build unread. This edge is what makes
  # "the qualification reader is wired" observed rather than claimed. Observed by
  # tests/flow_scenarios/present_cascade.ts, which already called `presentationFromDeclaration`
  # for the other two axes and now exercises this one for free — no scenario changes needed for
  # this edge specifically.
  - id: context-reads-the-qualification-declaration
    from: app/present/context
    to:   app/present/select/qualification
    callee: readQualificationDeclaration
    event: app.reads-the-qualification-declaration
    class: presentation-resolution
    gates_capabilities: [section-membership-is-read-not-guessed]

  # THE CONFIG-ONLY RESOLUTION TABLE REACHES (added 2026-08-01, design-the-resolution-
  # architecture.md step 5). Same shape as the three edges above, a fourth axis over the SAME
  # served document: registration's two names (default_node_type/base_node_type), ordering, line
  # grammars, the day boundary. STATUS UPDATED (steps 6, 7, 8 all shipped 2026-08-01; step 8's
  # own call site wired 2026-08-03):
  # `chromeShapes` (step 6) and `ordering`/`orderingFields` (step 7) have real, wired-in
  # consumers (`newline.ts`'s GLOBAL rung; `ordering.ts`'s preview, called from `app/index.html`).
  # `dayBoundary` (step 8) NOW DOES TOO — `app/present/today.ts`'s `todayFor` reads and resolves
  # it, proven to agree with the engine, and `app/index.html`'s `sayAsOf` calls it
  # (`todayNoteFor`) on every fresh projection arrival, appending the logical date and week end
  # to the freshness line. Neither ordering (already shipped, clock-free) nor membership's 8
  # clock-bound qualifications (still need a wider predicate grammar, not only the boundary) is
  # answered by this — see capability `day-boundary-resolver-agrees-with-the-engine`'s own
  # record for the full account, including why this call is not observable as a flows.yaml edge
  # (a call from `app/index.html` is unobservable to flow-trace's node module-load hook, the
  # same reason `membershipNoteFor`/`orderingNoteFor`'s own calls have no edge here either).
  - id: context-reads-the-resolution-declaration
    from: app/present/context
    to:   app/present/resolutiontable
    callee: readConfigResolutionDeclaration
    event: app.reads-the-resolution-declaration
    class: presentation-resolution
    gates_capabilities: [config-resolution-table-is-published]

  # THE FACTS. The cascade reads each level through the context rather than reaching for a
  # session, a store or a global — which is what lets a test resolve "as if the cursor were here"
  # without a browser, and what stage 3 depends on.
  - id: cascade-reads-the-levels-it-was-given
    from: app/present/express/cascade
    to:   app/present/context
    callee: PresentationContext.at
    event: app.reads-a-level-contribution
    class: presentation-resolution
    gates_capabilities: [presentation-is-resolved-not-chosen]

  # SILENCE HAS ONE SPELLING, and the predicate that says so lives with the levels. A second
  # spelling at a call site is how a cascade acquires a hole nobody can see, so the edge is
  # declared rather than left as an implementation detail.
  - id: cascade-asks-the-levels-what-silence-is
    from: app/present/express/cascade
    to:   app/present/express/levels
    callee: isSilent
    event: app.tests-level-silence
    class: presentation-resolution
    gates_capabilities: [presentation-is-resolved-not-chosen]

  # THE LINE'S OWN CONTENT — the LINE level's input, read in one place instead of by three
  # regexes at three call sites.
  - id: paint-classifies-the-line
    from: app/present/paint
    to:   app/present/express/rendition
    callee: classifyLine
    event: app.classifies-a-source-line
    class: presentation-resolution
    gates_capabilities: [presentation-is-resolved-not-chosen]

  # THE TOKEN'S OWN CONTENT (added 2026-07-30, migration stage 8). The LINE level's content input
  # one layer finer: not "what kind of line is this" but "where in it are the tags". Declared as
  # its own edge beside paint-classifies-the-line, and for the same reason — a tag grammar
  # re-expressed at a call site is the same failure as a precedence order re-expressed at one, and
  # this grammar is a MIRROR of the engine's (parse_tag.py:23) rather than something this repo gets
  # to choose. One place to look, one place to correct if the engine ever moves.
  #
  # IT FIRES ONLY ON THE WIRED PATH. Asking where a line's tags are when the answer will not be
  # used is work nobody asked for, so the edge appears exactly when a declaration says `tags:
  # wired`. That makes the observation itself meaningful: this edge being present in a capture is
  # evidence that a declaration reached the painter and was obeyed.
  - id: paint-finds-the-tags-in-the-line
    from: app/present/paint
    to:   app/present/express/rendition
    callee: tagSpans
    event: app.finds-the-tags-in-a-line
    class: presentation-resolution
    gates_capabilities: [presentation-is-resolved-not-chosen]

  # ── THE IDENTITY STAMP (added 2026-08-01) ─────────────────────────────────────────────────
  # THE SAME EDGE AS THE TAG GRAMMAR'S, FOR THE SAME REASON, ONE TOKEN FAMILY ALONG. The painter
  # does not decide what an identity stamp IS; it asks the module that mirrors the engine's own
  # grammar (parse_qntm_id.py). What makes this edge worth declaring SEPARATELY from
  # paint-finds-the-tags-in-the-line is that the two grammars are deliberately different WIDTHS —
  # `stampSpans` is the NARROW identity form and `wikiLinkSpans` is the WIDE one that word motions
  # use — and an edge that named only "the painter asks resolution about tokens" would hide the
  # one fact a reader needs: which of the two this rendition hides by.
  #
  # IT FIRES ONLY ON THE WIRED PATH, exactly as the tag edge does, so observing it is evidence that
  # a declaration of `stamp: wired` reached the painter and was obeyed rather than merely loaded.
  - id: paint-finds-the-identity-stamp-in-the-line
    from: app/present/paint
    to:   app/present/express/rendition
    callee: stampSpans
    event: app.finds-the-identity-stamp-in-a-line
    class: presentation-resolution
    gates_capabilities: [presentation-is-resolved-not-chosen]

  # ── THE CURSOR (added 2026-07-30, migration stage 3) ──────────────────────────────────────
  # WHERE THE CURSOR IS, AS A LEVEL RATHER THAN AS A BRANCH. FOCUS is the most specific of the
  # seven, so the cursor beats every declaration below it — which is what stops a line that
  # declares itself a chip, or an instance that declares `wired`, from becoming uneditable. The
  # rule is expressed as a contribution at the top of the cascade and NOT as an `if (focused)` in
  # the painter, and these two edges are the observable form of that: the painter asks the focus
  # surface for a context and obeys what the cascade then resolves.
  - id: paint-derives-the-focus-level
    from: app/present/paint
    to:   app/present/focus
    callee: FocusSurface.contextFor
    event: app.derives-the-focus-level
    class: presentation-resolution
    gates_capabilities: [the-focused-line-shows-its-source]

  # THE GESTURE. Clicking a line's text is what moves the cursor, and the painter is where the
  # click lands, so this edge is the cursor rule's entry point. Declared alongside the two quiet
  # reads below it for the reason this file already gives for the session's getters: they are
  # real observed edges, and leaving them undeclared would report as drift while being exactly
  # what we intend. An accurate map includes the quiet edges.
  - id: paint-moves-the-cursor
    from: app/present/paint
    to:   app/present/focus
    callee: FocusSurface.focus
    event: app.puts-the-cursor-on-a-line
    class: presentation-resolution
    gates_capabilities: [the-focused-line-shows-its-source]

  - id: paint-takes-the-cursor-off
    from: app/present/paint
    to:   app/present/focus
    callee: FocusSurface.blur
    event: app.takes-the-cursor-off-a-line
    class: presentation-resolution
    gates_capabilities: [the-focused-line-shows-its-source]

  # The one read that is NOT about deciding a rendition: whether to put the caret in the element
  # that was just painted. The rendition came from the cascade; this is the painter asking
  # whether the line it is building is the one a person is looking at.
  - id: paint-asks-where-the-cursor-is
    from: app/present/paint
    to:   app/present/focus
    callee: FocusSurface.isFocused
    event: app.reads-the-cursor-position
    class: presentation-painting
    gates_capabilities: [the-focused-line-shows-its-source]

  # The derived level is LAYERED onto the declared ones rather than replacing them: GLOBAL still
  # says what it said, and FOCUS wins because of where it sits in SPECIFICITY, not because
  # anything overwrote anything. A context is immutable, so what comes back is a new one.
  - id: focus-layers-its-level-onto-the-context
    from: app/present/focus
    to:   app/present/context
    callee: PresentationContext.with
    event: app.layers-a-derived-level
    class: presentation-resolution
    gates_capabilities: [the-focused-line-shows-its-source]

  # THE AFFORDANCE, AS A SOURCE EDIT. The single most important edge in this file. Every write
  # the app offers is computed here, from the source string, and handed out as a whole file. An
  # affordance that appeared WITHOUT this edge would be an affordance with no source edit — which
  # is precisely what is not admissible.
  #
  # STAGE 3 ADDED A SECOND AFFORDANCE AND NO SECOND EDGE, which is the point of the edge. The
  # focused line settles through this same call — `set-line` beside `set-checkbox` — so "does
  # this affordance have a source edit?" is still answered by reading one file. An `<input>`
  # holding verbatim source text has such an edit ("line N becomes this string"); a
  # contenteditable region holding a rendition would not, which is why one is admissible and the
  # other is the shape the design forbids.
  - id: paint-writes-back-through-the-source
    from: app/present/paint
    to:   app/present/source
    callee: applyEdit
    event: app.computes-a-source-edit
    class: source-write-back
    gates_capabilities:
      - every-affordance-writes-back-through-the-source
      - a-new-line-is-resolved-not-guessed

  # ── A NEW LINE, AND THE TWO EDGES THAT MAKE IT A RESOLUTION RATHER THAN A CONSTANT ─────────
  # Added 2026-07-31. A new line has no content, so nothing about it can be read from the line —
  # everything about it is resolved. These two are the observable form of that.
  #
  # THE FIRST IS THE ONE WORTH WATCHING. `seedFor` walks the rungs of the engine's own
  # `default_node_type` cascade (GLOBAL -> VIEW -> STRUCTURAL_NODE) as they are legible in what the
  # engine PRINTED, and reports which one answered. A painter that stopped calling it would be a
  # painter that had decided what a new line is — which is the exact condition the presentation
  # cascade exists to end, arriving in the one place where there are no characters to hide it.
  - id: paint-resolves-what-a-new-line-is
    from: app/present/paint
    to:   app/present/newline
    callee: seedFor
    event: app.resolves-a-new-line
    class: presentation-resolution
    gates_capabilities: [a-new-line-is-resolved-not-guessed]

  # THE SECOND IS WHERE THE UNCOMMITTED LINE LIVES. It is a separate module from the focus surface
  # on purpose: `FocusSurface` CONTRIBUTES a level to the cascade and this contributes nothing,
  # because a line with no content has no rendition to resolve between. What it holds is the fact
  # that the source string has NOT been touched yet — which is what makes an abandoned line cost
  # nothing and is why `applyEdit` gained one kind rather than two.
  - id: paint-opens-a-line-that-is-not-in-the-file
    from: app/present/paint
    to:   app/present/draft
    callee: DraftSurface.open
    event: app.opens-a-new-line
    class: presentation-painting
    gates_capabilities: [a-new-line-is-resolved-not-guessed]

  # THE GRAMMAR SAYS WHETHER A LINE CARRIES ANYTHING, AND THE WRITE-BACK ASKS IT. Not a second
  # regex in source.ts: the engine's rule — one canonical implementation per capability, no
  # parallel regex — is the one this repo mirrors, and "is this line empty" is a question about the
  # line grammar that `app/present/resolution` already owns. The refusal it gates is the one that
  # stops a node titled nothing from being minted, which was measured against a real cycle.
  - id: source-asks-the-grammar-whether-a-line-carries-content
    from: app/present/source
    to:   app/present/express/rendition
    callee: carriesContent
    event: app.judges-a-line-empty
    class: source-write-back
    gates_capabilities: [a-new-line-is-resolved-not-guessed]

  # AND THE RESOLUTION OF A NEW LINE READS THE CHROME THE ENGINE PRINTED. The same module, the
  # other half of the pair: `chromeOf` is what turns "the engine printed this line as a checkbox"
  # into "a new line beside it is a checkbox". It is the point at which the app reads the cascade's
  # answer instead of re-deriving it.
  - id: newline-reads-the-printed-shape
    from: app/present/newline
    to:   app/present/express/rendition
    callee: chromeOf
    event: app.reads-the-printed-shape
    class: presentation-resolution
    gates_capabilities: [a-new-line-is-resolved-not-guessed]

  # A HEADING IS WHERE A SECTION ENDS, and that is the whole reason the seed walk classifies lines
  # at all. It is what separates the STRUCTURAL_NODE rung from the VIEW rung: evidence found
  # without crossing a heading is the section's own answer, evidence found across one is the
  # view's. Same grammar as the painter's, asked for a different purpose.
  - id: newline-finds-the-section-boundary
    from: app/present/newline
    to:   app/present/express/rendition
    callee: classifyLine
    event: app.finds-a-section-boundary
    class: presentation-resolution
    gates_capabilities: [a-new-line-is-resolved-not-guessed]

  # THE GLOBAL RUNG BECOMES A READ (design-the-resolution-architecture.md step 6, 2026-08-01).
  # Added alongside the three edges above rather than replacing any of them — the GLOBAL rung is
  # walked to LAST, after LINE/STRUCTURAL_NODE/VIEW have all had their turn at the printed source,
  # so most-specific-PRINTED-evidence still wins outright. This edge fires only when `declared` was
  # supplied AND every earlier rung found nothing: `seedFor` names the `(view, section)` a bare new
  # line sits in the SAME way `membershipFor`'s caller does (L3 ADDRESSING, step 2), never by
  # re-deriving the ordinal itself.
  # WIDENED 2026-08-01 (`a-new-line-acquires-its-node-type-and-its-defaults`): this edge no longer
  # fires only after the three PRINTED rungs have all found nothing. The section is named ONCE, up
  # front, whenever a declaration is supplied, because the DECLARED TOKENS are a fact about the
  # section the line is ACTUALLY in while the CHROME may have been copied from a neighbour across a
  # heading (the VIEW rung). Resolving it twice would be two chances for one seed to describe two
  # different sections. The walk order above is unchanged; only how often this call is reached is.
  # THE CALLEE CHANGED 2026-08-01 (`the-seed-addresses-the-line-it-is-about-to-make`), and the walk
  # order STILL did not. `sectionAt` answers for a line that EXISTS at an index; `seedFor`'s index
  # is an INSERTION index — where the new line WILL BE. At two boundaries those are different
  # sections, and `sectionAt` refuses one of them outright: `lineIndex === lines.length`, which is
  # exactly what `o` on a trailing blank line asks for, and every rendered view ends with one. A
  # real browser run showed the cost — the seed dropped the declaration and the printed rungs
  # carried on copying the neighbour, so it gave the right answer only where the neighbour agreed.
  # `sectionForInsertAt` is `sectionAt` asked about the line the new one lands AFTER.
  - id: newline-addresses-the-declared-section
    from: app/present/newline
    to:   app/present/address
    callee: sectionForInsertAt
    event: app.addresses-the-declared-section
    class: presentation-resolution
    gates_capabilities:
      - new-line-seed-reads-the-declaration
      - a-new-line-acquires-its-node-type-and-its-defaults
      - the-seed-addresses-the-line-it-is-about-to-make

  # WHERE THE ROW GOES. Asked once per line of the view, because the row for a line being made sits
  # AT an index and every line from there down keeps the index it already had — the source is not
  # renumbered, so the painter has to be told which position it is rather than work it out.
  - id: paint-asks-where-the-new-line-goes
    from: app/present/paint
    to:   app/present/draft
    callee: DraftSurface.isDraftAt
    event: app.reads-the-new-line-position
    class: presentation-painting
    gates_capabilities: [a-new-line-is-resolved-not-guessed]

  - id: paint-reads-the-line-being-made
    from: app/present/paint
    to:   app/present/draft
    callee: DraftSurface.draft
    event: app.reads-the-line-being-made
    class: presentation-painting
    gates_capabilities: [a-new-line-is-resolved-not-guessed]

  # THE LINE IS ABANDONED — Escape, Backspace on an empty row, or a settlement that carried
  # nothing. IT IS NOT A DELETION and there is deliberately no source edit for it: the line was
  # never in the file, so there is nothing to remove. That this edge reaches `draft` and NOT
  # `source` is the observable form of that claim.
  - id: paint-abandons-a-line-that-was-never-in-the-file
    from: app/present/paint
    to:   app/present/draft
    callee: DraftSurface.drop
    event: app.abandons-a-new-line
    class: presentation-painting
    gates_capabilities: [a-new-line-is-resolved-not-guessed]

  # ── THE GESTURE LAYER'S BOUNDARY/INDENT/WORD MODULES READ THE SAME GRAMMAR THE PAINTER DOES ──
  # Added 2026-07-31, observed by tests/flow_scenarios/vim_gestures.ts (see the backlog row
  # scenario-the-vim-gesture-layer). `motions.ts` itself still imports nothing — these three edges
  # are the modules the gesture layer DELEGATES to for "which line" / "may this line be indented" /
  # "where does the title start", each of which needs classifyLine's or titleSpans's answer rather
  # than deciding it locally. Previously "observed but not declared" INFO; declared here now that a
  # scenario deliberately drives them rather than merely reaching them by accident.

  - id: boundary-classifies-the-line
    from: app/present/boundary
    to:   app/present/express/rendition
    callee: classifyLine
    event: app.finds-a-structural-boundary
    class: presentation-resolution
    gates_capabilities: [vim-normal-mode-is-a-gesture-not-a-resolution]

  - id: indent-classifies-the-line
    from: app/present/indent
    to:   app/present/express/rendition
    callee: classifyLine
    event: app.decides-whether-a-line-may-be-indented
    class: presentation-resolution
    gates_capabilities: [vim-normal-mode-is-a-gesture-not-a-resolution]

  - id: word-finds-the-title-words
    from: app/present/word
    to:   app/present/express/rendition
    callee: titleSpans
    event: app.finds-the-title-words-for-a-word-jump
    class: presentation-resolution
    gates_capabilities: [vim-normal-mode-is-a-gesture-not-a-resolution]


  # ── SECTION MEMBERSHIP (2026-08-01) ──────────────────────────────────────────────────────
  #
  # `membership.ts` answers "after this edit, does this line still belong in the section it is
  # in?". Everything it needs about the LINE it gets from `resolution.ts`, and these three edges
  # are the whole of that dependency — there is no fourth, and the absence of one is the point:
  # no edge to `context.ts` (membership is not a rendition), none to `source.ts` (it produces no
  # edit), none to a clock or a fetch. Observed by tests/flow_scenarios/section_membership.ts,
  # which additionally spies on `PresentationCascade.resolve` and asserts a count of zero.
  #
  # `qualification.ts` declares NO flow of its own. It is a reader: it takes an already-parsed
  # document and returns a table, importing nothing under `app/`. Its one caller inside the app
  # would be the page, which node cannot import — the same invisibility `base.ts` and `vendor.ts`
  # record above.

  - id: membership-reads-the-lines-identity-stamp
    from: app/present/select/membership
    to:   app/present/express/rendition
    callee: qntmIdSpans
    event: app.checks-whether-the-line-is-already-a-node
    class: section-membership
    gates_capabilities: [section-membership-is-read-not-guessed]

  - id: membership-reads-the-lines-tags
    from: app/present/select/membership
    to:   app/present/express/rendition
    callee: tagSpans
    event: app.resolves-the-lines-fields-from-its-tokens
    class: section-membership
    gates_capabilities: [section-membership-is-read-not-guessed]

  - id: membership-checks-the-line-carries-content
    from: app/present/select/membership
    to:   app/present/express/rendition
    callee: carriesContent
    event: app.refuses-a-line-that-would-mint-an-untitled-node
    class: section-membership
    gates_capabilities: [section-membership-is-read-not-guessed]

  # ── L3 ADDRESSING (2026-08-01, design-the-resolution-architecture.md step 2) ────────────────
  #
  # `address.ts`'s `sectionAt` names the `(view, section)` a printed row sits in, BY THE CONFIG'S
  # OWN SECTION ID — the join `membershipFor` needs and could not get before this. Counting section
  # ordinals needs to know which lines are headings, and that is the whole of the dependency: one
  # edge, to `resolution.ts`, same as `membership.ts`'s own three. Observed by
  # tests/flow_scenarios/section_addressing.ts, which also proves the join closes THE TRAP —
  # `sectionAt` names an UNPUBLISHED section (`daily-work`'s "urgent", ordinal 1) correctly, and
  # `membershipFor`, given that correct name, still honestly abstains, because addressing and
  # evaluation are two different layers with two different reaches.
  - id: address-classifies-the-line
    from: app/present/address
    to:   app/present/express/rendition
    callee: classifyLine
    event: app.counts-a-lines-section-ordinal
    class: section-addressing
    gates_capabilities: [section-addressing-reads-the-full-declared-order]

  # ── STEP 4 — SAY THE MEMBERSHIP ANSWER (2026-08-01) — NO NEW EDGE DECLARED HERE, ON PURPOSE ──
  #
  # `app/index.html`'s `commitLine` now calls `sectionAt` then `membershipFor` on every committed
  # edit (`membershipNoteFor`) and shows the answer in the freshness line. That edge is REAL and
  # UNOBSERVABLE by this tool by construction — the caller is the page, which `.flow-trace.yaml`'s
  # capture filter names (`include: [app]`, a path prefix) but which node cannot import at all,
  # module-load hook or not. The same gap `base.ts` and `vendor.ts` already record above: a page
  # calling a bundled function is a call nothing here can see, regardless of which function it is.
  # Declaring an edge from `app/index.html` would be declaring something never observed, which is
  # its own kind of drift — so this stays a comment, and the proof lives in
  # tests/app-membership-note.test.mjs, which drives the page's own lifted script directly. See
  # capability `section-membership-is-said-in-the-freshness-line` (capabilities.yaml) for the rest.

  # ── STEP 7 — ORDERING PREVIEW (2026-08-01) ──────────────────────────────────────────────────
  #
  # `ordering.ts` answers "after this edit, will this line sort to a different position within its
  # section?". Its own reach into `resolution.ts` is the SAME shape `membership.ts`'s three edges
  # above already declare — one grammar module, asked for a different purpose (finding a section's
  # line range by counting headings, the same classification `address.ts`'s own edge already uses).
  # `resolutiontable.ts` is imported TYPE-ONLY (`OrderingKey`/`SectionOrdering`/`OrderingFieldMarker`
  # shapes, no runtime call), so no edge is declared for it — the same posture this file already
  # takes for a type-only import elsewhere.
  - id: ordering-classifies-the-line
    from: app/present/arrange/ordering
    to:   app/present/express/rendition
    callee: classifyLine
    event: app.finds-a-sections-line-range
    class: presentation-resolution
    gates_capabilities: [ordering-position-is-said-in-the-freshness-line]

  # `app/index.html`'s `commitLine` now calls `sectionAt` then `orderingFor` on every committed
  # edit (`orderingNoteFor`), the same "computed before the write leaves" shape `membershipNoteFor`
  # already established, and joins whichever of the two notes fired into one freshness-line
  # sentence. THAT EDGE IS REAL AND UNOBSERVABLE BY THIS TOOL, for the identical reason step 4's own
  # comment above states: the caller is the page, which node cannot import. No edge is declared
  # from `app/index.html` for the same reason none is declared for `membershipNoteFor`; the proof
  # lives in tests/app-ordering-note.test.mjs, which drives the page's own lifted script directly.
  # See capability `ordering-position-is-said-in-the-freshness-line` (capabilities.yaml) for the rest.

  # ── STEP 11 — CARRY SECTION IDENTITY IN THE ENVELOPE (2026-08-01) — NO NEW EDGE, ON PURPOSE ──
  #
  # `address.ts` gains `sectionOrderFor(view, declared)` — it imports NOTHING new (still only
  # `classifyLine` from `resolution.ts`, the edge `address-classifies-the-line` above already
  # declares), so there is no new module-to-module edge for this file to declare a callee of.
  # `app/index.html`'s `membershipNoteFor`/`orderingNoteFor` now call `sectionOrderFor` before
  # `sectionAt`, on every committed edit — THAT call is real and unobservable by this tool, the same
  # page-is-not-importable gap steps 4 and 7's own comments above record. The proof lives in
  # `tests/present-address.test.mjs` §5-7 (the pure function, over the operator's real 72 views) and
  # is exercised end to end nowhere yet, because `server/app.py` does not serve a `sections` field
  # for the page's own call to prefer — see capability `section-order-prefers-the-served-envelope`
  # (capabilities.yaml) for what is proven and what is not.

  # ── STEP 12 — THE PROJECTION-REPLAY CONVERGENCE TEST (2026-08-01) — NO NEW EDGE, ON PURPOSE ──
  #
  # `tests/fixtures/replay-harness.mjs` calls `applyEdit`, `BaseSurface`, `instanceAnchorFor`,
  # `membershipFor`, `orderingFor`, `resolveInstanceAnchor`, `sectionAt` and `sectionOrderFor` —
  # every one of them already an exported symbol from `app/present/index.ts`'s barrel, called the
  # same way every `tests/present-*.test.mjs` file already calls it. There is no new module-to-
  # module edge inside `app/` for this step to declare: the harness is a CALLER, and callers under
  # `tests/` are outside this file's whole domain by construction — `.flow-trace.yaml`'s capture
  # filter is `include: [app]`, so a test file is no more observable here than `app/index.html`
  # itself is (see that file's own note, repeated across steps 4, 7 and 11 above). `flow-trace
  # verify .` re-run after this step: unchanged PASS/FAIL/INFO counts, because nothing under `app/`
  # changed at all — see capability `projection-replay-convergence-is-measured` (capabilities.yaml)
  # for what the step proves and the one thing it deliberately does not (a runtime version of this
  # check, argued against in the test file's own header).

  # ── L3 ADDRESSING — THE ANCHOR WALK (2026-08-01, widen-instance-identity-past-the-first-stamp) ──
  #
  # `instance.ts` answers "which line is the cursor on now". Until this row it reached ONE module,
  # `resolution.ts`, and declared nothing here — because `tests/flow_scenarios/vim_gestures.ts`
  # recorded in as many words that `instance.ts` was "sibling-owned and still in flight, so it is
  # deliberately left unscenario'd here … a real gap today, not an oversight". That sibling landed,
  # and `tests/flow_scenarios/instance_anchor.ts` closes the gap for both modules at once.
  #
  # `relative.ts` is the second construct the design refused to fold into instance identity
  # (design-presentation-instance-identity.md §3.2): a line the operator is AUTHORING has no node
  # to search with and its characters change the instant the cycle stamps it, so both of the walk's
  # first two rungs are structurally unavailable at once. It IMPORTS NOTHING — the same structural
  # property `held.ts` has, for a related reason: a module that turns a projection into a POSITION
  # must not be able to reach one that turns a position into a write. The dependency therefore runs
  # ONE WAY ONLY, and these two edges are the whole of it.
  #
  # UNCHANGED BY `the-relative-anchor-has-no-landmark-in-an-empty-section` (2026-08-01), and that is
  # worth recording rather than leaving to inference. That row gave a section with nothing stamped
  # in it a landmark — its own heading's ordinal — and it did so INSIDE `relative.ts`, through the
  # same two edges below. No module was added, no import was added, `relative.ts` still imports
  # nothing, and the walk is still owned by `ANCHOR_TRUST` in `instance.ts` alone.
  # `tests/flow_scenarios/instance_anchor.ts` gained a fifth claim that drives the new case over
  # these same edges.

  - id: instance-asks-where-the-line-sat
    from: app/present/instance
    to:   app/present/relative
    callee: relativeAnchorFor
    event: app.takes-a-relative-anchor-for-a-line-with-no-identity
    class: section-addressing
    gates_capabilities: [a-line-being-authored-keeps-its-cursor-through-the-first-stamp]

  - id: instance-resolves-where-the-line-sat
    from: app/present/instance
    to:   app/present/relative
    callee: resolveRelativeAnchor
    event: app.walks-the-two-weakest-anchor-rungs
    class: section-addressing
    gates_capabilities: [a-line-being-authored-keeps-its-cursor-through-the-first-stamp]

  # THE OTHER HALF OF `instance.ts`'S REACH, declared now that a scenario drives it deliberately
  # rather than reaching it by accident — the same reason the three gesture-layer edges above were
  # promoted from INFO to declared on 2026-07-31.
  - id: instance-classifies-the-line
    from: app/present/instance
    to:   app/present/express/rendition
    callee: classifyLine
    event: app.counts-the-section-a-printed-row-sits-in
    class: section-addressing
    gates_capabilities: [a-line-being-authored-keeps-its-cursor-through-the-first-stamp]

  - id: instance-reads-the-stamp
    from: app/present/instance
    to:   app/present/express/rendition
    callee: qntmIdSpans
    event: app.reads-a-printed-rows-node-id
    class: section-addressing
    gates_capabilities: [a-line-being-authored-keeps-its-cursor-through-the-first-stamp]

  # ── THE ROW BEING MADE (2026-08-01, a-line-being-made-survives-a-projection-too) ──
  #
  # `draft.ts` imported NOTHING until this row, and the reason it does now is worth stating rather
  # than inferring. A draft is a line that is in NEITHER source string — not the one it was opened
  # against (nothing is written until it settles) and not the one that arrives (the cycle never saw
  # it) — so `relativeAnchorFor` returns `null` for it and cannot do otherwise. What it has instead
  # is the NEIGHBOUR it was opened beside, which is a real line with a real identity. These four
  # edges are that borrowing, and they are the whole of it: the row asks `instance.ts` where its
  # neighbour went and asks `relative.ts` one predicate, and decides nothing about specificity for
  # itself. Observed by tests/flow_scenarios/draft_placement.ts.

  - id: draft-takes-its-neighbours-anchor
    from: app/present/draft
    to:   app/present/instance
    callee: instanceAnchorFor
    event: app.takes-the-place-of-a-row-that-is-in-no-file
    class: section-addressing
    gates_capabilities: [a-line-being-made-survives-a-projection-too]

  - id: draft-resolves-its-neighbours-anchor
    from: app/present/draft
    to:   app/present/instance
    callee: resolveInstanceAnchor
    event: app.finds-where-a-row-being-made-goes-in-the-arriving-projection
    class: section-addressing
    gates_capabilities: [a-line-being-made-survives-a-projection-too]

  # THE RELEASE RULE, REACHED RATHER THAN REWRITTEN. `held.ts` owns the rule ("the file has taken
  # the characters back") and imports nothing by construction, so its copy of the predicate cannot
  # be shared. `relative.ts` already carries the second copy WITH the note that a third caller must
  # reach for it rather than write it a third time. This is that third caller, obeying that note.
  - id: draft-asks-whether-the-file-took-the-characters-back
    from: app/present/draft
    to:   app/present/relative
    callee: extendsLine
    event: app.releases-a-row-the-arriving-projection-already-carries
    class: section-addressing
    gates_capabilities: [a-line-being-made-survives-a-projection-too]

  # THE PLACE IS TAKEN IN ONE PLACE, at the moment the row opens, because the index and the string
  # it is an index INTO only mean anything together — see `openLine`'s own header.
  - id: newline-takes-the-rows-place-when-it-opens-it
    from: app/present/newline
    to:   app/present/draft
    callee: placeFor
    event: app.records-where-a-new-row-sits-before-anything-can-move-it
    class: section-addressing
    gates_capabilities: [a-line-being-made-survives-a-projection-too]

  # ── THE RULES AXIS, THROUGH THE RESOLVER REGISTRY (2026-08-07) ─────────────────────────────
  #
  # `app/present/resolvers/registry.ts`'s `RESOLVERS` array, walked by `runResolvers` on every
  # real commit (`app/index.html`'s `commitLine`), had FOUR resolvers and ZERO flow declarations
  # for any of them before this row — checked by `rg` over this whole file and every
  # `tests/flow_scenarios/*.ts`, not assumed. `tests/flow_scenarios/capture_rules.ts` closes the
  # gap for the RULES axis only: `resolve.runResolvers` reaching `resolvers/rules.read`, and that
  # function's own reach into `address.ts`, `select/membership.ts`, `today.ts` and `rules.ts` for
  # the two-rule, one-pass chain `design-the-rule-mirror.md` §3.3 named
  # (`routine-without-cadence-becomes-task` retyping the candidate, `stamp-created-at-on-task`
  # then matching the NOW-task candidate in the SAME pass). Membership, ordering and promotion —
  # the other three axes the same registry walks — remain UNDECLARED here; each would need its
  # own scenario, and none is added by this row. That gap is real and is not this row's to close.
  #
  # THE LOAD-BEARING EDGE IS `rules.applyRules -> select/membership.matchesQualifier`: the closed
  # grammar's OWN matcher is the SAME function `membership.ts`'s section-membership axis already
  # uses, not a second, private interpreter — the structural form of "generate-once, no second
  # copy of the language" `design-the-rule-mirror.md`'s own refutations section states for this
  # exact axis ("Upheld, and this document does not challenge it").

  - id: registry-runs-the-rules-resolver
    from: app/present/resolve
    to:   app/present/resolvers/rules
    callee: read
    event: app.evaluates-the-published-rules-for-a-fresh-capture
    class: capture-rule-application
    gates_capabilities: [the-published-rule-order-is-applied-at-commit]

  - id: rules-resolver-addresses-the-committed-line
    from: app/present/resolvers/rules
    to:   app/present/address
    callee: sectionAt
    event: app.finds-the-section-the-new-line-was-typed-under
    class: capture-rule-application
    gates_capabilities: [the-published-rule-order-is-applied-at-commit]

  - id: rules-resolver-resolves-the-lines-fields
    from: app/present/resolvers/rules
    to:   app/present/select/membership
    callee: resolveLineFields
    event: app.resolves-the-candidates-own-fields-before-the-rule-pass
    class: capture-rule-application
    gates_capabilities: [the-published-rule-order-is-applied-at-commit]

  - id: rules-resolver-reads-the-day-boundary
    from: app/present/resolvers/rules
    to:   app/present/today
    callee: todayFor
    event: app.resolves-cycle-today-the-way-the-engine-would
    class: capture-rule-application
    gates_capabilities: [the-published-rule-order-is-applied-at-commit]

  - id: rules-resolver-runs-the-published-pass
    from: app/present/resolvers/rules
    to:   app/present/rules
    callee: applyRules
    event: app.applies-the-closed-rule-grammar-to-the-resolved-fields
    class: capture-rule-application
    gates_capabilities: [the-published-rule-order-is-applied-at-commit]

  - id: applyrules-reuses-the-membership-matcher
    from: app/present/rules
    to:   app/present/select/membership
    callee: matchesQualifier
    event: app.matches-a-rules-for-each-pattern-with-no-second-interpreter
    class: capture-rule-application
    gates_capabilities: [the-published-rule-order-is-applied-at-commit]

  - id: rules-resolver-renders-the-fired-effects
    from: app/present/resolvers/rules
    to:   app/present/rules
    callee: renderRuleEffects
    event: app.spells-the-fired-rules-effects-onto-the-line-or-refuses
    class: capture-rule-application
    gates_capabilities: [the-published-rule-order-is-applied-at-commit]

  # ── THE CONNECTING ACT ITSELF (2026-08-07) — commitLine relocated to app/present/commit.ts,
  # where these three calls (already real before the move — see resolve.ts's own header) become
  # module-to-module edges a caller-chain probe can see. See classes.yaml's new
  # `commit-line-routing` row for what this closes and `capture-rule-application`'s own addendum
  # for why NONE of the four resolvers gets an edge here instead: they are reached FROM
  # `runResolvers`, not the other way round, and none of them ever calls back into `commit.ts`.

  - id: commit-line-walks-the-registry
    from: app/present/commit
    to:   app/present/resolve
    callee: runResolvers
    event: app.walks-every-resolver-for-a-committed-line
    class: commit-line-routing

  - id: commit-line-arms-settle
    from: app/present/commit
    to:   app/present/resolve
    callee: armSettle
    event: app.arms-the-settle-surface-with-whatever-a-resolver-placed
    class: commit-line-routing

  - id: commit-line-arms-predict
    from: app/present/commit
    to:   app/present/resolve
    callee: armPredict
    event: app.arms-the-predict-surface-with-whatever-a-resolver-claimed
    class: commit-line-routing

forbidden_flows:

  # The renderer is PURE and the session holds nothing but mode and text — neither may reach the
  # DOM. This is the structural form of "main.ts is the only module that touches the page": stated
  # as a rule the tool enforces, rather than a convention a later change could quietly break.
  - id: renderer-never-touches-the-dom
    from: app/render/renderer
    to:   app/main
    reason: >
      The renderer is a pure transform. If it ever calls back into the DOM-owning module the
      purity claim is dead, live re-rendering on every keystroke stops being safe, and the
      renderer can no longer be exercised without a browser.

  - id: session-never-touches-the-dom
    from: app/editor/session
    to:   app/main
    reason: >
      The session is state, not presentation. A call back into main.ts would make the mode
      machine depend on the page it drives, which is the coupling that makes editors untestable.

  # ── THE PRESENTATION CASCADE'S PURITY, AND THE ONE SHAPE THE DESIGN FORBIDS ───────────────
  # Added 2026-07-30 with migration stage 1. Same reasoning as the two above, one concern over:
  # the resolver and the write-back are pure, and the painter is the only module here that
  # touches the document. Stated as rules the tool enforces rather than conventions a later
  # change could quietly break.

  - id: cascade-never-touches-the-dom
    from: app/present/express/cascade
    to:   app/present/paint
    reason: >
      The cascade is a pure decision. If it ever calls into the painter it can see the page it is
      deciding about, and "which level won" stops being answerable without running the app —
      which is the exact property the presentation cascade exists to create. It would also make
      the resolver unrunnable under node, taking every test in tests/present-cascade.test.mjs
      with it.

  # Added 2026-07-30 with migration stage 3, for the same reason as the two above and with one
  # more of its own: the focus surface is the module most likely to be "helped" into touching the
  # page, because what it describes IS a thing on the page. It must not.
  - id: focus-never-touches-the-dom
    from: app/present/focus
    to:   app/present/paint
    reason: >
      The focus surface holds ONE NUMBER — which line the cursor is on — and turns it into a
      level. It is pure so that a test can resolve "as if the cursor were here" without a
      browser, which is what let the cursor rule be specified before the surface it reacts to
      existed. A call from here into the painter would make the level depend on the page it is
      deciding about, and the FOCUS contribution would stop being derivable without running the
      app — which is exactly the condition the presentation cascade was built to end.

  # Added 2026-08-01 with `widen-instance-identity-past-the-first-stamp`. The relative anchor is
  # the module in this bundle that comes CLOSEST to being a write, and the distance is one field.
  - id: relative-never-reaches-the-edit-path
    from: app/present/relative
    to:   app/present/source
    reason: >
      `relative.ts` turns a projection into a LINE INDEX — which is exactly what `applyEdit` takes.
      It is the same hazard `held.ts` answers by carrying no index at all, arriving at the opposite
      end: this module's whole output IS an index, so the separation has to be that it can never
      reach the thing an index would be handed to. The module imports nothing, which makes the rule
      structural rather than a promise (tests/flow_scenarios/instance_anchor.ts, claim 1, reads its
      own source and fails on any import line). A call from here into `source.ts` would let a module
      whose job is to say WHERE a line went also decide what is written to it, and "the app never
      reconstructs markdown" would stop being a property of the write path and start being a rule
      each caller had to remember.

  # Added 2026-08-01 with `a-line-being-made-survives-a-projection-too`. `draft.ts` is now the
  # SECOND module in this bundle whose output is a line index, and it is closer to a write than
  # `relative.ts` is: the index it produces is the one `applyEdit`'s `insert-line` takes, and the
  # row it describes is one the operator is actively typing into.
  - id: draft-never-reaches-the-edit-path
    from: app/present/draft
    to:   app/present/source
    reason: >
      `draft.ts` says WHERE a row being made sits. `source.ts` says what is written. The whole
      arrangement that makes an uncommitted row safe is that the source string is byte-for-byte the
      one the server sent for as long as the row exists, and exactly one `insert-line` is computed
      from it — by `paint.ts`, at settlement, from the characters in the element. A call from here
      into `source.ts` would let the module that decides where a row goes also decide what is
      written there, which is one module holding both halves of the only write this affordance has.

  - id: draft-never-touches-the-dom
    from: app/present/draft
    to:   app/present/paint
    reason: >
      The dependency runs one way: `paint.ts` reads this surface and this surface knows nothing
      about a page. It holds the characters a row is carrying so a repaint can put them back, and
      the moment it could ask the painter what is on screen those characters would stop being
      derivable without running the app — which is the condition `held.ts` and `focus.ts` already
      refuse for the same reason, and the one the presentation cascade was built to end.

  - id: queue-never-reaches-the-edit-path
    from: app/present/queue
    to:   app/present/source
    reason: >
      `queue.ts` holds PROJECTIONS — envelopes that came off the wire — and decides which of two is
      the current one for a file. `source.ts` decides what is written. The property that makes the
      queue safe is that everything in it came from the server, so that installing one hands
      `BaseSurface` a base the server really sent; a call from here into the edit constructor would
      let the module holding the server's answer also compute a change to it, and the string that
      came back out would be indistinguishable from an arrival. That is `base.ts`'s named trap —
      "never with a string this app computed" — reached from the one direction that could certify
      itself. The module imports nothing at all, which makes the rule structural rather than a
      promise a caller has to keep.

  - id: queue-never-paints
    from: app/present/queue
    to:   app/present/paint
    reason: >
      HOLDING A PROJECTION AND INSTALLING ONE ARE TWO DECISIONS AND ONLY ONE OF THEM IS THIS
      MODULE'S. It answers "which projection is the current one for this file", which is pure
      arithmetic over `generated_at`; whether that projection may go on the screen depends on
      whether a line is open, which is a fact about an `<input>` element and belongs to the page.
      A call from here into the painter would fold the two together, and the ordering — the half a
      test can drive without a browser — would stop being answerable without running the app.

  - id: relative-never-touches-the-dom
    from: app/present/relative
    to:   app/present/paint
    reason: >
      The relative anchor answers "where did the line the operator was writing go", from two
      strings and nothing else. A call into the painter would make the answer depend on what is
      currently drawn — so a cursor could only be recovered by running the app, which is the exact
      condition the pure presentation bundle exists to end. It is also what keeps every refusal in
      this module testable: `gap-changed`, `bracket-crossed` and the rest are facts about two
      strings, and a fact about two strings can be put in a fixture.

  # Added 2026-07-31 with the third source edit. Two more pure modules, two more of the same rule,
  # and the second of them is the one most exposed to being "helped" into breaking it.

  - id: newline-never-touches-the-dom
    from: app/present/newline
    to:   app/present/paint
    reason: >
      `seedFor` decides what a NEW line is, and it decides it from the SOURCE STRING — from the
      lines the engine has already printed into this view, which are the cascade's answer already
      computed by the thing that owns the cascade. Reaching into the painter would mean deciding it
      from the rendered page instead, which is DOM inversion arriving at the one affordance where
      it would be hardest to see: a new line has no characters, so there is nothing for a
      byte-comparison to catch. It would also make the four rungs unresolvable without a browser,
      taking the whole of tests/present-newline.test.mjs section 3 with them.

  - id: draft-never-touches-the-dom
    from: app/present/draft
    to:   app/present/paint
    reason: >
      THE DRAFT SURFACE IS THE MODULE MOST LIKELY TO BE HELPED INTO TOUCHING THE PAGE, because what
      it describes IS a row on the page — an `<input>` a person is typing into. It must not. It
      holds an index and the characters that row opened with, and the whole safety of the affordance
      rests on that being ALL it holds: the source string is not touched while a line is being made,
      so the edit is computed once, at settlement, from the string the server sent plus the
      characters typed. A surface that could read its own row could compute an edit from the page,
      and the app posts the WHOLE FILE — so a lossy inversion would not corrupt one line, it would
      rewrite a view.

  - id: source-never-touches-the-dom
    from: app/present/source
    to:   app/present/paint
    reason: >
      THIS IS THE STRUCTURAL FORM OF THE GOVERNING CONSTRAINT. The markdown is the truth and the
      DOM is a projection of it; edits travel projection to source to engine to new projection,
      never backwards. A call from the write-back module into the painter is what DOM inversion
      looks like on its first day — the module that owns source edits reaching for the rendered
      document to compute one.

      The consequence is not a cosmetic bug. The app posts the WHOLE FILE for one view and the
      server overwrites it, so a lossy inversion does not corrupt one title, it rewrites a view.
      The engine has already paid this bill one repo away in the milder form: delete one row from
      its accept vocabulary and the renderer keeps emitting the glyph, the unmatched glyph is
      absorbed into the node's title and the tick is silently dropped, exit 0, no diagnostic.

      Paired with a runtime falsifier rather than left as a static rule: the `is immune to a
      corrupted DOM` test corrupts every rendered element and then uses the affordance, asserting
      the posted markdown is unaffected. Mutation-proven 2026-07-30.

  # Added 2026-07-31 with the write's base (`a-write-refuses-a-stale-base`). Same rule again, and
  # this module has its own reason for needing it.

  - id: base-never-touches-the-dom
    from: app/present/base
    to:   app/present/paint
    reason: >
      THE BASE IS WHAT THE SERVER LAST SENT FOR A FILE, and the one thing that could destroy it as
      a precondition is deriving it from the page instead of from the string the server sent. The
      app posts the WHOLE FILE and the server overwrites what it is sent, so a base read off the
      rendered document would be a precondition that describes the projection rather than the
      source — it would match whatever is on screen, refuse nothing, and be indistinguishable from
      the silence this module exists to end.

      It is also the module most likely to be "helped" into reaching for a clock rather than the
      DOM, which the tool cannot see and tests/present-base.test.mjs therefore proves directly by
      making `Date.now` throw for the whole of a drive. A base with an age invites a rule about how
      old is too old; the surface holds the STRING, so the answer is exact and no timer is needed.

  # Added 2026-08-01 with the held edit (`a-vanished-or-refused-edit-is-held-unanchored`). The same
  # rule a fourth time, and this module has the sharpest reason of the four for needing it.

  - id: held-never-touches-the-dom
    from: app/present/held
    to:   app/present/paint
    reason: >
      A HELD ROW IS THE ONE THING ON THIS PAGE THAT LOOKS MOST LIKE A LINE AND IS MOST DANGEROUS TO
      TREAT AS ONE. It holds characters no file owns — a region of the screen the source string does
      not own, the same shape `DraftSurface` already has and for the mirrored reason. `draft.ts`'s
      own entry above says that surface is "the module most likely to be helped into touching the
      page, because what it describes IS a row on the page". This one is worse: what it describes is
      a row that USED to be in a file, so a future change reaching into the painter to "put it back
      where it was" would be doing exactly the thing design-the-edit-is-a-safe-haven.md §6.4 refuses
      — re-inserting into a view the cycle deliberately removed the line from, which the next cycle
      removes again, or which mints a fresh node if the old one is gone.

      THE MODULE IS BUILT SO IT CANNOT. It imports nothing, and its record carries NO LINE INDEX —
      an index is what `applyEdit` takes, so a record with one is a record a later change could
      post. A call into the painter would be the first step in getting one back, by reading the
      rendered document for the position a row used to hold. The app posts the WHOLE FILE, so that
      would not corrupt one line; it would rewrite a view.

      Paired with a runtime falsifier rather than left as a static rule: tests/app-held-edit.test.mjs
      holds a row, drives a tick and a line commit through the real gestures, and asserts neither
      POST body contains any of the held characters — plus the structural claim that `#heldStrip` is
      a SIBLING of `#viewBody`, so the painter is handed a body it cannot walk out of.

  # Added 2026-08-01 with write correlation (`the-browser-recognises-its-own-write`). The same
  # rule a fifth time, on the module that holds the operator's own write handles.

  - id: correlation-never-touches-the-dom
    from: app/present/correlation
    to:   app/present/paint
    reason: >
      THIS MODULE HOLDS THE HANDLES TO THE OPERATOR'S OUTSTANDING WRITES, and the one thing it
      decides — "did MY write land" — is the thing a held row is released on. So a call into the
      painter would be this module reading the rendered document to answer a question about the
      wire, which is the inversion `held.ts` and `base.ts` already refuse for their own facts and
      the one the presentation cascade was built to end. The register is arithmetic over strings
      and must stay so: a token is either in the echo under its own path or it is not, and there is
      no state of the screen that can make that more or less true.

      IT IS ALSO THE MODULE MOST LIKELY TO BE "HELPED" INTO REACHING FOR A CLOCK, which the tool
      cannot see — a write that has been outstanding "too long" is the obvious way to expire one,
      and it is the wrong way: it would make the give-up rule depend on a machine's idea of time
      rather than on what the server actually said. The rule is instead "three arrivals that named
      this file without naming this token", which is exact, deterministic and drivable without a
      browser. tests/app-write-correlation.test.mjs §1 proves the absence directly, by making
      `document`, `fetch` and `Date.now` all throw for the whole of a drive.

  - id: correlation-never-reaches-the-edit-path
    from: app/present/correlation
    to:   app/present/source
    reason: >
      `correlation.ts` holds TOKENS — opaque handles to writes that have already left — and
      `source.ts` decides what is written. A call from here into the edit constructor would let the
      module that knows which writes are outstanding also compute a new one, which is how "the
      browser recognising its own write" would become "the browser reissuing it". Nothing in this
      bundle can turn a write token into a position in a file, and that is the property that keeps
      the release safe: a token can be recognised and reported and nothing else. The module imports
      nothing at all, which makes the rule structural rather than a promise a caller has to keep.

  - id: pickup-never-reaches-the-edit-path
    from: app/present/pickup
    to:   app/present/source
    reason: >
      `pickup.ts` decides WHEN to go and collect the answer to a write and how many times to try;
      `source.ts` decides what is written. A call from here into the edit constructor would let the
      module that knows a write is outstanding also compute a second one, which is how "collect the
      answer" would become "send it again" — and a retry that reissues a WHOLE-FILE write is the
      clobber every surface around it exists to stop. Nothing in this module can turn a path and a
      delay into a change to a file, and it imports nothing at all, which makes the rule structural
      rather than a promise a caller has to keep.

  - id: pickup-never-fetches
    from: app/present/pickup
    to:   app/present/base
    reason: >
      THE POLICY AND THE REQUEST ARE TWO THINGS AND ONLY ONE OF THEM IS THIS MODULE'S. It answers
      "is a read owed for this path, and how long should the caller wait" — arithmetic over a list
      of delays — and holds no timer, makes no request, and reads no envelope. `base.ts` is named
      here as the nearest thing in this bundle to the wire's own facts; the rule it stands for is
      wider and is asserted directly in tests/app-async-ack.test.mjs §1, which drives the whole
      schedule with `document`, `fetch` and every clock absent. IT IS THE MODULE MOST LIKELY TO BE
      "HELPED" INTO HOLDING ITS OWN `setTimeout`, and that would be the end of it being drivable:
      the first wait is ten seconds, and a suite that could only wait ten seconds could prove
      neither that a read fires nor — the property that matters — that the series STOPS.

  - id: accepted-never-reaches-the-edit-path
    from: app/present/accepted
    to:   app/present/source
    reason: >
      `accepted.ts` holds ONE FILE'S markdown, as the server said it stands after taking a write.
      `source.ts` computes changes to a file. A call from here into the edit constructor would let
      the module holding "what the server has" also compute what to send it, and the string that
      came back out would be indistinguishable from the server's own word — which is the whole basis
      on which this surface is allowed to refresh the base at all. The module imports nothing, so
      the rule is structural.

  - id: accepted-never-paints
    from: app/present/accepted
    to:   app/present/paint
    reason: >
      WHAT THE PAINTER WALKS AND WHETHER IT MAY WALK IT ARE TWO DECISIONS. This surface answers the
      first — one string, for one path — and the second depends on whether a line is open, which is
      a fact about an `<input>` element and belongs to the page (`accept` in app/index.html). A call
      from here into the painter would fold them together and let an accepted write repaint a line
      the operator is typing into, which is the exact defect `a-projection-arriving-mid-edit-is-held`
      was built to end, reached from the one direction the queue does not guard.

