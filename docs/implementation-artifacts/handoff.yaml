  - thread: the-package-rung-populated-2026-08-11
    principle: >
      A class with no package is an empty position on the diamond, and an empty position is a
      finding rather than a status. `ClassDef.packages` had existed in flow-trace's schema since
      2026-07-09 and was populated in none of the six registry members; `flow-trace packages .`
      read `package_count: 0, class_package_ungoverned: 12` here.
    existing_architecture_survey: >
      RUN, all three altitudes, before anything was authored.

      CAPABILITY (rung 1) — surveyed all 61, nothing fits, so a 62nd was minted with the reasoning
      the rung requires rather than a name-match. The two near misses were checked by intent, not
      by title. `capabilities-have-runtime-enforcers` is about the SITE'S CLAIMS carrying a
      deterministic enforcer; its subject is the live page and the repo artifacts, not the
      declaration graph. `app-is-a-typed-browser-application` is about the TOOLCHAIN — package.json,
      a strict tsconfig, a CI build. Neither takes docs/architecture/*.yaml as its subject, and
      widening either to cover "the declared rungs are complete" would have made a true story into
      a vague one. Minted: `every-declared-class-names-its-package-home`.

      PACKAGE (rung 2) — `package_count: 0`, the honest common answer. Nothing to fold into; this
      session IS the population of that rung.

      CLASS (rung 3) — all twelve read; none covers declaration integrity, and none could. Every
      one of them names a runtime concern with a call path. The new capability's subject is two
      yaml files, which is why its `rooting:` is a reasoned `isolated` rather than a deferred one.
    detail: >
      TWO PACKAGES, DERIVED FROM WHAT THE BUILD ACTUALLY EMITS RATHER THAN FROM THE DIRECTORY TREE.
      scripts/build.mjs states the boundaries in its own header — "THREE committed bundles, across
      two pages" — so a package here is a build bundle: an entry module, what esbuild pulls in
      behind it, and the surface its one consumer imports. `presentation` = app/present/index ->
      dist/present.js (9 classes). `demo-page` = app/main -> demo/app.js (3 classes).

      WHAT THE RUNG SAYS THAT THE CLASS RUNG CANNOT, which is the whole case for populating it.
      The twelve classes read as one flat list of concerns in one program. They are two programs:
      app/main.ts imports render/renderer and editor/session and NOTHING under app/present/, and
      app/present/index.ts re-exports out of app/shell/ and reaches neither. The demo page and the
      app page share this repo, this toolchain and this build script and share no code at all. A
      class names one home; only the rung above it can name which application that home belongs to.
