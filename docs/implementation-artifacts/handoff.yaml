  - thread: the-python-dependency-here-is-dead-weight
    note: >
      Surfaced, deliberately NOT acted on — it is a separate change and this session's remit was
      the invoke and the clean tree. pyproject.toml declares "markdown-it-py>=3.0" and ZERO .py
      files in this repo import markdown_it. It is residue from the Python render app that retired
      into TypeScript on 2026-07-23 (see the-app-becomes-typescript-2026-07-23); the browser now
