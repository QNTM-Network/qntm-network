  qualitative:
  - thread: the-presentation-cascade-declared-2026-07-30
    note: >
      THE QUEUE READ ZERO THIS MORNING AND IT NOW READS TWELVE, and nothing was built. That is the
      whole shape of this session: the work was not missing, the ROWS were. `queue_length: 0` was
      an artefact of a backlog that stopped being written after 2026-07-23, not a statement that
      the product was finished.
      WHAT LANDED — declaration and documentation only, no application source touched. Five
      capabilities for the presentation cascade (the OUTPUT half of the resolution cascade whose
      INPUT half shipped in the engine as `qntm_md.resolution`), the spec at
      docs/implementation-artifacts/design-presentation-cascade.md, nine sized backlog rows,
      two `asserted:` rows, and corrections to four false declarations.
      THE SHAPE OF THE DESIGN in one line: presentation is RESOLVED, not chosen — seven levels
      ordered by WHEN EACH FACT BECOMES KNOWN (GLOBAL, USER, VIEW, STRUCTURAL_NODE, LINE, MODE,
      FOCUS), most specific wins, one tuple owning the order. Raw and app-like are two values of
      one type, not two products. The operator's first rule — cursor on the line shows `- [ ]`,
      cursor off shows a checkbox — is stage 3, and it is half a day rather than an hour because
      app.html has NO text-editing surface for a cursor to land on.
      THE HONESTY THAT MATTERS MOST, because it is the trap this repo keeps springing: ALL FIVE
      CAPABILITIES ARE `undeclared` WITH NO ENFORCER, and NO state invariant was declared for any
      of them. A predicate that does not exist is a declaration that loads clean and reaches
      nothing. Each migration stage names the falsifier its own predicate must assert, and the
      predicate lands with the stage. Four of the five declarations describe plans; ONE
      (`every-affordance-writes-back-through-the-source`) describes something already TRUE and
      unenforced, and that is the one worth an enforcer first.
      THE FINDING THAT MADE THE DESIGN CHEAP: the model is already in the browser and the browser
      ignores it. The snapshot envelope carries `graph` ({version, nodes, edges}) and `locations`;
      `grep -c` over app.html for nodes / edges / locations returns 0, 0, 0. The app re-parses
      markdown text it was handed alongside the model that produced it.
      ONE DERIVED LINE IS NOW UNRUNNABLE, left alone deliberately: with a non-actionable head the
      deriver splices `next_command: … map . --full`, and `map . --full` exits 2 here for the same
      reason `verify` does (observed this session, ERR_MODULE_NOT_FOUND on typescript). It is
      DERIVED and pinned do-not-hand-edit, so it stays; it is a second instance of the
      what-does-and-does-not-catch-a-broken-invoke thread below — the shape is validated, the
      running never is.
