      THE ORIGINAL THREAD, FROM 2026-07-30, FOLLOWS. NOT caused by this change, and NOT fixed by
      it — recorded because the crash is silent about
      its own cause and the next agent will otherwise burn a session on it. `flow-trace verify .`
