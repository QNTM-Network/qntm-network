  - thread: the-invoke-runs-and-leaves-no-trace-2026-07-30
    note: >
      What it takes to run flow-trace in THIS repo, established by running it rather than by
      reading the previous line and trusting it. The invoke is now
      "uv run --no-project --python 3.12 --with-editable ~/projects/qntm-network/qntm/tools/flow-trace flow-trace"
      and both new flags were earned. WITHOUT --python 3.12 uv honours THIS repo's
      requires-python floor (>=3.11), selects 3.11.13, and flow-trace (>=3.12) fails to resolve —
      exit 1, no verdict. WITHOUT --no-project uv treats cwd as a Python project on every
      invocation and BUILDS it, writing .venv/, qntm_network.egg-info/ and uv.lock into the tree;
      the first two were invisible only by accident (uv writes a .venv/.gitignore containing "*",
      and *.egg-info/ was already ignored), so uv.lock was the one artefact that surfaced, and
      every agent who ran the tool left it behind. RAISING THIS REPO'S FLOOR to >=3.12 was
      considered and REJECTED — it would make this project's declared Python floor a function of
      an external tool's floor, and it would not have fixed the byproducts at all. --no-project
      fixes both at once and is safe here because the only Python flow-trace loads is
      tests/flow_scenarios/static_evidence.py + qntm_network_checks.py, which import flow_trace,
      yaml and stdlib — nothing from qntm_network. Proven, not assumed:
      `verify . --scenario static_evidence` under --no-project returns 13 PASS / 0 FAIL, exit 0.
  - thread: what-does-and-does-not-catch-a-broken-invoke
    note: >
      Established by MUTATION, because "a declaration that exists and does not reach" is the bug
      class this whole layer exists to prevent, and it deserved a test rather than an assurance.
      TWO different breakages, two different outcomes. (1) A NON-CONFORMING invoke — one with a
      verb appended, "... flow-trace map ." — IS caught: `queue` emits a loud FAIL naming the
      principle invoke-is-a-bare-prefix-not-a-verb-template, and `queue --check` exits 1. (2) A
      CONFORMING but entirely BROKEN invoke — "... --with-editable /nonexistent/flow-trace
      flow-trace" — is caught by NOTHING. `queue` exits 0 with findings [] and drift 0;
      `queue --check` exits 0. flow-trace validates the invoke's SHAPE and never that it RUNS,
      and this repo has no flow-trace CI to catch it either (build.yml and worker.yml are
      node-only). So the invoke line is checked for grammar, not for truth. That is worth knowing
      before trusting any future edit to it. The positive half was proven too: changing `invoke`
      and running `queue brand` re-derived brand's next_command with the new prefix in the same
      pass, so the value genuinely reaches the deriver.
