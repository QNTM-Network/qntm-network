# a landing site PLUS a TypeScript browser application (capabilities.yaml, "the application
# stratum"), and it HAS the observed half over that TypeScript — traced flows, depth-to-sink,
# canonical routing, declared-vs-actual drift. The morning's version of this note said the
# opposite (flow-trace captured Python only, so the app was governed by static-evidence alone);
# the tool closed that gap the same day and this project adopted it the same afternoon. Both
# halves are live now: state.yaml predicates check the right things EXIST, flows.yaml checks the
# calls GO where we said. Neither implies the other — read each for what it asserts.
handoff:
  project_target: qntm-network            # GATE-TARGET field
  date: 2026-08-11
  commit: 255beee                       # self-ref SHA (package rung declared, 2026-08-11)

  bootstrap:                              # the runnable onboarding block
    # flow-trace is not on PATH; it is run out of the monorepo checkout through uv. Two flags in
    # this line are LOAD-BEARING and were each verified by running the thing (2026-07-30):
    #
    #   --no-project  flow-trace does not need THIS project's Python environment. The only Python
    #                 it loads here is tests/flow_scenarios/static_evidence.py + qntm_network_checks.py,
    #                 which import flow_trace, yaml and stdlib — nothing from qntm_network, and not
    #                 markdown-it-py (that dependency is residue from the retired Python render app;
    #                 zero .py files in this repo import it). Without the flag uv treats cwd as a
    #                 project on every invocation and BUILDS it: it writes .venv/, qntm_network.egg-info/
    #                 and uv.lock into the worktree purely as a side effect, so running a read-only
    #                 tool leaves an untracked file behind for the next agent to puzzle over.
    #                 If a future Python scenario here ever needs a project dependency, it will fail
    #                 loudly on import — add `--with <dep>` rather than dropping this flag.
    #   --python 3.12 flow-trace declares requires-python >=3.12; this repo declares >=3.11, and in
    #                 project mode uv honours THIS repo's floor, picks 3.11 and the resolution fails
    #                 outright (exit 1, no verdict). Pinned to flow-trace's floor rather than a
    #                 floating '>=3.12' so the interpreter is deterministic — a floating request
    #                 resolves onto whatever is newest on the machine (3.14 today). When flow-trace
    #                 raises its floor this line breaks with a legible uv resolution error; that is
    #                 the intended failure mode.
    #
    # The declared-side derivers (queue / backlog / map headline) read the yamls directly and are
    # cheap. verify / capability-rollup RUN the scenarios and additionally need `npm ci` here AND
    # node deps installed in flow-trace's own js/ observer — see the tooling thread below.
    invoke: uv run --no-project --python 3.12 --with-editable ~/projects/qntm-network/qntm/tools/flow-trace flow-trace
    yaml_dir: docs/implementation-artifacts
    # RESET to null 2026-07-30, and that IS the derived answer, not a hand-authored one.
    # derive_next_command returns None when the queue is EMPTY (prioritization.py — `if not queue:
    # return None`), so on this member — all 10 backlog rows passing, queue_length 0 — the deriver
    # NEVER splices this line. It therefore froze at whatever was last typed into it, and what was
    # last typed (91066b7, by hand) is now provably wrong twice over: it carries the pre-fix invoke
    # prefix, so copy-pasting it fails with the Python>=3.12 resolution error; and the deriver's
    # actual output for a non-actionable head is `map . --full`, not `map .` (verified by running
    # `queue brand`, whose queue is non-empty — it re-derived that line correctly from the new
    # invoke in the same pass). A stale runnable one-liner is worse than an honest absence, which is
    # the tool's own stated position. When a row here stops passing, the deriver splices the real
    # command back in, overwriting this line and these comments — as it should.
    next_command: uv run --no-project --python 3.12 --with-editable ~/projects/qntm-network/qntm/tools/flow-trace flow-trace map . --full  # DERIVED by flow_trace.prioritization.derive_next_command in the SAME reconcile_queue pass as `queue:` — do not hand-edit (bootstrap-next-command-is-derived-not-typed).

  queue:  # DERIVED by flow_trace.prioritization.derive_queue — the authored override is the `lead` flag in backlog.yaml; do not hand-edit (prioritization-is-derived-not-typed).
