backlog:
- id: search-reads-lines-through-the-shared-readers
  project: engine-and-clients
  captured: '2026-10-09'
  title: >
    app/present/search.ts parses lines with its own regexes (the [[qntm:N]] stamp, headings, the
    checkbox prefix) and its own `taskTitle`, where app/present/express/rendition.ts already owns
    each reader (`stampSpans`, `classifyLine`, `cleanTitleFor`). `taskTitle` can disagree with the
    engine's title, so a [[Title]] link can miss its task. Move search onto the shared readers,
    give each hit its done/open status from `classifyLine`, and delete `applyTag`
    (app/present/tagcomplete.ts), which duplicates `applyCompletion` and only a test calls.
    No ranking change in this row.
  kind: capability
  state: passing
  driving_capability: search-reads-lines-through-the-shared-readers
  resolution: >
    2026-10-09. search.ts reads lines only through rendition.ts (`classifyLine`, `stampSpans`,
    `contentOf` — extracted from `cleanTitleFor` — and `cleanTitleFor`); `taskTitle` and `applyTag`
    deleted; each hit carries `title` and `status`, and a done hit is dimmed in the search box.
    Enforced by state-search-reads-lines-through-the-shared-readers and
    tests/present-search.test.mjs, tests/present-links.test.mjs.
