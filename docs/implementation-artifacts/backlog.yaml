    once the caret was in the box. He is a vim user; in vim `w` repeats, so the second
    `w` was a literal `w` typed into his line. §Q1 and §2.2 of that document are amended
    in place rather than left asserting what the code contradicts.
    THE ROOT CAUSE WAS NOT THE WORD MOTION. paint.ts gated the FOCUS contribution on
    `mode.mode === "INSERT"`, so in NORMAL the selected line rendered WIRED — against
    "cursor on the line -> the line renders as its exact source text", which
