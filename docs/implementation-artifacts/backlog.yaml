- id: widen-qualification-language-for-clock-bound-predicates
  title: >-
    [resolution] Membership's 8 clock-bound qualifications (`$cycle_today`/`$cycle_week_end`
    compared against a date field) stay unpublished and unanswerable even with the day boundary
    resolver (`day-boundary-resolver-agrees-with-the-engine`) in hand — the PREDICATE GRAMMAR
    itself, not the clock, is the gap.
  driving_capability: day-boundary-resolver-agrees-with-the-engine
  record: >-
    NOT SHIPPED, MEASURED WHILE BUILDING STEP 8 RATHER THAN ASSUMED AWAY. `scripts/generate-
    qualification-declaration.mjs`'s `normalisePredicate` refuses in two unconditional places that
    have nothing to do with whether a boundary resolver exists: any `$`-prefixed scalar value
    (`refuse(field: cycle variable $value)`) and any predicate with more than one operator key — a
    date-range `{gte: $cycle_today, lte: $cycle_week_end}` IS two keys, so it is refused as
    `operator gte+lte` before the `$` is ever inspected. `app/present/qualification.ts`'s own
    `FieldPredicate` type is `{eq}`/`{not}` only, and `membership.ts`'s `evaluatePredicate` has no
    branch for an orderable comparison at all. Publishing and reading `resolution.dayBoundary`
    (steps 5 and 8) supplies the VALUE a `$cycle_today` substitution would need; it supplies
    nothing the GENERATOR or the EVALUATOR would use that value with. A correct widening needs, at
    minimum: (a) the generator to admit `gt`/`gte`/`lt`/`lte` as recognised single-purpose
    operators and a `$cycle_today`/`$cycle_week_end` substitution (resolved once, at generation
    time, into a concrete date the browser then treats as a plain field bound — never re-resolving
    "today" per keystroke, which would reopen exactly the clock-in-the-evaluator question step 8's
    own header refuses); (b) `qualification.ts`'s `FieldPredicate` and `membership.ts`'s
    `evaluatePredicate` to learn to compare, not only equal. Both are real, scoped work — larger
    than "read the boundary" (step 8's own size, `h`) — and neither was invented to manufacture a
    consumer for step 8; this row exists because the measurement found the gap, not because the
    step needed an excuse to widen something.
