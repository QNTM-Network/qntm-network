- id: a-projection-can-arrive-and-be-held
  title: >-
    [haven] [4] [HALF A DAY] THE BEHAVIOURAL QUEUE. One coalescing pending projection per path,
    ordered by `generated_at`, applied through `paintView`, gated by the line the operator has open.
    Specified in docs/implementation-artifacts/design-local-behaviour-and-the-queue.md section 5.
    CLOSED 2026-08-01.
  driving_capability: a-projection-arriving-mid-edit-is-held
  kind: capability
  record: >-
    THE DEFECT NEEDED NO TRANSPORT TO REACH, WHICH IS WHY THIS SHIPPED AHEAD OF ROW 7. `paint.ts`'s
    `rawInput` sets `input.value = lineSource`, so an open line's characters come out of whatever
    source string the painter is walking. `commitLine` is async and a cycle takes seconds, so a
    tick's own answer landed on the line he opened after making it and replaced what he had typed.
    `app/present/queue.ts` holds one pending projection per path and imports nothing.
    THE GATE IS "TYPEABLE", NEVER "SELECTED", AND THAT DECISION IS THE DIFFERENCE BETWEEN A QUEUE
    AND A STALL. In NORMAL the cursor is on a line and that line renders as characters with a block
    cursor — no `<input>`, nothing to lose — so the world goes on updating. vim always has a cursor;
    a gate on "selected" would have stopped the screen forever. Two shapes are typeable and both are
    asked for, because they are deliberately separate surfaces: a line being MADE (`draftLine`) and
    a line being EDITED (`focus` plus INSERT).
    ONE THING THE DESIGN DID NOT NAME AND THE WORK FOUND — AND IT IS THE ONE THAT MATTERED. Holding
    a projection blinds the stale-write detector unless the BASE moves with it. `served.take` ran
    only when a projection was INSTALLED, so a held projection left `BaseSurface` answering
    `current` for a save that provably discards a projection the page was holding in its own hand.
    Measured: tick a box, open a line, tick a second box, and the second write silently overwrote
    the first tick's answer with no sentence at all. `drainProjection` now takes the base off the
    held envelope while leaving the screen alone. It is still markdown read straight out of an
    envelope, which is the property base.ts's "taken here and nowhere else" rule was really
    protecting, and that rule's comment is amended rather than quietly broken.
    A SECOND ONE, SMALLER. `paint.ts` calls `onLineCommit` in the MIDDLE of a settlement — the mode
    changes and the repaint both happen after it returns — so draining there directly always found
    the line still open. The drain for a blur that changed nothing is scheduled one turn later, so
    "the moment the line settles" means the moment the settlement is finished.
    ONE RESIDUAL, NAMED RATHER THAN HIDDEN. A row abandoned with Escape settles inside `paint.ts`
    and tells the page nothing, so a projection stays held until the next gesture. Held, never lost,
    and the freshness line says so. The three drain points are a projection landing, a line settling
    (including a blur that changed nothing), and any keystroke the page sees.
    COUNTS. `graphData` assignment sites moved 5 to 4 and the direction is toward safety: the two
    write paths stopped installing a projection each and `installProjection` started, because
    "install it" and "hold it, a line is open" is one decision that must not be made in two places.
    `tests/app-membership-note.test.mjs` section 4 gained an assertion stronger than the count it
    replaced — it enumerates the assigned VALUES, so a site assigning a page-computed envelope fails
    even if the number were adjusted. `writeFile(` 3, `applyEdit(` 5, `.markdown` never assigned,
    `held.hold(` 1 and `held.rows` 1 are all unchanged.
    ENFORCEMENT IS `tests/app-projection-queue.test.mjs` — 24 tests in 6 documented sections, of
    which 2 are mutation proofs and 3 drive the falsifier with lines changed above the open line,
    below it, and both.
  state: passing
- id: escape-must-not-destroy-the-line
  title: >-
    [haven] [1] [HALF A DAY] ESCAPE DISCARDS AND CANNOT WRITE. Observed in a real browser
    2026-08-01 - cursor on a line, press Escape, the line is erased; reproduced twice, the second
    time destroying a saved line stamped `[[qntm:2614]]`, which then went from `personal/all`.
