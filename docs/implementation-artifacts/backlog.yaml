    chip is a decision the INSTANCE makes, at GLOBAL, in a served file. Flip that one key to raw,
    reload, chips become characters, NOTHING REBUILT — measured in a real browser against a
    bundle whose md5 was identical before and after.
    WHAT A TAG IS: the engine''s canonical grammar, `(?<!\S)#([a-zA-Z_][a-zA-Z0-9_-]*)`
    (parse_tag.py:23), mirrored — it is CODE, not vocabulary config (the engine''s own audit puts
    it under "Closed (code)"). So `#1`, `foo#bar`, `C#`, `# Heading`, `##` and a URL fragment are
    not tags and `#work/admin` is `#work` only. The boundary is written `(^|\s)` rather than a
    lookbehind because Safari only got lookbehind in 16.4 and an unparseable literal takes the
    whole bundle down; the two forms are proven equal over the engine''s own cases plus a
    972-case sweep, with the engine''s regex carried in the test as the reference.
    THE CHIP IS READ-ONLY AND THAT IS THE CONSTRAINT WORKING. No source edit was added and
    applyEdit still knows two operations, so the first token rendition could not corrupt a file
    even if every other claim in it were wrong. The deletion is writable (TagSpan carries the
    offsets); the AFFORDANCE is not answerable yet — the leftover whitespace, what deleting a
    structural tag MEANS, and where a destructive click sits when the chip is inside the cursor
    target. Named in app/present/paint.ts.
    HOW IT IS PAINTED, because the alternative was the forbidden shape: the chip goes into the
    markdown BEFORE the single render call, never swapped into the built DOM afterwards — the
    painter must not read the page it is building. Injection is safe BY THE GRAMMAR (a tag body
    cannot hold < > & "), fuzzed rather than assumed. Where the renderer would not carry the
