  driving_capability: section-membership-is-read-not-guessed
  record: >-
    NOT SHIPPED, AND THE BLOCKER IS SEMANTIC RATHER THAN TECHNICAL. The fields are available: the
    graph blob reaching the browser carries `{id, type, fields: {title, qntm_id, status, domain,
    ...}}` per node, and `instance.ts` already scrapes `qntm:N` off a line, so the join needs no new
    payload. What is NOT known is what an edit MEANS for a stamped node. Adding `#work` to a line
    plainly sets a domain; DELETING `#work` from it is not that operation inverted, and whether an
    absent token clears the field is the engine's ingest semantics to decide. Guessing it would
    produce exactly the confident-and-wrong answer the refusal exists to prevent. Establishing that
    semantics — by reading the applier rather than by inference — is the work, and it is worth more
    than the widening it unlocks.
