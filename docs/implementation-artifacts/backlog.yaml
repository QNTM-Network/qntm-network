    that opens the line's section is what tells the two printings apart, so each rung narrows by it
    before giving up — which is why there are four rungs and not two.
    AMBIGUITY IS A THIRD OUTCOME AND IS REFUSED, NOT GUESSED. One rule governs every rung — a rung
    that finds NOTHING passes, a rung that finds TOO MANY stops. An ambiguous STAMP does not fall
    through to TEXT: a node printed twice inside one section really is that node on both rows, and
    picking by characters picks a PRINTING rather than a node.
