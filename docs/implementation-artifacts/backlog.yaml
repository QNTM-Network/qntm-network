  driving_capability: section-order-prefers-the-served-envelope
  record: >-
    NOT SHIPPED — filed rather than attempted, because the app repo cannot change the server. THE
    PRECISE CHANGE: `server/app.py`'s `_read_views()` (currently `server/app.py:149-173`, read-only
    in the monorepo) parses each view's top-level `id`/`path`/`domain` by regex
    (`_parse_view_meta`). Extend it to also capture the view's declared `sections:` list, in file
    order, as an array of `id` strings — the SAME fact `scripts/generate-qualification-
    declaration.mjs`'s `readViews` already extracts client-side at build time, over the identical
    config, so the parsing shape to mirror already exists and is proven correct (step 1's own
    falsifier, 72 of 72 views, 186 of 186 sections). Add the result as a `sections` key on each
    view dict `_read_views` returns, so `_envelope()`'s `views[]` becomes `{id, path, title, domain,
    markdown, sections}` — additive, one new key, no change to any existing key. NO RENDERER RUN,
    NO DATABASE READ, NO MIGRATION: this is a second parse of the same YAML `_parse_view_meta`
    already opens, not a call into `run_cycle` or the compiled bundle. WHY IT IS WORTH DOING, NAMED
    RATHER THAN ASSUMED: `server/app.py`'s own docstring for `POST /config` states config "flows
