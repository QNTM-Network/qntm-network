# qntm.network backlog — STARTED AGAIN 2026-10-09 (operator-asked: "I want to sort of start from
# fresh"). The 166 rows before this date are in git history (`git log -- this file`); an issue they
# described that is still real will be found again and filed again in today's terms.
backlog:
- id: search-reads-lines-through-the-shared-readers
  captured: '2026-10-09'
  title: >
    app/present/search.ts parses lines with its own regexes (the [[qntm:N]] stamp, headings, the
    checkbox prefix) and its own `taskTitle`, where app/present/express/rendition.ts already owns
    each reader (`stampSpans`, `classifyLine`, `cleanTitleFor`). `taskTitle` can disagree with the
    engine's title, so a [[Title]] link can miss its task. Move search onto the shared readers,
    give each hit its done/open status from `classifyLine`, and delete `applyTag`
    (app/present/tagcomplete.ts), which duplicates `applyCompletion` and only a test calls.
    No ranking change in this row.
  kind: capability
  state: passing
  driving_capability: search-reads-lines-through-the-shared-readers
  resolution: >
    2026-10-09. search.ts reads lines only through rendition.ts (`classifyLine`, `stampSpans`,
    `contentOf` — extracted from `cleanTitleFor` — and `cleanTitleFor`); `taskTitle` and `applyTag`
    deleted; each hit carries `title` and `status`, and a done hit is dimmed in the search box.
    Enforced by state-search-reads-lines-through-the-shared-readers and
    tests/present-search.test.mjs, tests/present-links.test.mjs.
- id: one-ranking-for-every-list
  captured: '2026-10-09'
  title: >
    Five lists rank by five rules, each written inside the list: `searchViews` (search.ts),
    `linkTargets` (search.ts), `filterViews` (shell/drawer.ts), `matchingTags` (tagcomplete.ts),
    `markerSource` (markercomplete.ts). Add one pure module, app/present/rank.ts —
    `rank(candidates, query, policy)` with one word-match rule and match quality as a sort key —
    and move all five onto it; each keeps only its trigger parsing and its candidate building.
    The comparator is NOT new: extract the declared-key, absent-last comparison from
    app/present/arrange/ordering.ts (`compareTuples` / `DefaultFieldKey`) as one
    `compareByKeys(a, b, keys, valueOf)` that section ordering and list ranking both call. The
    built-in policy reproduces today's order, plus open tasks before done ones. Needs
    search-reads-lines-through-the-shared-readers.
  kind: capability
  state: passing
  driving_capability: one-ranking-for-every-list
  resolution: >
    2026-10-09. app/present/rank.ts — `rank(items, describe, query, policy)`, one match rule with
    match quality as a key, key `order` with `*`, and a `demoted` field for view path globs.
    app/present/arrange/keys.ts — `compareByKeys`, taken out of `compareDefaultTuples`, which now
    calls it. On rank: searchViews, linkTargets, filterViews, matchingTags, markerSource, and the
    Views tree (found by the new check — it sorted A–Z by its own rule). Built-in policies in
    `DEFAULT_RANK_POLICIES`: today's order plus open before done. Enforced by
    state-every-list-ranks-through-one-ranking and tests/present-rank.test.mjs.
- id: list-ordering-declared-in-global-defaults
  captured: '2026-10-09'
  title: >
    The ranking policy is declared in apps/qntm-md/config/global_defaults.yaml as `list_ordering:`
    (a default key list, optional per-list overrides for search, link, views, tags, markers, and a
    `demote:` list of view path globs whose hits sort last but stay listed — e.g. Everything Work).
    scripts/compile-resolution.mjs compiles it into presentation.json the way it already compiles
    `default_ordering:`, with a `source` field saying config or built-in. The engine never reads it.
    Needs one-ranking-for-every-list.
  kind: capability
  state: unscoped
- id: recently-used-recorded-on-the-server
  captured: '2026-10-09'
  title: >
    A `recent` ranking key needs a record of what was used. The worker records the views opened and
    the nodes edited (time stamped), so the Mac and the phone agree; the app reads it with the
    snapshot. Operator choice 2026-10-09: shared on the server, not per device, not graph dates.
    Needs list-ordering-declared-in-global-defaults.
  kind: capability
  state: unscoped
- id: one-ordering-vocabulary-for-lists-and-children
  captured: '2026-10-09'
  title: >
    Child order inside a view is the same problem as list order, and must use the same declared
    vocabulary. Today the engine orders children by declared field keys, after a hard-coded rule
    that puts nodes with NEXT or PARALLEL edges first (`_context_order_key`,
    apps/qntm-md/src/qntm_md/render/section_builder.py), and nothing orders along an #unlocks chain
    or puts done last. Operator wants, per view: order along a directed edge (an #unlocks chain
    renders in the order it was authored), status order (done last), and the choice of which wins
    (all done last, or done kept inside its chain). Proposed shape: an ordering is a list of keys —
    `{field, direction}` (exists), `{field, order: [values]}` (generalises the hard-coded
    priority rank table), `{chain: EDGE_TYPE}` (members joined by that edge kept together in edge
    order) — where key order decides precedence. The engine renders by it; the browser predicts
    placement and ranks lists by it. Two implementations by necessity (Python engine, TypeScript
    browser), held together by one compiled declaration and agreement tests, as default ordering
    already is. The engine half is filed in the monorepo backlog as
    children-order-by-declared-keys.
  kind: capability
  state: unscoped
