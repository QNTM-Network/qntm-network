- id: vault-file-accepts-a-precondition
  title: >-
    [haven] [3] [ONE HOUR, OTHER REPOSITORY] THE COMPARISON THE GRAPH SERVER DOES NOT MAKE - half
    (b) of `the-write-is-refused-server-side`, split out because it is the only part of that row
    this repository cannot build. THE EXACT CHANGE, in `server/app.py` `vault_write_file`
    (`@app.post("/vault/file")`, currently 267-287). It reads `path` and `markdown`, guards the
    path against traversal, and calls `target.write_text(...)` unconditionally. It must also read
    `base` from the body and, WHEN AND ONLY WHEN that field is a non-empty string, compare it
    against the file the projection would serve - then either write as today or raise a 409 whose
    body carries the current content.
    THE COMPARISON IS AGAINST THE SERVED STRING, NOT AGAINST THE BYTES ON DISK, and that is the
    one detail a reimplementation gets wrong. The browser hashes exactly what it was SENT, and
    what it was sent came through `_read_views()`, which decodes with `_read_text` (UTF-8, falling
    back to cp1252 for a legacy byte). So the server must compute
    `"sha256-" + hashlib.sha256(_read_text(target).encode("utf-8")).hexdigest()` - the SAME decode
    the envelope uses, re-encoded as UTF-8 - and compare that. Hashing `target.read_bytes()`
    directly agrees on every pure-UTF-8 file and disagrees on exactly the files `_read_text`
    exists for, which would refuse a save the operator can never make succeed.
    FAIL OPEN, EVERY BRANCH. No `base` - write, exactly as today. `base` present but the target
    does not exist yet - write. Anything unreadable - write. Refuse ONLY on a positive mismatch
    between two strings that were both computed. A wrongly-refused write means the operator cannot
    save, which is worse than the clobber this whole capability exists to stop.
    THE 409 BODY IS `{"ok": false, "error": ..., "current": <the file's current text>}`.
    `worker/src/app.js` already reads exactly that shape and passes `current` through verbatim,
    already answers the browser 409 rather than 502, and already skips the cycle - all of it
    shipped and fixture-tested on 2026-08-01 and inert until this lands. Nothing in qntm.network
    changes when it does.
    ORDER OF LANDING IS FREE. `base` is already on the wire and ignored by today's server, so this
    can land before or after and neither repository breaks.
    DO NOT USE `snapshot.version` - it is per-SNAPSHOT, not per-file, so it moves when any of 77
    views moves. The content hash is per-file by construction.
    Needs nothing. WAS BLOCKED FROM BEING SAFE TO SWITCH ON by `a-refused-edit-is-held-unanchored`,
    AND THAT BLOCK IS LIFTED as of 2026-08-01 - the browser now holds a refused edit's characters as
    a row no file owns, surviving the repaint that used to erase them. Read that row's record before
    enabling this one, and note what is still NOT proven: the end-to-end path has never run against
    a live server, so the first real 409 will be the first time the two halves meet.
