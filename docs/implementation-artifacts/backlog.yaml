- id: flow-trace-derives-a-time-axis-from-enforcer-git-history
  title: >-
    [tooling] [PROPOSAL, NOT BUILT] `docs/implementation-artifacts/pin-the-cube.md`'s TIME-axis
    recommendation: flow-trace has VERTICAL (`enforcement_depth`), HORIZONTAL (`rooting`,
    `horizontal_completeness`) and now a fourth, enforcement (a capability either names its check
    or is UNENFORCED) — no field answers "how long has this been true, and how much has been built
    on it since." PROPOSED, NOT INVENTED SILENTLY: two fields, DERIVED from git, never hand-typed —
    `enforcement_age_days` (days since the git history of every path an `enforced_by` /
    `enforced_by`-equivalent citation names first introduced that path) and
    `enforcement_touch_count` (count of distinct commits that modified those same paths since). The
    reasoning for DERIVED over hand-typed: this whole project's own finding, repeated across every
    merged design document, is that a hand-maintained note rots the moment nobody is looking at it
    (`global_defaults.yaml`'s stale "INERT" comment, `capabilities.yaml`'s own four-day-stale
    "embedded" paragraphs this same pass corrected — see claim H). A `first_pinned:` date typed by
    hand is the same failure shape one field later. A number computed fresh from `git log --follow`
    every run cannot go stale between runs; it can only be wrong if the enforcer citation itself is
    wrong, which is a defect `horizontal_completeness.rooted` already exists to catch. This is
    flow-trace's own tool to build (its source is not in this repo, and not in `apps/qntm-md/`
    either — this branch has no path to it); filed here because this repo's `capabilities.yaml` is
    the consumer of whatever field lands, and the shape should be settled before the field exists,
    not after.
  kind: null
  state: unscoped
