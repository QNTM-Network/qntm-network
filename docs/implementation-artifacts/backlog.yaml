- id: the-write-is-refused-server-side
  title: >-
    [haven] [5] [HALF A DAY] THE HONEST ABORT — the app cannot make its own write safe alone, and
    this row is exactly what the engine and the Worker would have to offer. (a) POST /app/edit-file
    (worker/src/app.js:229) takes {path, markdown} and validates only that both are present
    (:247-250); it must take {path, markdown, base} and answer 409 with the current content when
    base does not match — app/index.html already treats a 409 as a distinct field-level refusal in
    the auth flow (:1441-1443), so the shape exists here. (b) The graph server must be able to
    answer "what does this file say now": either POST /vault/file accepts an If-Match-style
    precondition and returns 409 with the current content rather than writing (one comparison
    before a write it already performs), or a GET /vault/file the Worker reads first — WEAKER,
    because check-then-act has its own race. THE INSTRUMENT MUST BE PER-FILE AND snapshot.version
    IS NOT IT: it is a per-SNAPSHOT integer (worker/src/app.js:159-176) so it moves when any of 77
    views moves, and a precondition on it would refuse an edit to this_week.md because an unrelated
    view was re-rendered. Note also that on the path the operator actually takes, version is
    hardcoded null twice (:141 hosted read, :271 write response) — the browser was never given one.
    A content hash of the served markdown is per-file by construction and needs nothing from
    anybody, which is why row 1 is shippable without this. TOUCHES worker/ AND A REPOSITORY THAT IS
    NOT THIS ONE, which is why it is separated from row 1 rather than bundled with it; the graph
    server's surface is read from docs/architecture/graph-server-plan.md:46-47 and from the calls
    the Worker makes, and if that plan is stale this is the row to re-check first. Needs 1.
