- id: stop-awaiting-the-cycle-safely
  title: >-
    [haven] [6] [HALF A DAY] STOP AWAITING THE ENGINE CYCLE IN POST /app/edit-file — ack on the
    vault write, cycle behind it. This is item #1 of research-state-and-speed.md's ranked list
    (:629), worth ~10s -> ~250ms on every checkbox and every line commit, and it is the right
    change. IT IS SEQUENCED HERE, AFTER 1, 3 AND 5, AND THAT ORDERING IS THE WHOLE POINT OF THIS
    ROW'S EXISTENCE AS A SEPARATE ITEM. Async does NOT cause the stale-base defect — that is
    refuted by a reproduction using one tab, two edits and no concurrency, because commitLine
    repaints OPTIMISTICALLY from the client-computed string (paint.ts:258) and only replaces it
    when the cycle returns (app/index.html:1192), leaving a ~14s window in which every row is live
    and nothing is disabled. What async does is remove the three accidents that currently limit the
    blast radius: the operator stops waiting (so more edits land inside a live cycle, not fewer),
    the window stops being legible as a stalled UI, and the projection's arrival stops being tied
    to the gesture that caused it. SHIPPING THIS FIRST WOULD MAKE AN INVISIBLE DEFECT FASTER AND
    QUIETER. Needs 1, 3 and 5. Cross-referenced rather than duplicated — the measurements and the
    method belong to research-state-and-speed.md and nothing here restates them.
