- id: an-indented-prose-line-cannot-carry-a-token-rendition
  title: '[present] An indented PROSE line cannot carry a token rendition — no chip and
    no identity mark — measured at 106 of 2,496 stamps in the live vault on 2026-08-01.
    markdown-it reads FOUR LEADING SPACES as an indented code block and ESCAPES everything
    inside it, so a line reaching the painter''s PROSE branch with the engine''s nesting
    indent has its injected markup escaped, and renderTokens'' all-or-nothing fallback
    correctly puts the whole line back to its characters.
    WHICH LINES, EXACTLY: prose lines indented 4, 8 or 12 spaces — their glyph is [>]
    (scheduled) or another spelling outside TASK''s ( |x|X), so classifyLine calls them prose
    rather than checkbox lines. A nested `- [ ]` line is a CHECKBOX line and hides correctly,
    because the checkbox branch renders only its TAIL, inline, with no indent at all.
    NOT A REGRESSION AND NOT NEW. Those same 106 lines already show their tags as characters
    rather than as chips, measured both ways — this is the tag chip''s own fallback, inherited
    unchanged by the second token rendition rather than introduced by it.
    THE FALLBACK IS CORRECT AND MUST NOT BE REMOVED. The alternative is escaped markup on the
    page with the token''s own characters GONE, which is worse than either end of the dial and,
    for the identity stamp, is an identity neither shown nor marked.
    WHAT WOULD FIX IT: give the prose branch the shape the checkbox branch already has — render
