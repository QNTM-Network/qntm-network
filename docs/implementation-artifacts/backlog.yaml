    `instancesOf(source, view)` computes every printed line's instance in ONE pass: `section` is
    the 0-based ordinal of the heading that opens the line's section — counted from the markdown
    alone, never read off a config — and `token` is the line's `qntm:N` stamp (brackets stripped)
    when it has one, a CONSTANT for an unstamped heading (`§heading`), or the line's own exact
    source text otherwise. `#N` is appended only when a `(section, token)` pair repeats — the
    `structural_edge_types allow_repeats` case, design doc §2.4 — so the common case (this_week.md's
    three duplicated stamps included) needs no suffix at all.
