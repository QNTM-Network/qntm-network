    instance.ts's HEADER RATHER THAN ASSUMED AWAY. §6 there spells `view/section_id/node_id`, where
    `section_id` is a config-declared string (`apps/qntm-md/config/views/inbox.yaml` really does
    declare `id: inbox-tagged`, `id: domain-empty`) — a string this module cannot read, because it
    has no config, only markdown. So `section` here is the ORDINAL POSITION instead, and "R1 and R2
    produce the identical string" (the property that makes the later switch a no-op) now has an
