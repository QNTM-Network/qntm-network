    global_defaults.yaml, which holds the engine's own field defaults (architecture checkpoint
    2026-10-09, decided). Replaces row list-ordering-declared-in-global-defaults.
  kind: capability
  state: unscoped
- id: recently-used-recorded-on-the-server
  project: engine-and-clients
  captured: '2026-10-09'
  title: >
    A blank `/` shows recent views and items (operator-asked 2026-10-09: "even when blank … switch
