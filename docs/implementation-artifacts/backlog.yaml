    with `ANCHOR_TRUST` exporting the order. `FocusSurface` gained the anchor (set in the SAME call
    as the index, so the two cannot disagree about where one cursor is) and `reanchor(source)`.
    app/index.html's `paintView` — the one place a view is chosen or re-read from the server — asks
    by identity instead of clamping an index, and says a refusal in the freshness line.
    IDENTITY BEAT REBASING, AND THE DECIDING FACT WAS NOT ELEGANCE: a rebase needs the OLD source
    string still in hand when the new one arrives, and `paintView` reads its markdown out of
    `graphData`, which a fresh snapshot replaces wholesale before anything repaints. A rebase would
    have had to make the browser retain a projection purely so it could diff it. Identity also
