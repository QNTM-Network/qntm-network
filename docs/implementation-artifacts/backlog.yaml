- id: carry-declared-section-order-in-the-server-envelope
  title: >-
    [present] [monorepo change, filed not attempted] `server/app.py`'s `_read_views()`/`_envelope()`
    do not publish a view's declared section order — widen them to, closing a real staleness gap
    between live-pushed config and the statically-baked `presentation.json`.
  driving_capability: section-order-prefers-the-served-envelope
  record: >-
    NOT SHIPPED — filed rather than attempted, because the app repo cannot change the server. THE
    PRECISE CHANGE: `server/app.py`'s `_read_views()` (currently `server/app.py:149-173`, read-only
    in the monorepo) parses each view's top-level `id`/`path`/`domain` by regex
    (`_parse_view_meta`). Extend it to also capture the view's declared `sections:` list, in file
    order, as an array of `id` strings — the SAME fact `scripts/generate-qualification-
    declaration.mjs`'s `readViews` already extracts client-side at build time, over the identical
    config, so the parsing shape to mirror already exists and is proven correct (step 1's own
    falsifier, 72 of 72 views, 186 of 186 sections). Add the result as a `sections` key on each
    view dict `_read_views` returns, so `_envelope()`'s `views[]` becomes `{id, path, title, domain,
    markdown, sections}` — additive, one new key, no change to any existing key. NO RENDERER RUN,
    NO DATABASE READ, NO MIGRATION: this is a second parse of the same YAML `_parse_view_meta`
    already opens, not a call into `run_cycle` or the compiled bundle. WHY IT IS WORTH DOING, NAMED
    RATHER THAN ASSUMED: `server/app.py`'s own docstring for `POST /config` states config "flows
    like DATA … a view/rule change takes effect on the next cycle without a redeploy" of the static
    app bundle that bakes `presentation.json` at BUILD time — so a live config edit (a renamed or
    reordered section) can silently outrun the shipped declaration, with nothing today to detect
    it. `app/present/address.ts`'s `sectionOrderFor` (this PR) is the consumer already wired and
    waiting: the moment this field ships, `membershipNoteFor`/`orderingNoteFor` in `app/index.html`
    prefer it automatically, with no further app-side change. THE FALSIFIER, INHERITED FROM THE
    DESIGN DOCUMENT'S OWN STEP 11: assert the envelope's `sections` for every view equals the
    generator's `sectionOrder`, for all 72 — `tests/present-address.test.mjs` §6 already runs this
    comparison in simulation, against an independent scanner standing in for this exact change;
    the server-side implementation should be checked against that same test's expectations, or a
    Python-side sibling of it, once built.
  state: diagnose-ready

- id: carry-per-line-section-identity-in-the-server-envelope
  title: >-
    [present] [monorepo change, filed not attempted, AN ARC] The stronger form of step 11 — a
    per-LINE section, replacing the browser's own heading-count walk entirely — needs
    `RenderedLineRecord` captured before the cycle discards it, not a config parse.
  driving_capability: section-order-prefers-the-served-envelope
  record: >-
    NOT SHIPPED, AND NOT THE SAME COST AS THE SIBLING ROW ABOVE — named separately because
    conflating the two would understate this one. `RenderedLineRecord` (`(sheet_id, section_id,
    node_id)` per printed line) is the fact that WOULD let the browser read a line's section
    directly rather than counting headings to find an ordinal — but the engine computes it fresh
    every cycle inside `run_cycle` and discards it before `line_cache` persists
    (design-the-resolution-architecture.md §5.9; `design-presentation-instance-identity.md` §0.4).
    `server/app.py`'s `GET /graph` never calls `run_cycle` at all (`_envelope()` only reads config,
    raw markdown and the persisted graph blob), so there is no per-request opportunity to produce
    it; `POST /cycle` does call `run_cycle`, but its own response is built from `_envelope()` too,
    AFTER the record that would answer this is already gone. Closing this needs either (a) a
    `line_cache` schema change to persist `(section_id, node_id)` alongside what it already stores
    — an ENGINE change to a table on the operator's LIVE database, a migration, not an afternoon
    (the same cost `design-presentation-instance-identity.md` §2.3(b) already priced for the
    equivalent instance-identity question and rejected in favour of re-deriving instead) — or (b)
    threading `RenderedLineRecord` out of `run_cycle`'s return value into `POST /cycle`'s own
    response before it is thrown away, which only helps the ONE request that triggers a cycle, not
    `GET /graph`'s far more common read. NEITHER IS THIS REPO'S TO BUILD. What this PR ships instead
    — the declared section ORDER, not a per-line fact — is deliberately the cheaper half: it lets
    `sectionAt`'s own heading-counting walk keep running exactly as it does today, and only changes
    where the ORDINAL-TO-ID TABLE it indexes comes from. Worth doing only if the ordinal/heading-
    count approach is ever measured to disagree with the engine in a real view — no such
    disagreement is on record; `tests/present-address.test.mjs` §4 sweeps all 72 real views and
    finds none.
  state: diagnose-ready
- id: widen-instance-identity-past-the-first-stamp
  title: >-
    [present] [step 12 finding, size not yet measured] `instance.ts`'s two-tier walk cannot follow a
    line across its OWN FIRST STAMP — measured, not assumed, by `tests/present-replay.test.mjs` §1
    (`projection-replay-convergence-is-measured`, capabilities.yaml). An unstamped line's identity
    IS its own exact text (`instance.ts`'s own header, "WHAT DOES NOT COLLAPSE"); the moment the
    cycle mints it, BOTH tiers fail at once — the text tier because the operator's own edit already
    changed what it would have matched, the node tier because the anchor was taken with `node: null`
    (there was no node yet) and has nothing to search with. This is not the "moved section" case
    refutation 1 already solved (design-presentation-instance-identity.md §2.3/§2.4) — that case has
    a node throughout and only its SECTION changes. This is a line acquiring a node for the first
    time, which the two-tier design (instance.ts's own header) does not name as a case at all.
    WHAT WOULD CLOSE IT, NAMED WITHOUT BEING SIZED: the operator's own edit already knows the exact
    text it just committed (`gesture.text` in step 12's own harness, `commit.text` in
    `app/index.html`'s real `commitLine`). A THIRD TIER — "was the anchor's own instance a PREFIX of
    a newly-stamped line's text, within the same section, and unique" — could follow the specific
    transition a first stamp makes (title text first, cycle-appended tokens after, the same shape
    step 12's own `preserved` check already relies on for every real stamped line in `~/qntm/inbox.md`).
    NOT SIZED, NOT DESIGNED, AND DELIBERATELY NOT BUILT HERE: a third tier changes `instance.ts`'s
    own two-tier contract, which `resolveInstanceAnchor`'s own callers (`focus.ts`'s `reanchor`) and
    its own test suite (`tests/present-instance.test.mjs`, `tests/present-anchor.test.mjs`) are built
    against; widening it is a change to a module step 12 was expressly told not to touch, and
    whether a prefix match is SAFE (a title that happens to be a prefix of an unrelated line's title,
    in the same section, is a real ambiguity a text-prefix tier would have to refuse rather than
    guess through) is an open question this row states rather than resolves.
    CLOSED 2026-08-01, AND THE OPEN QUESTION ABOVE WAS ANSWERED RATHER THAN ASSUMED AWAY. The third
    tier this row sketched — "was the anchor's own instance a PREFIX of a newly-stamped line's text"
    — was built, and it is the WEAKER of the two rungs `app/present/relative.ts` adds, not the only
    one. The row's own doubt was right: a text-prefix tier alone would guess, so it is reached only
    after a BRACKET rung (nearest stamped node above and below, plus a gap count and an offset) has
    refused, and it refuses rather than picks when more than one line in the view extends the
    characters. Neither rung is taken for a line that already carries a stamp, so the two-tier
    contract this row was careful about is not widened for any line that used it: `instance.ts`'s
    first two tiers are byte-identical, and both existing suites
    (`tests/present-instance.test.mjs`, `tests/present-anchor.test.mjs`) pass unmodified. See
    capability `a-line-being-authored-keeps-its-cursor-through-the-first-stamp`.
  driving_capability: a-line-being-authored-keeps-its-cursor-through-the-first-stamp
  kind: capability
  record: >-
    app/present/relative.ts; ANCHOR_TRUST + the third and fourth rungs in app/present/instance.ts;
    tests/present-relative.test.mjs (34 arms, 4 mutation proofs); tests/present-replay.test.mjs
    section 1b (the measured line itself, replayed); tests/app-held-edit.test.mjs sections 2f/2g
    (both rungs through the real page); tests/flow_scenarios/instance_anchor.ts.
  state: passing
- id: close-the-silent-drop-path-in-the-generators
  title: >-
    [fix] [declarations] Make it impossible for a config declaration to disappear without a
    record. Audit all three generators (not only generate-qualification-declaration.mjs:396,
    which the finding names), record every drop with its reason, and wire a staleness gate into
    build.yml so a drop that appears cannot ship green.
  driving_capability: a-config-declaration-the-app-drops-says-so
  kind: capability
  record: >-
    2026-08-01 — SHIPPED. design-the-rule-mirror.md's own ranked order puts this at row 0, ahead
    of every rung of the ladder, because "a mirror built on a generator that can silently drop a
    declaration is a mirror whose generality cannot be checked, however well the rungs are
    measured."
    HOW MANY WAYS COULD A DECLARATION VANISH: sixteen, across all three generators, and the
    finding named one of them. Qualification 14 (a patterns/ or views/ or vocabulary/ file that
    does not parse; a view sheet with the wrong number of top-level keys; a view with no sections
    list; a section that is not a mapping or carries no id/qualification — BOTH of which drop the
    section from `sectionOrder` and therefore shift the positional ordinal `app/present/address.ts`
    indexes; a vocabulary family that is not a list; an entry with no token; a token on a
    non-resolvable field (73 of the operator's own, THE ONE §9.3 NAMES); a render-only token on a
    resolvable field; a non-scalar value; a token setting a field through `parametric_field:`, a
    shape the loop never even looks at; and a section whose qualification was refused, 137 of 186).
    Structural 3 (a view sheet whose top-level key the line scanner cannot see; a view with no
    `sections:` at the expected indent; and a HALF-declared override — types with no direction or
    direction with no types — which was dropped whole, so the app silently used the global indent
    binding under a heading the operator had told to do otherwise). Resolution 6 (three view-file
    shapes, each of which ALSO disables the registration guard that stops a stale GLOBAL
    input_grammar shipping; a section with no readable id; a node type whose render shape cannot
    be seeded; and four ordering-marker paths, one of which — an unrecognised extraction_hint —
    is the exact twin of the finding's own line in a different generator).
    WHAT A REFUSAL DOES: recorded in `dropped`, printed to stderr, and gated by `--check`. Never a
    non-zero exit on generate — a generator that cries wolf gets --force'd, which is the same
    silence with extra steps.
    THE TWO SHIPPED TESTS THAT "ASSERT THE SILENCE IS INTENDED" both encode a REAL requirement and
    NEITHER was weakened. `tests/present-qualification.test.mjs`'s "REFUSAL FOLLOWS THE CONFIG TOO"
    asserts the generator publishes nothing for a traversing pattern and the app abstains rather
    than answering from the half it understands — correct, and kept verbatim; two assertions were
    ADDED beneath it, that the pattern's reason is in `refused` and the heading it costs is named
    in `dropped`. `tests/app-membership-note.test.mjs`'s 'ABSTENTION 1/5' asserts the note line
    stays empty for an unpublished section — also correct: a note under 137 of 186 sections would
    be noise, and surfacing the refusal IN THE UI is design row 6, not this row. Unchanged.
    WHAT THIS ROW DID NOT DO, NAMED: it does not widen any grammar (137 sections remain refused,
    by design — the number is now visible, not smaller), and it does not surface the count in the
    running app. `app/present/qualification.ts`'s `dropped` is parsed and, like `refused` beside
    it, read to decide nothing. That is design-the-rule-mirror.md row 6 and it is still open.
  state: passing
- id: apply-the-registration-defaults-to-the-line-as-it-is-typed
  title: >-
    [feat] [app] Rungs 1 and 2 of the operator's own ladder, together. On Enter, seed the new line
    with its node type AND its section's declared defaults, resolved through the cascade, for any
    section that declares them and with no code naming any particular one.
  driving_capability: a-new-line-acquires-its-node-type-and-its-defaults
  kind: capability
  record: >-
    2026-08-01 — SHIPPED. His own words are the specification: "it gets stamped task. That's what
    the evidence would be for inbox. Then for personal all it would get stamped task and personal,
    as we have a default resolution here."
    THE ANSWER, IN HIS OWN VIEW. `personal/all` was `- [ ] ` and is now
    `- [ ] #task #personal `. `inbox` was `- [ ] ` and is now `- [ ] #task `. `spirit/God Box` is
    `- [ ] #task #spirit #God `. `routines/personal` is `- [ ] #personal ` — the type tag refused,
    for the reason below.
    WHY A DEFAULT CAN BE WRITTEN INTO A LINE AT ALL. A `defaults:` block sets a FIELD, and a field
    is not text. What makes it seedable is that the ENGINE ITSELF spells a set field back onto the
    line every cycle, through `TokenResolver.source_tags_for_node` — "Render: field + value ->
    canonical token -> text". His own personal/all.md already carries `#task #personal` on every
    line, printed by the engine, not by a person.
    `INPUT WINS`, AND IT IS THE SHARPEST QUESTION IN THE WHOLE ROW. A value the browser writes into
    the source is ingested as AUTHORED and outranks the rule that produced it, so seeding converts
    a DERIVED value into an AUTHORED one. It costs nothing here because the engine performs that
    same conversion itself one cycle later, when it prints the tag back — seeding reaches the same
    fixed point one cycle earlier rather than creating one. A field the engine prints NO tag for is
    never seeded, and that is the same rule read the other way: `project` (60 sections),
    `principle_state`, `stage`, and every other unspellable default is recorded in `dropped` with
    the field named. THE CENSUS: 153 sections, 8 fields, 262 declared defaults, of which 188 are
    spelled (domain 148, cap_state 12, principle_state 10, class_state 8, package_state 8,
    god_box 2) and 74 are not (project 60, stage 9, domain 5). SPELLABILITY IS PER (FIELD, VALUE):
    the five refused `domain` defaults are the sections declaring `domain: dojo`, a value no tag
    spells even though the field is spelled everywhere else.
    THE 13 SECTIONS design-the-rule-mirror.md §3.3 MEASURED, DERIVED RATHER THAN NAMED. In 13 of
    186 sections a rule retypes the capture inside the same pass that minted it. No code names
    `routine`, that rule, or any section: the generator reads config/rules/*.yaml, normalises each
    `set_node_type` rule's pattern and `when:` into a closed grammar (a root.find over node fields
    with no traversal step; a `when:` of null / not / literal eq), and refuses the type tag for any
    section whose bare capture the rule would fire on. It lands on exactly 13. APPLYING THE
    DEFAULTS DOES NOT FIX THOSE SECTIONS, measured rather than assumed: the rule fires on the
    ABSENCE of `cadence` and not one of the 13 declares a `defaults:` block supplying it. So they
    seed their FIELD tags and withhold their TYPE tag, which is the honest half of the answer.
    THE BOUNDARY, STATED. A retype rule whose pattern TRAVERSES (four of the nine) binds through a
    related node the generator does not read, and is recorded in `dropped` as unevaluated rather
    than assumed harmless. The corroboration is the design's own engine-run sweep: the union of
    rules a bare capture reaches across all 186 sections is exactly two, and no traversing rule
    among them.
    THE AGREEMENT, GENERATED NOT TRANSCRIBED. `scripts/resolution-agreement.py` gained a seeds arm
    calling the engine's own `source_tags_for_node` over the BUNDLE's own section list — 186 cases,
    no sampling, and it covers `all-personal.tasks`, which the qualification-gated arm cannot.
    Result: 173 identical, 13 type-tag-withheld (each with its reason checked in `dropped`), 0
    disagreements.
    A DEFECT THE ROUND TRIP FOUND, and it is why the round trip was written. A seeded line with no
    title was POSTED. A tag is not a title: the engine excises every resolved tag span and
    normalises what is left, so `- [ ] #task #personal ` reaches the mint with an EMPTY title and
    gets the fate `carriesContent`'s own header measured — a node called nothing, reprinted into
    every view that qualifies it, forever. `carriesContent` now takes the tags off before asking.
    This was always true of a line the operator typed one tag into; seeding made it reachable by
    default.
    WHAT THIS ROW DID NOT DO, NAMED. It does not seed MARKERS (`🆕`, `📅`) — no section default
    names a marker field, and a seeded stamp would be the browser claiming something only a rule
    can make; `carriesContent` correspondingly still counts a marker-only line as content, stated
    at the site. It does not surface the `dropped` record in the running app, which stays
    design-the-rule-mirror.md row 6. It does not touch rung 3.
  state: passing
