- id: config-publish-in-the-api
  project: engine-and-clients
  lead: true
  captured: '2026-10-09'
  title: >
    Config is each user's content, published by the API, never by CI. One Worker route takes a set of
    config files, compiles them once, asks the engine to check them (design-gate-two.md), stores
    config and declaration as one numbered version keyed by user, and pushes that version to the
    engine. The app reads its declaration from /config/declaration/*/current; presentation.json is
    no longer committed. Removes the two delivery paths seen 2026-10-08 (deployed, not live until a
    hand push). Builds on design-config-is-content.md. Was a-config-write-lands-on-both-consumers-
    or-neither before the backlog reset.
  kind: capability
  state: passing
  driving_capability: config-is-published-by-the-api
  resolution: >
    Done 2026-10-10 (qntm-network #237, qntm #159). POST /config/publish compiles with
    compile-presentation.mjs, sends the files to the engine's POST /config (which test-loads and
    switches), then one D1 batch stores the declaration, the app's pointer and config_versions #N
    with the accepted archive. Live: config #1 published from qntm main a34daf2 (550 files), a
    repeat kept #1 and the engine skipped it, the app fetched only
    /config/declaration/presentation/current. GRAPH_PUSH_KEY was replaced (none was on the
    laptop); scripts/.graph-push-key holds it. Still open: graph-sync cycle pushes config to the
    engine directly (row graph-sync-stops-pushing-config); presentation.json retires in row
    retire-committed-presentation-json.
