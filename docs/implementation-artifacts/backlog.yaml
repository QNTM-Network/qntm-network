- id: one-ordering-vocabulary-for-lists-and-children
  project: engine-and-clients
  captured: '2026-10-09'
  title: >
    Child order inside a view is the same problem as list order, and must use the same declared
    vocabulary. Today the engine orders children by declared field keys, after a hard-coded rule
    that puts nodes with NEXT or PARALLEL edges first (`_context_order_key`,
    apps/qntm-md/src/qntm_md/render/section_builder.py), and nothing orders along an #unlocks chain
    or puts done last. Operator wants, per view: order along a directed edge (an #unlocks chain
    renders in the order it was authored), status order (done last), and the choice of which wins
    (all done last, or done kept inside its chain). Proposed shape: an ordering is a list of keys —
    `{field, direction}` (exists), `{field, order: [values]}` (generalises the hard-coded
    priority rank table), `{chain: EDGE_TYPE}` (members joined by that edge kept together in edge
    order) — where key order decides precedence. The engine renders by it; the browser predicts
    placement and ranks lists by it. Two implementations by necessity (Python engine, TypeScript
    browser), held together by one compiled declaration and agreement tests, as default ordering
    already is. The engine half is filed in the monorepo backlog as
    chain-edge-types-hardcoded-in-applier-and-section-builder (corrected 2026-10-10: the row named
    here before, children-order-by-declared-keys, was merged into that one).

    CHECKED 2026-10-10 (architecture page https://claude.ai/artifact/NQEF7guXTNME6hCWopY1bK):
    app/present/arrange/keys.ts `compareByKeys` already reads `{field, order: [values, "*"]}`; the
    engine does not, so the two languages have drifted. This row's work: one JSON file of ordering
    test cases (siblings, fields, edges, key list, expected order) run by the engine's pytest and by
    node --test; the chain key in arrange/keys.ts; children orderings in the compiled declaration;
    retire the constants-only fixture behind tests/resolution-default-ordering-agreement.test.mjs.

    DECIDED 2026-10-10: the substrate knows no declarations. The app's ENGINE_DEFAULT_ORDERING and
    ENGINE_PRIORITY_RANK (scripts/compile-resolution.mjs) go, because the defaults move into the
    instance's global_defaults.yaml and reach the app through the compiled declaration. The shared
    test cases use made-up field and edge names. rank.ts RANK_FIELDS names `status`, a declared
    field: tracked with the monorepo row substrate-names-no-declared-field-or-type.
  kind: capability
  state: unscoped
