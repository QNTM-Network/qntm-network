- id: the-open-line-survives-a-new-projection
  title: >-
    [haven] [3] [HALF A DAY] THIS IS THE CAPABILITY. A repaint from a foreign projection must reuse
    the row the cursor is in and NEVER source its characters from the new projection — today
    `input.value = lineSource` takes them straight out of whatever source the painter is walking
    (app/present/paint.ts:214), so a projection arriving mid-edit silently replaces what was typed.
    The painter gains a HELD LINE the same way it already has a DRAFT line: an index (from row 2's
    anchor) plus content that does not come from the source. NOT A NEW IDEA IN THIS CODEBASE —
    `DraftSurface` (app/present/draft.ts:55-83) is already a working implementation of a region of
    the screen the source string does not own, shipped 2026-07-31 for a completely different
    reason. WHAT CHANGES UNDER THE LINE, INVISIBLY, IS THE BASE: the painter's `source` becomes the
    new projection, so at settlement applyEdit computes `set-line` against the CURRENT projection
    and the POST carries the cycle's output AND the operator's line. That is the whole fix and it
    is proven by a control arm — the identical edit against a fresh base preserves everything, so
    applyEdit is not the defect, the base it is handed is. NO EDIT KIND IS ADDED; the closed union
    of three stands. Needs 1 and 2, provable with NO server change by repainting from a second
    fixture. FALSIFIER — type into a line, repaint from a projection that changed lines above and
    below it, assert the characters are untouched and the committed file carries both sides.
    AMENDED 2026-07-31, AFTER ROW 2 LANDED — IT DID GET SMALLER, AND HERE IS EXACTLY HOW MUCH. The
    index half is DONE and is not this row's work any more: `focus.reanchor(source)` returns the
    line the cursor is in AFTER a projection lands, and app/index.html already calls it in the one
    place a projection arrives. Three decisions this row would otherwise have had to make are also
    made and written down — the anchor is a SOURCE LINE INDEX (not a painted-row ordinal), a blank
    line gets NO anchor, and an ambiguous identity is refused rather than guessed. WHAT IS LEFT IS
    THE DELTA AND NOTHING ELSE: hold `input.value` across a repaint, reuse the row rather than
    rebuilding it from the new source, and let the base underneath it move. ONE OBLIGATION IT
    GAINED, and it is small: the reading carries a TIER, and a row restored at `TEXT` is a weaker
    claim than one restored at `STAMP` — `ANCHOR_TRUST` exports the order so this row can decide
    what, if anything, it does differently for a weak restore rather than treating all four alike.
    AMENDED 2026-07-31, AFTER derive-the-instance-id-in-the-browser LANDED — IT GOT SMALLER AGAIN,
    THE SAME WAY, AND THE LIVE CURSOR NOW RUNS ON IT. The "ONE OBLIGATION IT GAINED" paragraph
    above asked this row to decide what to do differently for a weak (`TEXT`-tier) restore, over
    FOUR heuristic rungs. That decision is now over THREE NAMED IDENTITY SPACES instead, AND IT IS
    THE LIVE DECISION, NOT A FUTURE ONE: `FocusSurface.reanchor` calls `resolveInstanceAnchor`
    directly (the same-day correction to this row's first cut, which shipped the resolver additive
    and left `reanchor` on the old four-rung walk — see `presentation-instance-identity`'s own
    record for the fuller account). It returns `found`/`via: "instance"` (the same printing, a
    strong restore), `found`/`via: "node"` (the printing moved section — this row's "what, if
    anything, it does differently" question now has a concrete second case to answer, not just one
    strength gradient), or `ambiguous`/`absent` — which is a smaller, more legible decision than
    "is `TEXT` weak enough to treat specially". Reusing `instance.ts`'s output for `data-instance`
    also means this row's HELD ROW can now be found by a stable key across the repaint it survives,
    rather than only by the source index row 2 already provides — a smaller win than the resolver
    swap but a real one. STILL NOT DONE: the HELD LINE itself — this row's own delta, holding
    `input.value` across a repaint rather than sourcing it from the arriving projection.
