    poisoning `Date.now` (§3) and by comparing against an arbitrary device timezone (§4). **THIS
    ROW CLOSES WITH NO RUNTIME CALL SITE WIRED, BY MEASUREMENT, NOT BY OMISSION.** Two candidate
    consumers were checked in this step: ORDERING needs nothing beyond what it already shipped
