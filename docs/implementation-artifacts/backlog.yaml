- id: a-line-being-made-survives-a-projection-too
  title: >-
    [haven] [8] [UNDER AN HOUR] paintView calls `draftLine.drop()` unconditionally
    (app/index.html:1121) with an argued reason — "an index that meant under the third task in one
    view means something else in the next, and a fresh snapshot has already been through the cycle
    without it." THAT REASONING IS RIGHT FOR A VIEW CHANGE AND WRONG FOR A PROJECTION ARRIVAL, and
    the difference is the one the whole arc turns on: a view change means the operator chose to be
    somewhere else; an arrival means the world moved while he stayed put, and dropping his
    half-typed line for that is the safe haven being violated by the very mechanism the second
    capability needs.
    CLOSED 2026-08-01. `paintView(id, why)` takes the caller's own event and only `"arrived"` on the
    SAME view carries the row across; every other caller drops it exactly as before.
    THE ROW'S OWN SKETCH OF THE ANCHOR WAS WRONG, AND THE CORRECTION IS THE FINDING. It said "its
    anchor is RELATIVE, read off the line above it when it was opened … one field on `Draft`", and
    the second half of that is right while the first is not: a draft CANNOT carry a relative anchor
    of its own. `relativeAnchorFor` needs `places[lineIndex]` to be a real line, and a draft is in
    NEITHER source string by construction — not the one it was opened against (nothing is written
    until it settles) and not the one that arrives (the cycle never saw it). `places[lineIndex]` is
    the line the row would PUSH DOWN, not the row. So the place is an ordinary `InstanceAnchor` for
    the ADJACENT line plus which side of it the row sits on, resolved by `resolveInstanceAnchor` —
    which means the row inherits all four rungs of `ANCHOR_TRUST` including `relative`, and no
    specificity order is re-expressed anywhere.
    THE ROW'S "GENUINELY WORTHLESS BEFORE 7" IS REFUTED, AND THE REFUTATION IS DRIVEN THROUGH THE
    PAGE. `commitLine` is async and the cycle takes seconds. He captures a thing, presses Enter,
    presses `o` and starts typing the next one — and the FIRST capture's own answer landed on the
    SECOND capture's open row and destroyed it. Two captures in a row is the operator's ordinary
    gesture in his own inbox, not a race that needs an unbidden projection to reach.
    THREE THINGS THE ROW DID NOT NAME AND THE WORK FOUND. (a) THE CHARACTERS WERE NOT ON THE
    SURFACE AT ALL — `Draft` held `{lineIndex, seed}` and what he typed lived only in the `<input>`,
    which every repaint destroys. That is `design-the-edit-is-a-safe-haven.md`'s own DELTA finding
    reaching the last surface that had not answered it; `Draft.typed` is the answer. (b) THE
    PROJECTION MAY ALREADY CARRY HIS LINE, in which case re-placing the row puts a second copy of a
    line the file owns on screen and settling it mints a second node — released instead, by
    `held.ts`'s own rule reached through `relative.ts`'s `extendsLine` rather than written a third
    time. (c) THE DROP NEVER PROTECTED THE ELEMENT. `paint.ts` builds one `<input>` per row whose
    `blur` listener SETTLES, and removing a focused element is a blur in every browser that fires
    one — so a view change could already post into the view being left. `DraftSurface.generation`
    closes that, and it had to exist for a surviving row anyway.
    See capability `a-line-being-made-survives-a-projection-too`.
