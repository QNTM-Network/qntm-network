- id: stand-up-the-typescript-app
  title: '[app] [foundation] Stand up qntm.network as a real TypeScript browser application
    — npm + strict tsconfig + bundler producing dist/, TS sources under app/, and
    a GitHub Actions workflow building on push so the deploy stays push-to-publish
    with no human in the loop. Chosen deliberately for where this is going (render
    -> edit -> structure -> graph -> sync), not inherited from the demo. Requires
    the amended push-to-deploy-loop pin — the retired "no build step" clause described
    the old implementation, not the commitment. Deploy target (GitHub Pages + Actions
    vs moving to Cloudflare Pages beside the Worker) is deliberately DEFERRED: both
    consume the same dist/, so it does not shape the build and should be decided when
    the first build ships.'
  driving_capability: app-is-a-typed-browser-application
  record: '2026-07-23 — SHIPPED. npm + tsconfig (strict, plus noUncheckedIndexedAccess
    / exactOptionalPropertyTypes / noImplicitOverride) + esbuild via scripts/build.mjs
    -> committed demo/app.js + app.css. CI (.github/workflows/build.yml) runs typecheck
    then build on push to main and FAILS IF demo/ CHANGED — that staleness gate is
    what makes the amended push-to-deploy-loop true rather than aspirational: the
    artifact is committed (Pages serves main:/), so forgetting to rebuild is the obvious
    failure mode, and the machine catches it instead of the operator having to remember.
    Deploy target deliberately unchanged (GitHub Pages, main:/) so the live site was
    never at risk during the migration. esbuild bumped 0.24 -> 0.28 to clear a moderate
    advisory; npm audit now reports 0 vulnerabilities.'
