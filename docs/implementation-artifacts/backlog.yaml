- id: the-relative-anchor-has-no-landmark-in-an-empty-section
  title: >-
    [present] CLOSED 2026-08-01. `app/present/relative.ts` REFUSED to take an anchor at all when
    nothing in the line's section carried a `[[qntm:N]]`, on the stated reason that such a section
    "offers no landmark that outlives the cycle". THE ROW'S OWN FALSIFIER WAS "SHOW A LANDMARK IN AN
    EMPTY SECTION THAT OUTLIVES THE CYCLE", and there is one — the section's own HEADING, addressed
    by the 0-based ORDINAL that `app/present/instance.ts` already builds a heading's identity token
    from and that `app/present/address.ts`'s `sectionOrdinalAt` already counts. It is the same fact,
    not a weaker one, which is why `~/qntm/metrics.md`'s headings survive a ratio that changes every
    cycle.
    THE MEASUREMENT, TAKEN BEFORE ANYTHING WAS BUILT AND REPORTED WHATEVER IT SAID. Counted
    read-only against the operator's live vault on 2026-08-01, over 77 rendered files — 191 sections,
    of which 109 carry NO stamped line, of which 94 are HEADING-ONLY. Named capture surfaces in that
    set include `inbox.md :: ## Inbox`, `work/daily.md :: ## Work Capture / ## In Progress /
    ## Urgent / ## Due Today`, `personal/daily.md :: ## Personal Capture / ## High Priority /
    ## Due Soon`, `this_week.md :: ## Overdue` and each `dev/<project>/operator.md :: ## Tasks /
    ## Waiting For`. This is not one section nobody captures into; it is the majority of them, and
    the operator's own inbox is in it.
    CANDIDATE (a) LANDED, AND THE OBJECTION AGAINST IT WAS REFUTED BY MEASUREMENT. The row said "the
    Kth line in section ordinal N … does NOT survive the cycle inserting anything above the line".
    True, and it is not the defect the row assumed — a region that gained a line is `gap-changed`,
    which is a REFUSAL, not a wrong cursor, and the TEXT rung then catches the sub-case the row
    itself said it would. Candidates (b) and (c) are untouched and remain the right owners of what
    they describe.
    WHAT WAS ACTUALLY CHANGED IS ONE GUARD AND ONE DERIVATION. The take side refused on `above ===
    null && below === null`; it now refuses only when `section === null` as well — the region above
    the file's first heading, which has no heading and so no ordinal. The resolve side derived the
    region's section from whichever bracketing node resolved; with NO bracket it now reads
    `anchor.section`, the ordinal the anchor already carried and nothing read. Two new named
    refusals — `section-absent` (the ordinal is not in the arriving projection) and `no-landmark`
    (no bracket and no ordinal, which `relativeAnchorFor` never mints and which therefore guards the
    exported resolver against a hand-built anchor).
    WHAT THE LANDMARK CANNOT SURVIVE, NAMED. If the HEADING itself does not render — the measured
    collision case, dormant, zero firings across the live views — every ordinal below it shifts and
    `anchor.section` names a different section. Its gap count and its characters then disagree,
    `gap-changed` or `text-changed` follows, then the TEXT rung, then `held.ts`. That exposure is
    not new and not local: an ordinal that shifts already breaks a heading's own INSTANCE rung
    everywhere in this bundle. An anchor taken while the section was EMPTY does not survive the
    section filling up by the bracket either — the gap is a count — and is carried by the characters
    instead, which is reported as `via: "text"` rather than hidden.
