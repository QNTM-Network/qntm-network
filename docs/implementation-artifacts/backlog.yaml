  driving_capability: escape-discards-and-cannot-write
  kind: capability
  state: passing
  record: >-
    THE SHAPE OF THE DEFECT, WHICH IS THE SAME SHAPE THE DRAFT ROW PAID FOR ONE DAY EARLIER.
    `paint.ts`'s `rawInput` routed Escape into `settle(false)` - the function that reads
    `input.value`, calls `applyEdit` and calls `deps.onLineCommit` - and stood one boolean between
    the operator's discard and a write. The element's own `blur` is wired to that same function
    with `commit` true, and the repaint the discard causes is what fires it. `DraftSurface.generation`
    exists because that arrangement failed for the row being made.
    THE FIX IS STRUCTURAL RATHER THAN DEFENSIVE. `discard()` is a separate function that reaches no
    edit constructor, `settle` lost its `commit` parameter so no argument can turn one into the
    other, and the latch became `open`/`committed`/`discarded` so a discarded element is refused by
    NAME rather than by which listener ran first. The discard also stopped asking `wasFocused` -
    that check latched the element shut and then left it on screen in INSERT holding his characters
    with every later settlement refused in silence.
    WHAT WAS NOT PROVEN, STATED PLAINLY. No browser was available. Eleven gesture sequences were
    driven through the real lifted page with the three browser facts modelled and NONE of them
    produced a POST from Escape on the unmodified code, so the exact trigger in the operator's
    browser is not established. What is established is that the pre-fix routing writes exactly the
    file he lost (the mutation arm asserts the bytes) and that the write is now unreachable by
    construction rather than by ordering.
    COUNTS UNCHANGED. `graphData` 4, `writeFile(` 3, `applyEdit(` 5, `.markdown` never assigned.
- id: enter-destroys-the-row-it-opens
  title: >-
    [haven] [OBSERVED 2026-08-01] ENTER ON AN OPEN LINE DESTROYS THE ROW IT OPENS, AND PAINTS THE
    VIEW THREE TIMES. Reproduced deterministically in the harness once "focusing an element blurs
    the one that had focus" is modelled. Found while proving the Escape row; NOT fixed there.
  kind: capability
  driving_capability: enter-opens-a-line-that-survives-the-paint
  state: passing
  record: >-
    THE MECHANISM, MEASURED. `settle`'s repaint builds a fresh `<input>` for the line just committed
    (INSERT plus focused, so the cascade says raw) and focuses it, then `paintDraft` focuses the
    draft row. The focus transfer blurs the committed line's input; its `blur` runs the COMMITTING
    settlement re-entrantly, inside `paint()`; that settlement's own repaint empties `#viewBody` and
    destroys the draft the same paint has just created; and the outer `paint()` frame then goes on
    appending rows from its own, now stale, source.
    OBSERVED IMMEDIATELY AFTER ENTER - mode NORMAL, no draft, no `<input>`, and three copies of the
    view in the column. This is the likeliest engine behind "keys that do nothing" and it is also a
    live source-clobber route, because a row appended by the outer frame carries a `fileSource` that
    is no longer what the screen shows, and committing that row posts the stale file.
    2026-08-01 - FIXED, AND IT WAS TWO FAULTS RATHER THAN ONE. Both are named in
    `enter-opens-a-line-that-survives-the-paint`. The TRIGGER is a missing `focus.blur()` - `settle`
    opened the draft and left the cursor on the line it had just committed, which is what gave one
    paint two cursors to focus in turn. `o`/`O` in `app/index.html` has always blurred first. The
    DANGEROUS HALF is the stale source, and it is separable - `paint` now takes a generation and a
    superseded frame appends nothing.
    ONE CORRECTION TO THE DIAGNOSIS ABOVE, MEASURED RATHER THAN ARGUED. Through ENTER the three
    frames all repaint from the SAME string, so the Enter gesture as reported destroys the row and
    triples the column but does NOT itself put a stale file on the wire. The stale WRITE is real one
    gesture over - a row being made, holding characters, settled by a nested paint into a file with
    one line more, underneath rows still closing over the file with one line less. Both are proven
    in `tests/app-enter-opens-a-line.test.mjs`, each with its own mutation arm.
