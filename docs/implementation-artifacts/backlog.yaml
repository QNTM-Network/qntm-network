- id: author-in-the-browser-not-in-obsidian
  title: '[present] [apex] [AN ARC] The thing everything is measured against: a human
    logs into qntm.network and does their content THERE. Today you can TOGGLE and you
    cannot AUTHOR — the web write path works end to end (click a checkbox, cycle through
    the hosted model, re-render from the fresh projection) and there is no way to write
    a line. This row is the arc the presentation stages serve and it stays open until
    the surface exists; stage 3 builds the first piece of it. Single user; signups,
    accounts and isolation are explicitly OUT of scope and their absence is a decision.
    NO FALSIFIER IS POSSIBLE TODAY and none is claimed — declared so the distance is
    in the queue instead of in a conversation.
    CLOSER, 2026-08-01, BY EXACTLY ONE BLOCKER AND NOT MORE. Until this date the act of
    authoring destroyed the cursor''s hold on the line being authored: the cycle stamped
    the line, the anchor could no longer find it, and the operator was left mid-sentence
    with the cursor somewhere else. `a-line-being-authored-keeps-its-cursor-through-the-
    first-stamp` (capabilities.yaml) closes that. WHAT IS STILL IN THE WAY, and none of
    it is smaller than the thing just closed: (1) a projection can still only arrive
    because the browser asked for it — `the-projection-arrives-without-being-asked-for`
    is open, so the cursor recovery this row now has is exercised on a poll the operator
    triggered rather than on the world moving under him; (2) CLOSED 2026-08-01 —
    `a-line-being-made-survives-a-projection-too`. A line he has OPENED but not yet
    committed now survives a projection arriving, moves with the lines the cycle changed
    around it, is released rather than duplicated when the cycle ingested it, and is HELD
    rather than destroyed when its place cannot be re-found. A view change still drops it,
    which is the half of that row''s reasoning that was always right; (3) the server
    still accepts a stale write — `the-write-is-refused-server-side` shipped the Worker
    half but the refusal is not switched on, which is the operator''s decision and needs
    the other repository; (4) CLOSED 2026-08-01 — `the-relative-anchor-has-no-landmark-
    in-an-empty-section`. A capture into a section with NO stamped line in it was refused
    outright, which was the majority of his sections and not a corner: 109 of 191 rendered
    sections carry no stamped line and 94 are heading-only, `## Inbox`, `## Work Capture`
    and `## Personal Capture` among them. The landmark it had missed is the section''s own
    HEADING, addressed by the ordinal a heading''s identity token is already built from.
    SO THE DISTANCE IS NOW TWO, AND ONE OF THEM IS IN ANOTHER REPOSITORY. What a person
    can do today, end to end and without leaving the browser: open a view, put the cursor
    on a line, press `o`, type a capture into a section the cycle has never filled, press
    Enter, watch the cycle take it and keep the cursor on it — and open the NEXT one while
    that cycle is still running, without losing it. What he still cannot rely on: the page
    telling him the world moved without him asking (1), and the server refusing a stale
    write (3). NOTHING PURELY CLIENT-SIDE REMAINS BETWEEN HERE AND AUTHORING IN THE
    BROWSER — (1) is a delivery mechanism this repository owns but which is a transport
    change rather than a presentation one, and (3) is a switch in the other repository and
    the operator''s own decision.
    AMENDED 2026-08-01 — THE DISTANCE IS STILL TWO AND ONE OF THEM SHRANK. Blocker (1) said a projection
    can only arrive because the browser asked. That is unchanged as a TRANSPORT fact, and its dangerous
    half is closed: `a-projection-can-arrive-and-be-held` means that when one does arrive, however it
    arrives, it does not repaint a line he is typing into and it does not move the screen backwards
    through a projection the server has already left. The browser half row 7 needs is therefore built
    and proven. What remains of (1) is the transport itself. Blocker (3), the server accepting a stale
    write, is unchanged and is in the other repository.
    AMENDED AGAIN 2026-08-01 — THE DISTANCE IS ONE, AND IT IS THE ONE IN THE OTHER REPOSITORY.
    `a-write-does-not-wait-for-the-cycle` shipped, and with it the transport half of (1): a write is
    answered when the vault has it (~10 s -> ~250 ms on every checkbox and every line commit) and
    the engine''s answer is COLLECTED SEPARATELY, by a bounded series of reads placed after the
    write. So a projection now reaches the screen with no gesture behind it and no write in flight
    to carry it — which is what (1) was for. What (1) still does NOT cover is a projection caused by
    something other than his own write: a rule firing on the server while he sits reading. That
    needs the graph server to be able to reach the Worker and it needs an answer to the wake-up
    cost, and it is the remainder recorded on `the-projection-arrives-without-being-asked-for`.
    IT IS NOT A BLOCKER ON AUTHORING AND THAT IS THE JUDGEMENT THIS AMENDMENT MAKES. Authoring is
    the operator typing and the machine answering; his own writes are what he is waiting on, and
    those now answer. A rule that fires while he reads is the world moving around him — real, and
    the next thing after the apex rather than before it.
    SO WHAT REMAINS BEFORE THIS ROW IS BLOCKER (3): the server accepting a stale write. The Worker
    half is complete and inert (`the-write-is-refused-server-side`), the browser can hold a refused
    edit''s characters (`a-refused-edit-is-held-unanchored`), and every write now carries a base the
    server could refuse. Switching it on is `vault-file-accepts-a-precondition`, in the other
    repository, and it is the operator''s own decision.'
