- id: add-view-and-edit-modes
  title: '[app] [edit] Give the demo page a VIEW mode (rendered, read-only) and an
    EDIT mode (markdown source, re-rendering as you type) with a toggle between them,
    session state held in memory. Edits are EPHEMERAL BY DESIGN — no persistence of
    any kind, everything lost on refresh — and that is declared with its own enforcer
    (state-edits-are-ephemeral) rather than left as an implicit TODO, so accidentally
    adding persistence later FAILs loudly instead of quietly changing what this is.
    The operator ask that opened the arc, and the smallest honest version of the qntm
    editing surface.'
  driving_capability: reader-can-toggle-edit-and-view-modes
  record: '2026-07-23 — SHIPPED. EditorSession (app/editor/session.ts) owns mode +
    text and nothing else — no DOM, no rendering — so the mode logic is reasonable
    about without a browser; app/main.ts is the single module that touches the page.
    Re-renders on every keystroke deliberately (pure renderer, small documents; debounce
    when a document actually stutters, not before). VERIFIED IN A REAL BROWSER, not
    just by predicate: rendered client-side, toggled both ways, typed markdown became
    a real h2 + strong live, refresh discarded the edits and restored the original,
    localStorage and sessionStorage both empty throughout, no console errors. content/demo.md
    rewritten — it still advertised the retired Python capability and the rendered-page-written
    sink, which the enforcers could not catch because prose is not checked. NOTE the
    two predicate bugs this arc found and fixed, both the same mistake one file format
    apart: assert_edits_are_ephemeral FAILed on session.ts''s own docstring ("no localStorage...")
    and assert_markdown_renders_client_side FAILed on flows.yaml''s comment explaining
    the retirement. Absence checks over raw text convict their own documentation.
    Fixed properly — strip JS comments before scanning, parse the YAML and inspect
    declared entries rather than grepping. Worth remembering the next time an absence
    invariant gets written.'
  state: passing
