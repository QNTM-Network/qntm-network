    sink. The retirement is the point, not a tidy-up: browser editing needs a browser
    renderer, and keeping the Python one would leave two implementations of one contract
    to diverge silently (architecture.yaml#one-implementation-per-concern). Sequenced
    AFTER the toolchain and BEFORE editability; the flows and sink retire in the SAME
