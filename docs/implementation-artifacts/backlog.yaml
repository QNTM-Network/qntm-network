- id: a-write-refuses-a-stale-base
  title: >-
    [haven] [1] [HALF A DAY] EVERY SAVE POSTS THE WHOLE FILE WITH NO PRECONDITION, AND THE LOSER
    IS THE CYCLE'S OWN OUTPUT. `commitLine` (app/index.html:1190) and `toggleTask` (:1164) both
    POST {path, markdown} where markdown is the entire view, computed by applyEdit against
    `fileSource` — the projection the painter was handed (app/present/paint.ts:242, :528). The
    Worker forwards it to POST /vault/file unconditionally (worker/src/app.js:254-259). Nothing in
    the path compares anything; grep for If-Match / ETag / 409 across worker/src, app and scripts
    returns one hit and it is a handle collision in auth.js:57. So a cycle that changed line 3
    while the operator was on line 7 is overwritten by his save. LAST WRITE WINS AND THE LOSER IS
    THE SYSTEM'S OWN COMPUTED BEHAVIOUR — his typing is never lost, the rule's output always is,
    silently, exit 0. THIS ROW ADDS THE CLIENT HALF OF OPTIMISTIC CONCURRENCY CONTROL, which is
    buildable here with NO server change: the browser hashes the markdown it was served, carries
    that base with every write, and REPORTS a divergence it cannot yet prevent — which converts a
    defect that has never been seen into one that names itself. THE SERVER HALF IS ROW 5 and is an
    honest abort, spelled out in section 8 of the design. FIRST IN THE SEQUENCE AND BEFORE ANY
    SPEED WORK: every later row widens the window in which this fires. FALSIFIER — repaint from a
    second fixture, commit an edit, and assert the write is refused (or reported) rather than
    applied; mutation-prove it by removing the base and watching the assertion go green wrongly.
  driving_capability: the-edit-is-a-safe-haven
  kind: capability
  state: diagnose-ready
- id: the-cursor-anchors-to-a-node-not-a-line-number
  title: >-
    [haven] [2] [HALF A DAY] THE CURSOR IS HELD AS A POSITIONAL INDEX, AND AN INDEX IS MEANINGFUL
    ONLY AGAINST THE STRING IT INDEXES. `FocusSurface` holds one number (app/present/focus.ts:50)
    and the painter restores the cursor by asking `isFocused(lineIndex)` while walking whatever
    source it is currently given (app/present/paint.ts:532-533). MEASURED, not reasoned: repaint a
    body from a projection with one line inserted above the cursor and the cursor lands on
    `## Today` with the typing gone; repaint from one where the edited line is absent entirely and
    ZERO editable rows are painted while `FocusSurface` still reports the old index — the cursor
    vanishes and nothing is reported anywhere. THE ANCHOR BECOMES IDENTITY, IN TIERS THAT DEGRADE
    EXPLICITLY: tier 1 is the `[[qntm:N]]` the engine already stamps into the printed line (it is
    already on the wire; paint.ts:273 already reasons about it), tier 2 is the exact source text of
    the line as painted, tier 3 is "not in this projection" and is REPORTED rather than guessed —
    the same walk-the-rungs-and-say-which-answered shape app/present/newline already uses. Chosen
    over rebasing the index (diff old against new, map 7 forward) because identity is free, already
    present, and survives a move BETWEEN SECTIONS, which index arithmetic does not. NEEDS NOTHING,
    and it is what makes row 3 small. FALSIFIER — the two repaints above, asserting the cursor
    lands on the SAME LINE after a line is inserted above it, and that tier 3 produces a reported
    refusal rather than silence.
  driving_capability: the-edit-is-a-safe-haven
  kind: capability
  record: >-
