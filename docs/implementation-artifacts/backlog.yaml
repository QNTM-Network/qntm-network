- id: a-write-refuses-a-stale-base
  title: >-
    [haven] [1] [HALF A DAY] EVERY SAVE POSTS THE WHOLE FILE WITH NO PRECONDITION, AND THE LOSER
    IS THE CYCLE'S OWN OUTPUT. `commitLine` (app/index.html:1190) and `toggleTask` (:1164) both
    POST {path, markdown} where markdown is the entire view, computed by applyEdit against
    `fileSource` — the projection the painter was handed (app/present/paint.ts:242, :528). The
    Worker forwards it to POST /vault/file unconditionally (worker/src/app.js:254-259). Nothing in
    the path compares anything; grep for If-Match / ETag / 409 across worker/src, app and scripts
    returns one hit and it is a handle collision in auth.js:57. So a cycle that changed line 3
    while the operator was on line 7 is overwritten by his save. LAST WRITE WINS AND THE LOSER IS
    THE SYSTEM'S OWN COMPUTED BEHAVIOUR — his typing is never lost, the rule's output always is,
    silently, exit 0. THIS ROW ADDS THE CLIENT HALF OF OPTIMISTIC CONCURRENCY CONTROL, which is
    buildable here with NO server change: the browser hashes the markdown it was served, carries
    that base with every write, and REPORTS a divergence it cannot yet prevent — which converts a
    defect that has never been seen into one that names itself. THE SERVER HALF IS ROW 5 and is an
    honest abort, spelled out in section 8 of the design. FIRST IN THE SEQUENCE AND BEFORE ANY
    SPEED WORK: every later row widens the window in which this fires. FALSIFIER — repaint from a
    second fixture, commit an edit, and assert the write is refused (or reported) rather than
    applied; mutation-prove it by removing the base and watching the assertion go green wrongly.
  driving_capability: the-edit-is-a-safe-haven
  kind: capability
  record: >-
    2026-07-31 — SHIPPED, AS A DETECTOR AND A REPORT. BOTH ARMS REPRODUCED FIRST on unmodified
    origin/main (532a8cf), driven through app/index.html's own lifted script (tests/fixtures/
    app-html-page.mjs) and the shipped dist/present.js. No server, no cycle, no POST anywhere.
    ARM 1 — a projection arrives while a line is open. The `<input>` closes over the source the
    painter gave it, the repaint that removes it fires blur, and the POST is the whole of the OLD
    projection: `#blocked` (a rule's output) and `qntm:124` (a task the cycle created) gone, his
    typing intact, the freshness line reading `as of … · 0 queued` and nothing else.
    ARM 2 IS A CORRECTION TO THIS ROW'S OWN DIAGNOSIS, AND IT IS THE WORSE PATH. `toggleTask` does
    not repaint from its edited string, so the painter's source still holds the file as it was
    BEFORE the first tick; a second tick inside the same cycle posts the FIRST TICK UNDONE. On the
    checkbox path the loser is the OPERATOR'S OWN GESTURE, not only the cycle's output — so "his
    typing is never lost" is true of `commitLine` and false of `toggleTask`.
    WHAT SHIPPED. `app/present/base.ts` (new, pure, imports nothing, no DOM/fetch/clock) holds the
    markdown the server last sent for the file on screen and reads any write as `current`, `stale`,
    `writing` or `unknown`. `baseOf` is `sha256-<hex>` of the file's UTF-8 bytes, UNNORMALISED and
    written out in TypeScript rather than taken from `crypto.subtle` — measured, that digest's
    promise resolves AFTER a `setImmediate` scheduled at the same moment, so hashing through it
    would have moved the POST one asynchronous turn later than every caller of this write path
    expects. It is checked against node's own `createHash("sha256")` instead of trusted.
    THE BASE IS TAKEN IN `paintView`, from the markdown the server sent, in the SAME CALL that
    installs it for painting — the discipline `FocusSurface`'s anchor already follows, applied to a
    per-FILE fact. One base, for the file on screen, replaced by the next projection and dropped
    with the graph at sign-out. The pending writes are counted separately because they are a
    different fact with a different lifetime.
    THE PRECONDITION IS THE STRING `applyEdit` TRANSFORMED, WHICH IS WHY `LineCommit` AND
    `CheckboxToggle` GAINED `source`. After an optimistic repaint the painter holds a string this
    app computed and `graphData` does not; a base read off the page would have matched every time.
    WHAT THE OPERATOR SEES — one sentence in the freshness line, in the register `reportCursorReading`
    and `declineNewLine` already use, said at the gesture beside "syncing…" AND again when that
    write's own answer lands ~14 s later: "this save was computed from an out-of-date copy of this
    file — whatever changed in it since is overwritten", or "this save left while an earlier save of
    this file was still running — the earlier one is overwritten".
    THE NOTE IS RE-ARMED FOR ITS OWN WRITE, and that was a measured defect before it was a comment:
    every caller says the freshness line one statement after its `await`, so a note set when the
    SECOND save left was consumed by the FIRST save's answer and the arm reported nothing at all.
    IT REPORTS AND DOES NOT PREVENT, DELIBERATELY. The server accepts whatever it is sent; refusing
    client-side would throw away characters a person typed in exchange for a status line, which is
    strictly worse than the defect. tests/present-base.test.mjs asserts the clobber still happens.
    NO NEW EDIT KIND, NO NEW WRITE UNIT. `SourceEdit` still the closed union of three, `markdown`
    still the whole view, `motions.ts` still imports nothing, and the two write sites now share one
    `writeFile` — one place a file is posted.
    NO SCENARIO, AND IT IS A MEASUREMENT NOT AN OMISSION. `base.ts`'s only caller is
    `app/index.html`; capture is a node module-load hook and node cannot import an HTML document,
