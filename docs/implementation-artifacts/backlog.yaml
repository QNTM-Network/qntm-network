    engine. The app reads its declaration from /config/declaration/*/current; presentation.json is
    no longer committed. Removes the two delivery paths seen 2026-10-08 (deployed, not live until a
    hand push). Builds on design-config-is-content.md. Was a-config-write-lands-on-both-consumers-
    or-neither before the backlog reset.
  kind: capability
  state: unscoped
