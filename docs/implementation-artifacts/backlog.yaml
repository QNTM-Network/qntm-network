    [haven] [9] [UNDER AN HOUR] "THE MARKDOWN IS THE TRUTH" IS A DANGEROUS SENTENCE, and the
    operator said so on 2026-07-31. It is written in five declaration and documentation files and
    in one application source file — app/present/source.ts:11, "the markdown is the truth, the DOM
    is a projection of it". IT IS TRUE IN THE DIRECTION IT WAS WRITTEN FOR: against the DOM the
    markdown really is authoritative, and nothing about that constraint weakens. Its failure is
    that it says "the truth" full stop, and the reader who comes next is a reader deciding what a
    WRITE should contain — who takes it at its word and posts the whole file. THE CORRECTION IN ONE
    SENTENCE: the graph is the truth and the markdown is a VIEW of it; the markdown is
    authoritative for the DELTA (a file carries no events, so the only thing it can honestly assert
    is the difference between what it said and what it now says) and DERIVED for the state; the
    cycle computes behaviour, so a projection is a consequence, not a copy. DOCUMENTATION ONLY — a
    comment, no behaviour. It is a separate row because the branch that found it was declaration-
    and-documentation-only and could not touch application source, and leaving it as a remembered
    intention is how the sentence survives. capabilities.yaml:410 was corrected in place on that
    branch; the three remaining copies are left because their subject really is the DOM and the
    general correction now lives in design-the-edit-is-a-safe-haven.md section 2.1.
