- id: gate-two-declines-a-config-it-cannot-load
  title: >-
    [runtime] THE GRAPH SERVER DELETES THE OLD CONFIG BEFORE ATTEMPTING TO LOAD THE REPLACEMENT, SO
    THERE IS NO MOMENT AT WHICH IT CAN SAY NO. `design-gate-two.md`, the full design. VERIFIED
    DIRECTLY, `server/app.py:470-487` (read-only, trunk clone, engine monorepo): `config_push`
    extracts the incoming tar to a staging directory, then unconditionally `shutil.rmtree(CONFIG)`
    before renaming the staging directory in - no load is attempted anywhere in the function. THE
    FIX, SINGLE-TENANT, NEEDS NO CROSS-REPO WORK - four steps, all in the engine monorepo, all
    against today's one shared `/data/config`: (1) call the engine's own `bundle_loader.load()`
    directly (not `load_with_fallback`, which swallows a failure rather than surfacing it) against
    the staged candidate before any deletion, refusing loudly with the typed error's own
    file/line/message/context on `BundleParseError`/`BundleValidationError` - half a day; (2) make
    `CONFIG` a symlink over two real sibling directories, swapped with one atomic `rename()` so a
    process death leaves either the old or the new target fully intact, never a missing or
    half-written one - half a day, needs (1); (3) an idempotency key (hash the incoming bytes,
    short-circuit a repeat of the last-applied hash to the same success response) so a lost ack is
    always safe to retry without double-applying - half a day, needs (2); (4) unique per-write
    staging names plus bounded retention of rejected candidates for inspection - under an hour,
    needs (1). CONVERTS "DELETE FIRST, VALIDATE NEVER" INTO "VALIDATE FIRST, DELETE ONLY A CONFIG
    PROVEN REPLACEABLE" for the operator's real, daily `graph-sync cycle` write path, with no
    dependency on the tenancy arc (see `stage-three-does-not-tenant-ize-config`, filed alongside
    this row, for why the MULTI-TENANT extension of this same fix is a separate, later, blocked
    piece of work).
  driving_capability: gate-two-declines-a-config-it-cannot-load
  kind: capability
  state: diagnose-ready
