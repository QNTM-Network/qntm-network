  driving_capability: client-core-stands-alone
  resolution: >
    Done 2026-10-10. app/present/ was NOT already free of the DOM: paint.ts (the painter), caret.ts
    and landing.ts touched the page, and index.ts re-exported fourteen app/shell modules. Those
    three moved to app/shell/; LineCommit moved to app/present/linecommit.ts; app/web.ts is the web
