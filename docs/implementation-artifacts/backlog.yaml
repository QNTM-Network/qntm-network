    with `readOnly` would have given a native caret for free. The CSSWG''s July 2025
    thread on standardising readonly input styles enumerates the divergence: WebKit
    "doesn''t render a text caret and no focus outline ring is rendered", Firefox "no
    text caret is rendered", Chromium "renders a text caret (but it doesn''t blink)".
