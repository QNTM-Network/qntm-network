- id: one-ordering-vocabulary-for-lists-and-children
  project: engine-and-clients
  captured: '2026-10-09'
  title: >
    Child order inside a view is the same problem as list order, and must use the same declared
    vocabulary. Today the engine orders children by declared field keys, after a hard-coded rule
    that puts nodes with NEXT or PARALLEL edges first (`_context_order_key`,
    apps/qntm-md/src/qntm_md/render/section_builder.py), and nothing orders along an #unlocks chain
    or puts done last. Operator wants, per view: order along a directed edge (an #unlocks chain
    renders in the order it was authored), status order (done last), and the choice of which wins
    (all done last, or done kept inside its chain). Proposed shape: an ordering is a list of keys —
    `{field, direction}` (exists), `{field, order: [values]}` (generalises the hard-coded
    priority rank table), `{chain: EDGE_TYPE}` (members joined by that edge kept together in edge
    order) — where key order decides precedence. The engine renders by it; the browser predicts
    placement and ranks lists by it. Two implementations by necessity (Python engine, TypeScript
    browser), held together by one compiled declaration and agreement tests, as default ordering
    already is. The engine half is filed in the monorepo backlog as
    children-order-by-declared-keys.
  kind: capability
  state: unscoped
