<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>qntm — the app</title>
<!-- SITE-ROOT-ABSOLUTE, not relative. This page is served at /app/, so `favicon.svg` would
     resolve to /app/favicon.svg and 404. Same reason as the two absolute paths in the module
     script below. -->
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="alternate icon" href="/favicon.ico" sizes="32x32" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<style>
  :root {
    --bg: #07080a; --ink: #eef1f4; --dim: #8b93a1; --line: #1b1f26;
    --glow: #7cc7ff; --accent: #cfe8ff;
    /* THE DECLARED GREEN. brand/BRAND.md section 2: "Colour system: green #3ff07f · black #0a0b0a
       · white #e6ebe6", with the glowing green point named as the brand device. This page is the
       half of the product that does not follow that palette yet — its blue is the "two styles, one
       unintended" the operator saw, and unifying them is its own wave, deliberately NOT attempted
       here. What IS here is that the two things already drawn in the identity's green — the tag
       chip and the cursor — name it once between them rather than twice. */
    --green: #3ff07f; --green-hairline: rgba(63, 240, 127, .32);

    /* ── THE SPACING SCALE ──────────────────────────────────────────────────────────────────
       Six steps and nothing between them. Every gap, pad and inset on this page is one of
       these or a `max()` of one against a safe-area inset — so "a bit more room here" is a
       step up the ladder rather than a new number, and two things that look aligned are
       aligned because they were given the same token rather than the same guess.
       The old page had .4/.5/.6/.7/.9/1.1/1.15/1.2/1.25/1.4/1.6/2rem, which is not a scale. */
    --s1: .25rem; --s2: .5rem; --s3: .75rem; --s4: 1rem; --s5: 1.5rem; --s6: 2rem;

    /* ── THE TYPE SCALE ────────────────────────────────────────────────────────────────────
       Four sizes for the CHROME. The reading column's heading ladder is deliberately NOT on
       this scale and is deliberately still written in literal rem: tests/app-view-rows.test.mjs
       reads those five font-sizes as NUMBERS and asserts they strictly decrease, and a
       `var()` is not a number to a test that has no browser. They are also five distinct
       values used once each, which is a ladder rather than a magic number written twice. */
    --t1: .68rem;  /* the letterspaced label — the smallest thing that is still a word */
    --t2: .78rem;  /* controls */
    --t3: .88rem;  /* secondary prose, drawer rows */
    --t4: 1rem;    /* body */
    --track: .28em;   /* the letter-spacing that makes a label a label */

    /* ── THE SHELL'S GEOMETRY ──────────────────────────────────────────────────────────────
       `--touch` is 44px at the root font size, which is the minimum target this page will
       offer a thumb. It is a token rather than a number in nine places because the moment it
       is a number in nine places, one of them is 40px and nobody can see which. */
    --touch: 2.75rem;
    --bar-h: 3.25rem;
    --drawer-w: min(21rem, 86vw);
    --col-w: 35rem;         /* the reading column's width — 560px, unchanged */
    --radius-sm: 6px; --radius: 10px; --radius-lg: 16px; --pill: 999px;

    /* ── THE EDGES OF THE SCREEN ───────────────────────────────────────────────────────────
       The viewport meta carries `viewport-fit=cover`, so on a notched phone the page really
       does run under the notch and the home indicator. Named once here; every fixed edge of
       the shell pays them with `max(step, inset)` so the inset can only ever ADD room. */
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);

    /* One motion, named once, so `prefers-reduced-motion` has exactly one thing to turn off. */
    --slide: .22s cubic-bezier(.2, .8, .25, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(1200px 800px at 50% -10%, #0e1420 0%, var(--bg) 60%);
    color: var(--ink);
    font: var(--t4)/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; align-items: flex-start; justify-content: center;
    /* The menu bar is FIXED, so the column starts below it — the one place that arithmetic is
       written, and it is written in tokens. Left/right pay the safe-area insets so a landscape
       phone does not put the first character of a line under the camera housing. */
    padding:
      calc(var(--bar-h) + var(--safe-t) + var(--s5))
      max(var(--s4), var(--safe-r))
      calc(var(--s6) + var(--safe-b))
      max(var(--s4), var(--safe-l));
  }
  .wrap { width: 100%; max-width: var(--col-w); }
  h1 { font-weight: 600; font-size: clamp(1.6rem, 5vw, 2.2rem); margin: var(--s2) 0 var(--s1); }
  .tag { color: var(--dim); margin: 0 0 var(--s6); }
  button {
    font: inherit; color: var(--bg); background: var(--accent);
    border: 0; border-radius: var(--radius); padding: var(--s3) var(--s4); cursor: pointer;
    font-weight: 600; transition: transform .08s ease, box-shadow .2s ease;
    box-shadow: 0 0 0 rgba(124,199,255,0);
  }
  button:hover { box-shadow: 0 0 28px rgba(124,199,255,.35); }
  button:active { transform: translateY(1px); }
  button.ghost { background: transparent; color: var(--accent); box-shadow: none; border: 1px solid var(--line); }
  button.ghost:hover { border-color: var(--glow); box-shadow: 0 0 20px rgba(124,199,255,.12); }
  /* One focus ring for the whole page, in the identity's green, on the only thing that can be
     focused without a pointer. It is `:focus-visible` so a mouse click does not draw it. */
  button:focus-visible, input:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
  input {
    font: inherit; color: var(--ink); background: #0c0f14; border: 1px solid var(--line);
    border-radius: var(--radius); padding: var(--s3) var(--s3); width: 100%; outline: none;
  }
  input:focus { border-color: var(--glow); box-shadow: 0 0 24px rgba(124,199,255,.15); }
  .row { display: flex; gap: var(--s2); align-items: center; }
  .stack > * + * { margin-top: var(--s3); }
  .muted { color: var(--dim); font-size: var(--t3); }
  .err { color: #ff9b9b; font-size: var(--t3); min-height: 1.2em; }
  .card { border: 1px solid var(--line); border-radius: var(--radius-lg); padding: var(--s4); background: rgba(255,255,255,.015); }
  .hidden { display: none !important; }

  /* THE ONE THING */
  .one-label { letter-spacing: var(--track); text-transform: uppercase; font-size: var(--t1); color: var(--glow); }
  .one-thing {
    font-size: clamp(1.3rem, 4.5vw, 1.9rem); font-weight: 600; line-height: 1.25;
    margin: var(--s1) 0 var(--s4); text-wrap: balance;
  }
  .one-empty { color: var(--dim); font-weight: 400; }
  .rest { margin-top: var(--s5); }
  .rest h3 { font-size: var(--t1); letter-spacing: var(--track); text-transform: uppercase; color: var(--dim); margin: 0 0 var(--s2); }
  .item { display: flex; align-items: flex-start; gap: var(--s2); padding: var(--s2) 0; border-top: 1px solid var(--line); }
  .item:first-child { border-top: 0; }
  .tick { flex: none; width: 20px; height: 20px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: transparent; padding: 0; }
  .tick:hover { border-color: var(--glow); box-shadow: 0 0 14px rgba(124,199,255,.25); }
  a { color: var(--accent); }

  /* ══ THE MENU BAR ═════════════════════════════════════════════════════════════════════════
     The app's one permanent piece of chrome, and the answer to "where am I, who am I, and how
     do I get somewhere else". It is present on the entry screen too — carrying the mark alone —
     because the alternative is a signed-out page with no identity on it at all, which is what
     the retired `.topbar` was for.

     WHAT IT HOLDS, LEFT TO RIGHT: the mark (dot + wordmark — brand/BRAND.md's `● qntm`
     combination mark, and the dot is the named brand device); WHERE YOU ARE (the current view's
     folder and title, the one thing the retired <select> said only while you were looking at
     it); then the identity, the way out, and the way to another view. The three controls sit
     together on the right because that is the edge the drawer comes from and the side a thumb
     reaches.

     IT IS FIXED, NOT STICKY. A sticky bar leaves the scroll position deciding whether the way
     to another view exists; on a phone, in a long view, that means scrolling to the top to
     change views. */
  .bar {
    position: fixed; inset: 0 0 auto 0; z-index: 20;
    display: flex; align-items: center; gap: var(--s3);
    height: calc(var(--bar-h) + var(--safe-t));
    padding: var(--safe-t) max(var(--s4), var(--safe-r)) 0 max(var(--s4), var(--safe-l));
    background: rgba(7, 8, 10, .82);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .bar-mark { display: flex; align-items: center; gap: var(--s2); flex: none; }
  /* The brand device. brand/BRAND.md section 2: "the glowing green dot (our signature
     element)". It is the only thing on this page drawn at full strength in the declared green,
     and it is 8px of it. */
  .bar-dot { width: .5rem; height: .5rem; border-radius: var(--pill); background: var(--green); box-shadow: 0 0 12px var(--green-hairline); }
  .bar-word { letter-spacing: var(--track); font-size: var(--t2); color: var(--ink); }
  /* WHERE YOU ARE. Takes the slack, and gives it back first: `min-width: 0` is what lets the
     view's title ellipse instead of shoving the controls off a 320px screen. */
  .bar-where { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: var(--s2); overflow: hidden; }
  .bar-folder { flex: none; font-size: var(--t1); letter-spacing: var(--track); text-transform: uppercase; color: var(--dim); white-space: nowrap; }
  .bar-view { font-size: var(--t3); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-acts { display: flex; align-items: center; gap: var(--s2); flex: none; }
  .bar-who { font-size: var(--t2); color: var(--dim); font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace; }
  /* Every control in the bar is at least --touch tall AND --touch wide. */
  .barbtn {
    display: inline-flex; align-items: center; justify-content: center; gap: var(--s2);
    min-height: var(--touch); min-width: var(--touch); padding: 0 var(--s3);
    background: transparent; color: var(--dim); border: 1px solid var(--line);
    border-radius: var(--pill); box-shadow: none;
    font-size: var(--t2); font-weight: 500;
  }
  .barbtn:hover { color: var(--ink); border-color: var(--glow); box-shadow: none; }
  .barbtn.key { color: var(--bg); background: var(--accent); border-color: var(--accent); font-weight: 600; }
  .kbd {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    font-size: var(--t1); opacity: .55;
  }

  /* ══ THE VIEW DRAWER ══════════════════════════════════════════════════════════════════════
     The shape the operator already reads in Obsidian: a panel off the right edge holding the
     views as a FOLDER TREE. The folders are the vault's own folders — see `folderOf` in the
     script for where that comes from and why it is `path` and not `domain`.

     IT IS A SLIDE, AND THE SLIDE IS ONE TOKEN. `--slide` is stated once and turned off once, in
     the `prefers-reduced-motion` block at the bottom of this sheet. A drawer that still moves
     for someone who asked it not to is a drawer with the transition written in four places. */
  .scrim {
    position: fixed; inset: 0; z-index: 30;
    background: rgba(4, 5, 7, .62);
    opacity: 0; visibility: hidden;
    transition: opacity var(--slide), visibility var(--slide);
  }
  .scrim.open { opacity: 1; visibility: visible; }
  .drawer {
    position: fixed; inset: 0 0 0 auto; z-index: 40;
    width: var(--drawer-w);
    display: flex; flex-direction: column;
    background: #0b0d12; border-left: 1px solid var(--line);
    padding: var(--safe-t) max(var(--s2), var(--safe-r)) var(--safe-b) 0;
    /* CLOSED IS `visibility: hidden`, NOT `display: none`. A translated-away panel that is still
       `visible` keeps its buttons in the tab order, so a keyboard would walk into a drawer
       nobody opened; `display: none` would stop it sliding at all. Visibility does both, and
       transitions as a step so the panel is still drawn while it slides OUT. */
    transform: translateX(100%); visibility: hidden;
    transition: transform var(--slide), visibility var(--slide);
  }
  .drawer.open { transform: translateX(0); visibility: visible; }
  .drawer-head {
    order: 1; flex: none;
    display: flex; align-items: center; justify-content: space-between; gap: var(--s2);
    padding: var(--s2) var(--s2) var(--s2) var(--s4);
    border-bottom: 1px solid var(--line);
  }
  .drawer-title { font-size: var(--t1); letter-spacing: var(--track); text-transform: uppercase; color: var(--dim); }
  .tree {
    order: 2; flex: 1; min-height: 0;
    overflow-y: auto; overscroll-behavior: contain;
    padding: var(--s2) var(--s2) var(--s4);
  }
  .drawer-note {
    order: 3; flex: none; margin: 0;
    padding: var(--s2) var(--s4) var(--s2);
    border-top: 1px solid var(--line);
    font-size: var(--t1); color: var(--dim);
  }
  /* A row is a row whether it opens a folder or a view — same height, same padding, same
     rhythm — because the tree is one list and only the leaves are destinations. */
  .foldbtn, .viewbtn {
    display: flex; align-items: center; gap: var(--s2);
    width: 100%; min-height: var(--touch); padding: 0 var(--s2);
    background: transparent; border: 0; border-radius: var(--radius); box-shadow: none;
    font-size: var(--t3); text-align: left;
  }
  .foldbtn { color: var(--dim); font-weight: 600; }
  .viewbtn { color: var(--ink); font-weight: 400; }
  .foldbtn:hover, .viewbtn:hover { background: rgba(255,255,255,.05); color: var(--ink); box-shadow: none; }
  .viewbtn.current { color: var(--green); background: rgba(63,240,127,.09); }
  /* `›` points RIGHT at rest, which is "there is more inside this"; a quarter turn down is
     "and here it is". The glyph is one character rather than an SVG because the drawer already
     has 72 rows and 72 inline SVGs is a payload for a chevron. */
  .chev { flex: none; width: 1rem; text-align: center; color: var(--dim); transform: rotate(90deg); transition: transform var(--slide); }
  .fold.shut > .foldbtn > .chev { transform: rotate(0deg); }
  .fold.shut > .foldkids { display: none; }
  /* The indent is one step, and it comes with a hairline — the line IS the "this is inside
     that" the indent alone only implies once you are three deep in dev/. */
  .foldkids { padding-left: var(--s3); margin-left: var(--s3); border-left: 1px solid var(--line); }
  .rowname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .count { flex: none; font-size: var(--t1); color: var(--dim); font-variant-numeric: tabular-nums; }
  .treenote { padding: var(--s3) var(--s2); font-size: var(--t3); color: var(--dim); }
  .noscroll { overflow: hidden; }

  #freshness { margin: 0 0 var(--s4); }

  /* ══ THE PHONE ════════════════════════════════════════════════════════════════════════════
     Two adaptations, both about a hand rather than about width for its own sake.

     THE BAR SHEDS WORDS, NOT CONTROLS. The wordmark goes (the dot alone is the reduced mark —
     brand/BRAND.md names the responsive full-qntm↔reduced pair as the system) and the folder
     crumb goes, because at 320px the honest choice is to keep the view's TITLE legible rather
     than truncate two things. Every control stays and every control keeps its 44px.

     THE DRAWER'S HEAD MOVES TO THE BOTTOM. On a 6" phone held one-handed the top-right corner
     is the one place a thumb cannot reach, and that is exactly where a drawer's close button
     conventionally sits. `order` moves the whole head — title and close together, one element,
     no second control — into the thumb's arc. The list keeps the rest of the panel and scrolls
     under it. (DOM order is unchanged, so tab order still starts at the close button; a phone
     has no Tab key and the visual/keyboard order only diverges where there is no keyboard.) */
  @media (max-width: 40rem) {
    .bar-word { display: none; }
    .bar-folder { display: none; }
    .kbd { display: none; }
    .drawer-head { order: 3; border-bottom: 0; border-top: 1px solid var(--line); }
    .tree { order: 1; }
    .drawer-note { order: 2; }
  }

  /* ══ ASKED NOT TO MOVE ════════════════════════════════════════════════════════════════════
     One block, because the motion is one token. The drawer still opens, closes, and traps
     focus; it simply arrives rather than travels. */
  @media (prefers-reduced-motion: reduce) {
    .scrim, .drawer, .chev, button { transition: none; }
  }
  /* ── THE READING COLUMN: ONE ROW GEOMETRY, TWO RENDITIONS ──────────────────────────────────
     Every line of a view is one ROW, and a row is `--row` tall whichever way the line is being
     shown — the app's rendition of it, or its verbatim source in an <input> once the cursor
     arrives. That equality is the whole fix for "if I click to edit it jumps around": the painter
     repaints the WHOLE view on every focus change (app/present/paint.ts), deliberately and
     correctly, so the only place the jump can be stopped is here, by making the two renditions
     occupy the same box.

     WHY THE GEOMETRY IS STATED ONCE AND NEVER PER KIND. The <input> the painter appends carries
     one class, `rawline`, and nothing that says which kind of line it replaced — and its text is
     set as a PROPERTY, so there is no `value` attribute for a selector to read either. A box that
     differs per kind is therefore a box the raw rendition cannot match. So the row height, the
     line box and the vertical rhythm are written once, for every child of .viewbody, and headings
     rank by SIZE and COLOUR rather than by the whitespace around them.

     WHAT THIS DOES NOT REACH: a line whose rendition WRAPS. A wrapped paragraph is two rows, an
     <input> cannot hold a second one, and no rule here can make it. That case needs the painter. */
  .viewbody {
    --row: 1.5rem;       /* one line of a view, in either rendition — the body's own line box */
    --row-gap: .5rem;    /* the space BETWEEN lines — the column's, never any one line's */
    --box-gap: .5rem;    /* checkbox to words, sized so the words barely move when the source shows */
    overflow-x: auto;
    line-height: var(--row);
  }
  /* No line owns its own vertical space. A margin on a heading is a margin the <input> that
     replaces it does not have, and that difference IS the jump. */
  .viewbody > * { margin: 0; min-height: var(--row); }
  .viewbody > * + * { margin-top: var(--row-gap); }
  /* A prose line is painted as its own one-line markdown document, so markdown-it's block margins
     land INSIDE the row. Zeroed, with the row's own box holding the space; `flow-root` stops those
     inner margins collapsing out through the line and becoming rhythm the column never asked for. */
  .viewbody > div { display: flow-root; }
  .viewbody p, .viewbody ul, .viewbody ol, .viewbody li, .viewbody blockquote, .viewbody pre { margin: 0; }
  /* The bullet sits where the source's `-` sits, so a list line does not slide sideways when its
     source appears. */
  .viewbody ul, .viewbody ol { padding-left: 0; list-style-position: inside; }

  /* THE HEADING LADDER. A view's `#` is the page's <h2> — the page owns the <h1> — so `##` becomes
     an <h3> and `###` an <h4>. That demotion is the painter's and it is right. What was missing was
     any rule below <h3>: `####` fell through to the browser default, which is BOLDER and LARGER
     than the <h3> above it, so `## Today` ranked BELOW `### Later`. The whole demoted range is
     stated here, strictly decreasing, and tests/app-view-rows.test.mjs keeps it that way.
     There is no `.viewbody h1` rule because there can be no <h1>: the painter clamps to 2..6. */
  .viewbody h2, .viewbody h3, .viewbody h4, .viewbody h5, .viewbody h6 {
    font-weight: 600; line-height: var(--row);
  }
  .viewbody h2 { font-size: 1.05rem; color: var(--accent); }
  .viewbody h3 { font-size: .95rem; color: var(--dim); }
  .viewbody h4 { font-size: .86rem; color: var(--dim); }
  .viewbody h5 { font-size: .78rem; color: var(--dim); }
  .viewbody h6 { font-size: .72rem; color: var(--dim); }

  .viewbody a { color: var(--glow); }
  .viewbody code { background: #0c0f14; border: 1px solid var(--line); border-radius: 6px; padding: .05rem .35rem; font-size: .85em; }
  .viewbody table { border-collapse: collapse; width: 100%; font-size: .9rem; }
  .viewbody th, .viewbody td { border: 1px solid var(--line); padding: .35rem .55rem; text-align: left; }
  /* Centred in its row, so a rule is one line like every other line. */
  .viewbody hr { border: 0; border-top: 1px solid var(--line); margin: calc((var(--row) - 1px) / 2) 0; }

  .viewbody .task { display: flex; gap: var(--box-gap); align-items: flex-start; padding: 0; cursor: pointer; }
  .viewbody .task input { flex: none; width: 1rem; height: 1rem; margin-top: calc((var(--row) - 1rem) / 2); accent-color: var(--glow); cursor: pointer; }
  .viewbody .task.done span { color: var(--dim); text-decoration: line-through; }
  .viewbody .task.syncing { opacity: .5; }
  .viewbody .task span { flex: 1; cursor: text; }

  /* THE FOCUSED LINE — the same row, now holding its own source.
     It is a real <input> because every affordance has to be expressible as an edit to the SOURCE
     STRING (app/present/paint.ts says why), so it is styled to BE the row rather than to look like
     a form control: the font of the line it replaced, the height of the row it sits in, no border
     and no slab of background. What marks it instead is the caret — the identity's electric green,
     the "glowing point" brand/BRAND.md names as the brand device — and a hairline under the row.
     Neither costs a pixel of layout, which is the point. No `margin` is set here: the row rhythm
     above already owns it, and re-stating it would out-specify the gap and reintroduce the jump. */
  .viewbody input.rawline {
    display: block; width: 100%; height: var(--row); padding: 0;
    background: transparent; border: 0; border-radius: 0;
    font: inherit; line-height: var(--row); color: var(--ink);
    caret-color: var(--green);
  }
  .viewbody input.rawline:focus { outline: none; box-shadow: inset 0 -1px 0 var(--green-hairline); }

  /* THE TAG CHIP — the `wired` rendition of the presentation cascade's `tags` key, and the ONLY
     style this stage adds. Scoped to `.viewbody .tagchip` so it cannot reach anything else on the
     page, and named `tagchip` rather than `tag` because `.tag` is already the hero tagline above.
     Whether a tag IS a chip is not decided here — that is presentation.json and app/present/. This
     rule only says what a chip looks like once the cascade has said there should be one.
     THE GREEN IS THE DECLARED ONE. #3ff07f, brand/BRAND.md section 2 ("Colour system: green
     #3ff07f · black #0a0b0a · white #e6ebe6") — read from the brand department, not sampled off a
     screenshot. It is the same green the caret above is, so both name it once.

     `inline-block` AND `line-height: 1` ARE TWO CONSTRAINTS MEETING, and neither may be dropped.

     `inline-block` is the STRIKE-THROUGH's. A `line-through` on `.task.done span` PROPAGATES to
     every descendant and a descendant cannot refuse it — `text-decoration: none` below simply does
     not work. What is exempt is an ATOMIC inline, which is what `inline-block` makes the chip. Try
     `display: inline` and the rule below stops having any effect: the line is drawn straight
     across the pill, which is the rendering fault that rule exists to prevent. Verified in a
     browser at 3x, both ways, rather than reasoned about.

     `line-height: 1` is THE ROW's. An atomic inline has to fit in the line box whole, so at the
     `1.45` this shipped with, a chipped line measured 24.0199px against 23.9986px for the same
     line without a chip. Tiny, and it is still the jump: a line whose WIRED rendition is taller
     than its raw form moves everything below it the moment the cursor lands, and it accumulates
     down a view full of tags. At `1` the chip's own box is its text's content area, which the row
     already contains by construction, and the pill's shape comes from padding and border — which
     an inline-block does have to count, so they are kept small deliberately. Measured after: a
     line with three chips is 23.9986px, the same as a line with none, to four decimal places. */
  .viewbody .tagchip {
    display: inline-block;
    padding: .1em .42rem;
    border-radius: 999px;
    background: rgba(63,240,127,.10);
    border: 1px solid rgba(63,240,127,.30);
    color: var(--green);
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    font-size: .82em;
    line-height: 1;
    white-space: nowrap;
    vertical-align: baseline;
  }
  /* A completed line strikes its text through. The chip is not the text — it is a token beside it,
     and a struck-through pill reads as a rendering fault rather than as "this is done". */
  .viewbody .task.done span .tagchip { text-decoration: none; }
</style>
</head>
<body>

<!-- ══ THE MENU BAR ═══════════════════════════════════════════════════════════════════════════
     Always present. `#barWhere` and `#barActs` are what appear once there is a session — the
     mark alone is the signed-out state, so the page is never chrome-less. -->
<header id="bar" class="bar">
  <div class="bar-mark"><span class="bar-dot"></span><span class="bar-word">qntm</span></div>
  <div id="barWhere" class="bar-where hidden">
    <span id="barFolder" class="bar-folder"></span>
    <span id="barView" class="bar-view"></span>
  </div>
  <div id="barActs" class="bar-acts hidden">
    <span id="who" class="bar-who"></span>
    <button id="signOut" class="barbtn">Sign out</button>
    <button id="viewsBtn" class="barbtn key" aria-haspopup="dialog" aria-expanded="false" aria-controls="drawer">
      Views<span class="kbd">\</span>
    </button>
  </div>
</header>

<!-- ══ THE VIEW DRAWER ════════════════════════════════════════════════════════════════════════
     Off the right edge until asked for. The scrim is a sibling rather than a parent so the
     drawer can slide over it, and it is clickable: a tap anywhere on the page outside the
     drawer closes it, which on a phone is a target the size of the screen. -->
<div id="scrim" class="scrim"></div>
<aside id="drawer" class="drawer" role="dialog" aria-modal="true" aria-label="Views" aria-hidden="true">
  <div class="drawer-head">
    <span class="drawer-title">Views</span>
    <button id="drawerClose" class="barbtn" aria-label="Close views">Close</button>
  </div>
  <nav id="viewTree" class="tree" aria-label="Views by folder"></nav>
  <p id="drawerNote" class="drawer-note"></p>
</aside>

<div class="wrap">

  <!-- ENTRY (logged out) -->
  <section id="entry" class="hidden">
    <h1>Enter the path.</h1>
    <p class="tag">One thing at a time. Sign in with a passkey — no password to hold.</p>
    <div class="card stack">
      <button id="loginBtn">Continue with a passkey</button>
      <div class="muted">New here?</div>
      <div class="row">
        <input id="handle" placeholder="claim a handle" autocomplete="username webauthn" autocapitalize="off" spellcheck="false" />
        <button id="registerBtn" class="ghost" style="white-space:nowrap">Create passkey</button>
      </div>
      <div id="entryErr" class="err"></div>
    </div>
  </section>

  <!-- GRAPH (logged in) — the rendering of the graph, hosted -->
  <section id="graph" class="hidden">
    <p id="freshness" class="muted"></p>
    <article id="viewBody" class="viewbody"></article>
  </section>

  <!-- APP (logged in) -->
  <section id="app" class="hidden">
    <h1 style="margin-bottom:1.2rem">What do you already know needs doing?</h1>
    <div class="card">
      <div class="one-label">The one thing</div>
      <div id="oneThing" class="one-thing"></div>
      <button id="doneBtn" class="hidden">Done — it's held no longer</button>
    </div>
    <div class="row stack" style="margin-top:1.2rem">
      <input id="captureBox" placeholder="capture a thought — press enter" autocomplete="off" />
    </div>
    <div id="appErr" class="err"></div>
    <div class="rest">
      <h3 id="restHead" class="hidden">Also held</h3>
      <div id="rest"></div>
    </div>
    <p style="margin-top:2rem"><button id="logoutBtn" class="ghost">Sign out</button></p>
  </section>
</div>

<script type="module">
import { startRegistration, startAuthentication } from "https://esm.sh/@simplewebauthn/browser@13";
import MarkdownIt from "https://esm.sh/markdown-it@14";

// THE PRESENTATION CASCADE. Built from app/present/ by scripts/build.mjs and committed, because
// Pages serves this repo from main:/ with no build step. This page used to decide how a line was
// shown, in 36 lines below; it now asks. See docs/implementation-artifacts/design-presentation-
// cascade.md section 7 for why the code has to live in a MODULE and not in this file.
//
// That section's reason was "`.flow-trace.yaml` includes `app` as a PATH PREFIX and this file is
// outside it". THIS FILE IS NOW INSIDE THAT PREFIX (it moved from /app.html to /app/index.html on
// 2026-07-30) AND THE CONCLUSION IS UNCHANGED — flow-trace's JS capture is a node module-load
// hook, and node cannot import an HTML document, so a decision written here is unobservable
// wherever the file sits. The prefix was never the binding reason; importability is. See
// .flow-trace.yaml.
//
// The path is SITE-ROOT-ABSOLUTE: this page is served at /app/, so "./dist/present.js" would
// resolve to /app/dist/present.js and 404.
import { paint, FocusSurface, PresentationContext, presentationFromDeclaration } from "/dist/present.js";

// Same markdown setup as app/render/renderer.ts — CommonMark + the table rule.
const md = new MarkdownIt("commonmark").enable("table");

// THE GLOBAL LEVEL (migration stage 2). Until the declaration is fetched every level is silent
// and every key falls through to DEFAULT, which is exactly what this page painted before there
// was a cascade — so a slow, missing or broken presentation.json costs nothing but a warning.
// The other levels arrive one stage at a time: MODE at stage 4, USER at stage 5 (from the user
// record behind the session, never from browser storage), VIEW and STRUCTURAL_NODE at stage 7
// once the snapshot envelope carries them.
let presentation = new PresentationContext();

// THE PAGE FETCHES; IT DOES NOT READ. Turning the document into levels is
// presentationFromDeclaration's job, in a TS module, where flow-trace can see the edge — a
// declaration read inside this file is a declaration whose reader nothing can observe, because
// node cannot import an HTML document and the JS capture is a module-load hook. What is left
// here is the fetch, which is what this page is for.
//
// SITE-ROOT-ABSOLUTE for the same reason as the import above: presentation.json is served from
// the site root, and this page is served at /app/.
async function loadPresentation() {
  try {
    const res = await fetch("/presentation.json", { cache: "no-cache" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const declared = presentationFromDeclaration(await res.json());
    for (const problem of declared.problems) {
      console.warn("presentation.json: " + problem);
    }
    presentation = declared.context;
  } catch (e) {
    // A declaration that cannot be read is reported, never guessed at. Silence is the honest
    // fallback: it is the same behaviour as declaring nothing, which is the behaviour the app
    // had before this level existed.
    console.warn("presentation.json not read (" + e.message + ") — every level stays silent");
    presentation = new PresentationContext();
  }
}

const API = location.hostname === "localhost" || location.hostname === "127.0.0.1"
  ? "http://localhost:8787"
  : "https://qntm-signups.lukeannison.workers.dev";

const $ = (id) => document.getElementById(id);
const tokenKey = "qntm_token";
let token = localStorage.getItem(tokenKey);

function show(view) {
  const loggedIn = view === "app";
  $("entry").classList.toggle("hidden", view !== "entry");
  $("app").classList.toggle("hidden", view !== "app");
  showShell(loggedIn);
  if (!loggedIn) $("graph").classList.add("hidden");
}

// The menu bar is always drawn; what a SESSION adds to it is where-you-are and the three
// controls. One function, called from every place that changes whether there is a session, so
// "signed out but the sign-out button is still there" cannot happen in one branch and not another.
function showShell(on) {
  $("barWhere").classList.toggle("hidden", !on);
  $("barActs").classList.toggle("hidden", !on);
}
async function api(path, { method = "POST", body, auth = false } = {}) {
  const headers = { "Content-Type": "application/json" };
  if (auth && token) headers["Authorization"] = "Bearer " + token;
  const res = await fetch(API + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok || data.ok === false) throw new Error(data.error || ("request failed (" + res.status + ")"));
  return data;
}

// --- render the app ---
function render(state) {
  $("who").textContent = state.handle ? "@" + state.handle : "";
  const one = state.oneThing;
  if (one) {
    $("oneThing").textContent = one.text;
    $("oneThing").classList.remove("one-empty");
    $("doneBtn").classList.remove("hidden");
    $("doneBtn").dataset.id = one.id;
  } else {
    $("oneThing").textContent = "Nothing held. Capture the first thing.";
    $("oneThing").classList.add("one-empty");
    $("doneBtn").classList.add("hidden");
  }
  const rest = (state.captures || []).slice(1);
  $("restHead").classList.toggle("hidden", rest.length === 0);
  $("rest").innerHTML = "";
  for (const c of rest) {
    const row = document.createElement("div");
    row.className = "item";
    const tick = document.createElement("button");
    tick.className = "tick"; tick.title = "done"; tick.dataset.id = c.id;
    tick.addEventListener("click", () => done(c.id));
    const span = document.createElement("div");
    span.textContent = c.text;
    row.append(tick, span);
    $("rest").append(row);
  }
}

async function loadState() {
  const state = await api("/app/state", { method: "GET", auth: true });
  render(state); show("app");
}
async function capture(text) {
  render(await api("/app/capture", { body: { text }, auth: true }));
}
async function done(id) {
  render(await api("/app/done", { body: { id }, auth: true }));
}

// --- graph viewer: the rendering of the graph, fetched behind the passkey ---
let graphData = null;

let currentViewId = null;

// Pick the view and hand its source to the painter. THIS PAGE NO LONGER DECIDES ANYTHING ABOUT
// HOW A LINE IS SHOWN — the task regex, the indent arithmetic, the heading demotion, the
// blank-line drop and the one-line-per-document fallback all moved to app/present/, unchanged.
// What is left here is what this page is actually for: finding the view, and posting the file.
// WHERE THE CURSOR IS (migration stage 3). One surface for the page, not one per paint: it has to
// survive the repaint it causes, or the line it just focused would be repainted with the cursor
// nowhere. It holds one number and nothing else — the FOCUS level is DERIVED from where the cursor
// is, never declared in a file, because a fact about the moment written down outlives the moment.
const focus = new FocusSurface();

// ══════════════════════════════════════════════════════════════════════════════════════════════
// THE VIEW DRAWER — the views as the folders they live in
//
// WHERE THE FOLDER COMES FROM, AND WHY IT IS NOT `domain`. Every view in the snapshot carries
// `path`, which is its rendered file's path INSIDE THE VAULT — `work/all.md`, `dev/qntm/queue.md`,
// `this_week.md`. It is not decoration: it is the address /app/edit-file writes back to, so it is
// the one field that cannot drift from where the file actually is. Its directory therefore IS the
// folder, in the same sense Obsidian means it, with no convention invented on top.
//
// A view also carries `domain`, which is what the retired <select> grouped by, and it is a
// DIFFERENT thing — a label hand-written in each view's config. Measured across the operator's
// 76 view configs, the two disagree in three ways that all cost the reader something:
//   * it is COARSER — 14 views under `dev/` are one `dev` bucket, though they are four separate
//     projects in four separate folders (dev/qntm, dev/flow-trace, dev/qntm-network,
//     dev/trace-orchestration);
//   * it RENAMES — `character-development/ego-ideal.md` is domain `character`, and the five views
//     in `spirit/program/` are domain `program`, which is not a folder at the top level at all;
//   * and it can be FLATLY WRONG — `dev/test-scratchpad.md` is declared domain `personal`.
// The vault's root files (`this_week.md`, `inbox.md`, `habits.md`, `metrics.md`, `routines.md`)
// carry domain `all`, which is not a folder either; here they simply sit at the tree's root, the
// way a loose file does in Obsidian.
//
// So: FOLDERS COME FROM `path`. `domain` is left alone — it is the engine's label, it is read by
// the engine, and re-deriving it here would be this app inventing a second answer to a question
// the vault already answers.
const folderOf = (path) => {
  const at = String(path ?? "").lastIndexOf("/");
  return at === -1 ? "" : String(path).slice(0, at);
};

/** The views as a tree of folders, built from their paths. Nested, because the vault is. */
function foldersOf(views) {
  const root = { name: "", folders: new Map(), views: [] };
  for (const v of views) {
    const segments = String(v.path ?? "").split("/");
    let node = root;
    for (const segment of segments.slice(0, -1)) {
      if (!node.folders.has(segment)) node.folders.set(segment, { name: segment, folders: new Map(), views: [] });
      node = node.folders.get(segment);
    }
    node.views.push(v);
  }
  return root;
}

const viewsUnder = (node) =>
  node.views.length + [...node.folders.values()].reduce((n, f) => n + viewsUnder(f), 0);
const holdsView = (node, id) =>
  node.views.some((v) => v.id === id) || [...node.folders.values()].some((f) => holdsView(f, id));

// Every button in the drawer, in tab order, and every view button by id. Both are rebuilt with
// the tree — a stale element here would be a focus trap that jumps to a button nobody can see.
const drawerStops = [];
const viewButtons = new Map();
let drawerIsOpen = false;

/** A row: chevron (folders only), name, count. The same shape for a folder and for a view. */
function treeRow(className, glyph, name, count) {
  const button = document.createElement("button");
  button.className = className;
  button.type = "button";
  if (glyph !== null) {
    const chev = document.createElement("span");
    chev.className = "chev";
    chev.textContent = glyph;
    button.append(chev);
  }
  const label = document.createElement("span");
  label.className = "rowname";
  label.textContent = name;
  button.append(label);
  if (count !== null) {
    const tally = document.createElement("span");
    tally.className = "count";
    tally.textContent = String(count);
    button.append(tally);
  }
  return button;
}

/** Folders first and alphabetical, then this folder's own views by title — Obsidian's order. */
function paintFolder(node, into) {
  for (const folder of [...node.folders.values()].sort((a, b) => a.name.localeCompare(b.name))) {
    const box = document.createElement("div");
    // OPEN IF IT HOLDS WHERE YOU ARE, shut otherwise. 76 views in ten folders is a scroll if
    // everything is open, and a drawer that lands showing the view you are in is the one that
    // answers "where am I" without being read.
    const open = holdsView(folder, currentViewId);
    box.className = open ? "fold" : "fold shut";
    const head = treeRow("foldbtn", "›", folder.name, viewsUnder(folder));
    head.setAttribute("aria-expanded", open ? "true" : "false");
    head.addEventListener("click", () => {
      const shut = box.classList.toggle("shut");
      head.setAttribute("aria-expanded", shut ? "false" : "true");
    });
    const kids = document.createElement("div");
    kids.className = "foldkids";
    box.append(head, kids);
    into.append(box);
    drawerStops.push(head);
    paintFolder(folder, kids);
  }
  for (const v of [...node.views].sort((a, b) => a.title.localeCompare(b.title))) {
    const button = treeRow("viewbtn", null, v.title, null);
    button.addEventListener("click", () => {
      paintView(v.id);
      closeDrawer();
    });
    into.append(button);
    drawerStops.push(button);
    viewButtons.set(v.id, button);
  }
}

function buildDrawer(views) {
  drawerStops.length = 0;
  viewButtons.clear();
  drawerStops.push($("drawerClose"));
  const tree = $("viewTree");
  tree.innerHTML = "";
  if (!views || views.length === 0) {
    const note = document.createElement("p");
    note.className = "treenote";
    note.textContent = "No views yet.";
    tree.append(note);
    $("drawerNote").textContent = "";
  } else {
    const root = foldersOf(views);
    paintFolder(root, tree);
    const folders = root.folders.size;
    $("drawerNote").textContent =
      `${views.length} views · ${folders} folder${folders === 1 ? "" : "s"} · \\ opens, Esc closes`;
  }
  // Escape and the Tab wrap are bound PER STOP rather than read off document.activeElement,
  // because a handler that asks the document where the cursor is only works in a browser — this
  // way the trap is the page's own code and a test can drive it.
  drawerStops.forEach((stop, index) => stop.addEventListener("keydown", (e) => drawerKey(e, index)));
  markWhereWeAre();
}

function drawerKey(e, index) {
  if (e.key === "Escape") { e.preventDefault(); closeDrawer(); return; }
  if (e.key !== "Tab" || drawerStops.length === 0) return;
  const last = drawerStops.length - 1;
  if (e.shiftKey && index === 0) { e.preventDefault(); drawerStops[last].focus(); }
  else if (!e.shiftKey && index === last) { e.preventDefault(); drawerStops[0].focus(); }
}

function openDrawer() {
  if (!graphData) return; // nothing to choose between, and no session to choose it for
  drawerIsOpen = true;
  $("drawer").classList.add("open");
  $("scrim").classList.add("open");
  $("drawer").setAttribute("aria-hidden", "false");
  $("viewsBtn").setAttribute("aria-expanded", "true");
  document.body.classList.add("noscroll");
  // The current view if it is on screen, else the close button. Landing the cursor on where you
  // already are means the first arrow key moves from here rather than from the top of a list.
  (viewButtons.get(currentViewId) ?? drawerStops[0] ?? $("drawer")).focus();
}

function closeDrawer() {
  const wasOpen = drawerIsOpen;
  drawerIsOpen = false;
  $("drawer").classList.remove("open");
  $("scrim").classList.remove("open");
  $("drawer").setAttribute("aria-hidden", "true");
  $("viewsBtn").setAttribute("aria-expanded", "false");
  document.body.classList.remove("noscroll");
  // Focus goes back to what opened it — but only if it WAS open, so closing an already-closed
  // drawer (boot, sign-out) does not steal the cursor from whatever has it.
  if (wasOpen) $("viewsBtn").focus();
}

/** The bar says where you are, and the drawer marks it. Both from the same one fact. */
function markWhereWeAre() {
  const v = graphData?.snapshot?.views.find((x) => x.id === currentViewId);
  $("barFolder").textContent = v ? folderOf(v.path) : "";
  $("barView").textContent = v ? v.title : "";
  for (const [id, button] of viewButtons) button.classList.toggle("current", id === currentViewId);
}

function paintView(id) {
  currentViewId = id;
  markWhereWeAre();
  const v = graphData?.snapshot?.views.find((x) => x.id === id);
  const body = $("viewBody");
  body.innerHTML = "";
  if (!v) return;
  paint(body, v.markdown, presentation, {
    markdown: md,
    focus,
    onCheckboxToggle: (toggle) => toggleTask(v, toggle),
    onLineCommit: (commit) => commitLine(v, commit),
  });
}

// Tick/untick a task: POST the edited view, let the server cycle, then re-render from the fresh
// projection. Optimistic — the box shows its new state immediately; reverts on failure.
//
// THE EDIT ITSELF IS NOT MADE HERE. `toggle.markdown` is the whole view source with exactly one
// glyph changed, computed by app/present/source.js#applyEdit, and `null` means the edit did not
// apply — the same refusal the old inline regex expressed by returning early, with the same
// consequence: no optimistic UI change and no POST. The DOM is never read to produce it.
async function toggleTask(view, toggle) {
  const { box, row, markdown: next } = toggle;
  if (next === null) return;
  row.classList.toggle("done", box.checked);
  row.classList.add("syncing");
  box.disabled = true;
  $("freshness").textContent = "syncing…";
  try {
    const data = await api("/app/edit-file", { body: { path: view.path, markdown: next }, auth: true });
    graphData = data;
    paintView(currentViewId);
    const when = new Date(data.snapshot.generated_at).toLocaleString();
    $("freshness").textContent = `as of ${when} · ${data.pending_edits} queued`;
  } catch (e) {
    box.checked = !box.checked;
    row.classList.toggle("done", box.checked);
    row.classList.remove("syncing");
    box.disabled = false;
    $("freshness").textContent = "sync failed: " + e.message;
  }
}

// The cursor leaves a line it changed: POST the edited view, let the server cycle, re-render from
// the fresh projection. Same write path as the checkbox, and deliberately so — one endpoint, one
// whole-file write unit, one place where a view is replaced.
//
// AGAIN, THE EDIT IS NOT MADE HERE. `commit.markdown` is the whole view source with exactly that
// one line replaced, computed by app/present/source.js#applyEdit from the source string the
// painter was given plus the characters the input held. `null` means the edit was refused — the
// line was left unchanged, or the text was not one line — and a refusal is not a POST.
async function commitLine(view, commit) {
  if (commit.markdown === null) return;
  $("freshness").textContent = "syncing…";
  try {
    const data = await api("/app/edit-file", { body: { path: view.path, markdown: commit.markdown }, auth: true });
    graphData = data;
    paintView(currentViewId);
    const when = new Date(data.snapshot.generated_at).toLocaleString();
    $("freshness").textContent = `as of ${when} · ${data.pending_edits} queued`;
  } catch (e) {
    // The painter has already repainted this view from the edited source, so the page is showing
    // the edit; what failed is the write. Repaint from the LAST KNOWN SERVER STATE so the screen
    // stops claiming something the vault does not have.
    paintView(currentViewId);
    $("freshness").textContent = "sync failed: " + e.message;
  }
}

// The logged-in home: the graph, not Focus.
async function enterGraph() {
  $("entry").classList.add("hidden");
  $("app").classList.add("hidden");
  showShell(true);
  $("graph").classList.remove("hidden");
  // The declaration before the paint, so the first view a person sees is already resolved
  // against it. Sequential rather than parallel on purpose: two round trips at sign-in is
  // cheaper than a first paint that changes under the reader a moment later.
  await loadPresentation();
  await loadGraph();
}

async function loadGraph() {
  const data = await api("/app/graph", { method: "GET", auth: true });
  graphData = data;
  // Identity lives in the bar now, and the bar's action cluster is what showShell() reveals —
  // so `#who` is never hidden on its own account and nothing here has to un-hide it.
  $("who").textContent = data.handle ? "@" + data.handle : "";
  if (!data.snapshot) {
    $("freshness").textContent = "No snapshot yet — run graph-sync push on the laptop.";
    $("viewBody").innerHTML = "";
    currentViewId = null;
    buildDrawer([]);
    return;
  }
  const when = new Date(data.snapshot.generated_at).toLocaleString();
  $("freshness").textContent = `as of ${when} · ${data.pending_edits} queued`;
  const def = data.snapshot.views.find((v) => v.id === "this-week") || data.snapshot.views[0];
  // Before the tree, so the folders holding the view we are about to paint land OPEN.
  currentViewId = def.id;
  buildDrawer(data.snapshot.views);
  paintView(def.id);
}

// --- passkey register / login ---
async function register() {
  $("entryErr").textContent = "";
  const handle = $("handle").value.trim();
  if (!handle) { $("entryErr").textContent = "pick a handle first"; return; }
  try {
    const { flowId, options } = await api("/auth/register/options", { body: { handle } });
    const response = await startRegistration({ optionsJSON: options });
    const out = await api("/auth/register/verify", { body: { flowId, response } });
    token = out.token; localStorage.setItem(tokenKey, token);
    await enterGraph();
  } catch (e) { $("entryErr").textContent = e.message; }
}
async function login() {
  $("entryErr").textContent = "";
  try {
    const { flowId, options } = await api("/auth/login/options", { body: {} });
    const response = await startAuthentication({ optionsJSON: options });
    const out = await api("/auth/login/verify", { body: { flowId, response } });
    token = out.token; localStorage.setItem(tokenKey, token);
    await enterGraph();
  } catch (e) { $("entryErr").textContent = e.message; }
}
function logout() {
  api("/auth/logout", { auth: true }).catch(() => {});
  localStorage.removeItem(tokenKey); token = null;
  graphData = null;
  currentViewId = null;
  closeDrawer();
  buildDrawer([]);
  $("graph").classList.add("hidden");
  show("entry");
}

// --- wire up ---
$("registerBtn").addEventListener("click", register);
$("loginBtn").addEventListener("click", login);
$("handle").addEventListener("keydown", (e) => { if (e.key === "Enter") register(); });
$("doneBtn").addEventListener("click", () => done($("doneBtn").dataset.id));
$("logoutBtn").addEventListener("click", logout);
$("signOut").addEventListener("click", logout);

// --- the shell ---
$("viewsBtn").addEventListener("click", () => (drawerIsOpen ? closeDrawer() : openDrawer()));
$("drawerClose").addEventListener("click", closeDrawer);
$("scrim").addEventListener("click", closeDrawer);

// TWO KEYS, AND ONLY TWO. Escape closes from anywhere, including from a line the cursor is in —
// the drawer is modal, and a modal that only listens while it has focus is a modal you can get
// stuck behind. `\` opens it, and is REFUSED while the cursor is in a text field, because every
// line of a view becomes an <input> the moment it is clicked and a global letter key that eats a
// character out of the operator's own source would be this shell breaking the app it wraps.
const typingIn = (target) => {
  const tag = String(target?.tagName ?? "").toLowerCase();
  return tag === "input" || tag === "textarea" || tag === "select";
};
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && drawerIsOpen) { e.preventDefault(); closeDrawer(); return; }
  if (e.key === "\\" && !drawerIsOpen && !typingIn(e.target)) { e.preventDefault(); openDrawer(); }
});
$("captureBox").addEventListener("keydown", async (e) => {
  if (e.key !== "Enter") return;
  const v = e.target.value.trim(); if (!v) return;
  e.target.value = "";
  try { await capture(v); } catch (err) { $("appErr").textContent = err.message; }
});

// --- boot: try the stored session, else show entry ---
(async () => {
  if (token) { try { await enterGraph(); return; } catch { localStorage.removeItem(tokenKey); token = null; } }
  show("entry");
})();
</script>
</body>
</html>
