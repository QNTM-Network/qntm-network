<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>qntm — the app</title>
<!-- SITE-ROOT-ABSOLUTE, not relative. This page is served at /app/, so `favicon.svg` would
     resolve to /app/favicon.svg and 404. Same reason as the two absolute paths in the module
     script below. -->
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="alternate icon" href="/favicon.ico" sizes="32x32" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<style>
  :root {
    --bg: #07080a; --ink: #eef1f4; --dim: #8b93a1; --line: #1b1f26;
    --glow: #7cc7ff; --accent: #cfe8ff;
    /* THE DECLARED GREEN. brand/BRAND.md section 2: "Colour system: green #3ff07f · black #0a0b0a
       · white #e6ebe6", with the glowing green point named as the brand device. This page is the
       half of the product that does not follow that palette yet — its blue is the "two styles, one
       unintended" the operator saw, and unifying them is its own wave, deliberately NOT attempted
       here. What IS here is that the two things already drawn in the identity's green — the tag
       chip and the cursor — name it once between them rather than twice. */
    --green: #3ff07f; --green-hairline: rgba(63, 240, 127, .32);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(1200px 800px at 50% -10%, #0e1420 0%, var(--bg) 60%);
    color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; align-items: flex-start; justify-content: center;
    padding: max(6vh, 2rem) 1.25rem 4rem;
  }
  .wrap { width: 100%; max-width: 560px; }
  .brand { letter-spacing: .32em; text-transform: uppercase; font-size: .72rem; color: var(--dim); }
  h1 { font-weight: 600; font-size: clamp(1.6rem, 5vw, 2.2rem); margin: .4rem 0 .2rem; }
  .tag { color: var(--dim); margin: 0 0 2rem; }
  button {
    font: inherit; color: var(--bg); background: var(--accent);
    border: 0; border-radius: 10px; padding: .7rem 1.1rem; cursor: pointer;
    font-weight: 600; transition: transform .08s ease, box-shadow .2s ease;
    box-shadow: 0 0 0 rgba(124,199,255,0);
  }
  button:hover { box-shadow: 0 0 28px rgba(124,199,255,.35); }
  button:active { transform: translateY(1px); }
  button.ghost { background: transparent; color: var(--accent); box-shadow: none; border: 1px solid var(--line); }
  button.ghost:hover { border-color: var(--glow); box-shadow: 0 0 20px rgba(124,199,255,.12); }
  input {
    font: inherit; color: var(--ink); background: #0c0f14; border: 1px solid var(--line);
    border-radius: 10px; padding: .75rem .9rem; width: 100%; outline: none;
  }
  input:focus { border-color: var(--glow); box-shadow: 0 0 24px rgba(124,199,255,.15); }
  .row { display: flex; gap: .6rem; align-items: center; }
  .stack > * + * { margin-top: .9rem; }
  .muted { color: var(--dim); font-size: .88rem; }
  .err { color: #ff9b9b; font-size: .88rem; min-height: 1.2em; }
  .card { border: 1px solid var(--line); border-radius: 16px; padding: 1.1rem 1.15rem; background: rgba(255,255,255,.015); }
  .hidden { display: none !important; }

  /* THE ONE THING */
  .one-label { letter-spacing: .28em; text-transform: uppercase; font-size: .64rem; color: var(--glow); }
  .one-thing {
    font-size: clamp(1.3rem, 4.5vw, 1.9rem); font-weight: 600; line-height: 1.25;
    margin: .35rem 0 1rem; text-wrap: balance;
  }
  .one-empty { color: var(--dim); font-weight: 400; }
  .rest { margin-top: 1.6rem; }
  .rest h3 { font-size: .7rem; letter-spacing: .22em; text-transform: uppercase; color: var(--dim); margin: 0 0 .5rem; }
  .item { display: flex; align-items: flex-start; gap: .6rem; padding: .5rem 0; border-top: 1px solid var(--line); }
  .item:first-child { border-top: 0; }
  .tick { flex: none; width: 20px; height: 20px; border-radius: 6px; border: 1px solid var(--line); background: transparent; padding: 0; }
  .tick:hover { border-color: var(--glow); box-shadow: 0 0 14px rgba(124,199,255,.25); }
  .topbar { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 1.4rem; }
  a { color: var(--accent); }

  /* NAV (tabs, logged in) */
  .nav { display: flex; gap: .4rem; margin-bottom: 1.4rem; }
  .tab {
    background: transparent; color: var(--dim); border: 1px solid var(--line);
    border-radius: 999px; padding: .4rem .95rem; font-size: .82rem; box-shadow: none;
  }
  .tab:hover { border-color: var(--glow); box-shadow: 0 0 16px rgba(124,199,255,.12); }
  .tab.active { color: var(--bg); background: var(--accent); border-color: var(--accent); }

  /* GRAPH viewer */
  .gbar { display: flex; align-items: center; gap: .6rem; margin-bottom: .5rem; }
  select {
    font: inherit; color: var(--ink); background: #0c0f14; border: 1px solid var(--line);
    border-radius: 10px; padding: .55rem .8rem; width: 100%; outline: none;
  }
  select:focus { border-color: var(--glow); box-shadow: 0 0 24px rgba(124,199,255,.15); }
  #freshness { margin: 0 0 1.1rem; }
  /* ── THE READING COLUMN: ONE ROW GEOMETRY, TWO RENDITIONS ──────────────────────────────────
     Every line of a view is one ROW, and a row is `--row` tall whichever way the line is being
     shown — the app's rendition of it, or its verbatim source in an <input> once the cursor
     arrives. That equality is the whole fix for "if I click to edit it jumps around": the painter
     repaints the WHOLE view on every focus change (app/present/paint.ts), deliberately and
     correctly, so the only place the jump can be stopped is here, by making the two renditions
     occupy the same box.

     WHY THE GEOMETRY IS STATED ONCE AND NEVER PER KIND. The <input> the painter appends carries
     one class, `rawline`, and nothing that says which kind of line it replaced — and its text is
     set as a PROPERTY, so there is no `value` attribute for a selector to read either. A box that
     differs per kind is therefore a box the raw rendition cannot match. So the row height, the
     line box and the vertical rhythm are written once, for every child of .viewbody, and headings
     rank by SIZE and COLOUR rather than by the whitespace around them.

     WHAT THIS DOES NOT REACH: a line whose rendition WRAPS. A wrapped paragraph is two rows, an
     <input> cannot hold a second one, and no rule here can make it. That case needs the painter. */
  .viewbody {
    --row: 1.5rem;       /* one line of a view, in either rendition — the body's own line box */
    --row-gap: .5rem;    /* the space BETWEEN lines — the column's, never any one line's */
    --box-gap: .5rem;    /* checkbox to words, sized so the words barely move when the source shows */
    overflow-x: auto;
    line-height: var(--row);
  }
  /* No line owns its own vertical space. A margin on a heading is a margin the <input> that
     replaces it does not have, and that difference IS the jump. */
  .viewbody > * { margin: 0; min-height: var(--row); }
  .viewbody > * + * { margin-top: var(--row-gap); }
  /* A prose line is painted as its own one-line markdown document, so markdown-it's block margins
     land INSIDE the row. Zeroed, with the row's own box holding the space; `flow-root` stops those
     inner margins collapsing out through the line and becoming rhythm the column never asked for. */
  .viewbody > div { display: flow-root; }
  .viewbody p, .viewbody ul, .viewbody ol, .viewbody li, .viewbody blockquote, .viewbody pre { margin: 0; }
  /* The bullet sits where the source's `-` sits, so a list line does not slide sideways when its
     source appears. */
  .viewbody ul, .viewbody ol { padding-left: 0; list-style-position: inside; }

  /* THE HEADING LADDER. A view's `#` is the page's <h2> — the page owns the <h1> — so `##` becomes
     an <h3> and `###` an <h4>. That demotion is the painter's and it is right. What was missing was
     any rule below <h3>: `####` fell through to the browser default, which is BOLDER and LARGER
     than the <h3> above it, so `## Today` ranked BELOW `### Later`. The whole demoted range is
     stated here, strictly decreasing, and tests/app-view-rows.test.mjs keeps it that way.
     There is no `.viewbody h1` rule because there can be no <h1>: the painter clamps to 2..6. */
  .viewbody h2, .viewbody h3, .viewbody h4, .viewbody h5, .viewbody h6 {
    font-weight: 600; line-height: var(--row);
  }
  .viewbody h2 { font-size: 1.05rem; color: var(--accent); }
  .viewbody h3 { font-size: .95rem; color: var(--dim); }
  .viewbody h4 { font-size: .86rem; color: var(--dim); }
  .viewbody h5 { font-size: .78rem; color: var(--dim); }
  .viewbody h6 { font-size: .72rem; color: var(--dim); }

  .viewbody a { color: var(--glow); }
  .viewbody code { background: #0c0f14; border: 1px solid var(--line); border-radius: 6px; padding: .05rem .35rem; font-size: .85em; }
  .viewbody table { border-collapse: collapse; width: 100%; font-size: .9rem; }
  .viewbody th, .viewbody td { border: 1px solid var(--line); padding: .35rem .55rem; text-align: left; }
  /* Centred in its row, so a rule is one line like every other line. */
  .viewbody hr { border: 0; border-top: 1px solid var(--line); margin: calc((var(--row) - 1px) / 2) 0; }

  .viewbody .task { display: flex; gap: var(--box-gap); align-items: flex-start; padding: 0; cursor: pointer; }
  .viewbody .task input { flex: none; width: 1rem; height: 1rem; margin-top: calc((var(--row) - 1rem) / 2); accent-color: var(--glow); cursor: pointer; }
  .viewbody .task.done span { color: var(--dim); text-decoration: line-through; }
  .viewbody .task.syncing { opacity: .5; }
  .viewbody .task span { flex: 1; cursor: text; }

  /* THE FOCUSED LINE — the same row, now holding its own source.
     It is a real <input> because every affordance has to be expressible as an edit to the SOURCE
     STRING (app/present/paint.ts says why), so it is styled to BE the row rather than to look like
     a form control: the font of the line it replaced, the height of the row it sits in, no border
     and no slab of background. What marks it instead is the caret — the identity's electric green,
     the "glowing point" brand/BRAND.md names as the brand device — and a hairline under the row.
     Neither costs a pixel of layout, which is the point. No `margin` is set here: the row rhythm
     above already owns it, and re-stating it would out-specify the gap and reintroduce the jump. */
  .viewbody input.rawline {
    display: block; width: 100%; height: var(--row); padding: 0;
    background: transparent; border: 0; border-radius: 0;
    font: inherit; line-height: var(--row); color: var(--ink);
    caret-color: var(--green);
  }
  .viewbody input.rawline:focus { outline: none; box-shadow: inset 0 -1px 0 var(--green-hairline); }

  /* THE TAG CHIP — the `wired` rendition of the presentation cascade's `tags` key, and the ONLY
     style this stage adds. Scoped to `.viewbody .tagchip` so it cannot reach anything else on the
     page, and named `tagchip` rather than `tag` because `.tag` is already the hero tagline above.
     Whether a tag IS a chip is not decided here — that is presentation.json and app/present/. This
     rule only says what a chip looks like once the cascade has said there should be one.
     THE GREEN IS THE DECLARED ONE. #3ff07f, brand/BRAND.md section 2 ("Colour system: green
     #3ff07f · black #0a0b0a · white #e6ebe6") — read from the brand department, not sampled off a
     screenshot. It is the same green the caret above is, so both name it once.

     `inline-block` AND `line-height: 1` ARE TWO CONSTRAINTS MEETING, and neither may be dropped.

     `inline-block` is the STRIKE-THROUGH's. A `line-through` on `.task.done span` PROPAGATES to
     every descendant and a descendant cannot refuse it — `text-decoration: none` below simply does
     not work. What is exempt is an ATOMIC inline, which is what `inline-block` makes the chip. Try
     `display: inline` and the rule below stops having any effect: the line is drawn straight
     across the pill, which is the rendering fault that rule exists to prevent. Verified in a
     browser at 3x, both ways, rather than reasoned about.

     `line-height: 1` is THE ROW's. An atomic inline has to fit in the line box whole, so at the
     `1.45` this shipped with, a chipped line measured 24.0199px against 23.9986px for the same
     line without a chip. Tiny, and it is still the jump: a line whose WIRED rendition is taller
     than its raw form moves everything below it the moment the cursor lands, and it accumulates
     down a view full of tags. At `1` the chip's own box is its text's content area, which the row
     already contains by construction, and the pill's shape comes from padding and border — which
     an inline-block does have to count, so they are kept small deliberately. Measured after: a
     line with three chips is 23.9986px, the same as a line with none, to four decimal places. */
  .viewbody .tagchip {
    display: inline-block;
    padding: .1em .42rem;
    border-radius: 999px;
    background: rgba(63,240,127,.10);
    border: 1px solid rgba(63,240,127,.30);
    color: var(--green);
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    font-size: .82em;
    line-height: 1;
    white-space: nowrap;
    vertical-align: baseline;
  }
  /* A completed line strikes its text through. The chip is not the text — it is a token beside it,
     and a struck-through pill reads as a rendering fault rather than as "this is done". */
  .viewbody .task.done span .tagchip { text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div><span class="brand">qntm</span></div>
    <div id="who" class="muted hidden"></div>
  </div>

  <!-- ENTRY (logged out) -->
  <section id="entry" class="hidden">
    <h1>Enter the path.</h1>
    <p class="tag">One thing at a time. Sign in with a passkey — no password to hold.</p>
    <div class="card stack">
      <button id="loginBtn">Continue with a passkey</button>
      <div class="muted">New here?</div>
      <div class="row">
        <input id="handle" placeholder="claim a handle" autocomplete="username webauthn" autocapitalize="off" spellcheck="false" />
        <button id="registerBtn" class="ghost" style="white-space:nowrap">Create passkey</button>
      </div>
      <div id="entryErr" class="err"></div>
    </div>
  </section>

  <!-- NAV (logged in) -->
  <nav id="nav" class="nav hidden">
    <button id="signOut" class="tab">Sign out</button>
  </nav>

  <!-- GRAPH (logged in) — the rendering of the graph, hosted -->
  <section id="graph" class="hidden">
    <div class="gbar"><select id="viewPick" aria-label="Choose a view"></select></div>
    <p id="freshness" class="muted"></p>
    <article id="viewBody" class="viewbody"></article>
  </section>

  <!-- APP (logged in) -->
  <section id="app" class="hidden">
    <h1 style="margin-bottom:1.2rem">What do you already know needs doing?</h1>
    <div class="card">
      <div class="one-label">The one thing</div>
      <div id="oneThing" class="one-thing"></div>
      <button id="doneBtn" class="hidden">Done — it's held no longer</button>
    </div>
    <div class="row stack" style="margin-top:1.2rem">
      <input id="captureBox" placeholder="capture a thought — press enter" autocomplete="off" />
    </div>
    <div id="appErr" class="err"></div>
    <div class="rest">
      <h3 id="restHead" class="hidden">Also held</h3>
      <div id="rest"></div>
    </div>
    <p style="margin-top:2rem"><button id="logoutBtn" class="ghost">Sign out</button></p>
  </section>
</div>

<script type="module">
import { startRegistration, startAuthentication } from "https://esm.sh/@simplewebauthn/browser@13";
import MarkdownIt from "https://esm.sh/markdown-it@14";

// THE PRESENTATION CASCADE. Built from app/present/ by scripts/build.mjs and committed, because
// Pages serves this repo from main:/ with no build step. This page used to decide how a line was
// shown, in 36 lines below; it now asks. See docs/implementation-artifacts/design-presentation-
// cascade.md section 7 for why the code has to live in a MODULE and not in this file.
//
// That section's reason was "`.flow-trace.yaml` includes `app` as a PATH PREFIX and this file is
// outside it". THIS FILE IS NOW INSIDE THAT PREFIX (it moved from /app.html to /app/index.html on
// 2026-07-30) AND THE CONCLUSION IS UNCHANGED — flow-trace's JS capture is a node module-load
// hook, and node cannot import an HTML document, so a decision written here is unobservable
// wherever the file sits. The prefix was never the binding reason; importability is. See
// .flow-trace.yaml.
//
// The path is SITE-ROOT-ABSOLUTE: this page is served at /app/, so "./dist/present.js" would
// resolve to /app/dist/present.js and 404.
import { paint, FocusSurface, PresentationContext, presentationFromDeclaration } from "/dist/present.js";

// Same markdown setup as app/render/renderer.ts — CommonMark + the table rule.
const md = new MarkdownIt("commonmark").enable("table");

// THE GLOBAL LEVEL (migration stage 2). Until the declaration is fetched every level is silent
// and every key falls through to DEFAULT, which is exactly what this page painted before there
// was a cascade — so a slow, missing or broken presentation.json costs nothing but a warning.
// The other levels arrive one stage at a time: MODE at stage 4, USER at stage 5 (from the user
// record behind the session, never from browser storage), VIEW and STRUCTURAL_NODE at stage 7
// once the snapshot envelope carries them.
let presentation = new PresentationContext();

// THE PAGE FETCHES; IT DOES NOT READ. Turning the document into levels is
// presentationFromDeclaration's job, in a TS module, where flow-trace can see the edge — a
// declaration read inside this file is a declaration whose reader nothing can observe, because
// node cannot import an HTML document and the JS capture is a module-load hook. What is left
// here is the fetch, which is what this page is for.
//
// SITE-ROOT-ABSOLUTE for the same reason as the import above: presentation.json is served from
// the site root, and this page is served at /app/.
async function loadPresentation() {
  try {
    const res = await fetch("/presentation.json", { cache: "no-cache" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const declared = presentationFromDeclaration(await res.json());
    for (const problem of declared.problems) {
      console.warn("presentation.json: " + problem);
    }
    presentation = declared.context;
  } catch (e) {
    // A declaration that cannot be read is reported, never guessed at. Silence is the honest
    // fallback: it is the same behaviour as declaring nothing, which is the behaviour the app
    // had before this level existed.
    console.warn("presentation.json not read (" + e.message + ") — every level stays silent");
    presentation = new PresentationContext();
  }
}

const API = location.hostname === "localhost" || location.hostname === "127.0.0.1"
  ? "http://localhost:8787"
  : "https://qntm-signups.lukeannison.workers.dev";

const $ = (id) => document.getElementById(id);
const tokenKey = "qntm_token";
let token = localStorage.getItem(tokenKey);

function show(view) {
  const loggedIn = view === "app";
  $("entry").classList.toggle("hidden", view !== "entry");
  $("app").classList.toggle("hidden", view !== "app");
  $("nav").classList.toggle("hidden", !loggedIn);
  if (!loggedIn) $("graph").classList.add("hidden");
}
async function api(path, { method = "POST", body, auth = false } = {}) {
  const headers = { "Content-Type": "application/json" };
  if (auth && token) headers["Authorization"] = "Bearer " + token;
  const res = await fetch(API + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok || data.ok === false) throw new Error(data.error || ("request failed (" + res.status + ")"));
  return data;
}

// --- render the app ---
function render(state) {
  $("who").textContent = state.handle ? "@" + state.handle : "";
  $("who").classList.remove("hidden");
  const one = state.oneThing;
  if (one) {
    $("oneThing").textContent = one.text;
    $("oneThing").classList.remove("one-empty");
    $("doneBtn").classList.remove("hidden");
    $("doneBtn").dataset.id = one.id;
  } else {
    $("oneThing").textContent = "Nothing held. Capture the first thing.";
    $("oneThing").classList.add("one-empty");
    $("doneBtn").classList.add("hidden");
  }
  const rest = (state.captures || []).slice(1);
  $("restHead").classList.toggle("hidden", rest.length === 0);
  $("rest").innerHTML = "";
  for (const c of rest) {
    const row = document.createElement("div");
    row.className = "item";
    const tick = document.createElement("button");
    tick.className = "tick"; tick.title = "done"; tick.dataset.id = c.id;
    tick.addEventListener("click", () => done(c.id));
    const span = document.createElement("div");
    span.textContent = c.text;
    row.append(tick, span);
    $("rest").append(row);
  }
}

async function loadState() {
  const state = await api("/app/state", { method: "GET", auth: true });
  render(state); show("app");
}
async function capture(text) {
  render(await api("/app/capture", { body: { text }, auth: true }));
}
async function done(id) {
  render(await api("/app/done", { body: { id }, auth: true }));
}

// --- graph viewer: the rendering of the graph, fetched behind the passkey ---
let graphData = null;

let currentViewId = null;

// Pick the view and hand its source to the painter. THIS PAGE NO LONGER DECIDES ANYTHING ABOUT
// HOW A LINE IS SHOWN — the task regex, the indent arithmetic, the heading demotion, the
// blank-line drop and the one-line-per-document fallback all moved to app/present/, unchanged.
// What is left here is what this page is actually for: finding the view, and posting the file.
// WHERE THE CURSOR IS (migration stage 3). One surface for the page, not one per paint: it has to
// survive the repaint it causes, or the line it just focused would be repainted with the cursor
// nowhere. It holds one number and nothing else — the FOCUS level is DERIVED from where the cursor
// is, never declared in a file, because a fact about the moment written down outlives the moment.
const focus = new FocusSurface();

function paintView(id) {
  currentViewId = id;
  const v = graphData?.snapshot?.views.find((x) => x.id === id);
  const body = $("viewBody");
  body.innerHTML = "";
  if (!v) return;
  paint(body, v.markdown, presentation, {
    markdown: md,
    focus,
    onCheckboxToggle: (toggle) => toggleTask(v, toggle),
    onLineCommit: (commit) => commitLine(v, commit),
  });
}

// Tick/untick a task: POST the edited view, let the server cycle, then re-render from the fresh
// projection. Optimistic — the box shows its new state immediately; reverts on failure.
//
// THE EDIT ITSELF IS NOT MADE HERE. `toggle.markdown` is the whole view source with exactly one
// glyph changed, computed by app/present/source.js#applyEdit, and `null` means the edit did not
// apply — the same refusal the old inline regex expressed by returning early, with the same
// consequence: no optimistic UI change and no POST. The DOM is never read to produce it.
async function toggleTask(view, toggle) {
  const { box, row, markdown: next } = toggle;
  if (next === null) return;
  row.classList.toggle("done", box.checked);
  row.classList.add("syncing");
  box.disabled = true;
  $("freshness").textContent = "syncing…";
  try {
    const data = await api("/app/edit-file", { body: { path: view.path, markdown: next }, auth: true });
    graphData = data;
    paintView(currentViewId);
    const when = new Date(data.snapshot.generated_at).toLocaleString();
    $("freshness").textContent = `as of ${when} · ${data.pending_edits} queued`;
  } catch (e) {
    box.checked = !box.checked;
    row.classList.toggle("done", box.checked);
    row.classList.remove("syncing");
    box.disabled = false;
    $("freshness").textContent = "sync failed: " + e.message;
  }
}

// The cursor leaves a line it changed: POST the edited view, let the server cycle, re-render from
// the fresh projection. Same write path as the checkbox, and deliberately so — one endpoint, one
// whole-file write unit, one place where a view is replaced.
//
// AGAIN, THE EDIT IS NOT MADE HERE. `commit.markdown` is the whole view source with exactly that
// one line replaced, computed by app/present/source.js#applyEdit from the source string the
// painter was given plus the characters the input held. `null` means the edit was refused — the
// line was left unchanged, or the text was not one line — and a refusal is not a POST.
async function commitLine(view, commit) {
  if (commit.markdown === null) return;
  $("freshness").textContent = "syncing…";
  try {
    const data = await api("/app/edit-file", { body: { path: view.path, markdown: commit.markdown }, auth: true });
    graphData = data;
    paintView(currentViewId);
    const when = new Date(data.snapshot.generated_at).toLocaleString();
    $("freshness").textContent = `as of ${when} · ${data.pending_edits} queued`;
  } catch (e) {
    // The painter has already repainted this view from the edited source, so the page is showing
    // the edit; what failed is the write. Repaint from the LAST KNOWN SERVER STATE so the screen
    // stops claiming something the vault does not have.
    paintView(currentViewId);
    $("freshness").textContent = "sync failed: " + e.message;
  }
}

// The logged-in home: the graph, not Focus.
async function enterGraph() {
  $("entry").classList.add("hidden");
  $("app").classList.add("hidden");
  $("nav").classList.remove("hidden");
  $("graph").classList.remove("hidden");
  // The declaration before the paint, so the first view a person sees is already resolved
  // against it. Sequential rather than parallel on purpose: two round trips at sign-in is
  // cheaper than a first paint that changes under the reader a moment later.
  await loadPresentation();
  await loadGraph();
}

async function loadGraph() {
  const data = await api("/app/graph", { method: "GET", auth: true });
  graphData = data;
  $("who").textContent = data.handle ? "@" + data.handle : "";
  $("who").classList.remove("hidden");
  const pick = $("viewPick");
  pick.innerHTML = "";
  if (!data.snapshot) {
    $("freshness").textContent = "No snapshot yet — run graph-sync push on the laptop.";
    $("viewBody").innerHTML = "";
    return;
  }
  // Group the views by domain into <optgroup>s, alphabetised.
  const byDomain = {};
  for (const v of data.snapshot.views) (byDomain[v.domain || "—"] ||= []).push(v);
  for (const dom of Object.keys(byDomain).sort()) {
    const og = document.createElement("optgroup");
    og.label = dom;
    for (const v of byDomain[dom].sort((a, b) => a.title.localeCompare(b.title))) {
      const o = document.createElement("option");
      o.value = v.id;
      o.textContent = v.title;
      og.append(o);
    }
    pick.append(og);
  }
  const when = new Date(data.snapshot.generated_at).toLocaleString();
  $("freshness").textContent = `as of ${when} · ${data.pending_edits} queued`;
  const def = data.snapshot.views.find((v) => v.id === "this-week") || data.snapshot.views[0];
  pick.value = def.id;
  paintView(def.id);
}

// --- passkey register / login ---
async function register() {
  $("entryErr").textContent = "";
  const handle = $("handle").value.trim();
  if (!handle) { $("entryErr").textContent = "pick a handle first"; return; }
  try {
    const { flowId, options } = await api("/auth/register/options", { body: { handle } });
    const response = await startRegistration({ optionsJSON: options });
    const out = await api("/auth/register/verify", { body: { flowId, response } });
    token = out.token; localStorage.setItem(tokenKey, token);
    await enterGraph();
  } catch (e) { $("entryErr").textContent = e.message; }
}
async function login() {
  $("entryErr").textContent = "";
  try {
    const { flowId, options } = await api("/auth/login/options", { body: {} });
    const response = await startAuthentication({ optionsJSON: options });
    const out = await api("/auth/login/verify", { body: { flowId, response } });
    token = out.token; localStorage.setItem(tokenKey, token);
    await enterGraph();
  } catch (e) { $("entryErr").textContent = e.message; }
}
function logout() {
  api("/auth/logout", { auth: true }).catch(() => {});
  localStorage.removeItem(tokenKey); token = null;
  graphData = null;
  $("graph").classList.add("hidden");
  $("nav").classList.add("hidden");
  $("who").classList.add("hidden");
  show("entry");
}

// --- wire up ---
$("registerBtn").addEventListener("click", register);
$("loginBtn").addEventListener("click", login);
$("handle").addEventListener("keydown", (e) => { if (e.key === "Enter") register(); });
$("doneBtn").addEventListener("click", () => done($("doneBtn").dataset.id));
$("logoutBtn").addEventListener("click", logout);
$("signOut").addEventListener("click", logout);
$("viewPick").addEventListener("change", (e) => paintView(e.target.value));
$("captureBox").addEventListener("keydown", async (e) => {
  if (e.key !== "Enter") return;
  const v = e.target.value.trim(); if (!v) return;
  e.target.value = "";
  try { await capture(v); } catch (err) { $("appErr").textContent = err.message; }
});

// --- boot: try the stored session, else show entry ---
(async () => {
  if (token) { try { await enterGraph(); return; } catch { localStorage.removeItem(tokenKey); token = null; } }
  show("entry");
})();
</script>
</body>
</html>
