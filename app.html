<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>qntm — the app moved to /app/</title>

<!--
  THE OLD ADDRESS. The app used to BE this file; on 2026-07-30 it moved to /app/index.html so it
  is served at https://qntm.network/app/ — a place, not a page at the root of a marketing site.

  THIS STUB IS NOT DEAD WEIGHT AND IT IS NOT KEPT OUT OF SENTIMENT. It is the only redirect this
  site can have: GitHub Pages serves the repo verbatim from main:/ with no rewrite rules and no
  server-side 301, so a URL keeps working only if a file answers at it. The operator has this URL
  bookmarked and uses it. Deleting the file would 404 the address he actually types.

  Three redirects, belt and braces, because each covers a case the others do not:
    1. <meta http-equiv="refresh"> — works with JavaScript disabled and is what crawlers read.
    2. <link rel="canonical">      — tells anything that indexed the old URL where the real one is.
    3. location.replace()          — instant, and does NOT push a history entry, so Back from the
                                     app goes where the visitor came from rather than bouncing off
                                     this stub forever. It carries ?search and #hash across.

  WHEN THIS CAN GO: when the operator confirms nothing links here any more. Until then its
  presence is asserted by qntm_network_checks:assert_app_is_reachable_from_the_front_door, so it
  cannot be quietly removed and leave a 404 behind.
-->
<meta http-equiv="refresh" content="0; url=/app/" />
<link rel="canonical" href="https://qntm.network/app/" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="alternate icon" href="/favicon.ico" sizes="32x32" />
<style>
  html, body { margin: 0; height: 100%; background: #0a0b0a; color: #e6ebe6; }
  body { display: grid; place-items: center; font: 15px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; }
  a { color: #3ff07f; }
</style>
</head>
<body>
<p>the app moved — <a href="/app/">qntm.network/app/</a></p>
<script>
  location.replace("/app/" + location.search + location.hash);
</script>
</body>
</html>
