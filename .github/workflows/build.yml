# The app build check — runs on every push to main.
#
# This is what keeps the AMENDED push-to-deploy-loop honest (capabilities.yaml). GitHub Pages
# serves this repo from main:/ with no build of its own, so demo/app.js is a COMMITTED artifact,
# and a committed artifact drifts the moment someone edits app/ and forgets to rebuild.
#
# So the job does not merely build — it builds and then FAILS IF THE WORKING TREE CHANGED. A
# stale bundle is caught by the machine rather than depending on the operator remembering, which
# is exactly the commitment: no human in the loop after the push. Typecheck runs first, because a
# bundle that builds from code that does not typecheck is not the check we said we had.

name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: typecheck (tsc --noEmit, strict)
        run: npm run typecheck

      # BUILD BEFORE TEST, deliberately. The presentation tests import dist/present.js — the
      # committed artifact, not the sources — because the artifact is what the browser loads and
      # a green against sources the browser never sees is a green about the wrong thing. Building
      # first means they run against THIS commit's bundle rather than the last one committed.
      - name: build the app bundles
        run: npm run build

      # Two suites, both node --test, both hermetic:
      #   graph-sync guards      — scripts/graph-sync.mjs is the one thing in this repo that can
      #                            destroy something the operator cannot get back, and its two
      #                            guards are the only reason it cannot. Runs against a throwaway
      #                            vault and throwaway git repos under the runner's temp dir.
      #   presentation           — the painted DOM is byte-identical to the hand-rolled painter
      #                            this replaced, the painter routes through the cascade, and
      #                            every affordance is a source-string edit (never a DOM read).
      - name: tests (graph-sync guards + presentation)
        run: npm test

      - name: fail if a committed bundle is stale
        run: |
          # app/index.html is IN this check now, alongside demo/ and dist/: scripts/build.mjs
          # writes a `?v=<hash of the built bytes>` onto this file's two bundle imports (its own
          # header explains why — GitHub Pages cannot be told to shorten its cache lifetime, so
          # the cache-buster is the fix instead of a header), so a bundle changing without this
          # file being regenerated is exactly the staleness this step exists to catch.
          if ! git diff --exit-code -- demo/ dist/ app/index.html; then
            echo "::error::demo/, dist/ or app/index.html is out of date with app/ — run 'npm run build' and commit the result."
            exit 1
          fi

      # THE DECLARATION FRESHNESS GATE. design-the-rule-mirror.md §9.4 measured the hole this
      # closes: every generator has a `--check` that exits 1 on a stale declaration, NONE of
      # them was wired into CI, and the tests that would catch it self-skip precisely in CI
      # because the runner does not clone the monorepo. So a stale declaration shipped green.
      # Covers all four generated keys (qualification, structural, resolution, rules) — `rules`
      # (scripts/generate-rules-declaration.mjs) used to run its own separate step below this one,
      # back when it was `generate-capture-rules-declaration.mjs` and its `dropped` was always `{}`
      # by construction (a closed set of exactly two hand-picked rules). It is a real category
      # compiler now, with real drops, so it belongs in this shared gate like the other three.
      #
      # WHY HERE, IN build.yml, AND NOT IN flow-trace.yml. build.yml runs on every push AND every
      # pull_request and is BLOCKING. flow-trace.yml is advisory, and is SKIPPED entirely until
      # FLOW_TRACE_CHECKOUT_TOKEN exists — a gate placed there would not run at all today.
      #
      # WHY IT IS PLACED AFTER `npm test` RATHER THAN INSTEAD OF IT. The check CI can genuinely
      # perform runs inside `npm test`: tests/declaration-drop.test.mjs drives this same script
      # against the committed tests/fixtures/config/ tree, so a GENERATOR changing without its
      # output being regenerated is caught unconditionally, on every PR, with no monorepo. This
      # step covers the other half — the operator's own config drifting out from under the
      # committed declaration — and it can only do that where the config exists.
      #
      # EXIT 3 IS "NOT CHECKED", NEVER A PASS. On a GitHub-hosted runner the monorepo is absent and
      # this step raises a ::warning:: rather than a green tick, for the same reason
      # flow-trace.yml's `flow-trace-gate-unavailable` job exists: a check that could not run must
      # never be indistinguishable from a check that ran and passed. Exit 1 fails the build.
      - name: declaration freshness (exit 3 = NOT CHECKED, not a pass)
        run: |
          set +e
          node scripts/checkdeclarations.mjs
          code=$?
          set -e
          case "$code" in
            0)
              echo "All four generated declarations match the config they were generated from."
              ;;
            1)
              echo "::error::A generated declaration is STALE relative to the config. Run the matching 'npm run generate:*' and commit presentation.json (and 'npm run build' for the bundle)."
              exit 1
              ;;
            3)
              echo "::warning title=declaration freshness NOT CHECKED::The qntm-md config is not present on this runner, so presentation.json was NOT checked against it. This is NOT a pass. The generator half of the check DID run, in 'npm test' (tests/declaration-drop.test.mjs) against tests/fixtures/config/."
              {
                echo "## Declaration freshness was NOT checked against the operator's config"
                echo
                echo "CI does not clone the private monorepo, so \`scripts/checkdeclarations.mjs\`"
                echo "exited 3 — it had nothing to compare \`presentation.json\` against. Read this"
                echo "as \"not checked\", never as \"checked and fine\"."
                echo
                echo "What DID run, unconditionally, in \`npm test\`:"
                echo "\`tests/declaration-drop.test.mjs\` drives the same script against the"
                echo "committed \`tests/fixtures/config/\` tree, so a generator whose behaviour"
                echo "changed without its output being regenerated fails this build."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::scripts/checkdeclarations.mjs exited ${code} — it never reached a verdict. This is a crash, not a staleness finding."
              exit 1
              ;;
          esac
