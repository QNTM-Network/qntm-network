# ROUTINE ⟺ CARRIES A CADENCE (operator-declared 2026-07-28). One rule, both
# directions, no provenance.
#
# A routine is a thing that recurs, and recurrence IS a rhythm. So a node carrying a
# cadence is a routine, and a node without one is a task — wherever it is authored, and
# whoever typed what. There is no such thing as a routine with no cadence, so nothing
# needs to remember how a node became one.
#
# WHAT THIS REPLACED, and why it was wrong. The promote used to stamp an `auto_routine`
# provenance marker so a future demote could revert ONLY engine-promoted routines and
# never an operator-typed `#routine`. That marker was written and never read for months;
# wiring it up on 2026-07-27 gave the vault TWO CLASSES of routine — 32 carrying the
# marker, 29 not — where the same gesture produced different results and nothing on the
# line told you which kind you had. The marker was not encoding a fact about the world.
# It was arbitrating a contradiction between two config rules:
#
#     stamp-default-cadence-on-routines : routine + cadence null -> fill it with daily
#     the demote                        : routine + cadence null -> it is not a routine
#
# Both cannot be true. Rather than pick, the marker split the data so each rule could own
# half of it. The fix is to pick. The default-stamp rules are RETIRED — a silent default
# is the system pretending you declared something you did not, and it is allowed to push
# back on nonsense rather than accommodate it. A bare `#routine` with no cadence now
# renders back as `#task`, which is the system telling you plainly that it did not take.
#
# SUB-STEPS ARE STEPS. A routine's children are not independently recurring work, so
# they carry no cadence and are typed steps. They still reset with the
# parent: routine_reset_cascade.yaml selects `nodes-under-resetting-routine` — ANY node
# beneath a resetting routine, transitive and type-agnostic — so nothing depends on a
# sub-step being typed `routine`. Two nodes in the live vault (qntm:2443, qntm:2444) were
# typed routine with no cadence; they correctly become tasks and keep their reset.
#
# set_node_type retypes IN PLACE (identity-preserving), so neither direction touches node
# identity or incident edges.
- id: task-with-cadence-becomes-routine
  for_each:
    pattern: tasks
  when:
    not:
      - "null": [$current.node.fields.cadence]
  actions:
    - verb: set_node_type
      node_id: $current.node.id
      node_type: routine
    - verb: emit_event
      type: auto_routine_promoted
      payload:
        node_id: $current.node.id
        reason: cadence

# The inverse, and it needs no guard. Cadence is the whole of routine-ness, so its
# absence is the whole of task-ness. No marker, no ancestor clause, no exception for who
# typed the tag: removing `#daily` (or `#weekly`, or any cadence tag) empties cadence via
# applier._operator_cleared_tag_fields and the node is a task again on the same cycle.
#
# Cannot oscillate with the promote above: a node either carries a cadence or it does
# not, and both rules read that one field, so exactly one of them can ever match.
- id: routine-without-cadence-becomes-task
  for_each:
    pattern: routines
  when:
    "null": [$current.node.fields.cadence]
  actions:
    - verb: set_node_type
      node_id: $current.node.id
      node_type: task
    - verb: emit_event
      type: routine_demoted
      payload:
        node_id: $current.node.id
        reason: cadence_absent
