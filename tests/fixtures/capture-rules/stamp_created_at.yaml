# Auto-stamp created_at on tasks that don't have it yet.
# Literal date — bump daily until $cycle_today wires through qntm-md (Pivot 1).
#
# for_each was `open-tasks` until 2026-07-07: a task held to status=waiting in its
# OWN birth cycle (immediately, e.g. by node-with-live-requires-gets-status-waiting)
# was never open when this rule ran, so it stayed created_at=null through the whole
# hold — then got stamped with $cycle_today on the day it UNBLOCKED, days later,
# wearing a false birthdate (real-vault defect, qntm:1590 "Get back to alice":
# authored 2026-07-03, held instantly by #requires, resurfaced 2026-07-07 stamped
# 🆕 that day). `tasks` (status-agnostic, config/patterns/tasks.yaml) sees every
# task the cycle it's created, held or not, so the stamp is always the true birthdate.
- id: stamp-created-at-on-task
  for_each:
    pattern: tasks
  when:
    eq: [$current.node.fields.created_at, null]
  actions:
    - verb: set_field
      node_id: $current.node.id
      field: created_at
      value: "$cycle_today"
