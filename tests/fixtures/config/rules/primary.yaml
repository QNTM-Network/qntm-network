# One rule this closed grammar fully models: an `eq` predicate, a `set_field` action.
- id: mark-in-progress
  for_each:
    pattern: local-tasks
  when:
    eq: [$current.node.fields.status, open]
  actions:
    - verb: set_field
      node_id: $current.node.id
      field: status
      value: in_progress
