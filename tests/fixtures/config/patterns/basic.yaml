# Two patterns, chosen to put one section on each side of the generator's own refusal boundary.

# PUBLISHABLE: node fields only, and only fields the app can resolve for a line being typed.
local-tasks:
  root:
    find:
      node_type: task
      status: open

# REFUSED: a MULTI-HOP edge-traversing step is not decidable from a line's own fields.
# RESTATED 2026-08-04: this pattern used to use `parents:` — a ONE-HOP step, which
# `compile-qualification.mjs`'s `normaliseEdgeStep` widening now models and publishes (with an
# `edgeSteps` entry) instead of refusing. `ancestors:` is TRANSITIVE and stays outside this
# generator's grammar, which is what this fixture exists to exercise.
traversing-tasks:
  root:
    find:
      node_type: task
  steps:
    - ancestors: { edge_type: PART_OF }
      exists: true
