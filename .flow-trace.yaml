# qntm.network — .flow-trace.yaml (self-application config).
#
# HEADER CORRECTED 2026-07-30. It read "A STATIC landing site: no traced code, no Python runtime"
# and then recommended a command that crashes. Both claims were false; the `modules:` block below
# is untouched.
#
# WHAT THIS PROJECT IS. A landing page, a markdown demo, a PASSKEY-AUTHENTICATED SINGLE-USER
# APPLICATION, a D1-backed hosted personal graph, and a two-way write path into a live vault.
# There IS traced code (app/, under flow-trace's node observer) and there IS a Python runtime
# (tests/flow_scenarios/static_evidence.py + qntm_network_checks.py, 13 deterministic predicates).
# See docs/architecture/architecture.yaml for the full correction and
# docs/implementation-artifacts/research-site-survey.md section 4 for what is still undeclared.
#
# THE INDUSTRIALIZATION PATH IS DONE, AND THE VERIFIER RUNS AGAIN (corrected 2026-07-30, stage 2).
# This header said `verify .` and `capability-rollup .` exit 2 — a CRASH with no verdict — because
# the TOOL's JS observer had no node_modules. THAT IS FIXED, in the tool's own checkout, and the
# correction is recorded here rather than left to rot because a stale "it crashes" note is how a
# working instrument goes unused. Measured 2026-07-30 against this worktree:
#   flow-trace verify .   -> exit 0, 23 PASS / 0 FAIL, 3 scenarios, every expected flow OBSERVED
# The two preconditions, and they are two DIFFERENT installs — a fresh clone fails on either:
#   1. `npm ci` in flow-trace's js/ (the tool's own observer dependencies)
#   2. `npm ci` HERE (node_modules/ is gitignored, and the scenarios import markdown-it)
#
# ONE VERB STILL UNDER-REPORTS, and it is the tool's behaviour rather than this project's:
# `capability-rollup .` and `map . --full` install canonical-routing probe anchors during the same
# capture, and with those anchors installed the JS observer records no cross-module calls at all —
# so every declared flow reads UNVERIFIABLE and the capabilities they gate derive `partial`.
# Measured both ways on the identical verify run (probe_anchors=() vs the two routing anchors).
# Until that is fixed in the tool, DO NOT accept a rollup write as the state of this project's
# flows: `verify .` is the instrument that can see them.
#
# AND `verify .` TRUNCATES ITS OWN CAPTURE HERE, WHICH IS THE TOOL'S AND IS CONTROLLABLE
# (diagnosed 2026-07-30, stage 8, after two wrong readings — both recorded, because a later reader
# will otherwise repeat them).
#
# THE SYMPTOM. Runs lose the LAST edges a scenario produces — FocusSurface.blur / .isFocused /
# .contextFor, PresentationContext.with, the second applyEdit. They surface as INFO "declared but
# not observed", NEVER as FAIL, so `fail_count` stays 0 and `pass_count` silently drops instead.
# The scenario itself is fine: run standalone under node it completes and asserts everything.
#
# WRONG READING 1 — "the branch broke it". Five runs over an unmodified base came back identical
# and made it look like a regression. Eight more base runs then flaked three times
# (29 27 29 26 29 29 26 29). It is not any one declaration's fault and it predates this stage.
# WRONG READING 2 — "it is purely random". Volume matters, and a lot. Driving a SIX-line fixture,
# this project's present_cascade scenario lost six edges on EVERY run (25 PASS, four times, dead
# stable). Cutting the fixture to FOUR lines, changing nothing else, took it to 31 on the next five
# runs. So the budget is real and a scenario can sit the wrong side of it permanently.
# AND WRONG READING 3, WHICH IS THE ONE THIS NOTE ORIGINALLY COMMITTED — "so shrinking it FIXES
# the flake". It does not. Six further runs of the four-line version read 28 28 28 31 28 31: the
# same three focus edges, lost some of the time. Shrinking moved the scenario off a CLIFF, not off
# the dice. The residual correlates with machine load — the truncated runs cluster immediately
# after a full `npm run check` — which points at a flush or a timeout in the observer rather than a
# fixed record cap. Current spread: this project 28-31, the same commit's parent 27-30. Same shape,
# same three-point range.
#
# WHAT A SCENARIO AUTHOR SHOULD DO ABOUT IT. A scenario exists to make each declared edge
# OBSERVABLE ONCE. Volume beyond that is not thoroughness, it is budget spent buying nothing — and
# what it costs is the evidence for whatever the run drives LAST. Keep fixtures minimal and prove
# painted output somewhere that is not a scenario (tests/present-golden.test.mjs does it against a
# whole view plus a 1,125-case sweep, under `node --test`, where there is no budget).
#
# WHAT IT MEANS WHEN YOU READ A RUN: a low `pass_count` with `fail_count: 0` and "declared but not
# observed" INFOs is a truncated capture, not a broken commitment. Run it again, and do not delete
# a flow declaration on the strength of one run.
#
# Note also that there is no flow-trace gate in this repo's CI (build.yml and worker.yml are
# node-only), so nothing catches a broken declaration here automatically.
#
# Read it like anywhere:
#   flow-trace verify .              # the fan: 13 static invariants + 10 flows + coverage
#   flow-trace queue .               # the derived work queue (actionable / diagnose-ready / pool)
#   flow-trace backlog .             # the rows x driving_capability
#   flow-trace map .                 # the cheap committed-status headline
#   flow-trace map-registry          # this project as one member of the cross-project board
#
# Any scenario run also needs `npm ci` in THIS worktree first — node_modules/ is gitignored, so a
# fresh worktree does not have it.

ordering: capability-driven

# CAPTURE FILTER — the TypeScript app (2026-07-23, second pass).
#
# For a JS/TS target, module identity is the REPO-RELATIVE PATH WITHOUT EXTENSION
# (`app/render/renderer`), so these entries are path PREFIXES, not dotted package roots — the
# convention differs from the Python side and the loader treats them accordingly (flow-trace
# js_capture.py). The scenario suffix is what dispatches a run to the node observer rather than
# `sys.setprofile`; nothing here selects the backend.
#
# The history in one line, because this file changed shape twice in two days: it pointed at
# `qntm_network.render` while the Python render app existed (2026-07-22), went never-matching
# when that app retired into TypeScript and flow-trace could not see TS at all, and now points at
# app/ because flow-trace's `typescript-capture-backend` landed (v1, working at depth 3). The
# observed half — traced flows, depth-to-sink, canonical routing, declared-vs-actual drift —
# reaches this project's real code for the first time.
#
# `app/boot` is EXCLUDED on purpose. It is the bootstrap: its only job is a top-level side effect,
# it is the build's entry point, and nothing imports it. Observing it would record a single
# start-up edge that says nothing about how the app is structured.
#
# ── 2026-07-30, MIGRATION STAGE 1: THE FILTER IS UNCHANGED, AND THAT IS THE ANSWER, NOT A SKIP ──
#
# Stage 1 moved the presentation decisions OUT of app.html and into app/present/, specifically so
# they would fall inside this prefix. Six modules and a barrel are now observable that were not.
#
# What is still outside app/ is app.html itself, and it CANNOT be brought in by editing the list
# below. Two independent reasons, both checked rather than assumed:
#
#   1. This is a JS/TS target, so capture works by a node module-load hook (flow-trace's
#      js/src/transform.mjs). It can only instrument what node can import. `app.html` is an HTML
#      document with an inline `<script type="module">`; node cannot import it, so no entry here
#      makes it observable.
#   2. Module identity is the repo-relative path WITHOUT extension. `app.html` therefore reduces
#      to the identifier `app` — which already collides with the directory prefix on the list.
#      Adding it would be indistinguishable from what is there and would change nothing.
#
# So an `- app.html` line would be a declaration with no reader — the highest-frequency bug in
# this system, committed in the config file that exists to catch it. It is deliberately not
# written. WHAT IS ACTUALLY LEFT IN app.html, stated so the residue is legible rather than
# implied: passkey auth, the fetch/POST wrappers, the view picker, the optimistic sync chrome
# around a toggle, and the boot sequence. None of it is presentation any more. Bringing it under
# observation means bundling that script through scripts/build.mjs the way the presentation
# cascade now is — which is the remaining half of the asserted backlog row
# `flag-one-markdown-implementation-is-now-three`, and a change of its own.
#
# ── 2026-07-30, THE PAGE MOVED IN, AND THE FILTER IS STILL UNCHANGED ──
#
# The page is no longer `/app.html`. It is `/app/index.html`, served at https://qntm.network/app/,
# so the app has an address instead of being a file at the root of a marketing site. THAT MOVE
# PUT IT INSIDE THIS PREFIX, and the prefix still does not observe it. Read that carefully,
# because it is the trap this block exists to disarm:
#
#   * REASON 2 ABOVE IS NOW RETIRED. The identity is `app/index`, which no longer collides with
#     anything, so the old "it would be indistinguishable" argument has expired.
#   * REASON 1 IS UNCHANGED AND WAS ALWAYS THE BINDING ONE. Capture is a node module-load hook.
#     Node cannot import an HTML document. The file's location was never what made it invisible;
#     its FORMAT is. Moving it changed the URL and changed nothing about observability.
#
# So the honest reading of `include: [app]` is now "every TS module under app/, plus one HTML
# document that this filter names and cannot see". A reader who assumes the prefix covers the
# whole directory would be wrong about exactly one file, which is why it is written down here
# rather than left to be rediscovered.
#
# The other extension-scoped reader worth knowing about, for the same reason: the Python
# predicates in qntm_network_checks.py go through `_app_sources`, which globs {.ts,.tsx,.js,.mjs}
# under app/ and therefore also skips the page. That matters for ONE invariant in particular —
# `assert_edits_are_ephemeral` bans localStorage under app/, and the app page legitimately keeps
# its session token in localStorage. It passes today because .html is not in that glob. If a
# future stage bundles the page's script to a .js under app/ (the remaining half of
# `flag-one-markdown-implementation-is-now-three`), that invariant goes red on a use that is
# correct and declared, and the fix is to scope the ban to the EDITOR rather than to delete it.
modules:
  include:
    - app
  exclude:
    - app/boot
